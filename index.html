/* ---------- Beginner-first teaching layer: written into each lesson page ---------- */
function beginnerFirstLesson(s,t){
  const id=s.id, n=t.name.toLowerCase();
  const prerequisites={
    math:'Start with arithmetic, algebra, fractions, powers and the meaning of a variable. When a step uses a new operation, pause and explain that operation before using it.',
    net:'Start with charge, current, voltage, resistance and Ohm’s law. A circuit is a set of connected elements; analysis means writing equations that obey the physical laws at every connection and loop.',
    sig:'Start with the idea that a signal is information represented as a quantity that changes with time or sample number. Learn the axes and notation before manipulating equations: t means continuous time, while n means an integer sample index.',
    ana:'Start with voltage, current, resistance, the idea of a semiconductor junction, and the difference between a DC operating value and a changing small signal. Every device explanation should connect its physical operation to its circuit model.',
    dig:'Start with two voltage ranges interpreted as logic 0 and logic 1. A truth table lists every possible input combination and the output for each combination; Boolean algebra is the compact language used to describe those rules.',
    ctl:'Start with a physical system, its input, its output and what we want it to do. A control system measures or estimates the output and uses feedback to reduce the difference between the desired value and the actual value.',
    com:'Start with a message, a transmitter, a channel, noise and a receiver. Communication techniques change the form of a signal so information can travel through a real channel and then be recovered.',
    em:'Start with voltage, current, electric and magnetic fields, and the idea that electromagnetic energy propagates through space or a guiding structure. Define the geometry and coordinate system before applying field equations.',
    dev:'Start with the atom-level idea of charge carriers in semiconductors. Device behaviour follows from how junctions and electric fields control the movement of electrons and holes.',
    mic:'Start with bits, registers, memory, a processor and the instruction cycle. A microprocessor executes instructions; a microcontroller combines a processor with memory and peripherals for controlling hardware.',
    me:'Start with the quantity being measured, the instrument, its range and its uncertainty. A displayed number is not automatically the exact true value; loading, calibration, noise and resolution all matter.',
    pw:'Start with the difference between controlling a small signal and switching substantial electrical power. Power converters use semiconductor devices as controlled switches to change voltage, current or frequency.',
    dsp:'Start with a sequence of samples indexed by integers. Digital signal processing uses mathematical operations on those samples to analyse information or change a signal, often with algorithms that can run on a processor.',
    mw:'Start with the fact that at microwave frequencies, circuit dimensions can become comparable to wavelength. Voltage and current are then not always uniform along a structure, so wave propagation and impedance matching become essential.',
    op:'Start with light carrying information through a fibre. The transmitter converts electrical information into light, the fibre guides it, and the receiver converts the arriving light back into an electrical signal.',
    apt:'Start by identifying exactly what is given, what is asked and which relationship connects them. Write the quantities and units first; then choose a method and check whether the result is reasonable.'
  };
  const procedures={
    math:'Name the unknowns → write the definition or theorem → substitute carefully → simplify without skipping algebra → verify the result in the original condition.',
    net:'Redraw and label the circuit → choose reference directions → write element laws → apply KCL/KVL or a justified theorem → solve → check units and limiting cases.',
    sig:'Identify the signal/system type → write the definition → check the conditions under which the property applies → calculate one step at a time → verify with a simple special case or sketch.',
    ana:'Identify the device region and DC bias first → select the correct equivalent model → separate DC and small-signal quantities where appropriate → calculate → check whether the result agrees with the assumed region.',
    dig:'List inputs and outputs → construct the truth table or state table → simplify the logic → draw/derive the circuit → check every row and consider timing, not just logic values.',
    ctl:'Define input, output and feedback sign → derive the model → identify poles and zeros → apply the requested time/frequency/stability test → state assumptions and interpret the result physically.',
    com:'Identify the message and carrier/channel → write the signal model → find bandwidth and power relationships → account for noise or detection assumptions → interpret the receiver output.',
    em:'Draw the geometry and coordinate axes → identify the field/source/material → choose the correct Maxwell or transmission relation → apply boundary conditions → check dimensions and physical direction.',
    dev:'Identify the device structure and operating region → state the physical mechanism → use the region-appropriate equation/model → determine current/voltage → check that the assumed region is self-consistent.',
    mic:'Identify the CPU/peripheral, data width and address space → trace the instruction or bus transaction → check timing and control signals → account for flags, interrupts and hardware side effects.',
    me:'Identify the measurand and range → select the instrument/model → account for calibration, loading and uncertainty → calculate the reading → report units and meaningful precision.',
    pw:'Identify topology and switch states → draw the current path in each state → apply inductor/capacitor laws → derive the conversion relation under stated assumptions → check device stresses and losses.',
    dsp:'Define the sequence and transform convention → identify periodicity and length assumptions → apply the property or algorithm → keep track of indices and scaling → verify with a small sequence.',
    mw:'Compare dimensions with wavelength → identify the supported mode and frequency range → apply the propagation/matching relation → calculate reflection or power → check operating limits.',
    op:'Identify source, fibre and detector → calculate numerical aperture/loss/dispersion as appropriate → track units (especially dB and dBm) → check the end-to-end link margin.',
    apt:'Translate words into quantities → choose the simplest valid relationship → calculate with units → estimate the size of the answer → check for traps such as percentage base or incompatible units.'
  };
  let intro='';
  const rules=[
    [/matrix|linear algebra|rank|eigen|determinant|vector|numerical methods|differential calculus|integral calculus|probability|complex variables/, 'A mathematical method is useful only when its definitions and conditions are clear. We will first identify the objects being manipulated, then show why the operation is valid, and finally check the answer independently.'],
    [/kcl|kvl|thevenin|norton|superposition|source transformation|star|delta|transient|sinusoidal|phasor|resonance|two.port|network function|graph theory/, 'A circuit is not solved by guessing currents. We choose reference directions, apply physical conservation laws, and solve the resulting equations. A negative answer simply means the actual direction is opposite to the direction we assumed.'],
    [/signal|energy|power|impulse|step|ramp|system|convolution|fourier|laplace|z.transform|sampling|pole|zero|frequency response/, 'A signal is a mathematical description of something that varies. A system transforms an input into an output. Before memorising formulas, learn what each axis, variable and operation means and how it changes the signal or system.'],
    [/diode|semiconductor|bjt|mosfet|jfet|amplifier|feedback|oscillator|op.amp|filter|power amplifier|regulator|junction|breakdown|bias|load line|current mirror/, 'An electronic circuit works because device characteristics constrain the voltage and current that can occur. We begin with the physical device and its operating region, derive or select a model, and then use that model to analyse the circuit.'],
    [/boolean|logic|number system|binary|adder|mux|decoder|flip.flop|latch|counter|state|timing|hazard|adc|dac|ttl|cmos|memory|programmable logic|hdl/, 'Digital logic represents information with discrete states, usually 0 and 1. The first job is to define the possible inputs and outputs; truth tables and state tables make the behaviour explicit before we implement it with gates or hardware.'],
    [/control|feedback|transfer function|block diagram|signal flow|time response|steady.state error|stability|root locus|bode|nyquist|margin|compensator|pid|state.space|discrete.time control/, 'Control analysis asks how a system responds and whether feedback makes its behaviour accurate and stable. We connect the physical model to a mathematical model, then use poles, response curves and stability tests to predict what the system will do.'],
    [/communication|modulation|transmitter|receiver|noise|pcm|quantisation|digital modulation|detection|matched filter|line coding|information theory|entropy|coding|multiplexing|equalisation|spread spectrum/, 'Communication is the process of sending information through a channel that may attenuate, distort or corrupt it with noise. Each technique solves a particular problem—efficient spectrum use, reliable detection, or reduced errors—under specific assumptions.'],
    [/electromagnetic|plane wave|polarisation|poynting|reflection|transmission line|impedance|smith chart|waveguide|cavity|scattering|microwave|radar|antenna/, 'At high frequencies, electrical energy behaves as a propagating electromagnetic wave. Geometry, wavelength, material properties and boundary conditions determine how the wave travels, reflects, radiates or is guided.'],
    [/microprocessor|microcontroller|assembly|addressing|instruction|memory|interrupt|timer|serial|embedded|dma|bus/, 'A processor program changes hardware state by executing instructions that read and write registers, memory and peripherals. To understand a program, trace the data, the instruction sequence and the timing of the hardware interaction.'],
    [/measurement|instrument|bridge|oscilloscope|transducer|sensor|calibration|data acquisition|voltmeter|multimeter|frequency counter/, 'Measurement is an estimate of a physical quantity made through an instrument. The instrument has finite range, resolution and bandwidth, and it can disturb the circuit being measured; these limits are part of the answer, not footnotes.'],
    [/power semiconductor|rectifier|converter|inverter|chopper|controller|switch.mode|snubber|gate driver|harmonic|efficiency/, 'A power converter changes electrical energy by repeatedly switching semiconductor devices. The key is to follow the current path during each switching state and then use inductor and capacitor behaviour to understand the average output.'],
    [/fibre|optical|light|numerical aperture|dispersion|photodetector|laser|led|wavelength division/, 'An optical link must launch enough light into the fibre, guide it with acceptable loss and distortion, and detect it at the far end. Power budget and dispersion budget answer different questions and must not be confused.'],
    [/percent|ratio|average|profit|time|speed|work|algebra|geometry|probability|reasoning|series|coding|verbal|comprehension|data interpretation/, 'Aptitude problems become easier when the words are translated into a small set of quantities and relationships. We will show the setup, explain why the chosen relationship applies, and use estimation to catch arithmetic errors.']
  ];
  for(const [re,txt] of rules){ if(re.test(n)){intro=txt;break;} }
  if(!intro) intro='We will build this topic from its basic definitions, explain the notation, derive the key relationships, and practise using them in examples before moving to exam-level questions.';
  let example='';
  if(id==='math' && /linear algebra|matrix|rank|eigen/.test(n)) example='<div class="ex"><b>Mini-example.</b> For a 2×2 matrix, multiplication is row-by-column: if A = [[1,2],[3,4]] and x = [1,1]ᵀ, then Ax = [1·1+2·1, 3·1+4·1]ᵀ = [3,7]ᵀ. The same row-by-column rule applies to 3×3 matrices; the dimensions must match.</div>';
  else if(id==='net') example='<div class="ex"><b>Mini-example.</b> A 2 Ω resistor carries 3 A. Ohm’s law gives V = IR = 3×2 = 6 V. If a node has 5 A entering and only two outgoing currents, 2 A and i, Kirchhoff’s current law gives 5 = 2+i, so i = 3 A.</div>';
  else if(id==='sig' && /energy|power/.test(n)) example='<div class="ex"><b>Mini-example.</b> For a discrete sequence x[n] that is nonzero only at n=0 with value 2, its energy is Σ|x[n]|² = |2|² = 4. Because only one sample is nonzero, this is a finite-energy signal.</div>';
  else if(id==='sig' && /convolution/.test(n)) example='<div class="ex"><b>Mini-example.</b> Discrete convolution is y[n]=Σₖx[k]h[n−k]. For x=[1,2] and h=[1,1], the output is [1,3,2]: the middle value 3 comes from the overlap 1×1 + 2×1. This overlap idea is the heart of convolution.</div>';
  else if(id==='dig' && /boolean|k.map|logic gates/.test(n)) example='<div class="ex"><b>Mini-example.</b> AND outputs 1 only when both inputs are 1. Its truth table is 00→0, 01→0, 10→0, 11→1. The Boolean expression is Y=A·B; the dot means AND, not ordinary arithmetic multiplication of analogue voltages.</div>';
  else if(id==='ctl' && /transfer function|mathematical model/.test(n)) example='<div class="ex"><b>Mini-example.</b> For a zero-initial-condition system with Y(s)/U(s)=1/(s+2), the pole is at s=−2. The natural response contains e^(−2t), which decays with time; this pole is consistent with a stable first-order mode.</div>';
  else if(id==='ana' && /op.amp/.test(n)) example='<div class="ex"><b>Mini-example.</b> For an ideal inverting op-amp, gain is −R_f/R_in. If R_f=10 kΩ and R_in=2 kΩ, the gain is −5, so a small +0.2 V input produces approximately −1 V output—provided the supply rails do not force saturation.</div>';
  else if(id==='pw' && /buck/.test(n)) example='<div class="ex"><b>Mini-example.</b> An ideal buck converter in continuous conduction has V_out≈D·V_in. With V_in=12 V and duty ratio D=0.25, V_out≈3 V. This result assumes ideal components and steady-state continuous inductor current.</div>';
  else if(id==='dsp' && /dft|fft/.test(n)) example='<div class="ex"><b>Mini-example.</b> The DFT turns N time samples into N frequency samples. It does not magically create new information; it expresses the finite record in terms of discrete complex sinusoids. Keep the chosen forward/inverse scaling convention consistent.</div>';
  else if(id==='op') example='<div class="ex"><b>Mini-example.</b> If a fibre link has 3 dB of loss, the received optical power is approximately half the launched power because 10 log₁₀(P_out/P_in)=−3 dB. Track dBm for absolute power and dB for ratios/losses.</div>';
  else if(id==='apt') example='<div class="ex"><b>Mini-example.</b> If a price rises from ₹80 to ₹100, the increase is ₹20 relative to the original ₹80. Percentage increase = (20/80)×100 = 25%, not 20%.</div>';
  else example='<div class="ex"><b>How to read the equations.</b> Before substituting numbers, state what each symbol represents, write the units, and list any assumptions. After solving, check whether the answer is physically and mathematically plausible.</div>';
  const prereq=prerequisites[id]||prerequisites.apt;
  const method=procedures[id]||procedures.apt;
  return `<div class="beginner-lesson"><h3>Start from the beginning</h3><p>${intro}</p><p><b>Prerequisite idea:</b> ${prereq}</p>${example}<p><b>Reliable solving method:</b> ${method}</p><p><b>Self-check:</b> After studying the explanation below, try to explain the main idea aloud without reading the formula. Then solve a small example from a blank page and state the assumptions under which your answer is valid.</p></div>`;
}


/* ---------- Topic-level syllabus alignment and beginner teaching scaffold ---------- */
function normalizedWords(x){return String(x).toLowerCase().replace(/[^a-z0-9×]+/g,' ').split(/\s+/).filter(w=>w.length>2);}
function lessonScopeFor(s,t){
 const groups=MASTER_SYLLABUS[s.id]||[];
 const topicWords=new Set(normalizedWords(t.name));
 const scored=[];
 for(const group of groups){
  for(const item of group[1]){
   const words=normalizedWords(item);
   let score=words.reduce((n,w)=>n+(topicWords.has(w)?1:0),0);
   // Give strong weight to distinctive terms appearing in both the lesson title and scope item.
   if(score>0) scored.push({item,score});
  }
 }
 scored.sort((a,b)=>b.score-a.score);
 let chosen=scored.slice(0,8).map(x=>x.item);
 if(chosen.length<4){
  for(const group of groups){for(const item of group[1]){if(!chosen.includes(item))chosen.push(item);if(chosen.length>=Math.min(6,groups.reduce((n,g)=>n+g[1].length,0)))break;}if(chosen.length>=6)break;}
 }
 return chosen;
}
function topicSpecificExample(s,t){
 const id=s.id, n=t.name.toLowerCase();
 const examples={
  math:[
   [/matrix|linear algebra|rank|eigen|determinant/,`For a 3×3 matrix, compute a determinant by expanding along one row or column: multiply each entry by its signed 2×2 minor. For example, det([[1,0,0],[0,2,0],[0,0,3]]) = 1·2·3 = 6. Since the determinant is nonzero, the matrix is invertible and has full rank 3.`],
   [/differential|calculus|limit|maximum|minimum/,`To find a stationary point of f(x)=x²−4x+1, differentiate: f′(x)=2x−4. Set f′(x)=0, giving x=2. Since f″(x)=2>0, the point is a local minimum; f(2)=−3.`],
   [/integral/,`A definite integral adds signed area. For example, ∫₀² x dx = [x²/2]₀² = 2. The result is an accumulated quantity, not simply the height of the curve.`],
   [/differential equation/,`For dy/dt+2y=0, separate or use the standard first-order solution: y(t)=C e^(−2t). The constant C is fixed by the initial condition. The negative exponent means the natural response decays.`],
   [/vector/,`For a scalar field f(x,y,z), the gradient points in the direction of steepest increase. If f=x²+y²+z², then ∇f=(2x,2y,2z); at (1,0,0), it points along the positive x-axis.`],
   [/complex/,`For z=1+j, the magnitude is |z|=√(1²+1²)=√2 and the angle is 45°. Thus z=√2 e^(jπ/4), connecting rectangular and polar forms.`],
   [/probability|distribution/,`If an event has probability 0.2, its complement has probability 0.8. For independent events A and B, P(A∩B)=P(A)P(B); independence must be established, not assumed.`],
   [/numerical/,`Newton–Raphson updates an estimate using xₙ₊₁=xₙ−f(xₙ)/f′(xₙ). For f(x)=x²−2 and x₀=1.5, x₁=1.5−0.25/3≈1.4167, already close to √2.`]
  ],
  net:[
   [/kcl|kvl|node|mesh/,`At a node, choose currents entering as positive. If 5 A enters and 2 A and i leave, KCL gives 5−2−i=0, so i=3 A. A negative result would mean the actual current flows opposite to your chosen arrow.`],
   [/thevenin|norton|superposition|maximum power/,`A linear network viewed from two terminals can be replaced by a Thevenin voltage in series with a resistance. If Vth=12 V and Rth=4 Ω, a 2 Ω load receives I=12/(4+2)=2 A and VL=4 V.`],
   [/star|delta|source transformation/,`A source V in series with R is equivalent at its terminals to a current source I=V/R in parallel with the same R. A 10 V source in series with 5 Ω becomes a 2 A source in parallel with 5 Ω.`],
   [/transient/,`For a charging RC circuit, τ=RC. If R=1 kΩ and C=100 μF, τ=0.1 s. After one time constant, the capacitor reaches about 63.2% of its final voltage; after five time constants it is practically settled.`],
   [/sinusoidal|phasor|power factor/,`For a resistor R=10 Ω driven by 10 V RMS, I=V/R=1 A RMS and real power is VI=10 W. In a purely resistive circuit, voltage and current are in phase and power factor is 1.`],
   [/resonance|q.factor|bandwidth|coupled/,`For an ideal series RLC circuit, resonance occurs when ωL=1/(ωC), so ω₀=1/√(LC). At resonance, the reactive parts cancel and the input impedance is purely resistive.`],
   [/two.port/,`Two-port parameters describe how the voltages and currents at one port relate to those at the other. In Z-parameters, z₁₁=V₁/I₁ with I₂=0, meaning port 2 is open-circuited during that measurement.`],
   [/network function|pole|zero|stability/,`For H(s)=1/(s+3), the pole is s=−3. The corresponding natural mode e^(−3t) decays, which is consistent with a stable continuous-time first-order system.`],
   [/graph theory|topology/,`A connected network tree contains every node but no closed loop. For N nodes, a tree has N−1 branches; remaining branches are links that create independent loops.`]
  ],
  sig:[
   [/continuous.time|discrete.time signals/,`A continuous-time signal x(t) can be evaluated at any real time t; a discrete-time sequence x[n] exists only at integer indices. For x[n]=[1,2] at n=0,1, shifting right by one gives x[n−1], whose nonzero samples occur at n=1,2.`],
   [/energy|power|even|odd/,`For x[n]=[1,2] with all other samples zero, energy is Σ|x[n]|²=1²+2²=5. Its even part is xₑ[n]=(x[n]+x[−n])/2 and its odd part is xₒ[n]=(x[n]−x[−n])/2.`],
   [/elementary signals|impulse|step|ramp/,`The unit step u(t) is 0 before t=0 and 1 after t=0. Its derivative is the unit impulse δ(t) in the distribution sense. Integrating u(t) produces the ramp r(t)=t u(t).`],
   [/system propert|linearity|time.invariance|causality|stability/,`Test y(t)=3x(t): it is linear, time-invariant, memoryless, causal and BIBO-stable. Test y(t)=x(t)+1: it is not linear because zero input produces output 1, but it is time-invariant.`],
   [/convolution|impulse response/,`For x[n]=[1,2] and h[n]=[1,1], convolution gives y[0]=1, y[1]=1·1+2·1=3, and y[2]=2, so y=[1,3,2]. The middle output is larger because both sequences overlap there.`],
   [/differential|difference equation/,`For y′(t)+2y(t)=x(t), the derivative term means the system has memory: its output depends on how the state changes, not only on the present input. With zero input, the natural response is C e^(−2t).`],
   [/fourier/,`A Fourier representation expresses a signal using sinusoids or complex exponentials. A periodic signal uses a discrete set of harmonics; an aperiodic signal is commonly represented by a continuous frequency spectrum.`],
   [/laplace/,`The Laplace transform of e^(−at)u(t) is 1/(s+a) with ROC Re(s)>−a. The formula alone is incomplete without the ROC, because the ROC helps identify which time signal the transform represents.`],
   [/z.transform/,`For x[n]=aⁿu[n], X(z)=1/(1−az⁻¹) with ROC |z|>|a|. The pole is at z=a; the outside ROC corresponds to a right-sided sequence.`],
   [/sampling|aliasing|reconstruction/,`If a signal contains frequencies up to 3 kHz, ideal bandlimited sampling requires a sampling rate greater than 6 kHz to avoid aliasing under the sampling theorem’s assumptions. A practical system also needs an anti-aliasing filter.`],
   [/poles|zeros|transfer function|frequency response/,`For H(s)=1/(s+2), the pole is −2 and there is no finite zero. The frequency response is H(jω)=1/(2+jω); its magnitude is 1/√(4+ω²), which decreases as frequency rises.`]
  ]
 };
 const entries=examples[id]||[];
 for(const [re,txt] of entries){if(re.test(n))return txt;}
 if(id==='ana') return 'Begin by identifying the device and its operating region. Establish the DC operating point first; only then use the appropriate small-signal model. Check that the calculated voltages and currents still satisfy the assumed region.';
 if(id==='dig') return 'List every possible input combination and determine the output for each one. A truth table is the safest starting point; simplify the Boolean expression only after the required behaviour is clear.';
 if(id==='ctl') return 'Write the input-output model and identify the poles before judging behaviour. For a continuous-time linear system, a pole with a negative real part gives a decaying exponential mode; a positive real part gives a growing mode.';
 if(id==='com') return 'Separate the message, carrier, channel and receiver. Write what quantity is being modulated, determine the bandwidth or power relationship, and state the noise and detection assumptions before calculating.';
 if(id==='em'||id==='mw') return 'Draw the geometry and identify the propagation direction, material parameters and boundary conditions. Choose the field or wave equation that matches those conditions, then check units and limiting cases.';
 if(id==='dev') return 'Start from the physical mechanism—carrier motion, junction depletion or electric-field control—then select the device equation valid in the assumed operating region. Recheck that region after calculating.';
 if(id==='mic') return 'Trace the data path one operation at a time: identify the register or memory location read, the operation performed, the destination written, and any flags or peripheral side effects.';
 if(id==='me') return 'State the measurand, instrument range, resolution and uncertainty. Perform the calculation with units, then report precision that the instrument can actually support.';
 if(id==='pw') return 'Draw the converter current path for each switch state. Apply the inductor voltage and capacitor current relationships, average over one switching period, and state whether continuous conduction and ideal components are assumed.';
 if(id==='dsp') return 'Write the sequence indices and transform convention first. Keep track of finite length, periodic extension, scaling and circular-versus-linear operations; verify the method on a short sequence.';
 if(id==='op') return 'Keep power ratios in dB and absolute optical power in dBm. Separate attenuation (power loss) from dispersion (pulse spreading), then check the received power and timing budgets independently.';
 return 'Translate the statement into known quantities and an unknown, state the governing rule and its assumptions, solve one step at a time, and check the result using units, limiting cases or a simple counterexample.';
}
function topicSyllabusChecklist(s,t){
 const items=lessonScopeFor(s,t);
 if(!items.length)return '';
 return `<section class="topic-scope"><h3>Exact scope for this lesson</h3><p>Use this as a checklist while studying. Every item below should be understandable, not merely familiar by name.</p><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul><div class="ex"><b>Worked example — start here.</b> ${topicSpecificExample(s,t)}</div></section>`;
}

/* ---------- topic ---------- */
function renderTopic(sid,tid){
  const s=SUBJECTS.find(x=>x.id===sid);
  if(!s){ renderHome(); return; }
  const idx=s.topics.findIndex(t=>t.id===tid);
  if(idx<0){ renderSubject(sid); return; }
  const t=s.topics[idx];
  const key=sid+'/'+tid;
  const isDone=!!done[key];
  const prev=idx>0?s.topics[idx-1]:null;
  const next=idx<s.topics.length-1?s.topics[idx+1]:null;

  crumbs.innerHTML=`<a href="#/">Home</a> · <a href="#/s/${sid}">${s.name}</a> · <b>${t.name}</b>`;

  view.innerHTML=`
    <span class="chip">${s.icon} ${s.name}</span>
    <h1>${t.name}</h1>
    <div class="actions">
      <button class="btn ${isDone?'ok':''}" id="doneBtn">${isDone?'✓ Completed':'○ Mark as complete'}</button>
      <button class="btn" id="printBtn">🖨 Print / PDF</button>
    </div>
    <article class="prose" id="prose">${beginnerFirstLesson(s,t)}${topicSyllabusChecklist(s,t)}${t.body}</article>

    <div class="notes">
      <h3 style="margin-top:0">My notes</h3>
      <textarea id="noteBox" placeholder="Your own notes, doubts, shortcuts for this topic…">${(notes[key]||'').replace(/</g,'&lt;')}</textarea>
      <div class="saved" id="savedMsg"></div>
    </div>

    <nav class="pager">
      ${prev?`<a href="#/t/${sid}/${prev.id}"><small>← Previous</small>${prev.name}</a>`:'<span></span>'}
      ${next?`<a class="nx" href="#/t/${sid}/${next.id}"><small>Next →</small>${next.name}</a>`:'<span></span>'}
    </nav>
  `;

  injectFigures(view);
  renderMath(view);
  // Keep the expanded self-checks saved locally without changing topic-completion tracking.
  const deepCheckKey='isro.ece.v2.deepchecks';
  let deepChecks={};
  try{deepChecks=JSON.parse(localStorage.getItem(deepCheckKey)||'{}')||{};}catch(_){deepChecks={};}
  view.querySelectorAll('[data-deep-check]').forEach(box=>{
    box.checked=!!deepChecks[box.dataset.deepCheck];
    box.addEventListener('change',()=>{
      deepChecks[box.dataset.deepCheck]=box.checked;
      localStorage.setItem(deepCheckKey,JSON.stringify(deepChecks));
    });
  });

  $('#doneBtn').addEventListener('click',()=>{
    done[key]=!done[key];
    saveProg();
    const b=$('#doneBtn');
    b.classList.toggle('ok',done[key]);
    b.textContent=done[key]?'✓ Completed':'○ Mark as complete';
    refreshNavCounts();
  });
  $('#printBtn').addEventListener('click',()=>window.print());

  let timer;
  $('#noteBox').addEventListener('input',e=>{
    notes[key]=e.target.value;
    clearTimeout(timer);
    timer=setTimeout(()=>{
      saveNotes();
      const m=$('#savedMsg');
      m.textContent='Saved ✓';
      setTimeout(()=>{m.textContent='';},1400);
    },500);
  });
}

/* ---------- formula sheet ---------- */
function renderFormulas(){
  crumbs.innerHTML=`<a href="#/">Home</a> · <b>Formula Sheet</b>`;
  let html=`<span class="chip">📐 Quick Revision</span><h1>Formula Sheet</h1>
    <p style="color:var(--muted)">Every formula block from every topic, grouped by subject. Use Ctrl+F to find a specific one.</p>`;
  SUBJECTS.forEach(s=>{
    let block='';
    s.topics.forEach(t=>{
      const doc=new DOMParser().parseFromString('<div>'+t.body+'</div>','text/html');
      const fs=doc.querySelectorAll('.formula');
      if(!fs.length) return;
      block+=`<h3>${t.name}</h3>`;
      fs.forEach(f=>{ block+=`<div class="formula">${f.innerHTML}</div>`; });
    });
    if(block) html+=`<h2>${s.icon} ${s.name}</h2>`+block;
  });
  view.innerHTML=html;
  renderMath(view);
}

/* ---------- search ---------- */
const searchInput=$('#search');
searchInput.addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){ buildNav(); refreshNavCounts(); return; }
  const results=[];
  SUBJECTS.forEach(s=>{
    s.topics.forEach(t=>{
      const hay=(s.name+' '+t.name+' '+t.body).toLowerCase();
      if(hay.includes(q)) results.push({s,t});
    });

  nav.innerHTML=`<div style="padding:6px 8px 12px;font-size:11px;color:var(--muted)">${results.length} result(s)</div>`+
    results.slice(0,60).map(r=>`<div class="sres" data-link="#/t/${r.s.id}/${r.t.id}">
        <b>${r.t.name}</b><span>${r.s.icon} ${r.s.name}</span>
      </div>`).join('');
  nav.querySelectorAll('[data-link]').forEach(el=>{
    el.addEventListener('click',()=>{ location.hash=el.getAttribute('data-link'); closeSidebar(); });
  });
});

/* ---------- mobile ---------- */
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
$('#menuBtn').addEventListener('click',()=>{
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show',sidebar.classList.contains('open'));
});
overlay.addEventListener('click',closeSidebar);

/* ---------- theme ---------- */
const themeBtn=$('#themeBtn');
const savedTheme=localStorage.getItem('isro.ece.theme');
if(savedTheme) document.documentElement.setAttribute('data-theme',savedTheme);
themeBtn.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nxt=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nxt);
  localStorage.setItem('isro.ece.theme',nxt);
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); searchInput.focus();
  }
  if(e.key==='Escape'){ searchInput.blur(); closeSidebar(); }
});

/* ---------- init ---------- */
buildNav();
updateTopProgress();
route();
</script>
</body>
</html>
