  {id:'rect', name:'Single-Phase and Three-Phase Rectifiers', body: T`<h2>1. Rectification</h2>
<p>A rectifier converts AC into a unidirectional output. A half-wave circuit uses one half-cycle; a full-wave circuit uses both. An uncontrolled rectifier uses diodes, while a controlled rectifier uses thyristors to choose when conduction begins.</p>
<h2>2. Single-phase circuits</h2>
<p>For an ideal sinusoidal source with peak V_m, a half-wave diode rectifier has average output V_m/π and a full-wave rectifier V_dc=2V_m/π, assuming a resistive load and ideal devices. The RMS values and ripple depend on the waveform and filter.</p>
<div class="formula">$$V_{dc,half}=\frac{V_m}{\pi},\qquad V_{dc,full}=\frac{2V_m}{\pi}$$</div>
<p>A bridge rectifier conducts through two diodes in each half-cycle, so the output loses roughly two forward drops in a practical circuit. A centre-tapped full-wave rectifier uses one diode at a time but needs a suitable transformer winding.</p>
<h2>3. Three-phase rectifiers</h2>
<p>A three-phase bridge uses six diodes and produces six-pulse output. At ideal continuous current, the average output of a three-phase diode bridge is approximately 1.35 times line-to-line RMS voltage. The ripple frequency is six times the supply frequency.</p>
<div class="ex"><b>Example.</b> For a 400 V line-to-line three-phase supply, ideal average DC is about 1.35×400=540 V before device drops and source-impedance effects.</div>
<h2>4. Ripple and filtering</h2>
<p>Rectified voltage is not perfectly constant. A capacitor charges near waveform peaks and discharges into the load between peaks. Larger capacitance or lighter load reduces ripple, but increases charging-current pulses and can worsen power factor and diode stress.</p>
<div class="tip"><b>Exam trap:</b> Check whether voltage is peak, phase RMS or line-to-line RMS. Many rectifier errors are caused by mixing these quantities.</div>
<h4>Rectifier output and ripple</h4>
<p>An ideal single-phase half-wave rectifier with sinusoidal peak <code>V_m</code> has average output <code>V_DC=V_m/π</code>; an ideal full-wave rectifier has <code>2V_m/π</code>. A bridge rectifier has two conducting diode drops per current path. A capacitor filter charges near the peak and discharges between peaks, reducing ripple but increasing peak diode current.</p>
<p>For a full-wave rectifier on a 50 Hz supply, the dominant ripple frequency is 100 Hz. Approximate capacitor ripple is <code>ΔV≈I_load/(f_ripple C)</code> for small ripple and nearly constant load current.</p>
`},

  {id:'ctrl', name:'Controlled Rectifiers & Firing Angle', body: T`<h2>1. Controlled rectification</h2>
<p>A thyristor does not begin conducting merely because it is forward biased; a gate pulse triggers it. The firing angle α is measured from the natural point at which a diode would start conducting. Delaying the gate pulse changes the average output voltage.</p>
<h2>2. Single-phase full converter</h2>
<p>For a fully controlled single-phase bridge with continuous load current and ideal supply, the average output is:</p>
<div class="formula">$$V_{dc}=\frac{2V_m}{\pi}\cos\alpha$$</div>
<p>This formula relies on continuous current and the stated converter assumptions. For a resistive load, current may become discontinuous and the expression may not apply over the whole firing-angle range.</p>
<h2>3. Half-controlled bridge and load effects</h2>
<p>A semi-converter uses controlled and uncontrolled devices and generally provides non-negative average output under normal rectifier operation. Inductive loads can keep current flowing after source voltage changes sign; freewheeling paths and commutation intervals matter.</p>
<h2>4. Worked example</h2>
<div class="ex"><b>Example.</b> If V_m=325 V and α=60°, the continuous-current full-converter ideal average is (2×325/π)cos60°≈103.5 V. Real output is reduced by device drops and commutation overlap.</div>
<div class="tip"><b>Exam trap:</b> The cosine formula is not a universal rectifier formula. State converter type, load-current continuity and whether the input voltage is peak or RMS.</div>
<h4>Controlled rectifier: firing angle</h4>
<p>In a single-phase fully controlled bridge with continuous load current, the ideal average output is <code>V_DC=(2V_m/π)cosα</code>, where α is the firing delay angle. At α=0°, output is maximum positive; increasing α reduces average output, and beyond 90° the ideal average becomes negative under the required current/energy-flow conditions.</p>
<p>This formula assumes the specified bridge topology and continuous current. Half-controlled bridges, discontinuous current and source inductance have different equations or waveforms, so identify the circuit before using the formula.</p>
`},

  {id:'dcdc', name:'DC–DC Converters — Buck, Boost, Buck–Boost', body: T`<h2>1. Why DC–DC converters switch</h2>
<p>A DC–DC converter changes one DC voltage into another using a switch, diode or synchronous switch, inductor and capacitor. Rather than dissipating the extra voltage in a resistor, it stores and transfers energy, which can be efficient.</p>
<h2>2. Buck converter</h2>
<p>A buck converter steps voltage down. During ON time, the inductor sees approximately V_in−V_out; during OFF time it delivers stored energy to the load through the freewheel path. In ideal continuous-conduction mode (CCM), inductor volt-second balance gives:</p>
<div class="formula">$$V_o=D V_{in}$$</div>
<p>D is duty ratio, the fraction of each switching period that the switch is ON.</p>
<h2>3. Boost converter</h2>
<p>A boost converter stores energy in the inductor while the switch is ON, then adds the inductor voltage to the input while the switch is OFF. Ideal CCM gives:</p>
<div class="formula">$$V_o=\frac{V_{in}}{1-D}$$</div>
<h2>4. Buck–boost converter</h2>
<p>The classic inverting buck–boost converter can produce an output polarity opposite to its input:</p>
<div class="formula">$$\frac{V_o}{V_{in}}=-\frac{D}{1-D}$$</div>
<p>These gain equations assume ideal components and CCM. At light load the converter may enter discontinuous-conduction mode, where gain also depends on load and inductance.</p>
<div class="ex"><b>Example.</b> An ideal buck with V_in=24 V and D=0.25 gives V_o=6 V. An ideal boost with V_in=12 V and D=0.5 gives V_o=24 V, but real losses reduce the output.</div>
<div class="tip"><b>Exam method:</b> Draw ON and OFF current paths, write the inductor voltage in each interval, then apply average inductor voltage = 0 in steady-state CCM.</div>
<h4>Buck and boost in continuous conduction</h4>
<p>For an ideal buck converter in continuous-conduction mode, <code>V_o=D V_in</code>. With <code>V_in=24 V</code> and duty ratio <code>D=0.25</code>, <code>V_o≈6 V</code>. For an ideal boost converter, <code>V_o=V_in/(1−D)</code>; at the same input and duty ratio, <code>V_o≈32 V</code>.</p>
<p>These relations assume ideal components, steady state and continuous inductor current. Real losses lower the output or require a different duty ratio. As D approaches one, boost gain rises mathematically but current stress and nonideal losses become severe.</p>
`},

  {id:'inv', name:'Inverters & PWM Techniques', body: T`<h2>1. What an inverter does</h2>
<p>An inverter converts DC into AC by switching semiconductor devices in a pattern that creates an alternating output. The output may be a square wave, a stepped waveform or a PWM waveform whose fundamental component approximates a sine wave.</p>
<h2>2. Single-phase bridge</h2>
<p>A full bridge applies +V_dc or −V_dc to the load by turning on diagonal switch pairs. Never turn on both devices in the same bridge leg simultaneously: this creates shoot-through from the DC supply. Dead time prevents overlap, but too much dead time distorts the output.</p>
<h2>3. PWM concepts</h2>
<p>Pulse-width modulation varies switching duty to control the average/fundamental output. In sinusoidal PWM, a sinusoidal reference is compared with a high-frequency triangular carrier. The modulation index controls fundamental amplitude within the linear modulation region; the carrier ratio affects switching harmonics.</p>
<h2>4. Harmonics and filters</h2>
<p>Switching produces harmonics around the carrier and its sidebands. An LC filter can attenuate high-frequency components, but its resonance and load interaction must be considered. Higher switching frequency can ease filtering but increases switching losses and EMI.</p>
<div class="ex"><b>Example.</b> In a two-level bridge, changing the duty pattern changes the fundamental voltage even though the instantaneous output still switches between discrete levels. PWM does not make the raw waveform a perfect sine wave; filtering and load response shape it.</div>
<div class="tip"><b>Exam trap:</b> The fundamental output voltage depends on topology and modulation strategy. Do not use one inverter voltage formula without checking whether it is half-bridge/full-bridge and square-wave/PWM.</div>
<h4>Inverter frequency and modulation</h4>
<p>An inverter synthesizes AC from a DC source. In PWM, switching duty is varied so the low-frequency component follows a reference waveform while harmonics are shifted toward the switching frequency and its sidebands. An output filter can attenuate switching ripple but must be designed for the load and modulation scheme.</p>
<p>Distinguish output fundamental frequency from switching frequency. Increasing switching frequency can ease filtering but increases switching loss and EMI. Dead time prevents shoot-through in a bridge leg, but too much dead time distorts the output voltage.</p>
`},

  {id:'chop', name:'Choppers, AC Voltage Controllers & Cycloconverters', body: T`<h2>1. Choppers</h2>
<p>A chopper converts a fixed DC input into a controlled DC output by rapidly switching it. Duty ratio D=t_ON/T controls the average output. A step-down chopper (buck-like) ideally has V_o=D V_in in continuous operation with the relevant topology.</p>
<h2>2. AC voltage controllers</h2>
<p>An AC controller varies the RMS voltage delivered to a load, often by phase-controlling two SCRs or using a TRIAC. Delaying conduction within each half-cycle changes the load waveform. The output is still AC at the supply frequency but contains harmonics.</p>
<h2>3. Cycloconverters</h2>
<p>A cycloconverter converts AC at one frequency directly to AC at a lower frequency using controlled rectifier groups, without an intermediate DC link in the classic line-commutated form. It is useful for high-power, low-speed drives but has complex control and harmonic concerns.</p>
<h2>4. Load and commutation effects</h2>
<p>Inductive loads cause current to lag voltage and continue after voltage crosses zero. Device turn-off and current paths therefore depend on load inductance and commutation. Always sketch both voltage and current before applying a resistive-load formula.</p>
<div class="ex"><b>Example.</b> An ideal step-down chopper with 100 V input and duty ratio 0.4 gives an average output near 40 V under the simple continuous-conduction model.</div>
<div class="tip"><b>Exam trap:</b> Average voltage, RMS voltage and fundamental RMS voltage are different. Phase-controlled AC waveforms make this distinction especially important.</div>
<h4>Duty ratio and average output</h4>
<p>An ideal step-down chopper gives <code>V_o=D V_s</code> when the load voltage is V_s during the on interval and zero during off, under the appropriate topology. If the switch is on 30% of the period, <code>D=0.3</code>; with 100 V input, the ideal average is 30 V.</p>
<p>AC voltage controllers use phase control or integral-cycle control and are not described by the DC buck formula. Cycloconverters directly convert AC at one frequency to AC at another, usually lower frequency in traditional line-commutated forms.</p>
`},

  {id:'smps', name:'Switch-Mode Power Supplies', body: T`<h2>1. What an SMPS is</h2>
<p>A switch-mode power supply (SMPS) regulates power by switching a transistor at high frequency and transferring energy through inductors, capacitors and sometimes a transformer. Compared with a linear regulator, the pass device spends less time dissipating a large voltage while carrying large current, so efficiency can be higher.</p>
<h2>2. Main functional blocks</h2>
<ol><li>Input protection and EMI filter.</li><li>Rectifier and bulk capacitor for AC input, when used.</li><li>High-frequency switching stage and controller.</li><li>Inductor/transformer and output rectification.</li><li>Output filter and feedback regulation.</li><li>Protection for overcurrent, overvoltage, overtemperature and short circuit.</li></ol>
<h2>3. Feedback and isolation</h2>
<p>A feedback loop compares output with a reference and adjusts duty ratio or switching frequency. Isolated supplies use a transformer and often an optocoupler or isolated feedback circuit to cross the safety barrier. Loop compensation is needed for stability; a supply can oscillate even if its power stage is otherwise correct.</p>
<h2>4. Efficiency and thermal design</h2>
<div class="formula">$$\eta=\frac{P_{out}}{P_{in}}\times100\%,\qquad P_{loss}=P_{in}-P_{out}$$</div>
<div class="ex"><b>Example.</b> A 50 W output supply at 90% efficiency draws 50/0.9≈55.6 W and dissipates about 5.6 W as heat.</div>
<div class="tip"><b>Safety:</b> Offline supplies can contain hazardous mains voltage and capacitors that remain charged after unplugging. Design and troubleshooting require isolation, rated equipment and proper discharge procedures.</div>
<h4>Feedback regulation in an SMPS</h4>
<p>A switching regulator senses output voltage, compares it with a reference, and adjusts duty cycle or switching behavior. The power stage transfers energy through inductors and capacitors; feedback corrects load and input changes. Compensation is needed because the power stage has poles and zeros and feedback delay can cause oscillation.</p>
<p>Check startup, current limit, transient response, loop stability, thermal limits, conducted/radiated EMI, and isolation requirements. A nominally correct DC output does not prove the supply is stable under load steps.</p>
`},

  {id:'loss', name:'Switching Losses, Efficiency, Harmonics & Filtering', body: T`<h2>1. Where losses come from</h2>
<p>Converter losses include switch conduction, switch transitions, diode recovery/forward drop, inductor copper and core losses, capacitor ESR, gate-drive power and control circuitry. The dominant loss changes with load current, switching frequency, device choice and temperature.</p>
<h2>2. Conduction and switching loss</h2>
<div class="formula">$$P_{cond}\approx I_{RMS}^2R_{DS(on)},\qquad P_{sw}\approx\frac12 VI(t_r+t_f)f_s$$</div>
<p>The MOSFET conduction estimate assumes its on-resistance model is appropriate. The switching estimate assumes approximate linear overlap during turn-on and turn-off. Both are first-order estimates; use datasheet waveforms and conditions for design.</p>
<h2>3. Efficiency trade-offs</h2>
<p>Raising switching frequency can reduce inductor/transformer size and ease filtering, but typically raises switching and magnetic core losses. A lower R_DS(on) device may have larger gate charge, creating a trade-off between conduction and drive/switching loss.</p>
<h2>4. Harmonics and filtering</h2>
<p>Switching waveforms contain high-frequency harmonics that can cause conducted/radiated EMI and extra heating. Filters, tight current loops, proper grounding, snubbers and layout reduce interference. A filter must meet ripple requirements without creating an unstable interaction with the converter control loop.</p>
<div class="ex"><b>Example.</b> If a converter supplies 100 W at 95% efficiency, input power is 100/0.95≈105.3 W and losses are about 5.3 W.</div>
<div class="tip"><b>Exam trap:</b> A higher switching frequency does not automatically improve efficiency. Always weigh smaller passive components against increased switching and core losses.</div>
<h4>Efficiency and thermal estimate</h4>
<p>Efficiency is <code>η=P_out/P_in</code>; loss is <code>P_loss=P_in−P_out</code>. If a converter delivers 90 W at 90% efficiency, input power is 100 W and heat loss is 10 W. That heat must be removed from components within their thermal limits.</p>
<p>Switching loss tends to rise with switching frequency and depends on voltage, current, transition times and device capacitances. Conduction loss depends on current and device on-state behavior. Harmonic filtering and power-factor correction may be required by application or standards.</p>
`},

  {id:'drv', name:'Gate Drivers, Snubbers & Protection', body: T`<h2>1. Why a gate driver is needed</h2>
<p>A controller pin usually cannot charge a power transistor’s gate quickly enough or safely provide the required voltage. A gate driver supplies peak current to charge/discharge gate capacitance, provides the correct gate-source or gate-emitter voltage, and may include isolation, undervoltage lockout and fault handling.</p>
<h2>2. Gate charge and switching speed</h2>
<p>The gate is capacitive, so switching depends on charge rather than DC gate current. A rough average drive current is I≈Q_g/t_sw. Lower gate resistance can reduce transition time but increases peak current and can excite parasitic inductance, ringing and EMI. Driver layout and common-source/emitter inductance matter.</p>
<h2>3. High-side driving and dead time</h2>
<p>A high-side N-channel MOSFET needs its gate voltage above its source. Bootstrap drivers can create this voltage for suitable switching patterns, but their capacitor must recharge and cannot support every 100% duty-cycle or static condition. Half-bridge legs need dead time to avoid shoot-through; excessive dead time increases distortion and diode conduction.</p>
<h2>4. Snubbers and protection</h2>
<p>RC/RCD snubbers and clamps absorb energy from stray inductance and limit voltage overshoot. Gate resistors, Miller clamps, desaturation detection, current sensing and soft shutdown can improve robustness. Protection must be coordinated with the device’s safe operating area.</p>
<div class="ex"><b>Example.</b> A gate charge of 60 nC moved in 100 ns requires about 0.6 A average gate current during that transition (60 nC/100 ns). Peak current can be higher.</div>
<div class="tip"><b>Exam trap:</b> A gate resistor controls switching dynamics; it is not a substitute for correct dead time, layout, voltage rating or overcurrent protection.</div>
<h4>Gate drive and snubber purpose</h4>
<p>A MOSFET gate is capacitive. The driver must move gate charge quickly enough to achieve desired switching transitions; approximate average gate-drive power is <code>P_gate≈Q_g V_drive f_s</code>. Higher frequency or gate charge increases driver power demand.</p>
<p>A snubber limits voltage overshoot or ringing caused by parasitic inductance/capacitance. Gate resistors trade switching speed against ringing and EMI. Verify gate-source voltage limits, isolation, dead time, Miller turn-on, layout loop inductance and fault response.</p>
`}
  ]
},

/* ============================================================ 13 DSP */
{
  id:'dsp', name:'Digital Signal Processing', icon:'◫',
  topics:[
  {id:'dt', name:'Discrete-Time Systems & Difference Equations', body: T`<h2>1. Begin with a sequence</h2>
<p>A discrete-time signal is a list of samples indexed by an integer: x[n]. The index n is not continuous time; x[2] means the third indexed sample if indexing starts at zero. A discrete-time system maps an input sequence x[n] into an output y[n].</p>
<h2>2. Difference equations</h2>
<p>A difference equation relates present and past input/output samples. For example, y[n]=0.5y[n−1]+x[n] says the current output is the current input plus half the previous output. Because past output feeds back, this is recursive.</p>
<div class="ex"><b>Step by step.</b> If the system starts at rest and x[0]=1, x[1]=0, then y[0]=1. Next y[1]=0.5y[0]+0=0.5; y[2]=0.25; the response decays geometrically.</div>
<h2>3. Linear, time-invariant and causal tests</h2>
<p>Linearity requires superposition: input ax₁[n]+bx₂[n] must produce ay₁[n]+by₂[n]. Time invariance means delaying the input delays the output by the same number of samples. A causal system uses no future input samples. These are separate properties; one does not imply the others.</p>
<h2>4. FIR versus IIR</h2>
<p>FIR systems have a finite impulse response and commonly use only input samples: y[n]=Σbₖx[n−k]. IIR systems use feedback terms as well: y[n]=Σbₖx[n−k]−Σaₖy[n−k]. FIR filters can be designed with exact linear phase and are BIBO-stable when coefficients are finite. IIR filters can achieve a sharp response with fewer coefficients, but stability must be checked.</p>
<h2>5. Transfer function and initial rest</h2>
<p>Under zero initial conditions, the Z-transform converts delays into powers of z⁻¹, giving H(z)=Y(z)/X(z). The coefficient of each delay must be handled consistently; signs in the difference equation determine signs in the denominator.</p>
<div class="ex"><b>Example.</b> y[n]=0.5y[n−1]+x[n] gives H(z)=1/(1−0.5z⁻¹). Its pole is z=0.5, inside the unit circle, so the causal system is stable.</div>
<h2>Exam checks</h2><ul><li>State initial conditions before using a transform.</li><li>Do not confuse a recursive equation with a noncausal one; feedback from past output is causal.</li><li>For a causal rational system, stability requires all poles strictly inside the unit circle.</li></ul>
<h4>Difference-equation response</h4>
<p>A discrete-time LTI system may be described by <code>y[n]−0.5y[n−1]=x[n]</code>. With zero initial conditions, the transfer function is <code>H(z)=1/(1−0.5z⁻¹)</code>. Its impulse response is <code>h[n]=(0.5)ⁿu[n]</code>, and it is BIBO stable because <code>Σ|h[n]|=Σ(0.5)ⁿ=2</code> is finite.</p>
<p>For causal rational discrete-time systems, all poles must lie strictly inside the unit circle for BIBO stability. Poles on the unit circle are not BIBO-stable in the usual noncancelled rational case.</p>
`},

  {id:'dft', name:'DTFT and DFT — Properties & Computation', body: T`<h2>1. Two related frequency descriptions</h2>
<p>The DTFT describes the frequency content of a discrete-time sequence as a continuous function of angular frequency ω, periodic every 2π. The DFT samples that frequency description at N equally spaced frequencies so a computer can calculate it.</p>
\[X[k]=\sum_{n=0}^{N-1}x[n]e^{-j2\pi kn/N},\qquad x[n]=\frac1N\sum_{k=0}^{N-1}X[k]e^{j2\pi kn/N}.\]
<p>Here N is the transform length, n indexes time samples, and k indexes frequency bins. The inverse contains the factor 1/N under this convention.</p>
<h2>2. Frequency bins and resolution</h2>
<p>If the sampling rate is fₛ, bin k corresponds to fₖ=kfₛ/N, with bin spacing Δf=fₛ/N. Increasing N by collecting a longer record improves the ability to distinguish nearby tones; adding zero padding makes the plotted spectrum smoother but does not create new physical information.</p>
<div class="ex"><b>Example.</b> For fₛ=8000 Hz and N=800 samples, Δf=8000/800=10 Hz. Bin k=25 corresponds to 250 Hz.</div>
<h2>3. Core properties</h2>
<ul><li>Linearity: the DFT of ax[n]+by[n] is aX[k]+bY[k].</li><li>Circular time shift: shifting a length-N sequence multiplies its DFT by a phase factor.</li><li>Pointwise multiplication in frequency corresponds to circular convolution in time.</li><li>Parseval: time-domain energy and appropriately scaled frequency-domain energy agree.</li><li>For real x[n], X[N−k]=X*[k] (with indices interpreted modulo N), giving conjugate symmetry.</li></ul>
<h2>4. Leakage and windowing</h2>
<p>The DFT treats the N observed samples as one period repeated forever. If the record does not contain an integer number of sinusoidal cycles, this artificial repetition creates a boundary jump and spreads energy across bins: spectral leakage. Windows taper the endpoints to reduce leakage, trading it against a wider main lobe.</p>
<h2>5. Worked reasoning and traps</h2>
<p>A sinusoid exactly aligned with a DFT bin concentrates energy in the corresponding bin (and its negative-frequency partner for a real sinusoid). A non-bin-centred sinusoid spreads energy. Remember that DFT convolution is circular; zero-pad appropriately when linear convolution is required.</p>
<h4>DFT interpretation and leakage</h4>
<p>The N-point DFT is <code>X[k]=Σₙ₌₀ᴺ⁻¹x[n]e^(−j2πkn/N)</code>. It samples the DTFT at equally spaced frequencies <code>ω_k=2πk/N</code>. The inverse DFT reconstructs the finite sequence from those N frequency samples.</p>
<p>If a sinusoid completes an integer number of cycles in the N-sample window, its energy aligns with DFT bins under ideal conditions. Otherwise, finite-window truncation spreads energy across bins, called spectral leakage. Window functions reduce sidelobes at the cost of a wider main lobe.</p>
`},

  {id:'fft', name:'FFT — Radix-2 DIT and DIF', body: T`<h2>1. Why an FFT exists</h2>
<p>The discrete Fourier transform is a mathematical operation; the fast Fourier transform (FFT) is a family of algorithms that computes the same result with fewer operations. A direct N-point DFT needs roughly N² complex operations, whereas radix-2 FFT uses roughly N log₂N, provided N is a power of two.</p>
<h2>2. Divide-and-conquer idea</h2>
<p>For N=2M, separate even-indexed samples x[2r] and odd-indexed samples x[2r+1]. Compute an M-point transform of each group, then combine them with twiddle factors W_N^k=e^(−j2πk/N):</p>
\[X[k]=E[k]+W_N^kO[k],\quad X[k+N/2]=E[k]-W_N^kO[k].\]
<p>The pair of equations is a butterfly: one sum and one twiddle-weighted difference. The same decomposition repeats recursively until two-point transforms remain.</p>
<h2>3. DIT and DIF</h2>
<p>Decimation-in-time (DIT) splits the input sequence into even and odd samples; decimation-in-frequency (DIF) splits the output-frequency calculation. They compute the same DFT but arrange butterflies and data ordering differently. A common radix-2 implementation uses bit-reversed ordering at either input or output.</p>
<div class="ex"><b>Example.</b> N=8 requires log₂8=3 stages. Each stage has N/2=4 butterflies, for 12 butterflies overall. This is far fewer than evaluating all 64 DFT terms directly.</div>
<h2>4. Practical implementation</h2>
<ul><li>Check transform length and whether the implementation expects bit-reversed input/output.</li><li>Track twiddle-factor signs: forward transforms normally use the negative exponent.</li><li>Scaling conventions differ; some inverse FFTs apply 1/N, others distribute scaling.</li><li>Real-valued input has conjugate-symmetric output, so some implementations exploit this to save work.</li></ul>
<h2>Exam traps</h2><p>An FFT is not a different transform and does not improve the inherent frequency resolution. It changes computational cost. DIT/DIF names refer to the decomposition direction, not to different physical meanings of frequency.</p>
<h4>Radix-2 FFT workload</h4>
<p>A direct N-point DFT needs on the order of <code>N²</code> complex operations, while a radix-2 FFT needs on the order of <code>N log₂N</code>. For <code>N=1024</code>, <code>log₂N=10</code>, so the FFT scales roughly with 10 stages of 512 butterflies per stage rather than roughly one million pairwise terms.</p>
<p>Radix-2 algorithms require N to be a power of two. Decimation-in-time and decimation-in-frequency differ in where the decomposition occurs and in input/output ordering; bit reversal is commonly needed at one end. Check the specific algorithm before assuming output order.</p>
`},

  {id:'struct', name:'FIR and IIR Filter Structures', body: T`<h2>1. Filter structure is the implementation</h2>
<p>A transfer function describes what a filter does; a structure describes how delays, multipliers and adders are connected to implement it. Different structures can represent the same H(z), yet differ in memory use, round-off behaviour and sensitivity to coefficient quantisation.</p>
<h2>2. FIR forms</h2>
<p>An FIR filter has H(z)=b₀+b₁z⁻¹+…+b_Mz⁻ᴹ and output y[n]=Σbₖx[n−k]. Direct form is a tapped delay line. Transposed form reverses the signal-flow arrangement while preserving the input-output relation. Linear-phase FIR filters often have symmetric or antisymmetric coefficients, allowing some multipliers to be shared.</p>
<h2>3. IIR forms</h2>
<p>An IIR transfer function has a denominator containing feedback terms. Direct Form I keeps separate delay lines for input and output; Direct Form II shares delays and is memory-efficient. Cascade form factors H(z) into first- or second-order sections; parallel form decomposes it into partial fractions.</p>
<div class="ex"><b>Example.</b> H(z)=(1+0.5z⁻¹)/(1−0.8z⁻¹) gives y[n]−0.8y[n−1]=x[n]+0.5x[n−1], hence y[n]=0.8y[n−1]+x[n]+0.5x[n−1]. The feedback coefficient is positive in this rearranged recurrence.</div>
<h2>4. Quantisation and stability</h2>
<p>Finite precision rounds coefficients and intermediate values. In an IIR filter, a small coefficient change can move a pole across the unit circle and cause instability. Second-order sections are often safer than one high-order polynomial because each section is easier to scale and control.</p>
<h2>Choose a structure</h2><ul><li>FIR tapped delay line: simple and naturally stable for finite coefficients.</li><li>IIR direct form: compact but potentially sensitive to quantisation.</li><li>Cascade biquads: usually preferred for practical high-order IIR filters.</li><li>Transposed structures can improve numerical behaviour in particular fixed-point implementations, but scaling still matters.</li></ul>
<h4>FIR versus IIR with a simple example</h4>
<p>An FIR filter has finite impulse response and can be implemented as <code>y[n]=Σₖ₌₀ᴹbₖx[n−k]</code>. An IIR filter uses feedback, for example <code>y[n]=0.5y[n−1]+x[n]</code>, giving an infinite decaying response when stable. FIR filters are inherently BIBO-stable when their finite coefficients are finite; IIR stability depends on pole locations.</p>
<p>FIR filters can achieve exact linear phase with symmetric or antisymmetric coefficients. IIR filters often meet a magnitude target with lower order but generally have nonlinear phase and require stability checks.</p>
`},

  {id:'fird', name:'FIR Filter Design Using Windows', body: T`<h2>1. What FIR design asks us to do</h2>
<p>FIR design chooses a finite set of coefficients bₖ so the frequency response approximates a desired low-pass, high-pass, band-pass or band-stop response. A window method begins with the ideal impulse response, which is generally infinite, then truncates it smoothly.</p>
<h2>2. Ideal low-pass response</h2>
<p>For a normalized cutoff ωc, the ideal low-pass impulse response is h_d[n]=ωc/π at n=0 and sin(ωc n)/(πn) otherwise. It extends infinitely in both directions, so it cannot be implemented directly. Shift it to make a causal finite sequence, then multiply by a window w[n]: h[n]=h_d[n]w[n].</p>
<h2>3. Window trade-offs</h2>
<ul><li>Rectangular window: narrow main lobe but relatively high sidelobes and leakage.</li><li>Hann/Hamming windows: lower sidelobes but wider transition bands.</li><li>Blackman: lower sidelobes still, with a wider main lobe.</li><li>Kaiser window: adjustable parameter β trades transition width against sidelobe attenuation.</li></ul>
<div class="ex"><b>Design logic.</b> If stopband attenuation is inadequate, choose a window with lower sidelobes. If the transition band is too wide, a longer filter usually helps. These requirements compete, so inspect both ripple and transition width.</div>
<h2>4. Linear phase</h2>
<p>Real FIR coefficients that are symmetric (h[n]=h[M−n]) or antisymmetric (h[n]=−h[M−n]) produce linear phase, apart from possible phase jumps at zeros. Linear phase means all frequency components are delayed by the same amount, avoiding phase distortion of waveform shape in the passband.</p>
<h2>5. Exam checklist</h2><ul><li>Distinguish cutoff frequency in rad/sample from Hz: ω=2πf/fₛ.</li><li>Window length controls the number of taps and transition sharpness.</li><li>Multiplying by a window in time corresponds to convolution in frequency.</li><li>Truncation causes ripple; a window redistributes that ripple rather than making the ideal response exact.</li></ul>
<h4>Window-method design steps</h4>
<p>Start with the ideal frequency response, calculate its inverse DTFT to obtain an infinite impulse response, then truncate/window it to create a finite-length filter. The window controls the trade-off between transition width and stopband sidelobes. A rectangular window gives a narrow main lobe but relatively large sidelobes; smoother windows reduce sidelobes but broaden the transition.</p>
<p>For a low-pass filter, the cutoff should be selected between the passband edge and stopband edge. Verify the actual response numerically: window formulas are design approximations, and meeting ripple/attenuation specifications may require a different window or order.</p>
`},

  {id:'iird', name:'IIR Filter Design Fundamentals', body: T`<h2>1. Why use IIR filters?</h2>
<p>IIR filters use feedback and can achieve sharp magnitude responses with fewer coefficients than many FIR designs. Their transfer functions are rational functions of z with poles and zeros. The poles strongly influence resonance, decay and stability.</p>
<h2>2. Analog prototypes and transformations</h2>
<p>Common analog low-pass prototypes include Butterworth (maximally flat magnitude), Chebyshev Type I (passband ripple, sharper transition), Chebyshev Type II (stopband ripple) and elliptic/Cauer (ripple in both bands, often sharpest transition for a given order). A digital IIR may be designed by transforming an analog prototype.</p>
<h2>3. Bilinear transform</h2>
\[s=\frac{2}{T}\frac{1-z^{-1}}{1+z^{-1}}\]
<p>The bilinear transform maps the stable left half of the s-plane inside the unit circle of the z-plane and avoids aliasing of frequency bands. However, it warps the frequency axis nonlinearly; prewarping can make a chosen cutoff map correctly.</p>
<h2>4. Stability and numerical form</h2>
<p>For a causal rational digital filter, all poles must lie strictly inside |z|=1 for BIBO stability. Zeros may lie outside the unit circle without making the filter unstable, although they affect phase and invertibility. Implement high-order designs as cascaded second-order sections to reduce sensitivity.</p>
<div class="ex"><b>Example.</b> A causal filter with poles 0.7 and 0.4 is stable because both magnitudes are below 1. A pole at 1.02 is outside the unit circle and makes the causal system unstable.</div>
<h2>5. What to compare</h2><ul><li>Butterworth: smooth magnitude, no passband ripple.</li><li>Chebyshev I: ripple in passband, sharper transition than Butterworth at comparable order.</li><li>Elliptic: ripple in both bands, very sharp transition.</li><li>Always verify the final digital poles after coefficient rounding.</li></ul>
<h4>Second-order section stability</h4>
<p>A second-order denominator can be written <code>1+a₁z⁻¹+a₂z⁻²</code>. Its poles are the roots of the corresponding polynomial; for a causal stable filter, each pole must lie inside the unit circle. Implementing high-order IIR filters as cascaded second-order sections often reduces sensitivity to coefficient quantization compared with one large direct-form polynomial.</p>
<p>Common design families include Butterworth (maximally flat passband), Chebyshev (ripple traded for sharper transition), and elliptic (ripple in both passband and stopband for a sharp transition). The family name alone does not establish stability; check the resulting poles.</p>
`},

  {id:'freqresp', name:'Frequency Response & Pole-Zero Analysis', body: T`<h2>1. Frequency response from H(z)</h2>
<p>The frequency response is obtained by evaluating the transfer function on the unit circle: H(e^{jω}), provided the unit circle lies in the region of convergence. Its magnitude tells how much each sinusoidal frequency is amplified or attenuated; its phase tells the phase shift.</p>
<h2>2. Poles and zeros</h2>
<p>Zeros make H(z)=0 at their locations; poles make H(z) grow without bound in the ideal mathematical model. A pole close to the unit circle often creates a narrow resonance. For a causal rational system, stability requires every pole strictly inside the unit circle.</p>
<div class="ex"><b>Example.</b> H(z)=1/(1−0.8z⁻¹) has a pole at z=0.8. The impulse response is h[n]=0.8ⁿu[n], which decays. Moving the pole toward 1 makes the decay slower and the low-frequency response more pronounced.</div>
<h2>3. Magnitude, phase and group delay</h2>
<p>Magnitude response is |H(e^{jω})|; phase response is arg H(e^{jω}). Group delay is −dφ/dω where phase is unwrapped and differentiable. A constant group delay corresponds to linear phase, a property commonly designed into FIR filters.</p>
<h2>4. Reading a plot</h2><ul><li>Passband: frequencies intended to pass with limited attenuation/ripple.</li><li>Stopband: frequencies intended to be strongly attenuated.</li><li>Transition band: region between them.</li><li>Resonant peaks often indicate poles close to the unit circle.</li><li>Notches often indicate zeros near the unit circle at the notch frequency.</li></ul>
<h2>5. Common traps</h2><p>Zeros outside the unit circle do not by themselves imply instability. A stable magnitude response does not guarantee linear phase. The frequency response is not meaningful as an ordinary bounded steady-state response at frequencies where the unit circle is outside the ROC.</p>
<h4>Frequency response by substitution</h4>
<p>For a discrete-time system, evaluate the transfer function on the unit circle: <code>H(eʲω)</code>. If <code>H(z)=1/(1−az⁻¹)</code>, then <code>H(eʲω)=1/(1−ae^(−jω))</code>. Magnitude peaks where the denominator magnitude is small; pole angle indicates the frequency around which a resonance may occur.</p>
<p>Frequency-response analysis assumes steady-state sinusoidal behavior and a suitable stable system. Transients from initial conditions are separate and decay only when the system is stable.</p>
`},

  {id:'linphase', name:'Linear-Phase FIR Filters', body: T`<h2>1. What linear phase means</h2>
<p>A filter has linear phase when its phase is a straight line versus angular frequency: φ(ω)=−ωτ+constant. Different frequency components then receive the same delay τ, so the shape of a composite waveform is preserved, apart from amplitude changes.</p>
<h2>2. Symmetric FIR coefficients</h2>
<p>For an FIR of order M, symmetric coefficients h[n]=h[M−n] or antisymmetric coefficients h[n]=−h[M−n] lead to generalized linear phase. The group delay is normally M/2 samples in the passband, except at frequencies where the response is zero or phase is undefined.</p>
<h2>3. Four FIR linear-phase types</h2>
<ul><li>Type I: M even (odd number of taps), symmetric.</li><li>Type II: M odd (even taps), symmetric; forced zero at ω=π.</li><li>Type III: M even, antisymmetric; zeros at ω=0 and ω=π.</li><li>Type IV: M odd, antisymmetric; zero at ω=0.</li></ul>
<div class="ex"><b>Example.</b> A symmetric FIR with  nine taps has order M=8, so its nominal group delay is 8/2=4 samples. If fₛ=48 kHz, this is 4/48000 ≈ 83.3 μs.</div>
<h2>4. Why the constraints matter</h2>
<p>The symmetry requirement reduces independent coefficients and can reduce multiplications. The forced zeros of Types II–IV constrain which filters they can implement: for example, a Type II symmetric filter cannot have a nonzero response exactly at Nyquist.</p>
<h2>Exam checks</h2><ul><li>Order = number of taps − 1.</li><li>Delay in seconds = samples / sampling frequency.</li><li>Linear phase does not mean zero phase; it means a constant delay plus possible fixed sign-related phase offsets.</li></ul>
<h4>Why symmetric coefficients give linear phase</h4>
<p>If a real FIR impulse response is symmetric, <code>h[n]=h[M−n]</code>, its frequency response factors into a real amplitude term times a linear phase factor <code>e^(−jωM/2)</code>, aside from possible sign changes. The group delay is therefore <code>M/2</code> samples in the passband where phase is well behaved.</p>
<p>For an FIR of length <code>L=M+1</code>, the delay is <code>(L−1)/2</code> samples. Even-length and odd-length symmetric filters have different allowed endpoint constraints, so do not assume every symmetric FIR can have arbitrary DC and Nyquist gains.</p>
`},

  {id:'quant', name:'Quantisation Effects & Finite Word Length', body: T`<h2>1. Finite-word-length arithmetic</h2>
<p>Digital hardware stores numbers with a finite number of bits. Rounding or truncating a value creates quantisation error. Fixed-point formats allocate bits to integer and fractional parts; floating-point formats use a significand and exponent, offering a wider dynamic range but still finite precision.</p>
<h2>2. Quantisation error and SNR</h2>
<p>For an ideal uniform quantizer with step Δ, error is often modelled as uniformly distributed between −Δ/2 and +Δ/2, giving variance Δ²/12 when the error is sufficiently decorrelated from the signal. For a full-scale sinusoid and an ideal N-bit quantizer, the approximate SNR is 6.02N+1.76 dB under standard assumptions.</p>
<div class="ex"><b>Example.</b> Increasing resolution from 8 bits to 10 bits ideally improves quantisation SNR by about 2×6.02=12.04 dB, provided the signal uses the available range and other noise sources do not dominate.</div>
<h2>3. Overflow and coefficient errors</h2>
<p>Fixed-point arithmetic can overflow if intermediate values exceed the representable range. Saturation clips to the largest representable value; wraparound behaves like modular arithmetic and can create severe distortion. Quantised filter coefficients move poles and zeros, which can notably affect IIR filters.</p>
<h2>4. Limit cycles and noise</h2>
<p>In recursive IIR filters, rounding within feedback can sustain a small oscillation even after the input becomes zero: a zero-input limit cycle. Round-off noise can also accumulate through recursive paths. Scaling, adequate word length, saturation strategy and second-order sections help control these effects.</p>
<h2>Exam traps</h2><ul><li>6.02N+1.76 dB is not universal; it assumes an ideal quantizer and a full-scale sinusoid.</li><li>More bits reduce quantisation step, but cannot eliminate analogue noise or clipping.</li><li>Coefficient quantisation is especially important when poles are close to the unit circle.</li></ul>
<h4>Quantization noise model</h4>
<p>For a uniform quantizer with step size <code>Δ</code>, the ideal rounding error is bounded approximately by <code>−Δ/2 ≤ e &lt; Δ/2</code>. Under the common high-resolution, uncorrelated-error model, its variance is <code>σ_e²=Δ²/12</code>. This is a model, not a guarantee for every deterministic input; low-level periodic signals can produce correlated quantization artifacts.</p>
<p>Finite-word-length effects include coefficient quantization, roundoff, overflow, and limit cycles in some recursive filters. Scaling and saturation/arithmetic choices can matter as much as the nominal bit count.</p>
`},

  {id:'multi', name:'Sampling-Rate Conversion & Multirate DSP', body: T`<h2>1. Why change the sampling rate?</h2>
<p>Multirate DSP changes a sequence's sampling rate to reduce computation, match interfaces or support communication systems. Decimation lowers the rate; interpolation raises it. Rate changes require filtering to prevent spectral copies from overlapping.</p>
<h2>2. Decimation by M</h2>
<p>Downsampling forms y[n]=x[nM]. Before keeping every Mth sample, low-pass filter the signal so content above π/M rad/sample is removed; otherwise high-frequency content aliases into the retained band. The output sampling rate is fₛ/M.</p>
<div class="ex"><b>Example.</b> A signal sampled at 48 kHz is decimated by M=3. The new rate is 16 kHz. Before downsampling, the anti-alias filter should normally limit the signal to at most 8 kHz (with a practical transition band below Nyquist).</div>
<h2>3. Interpolation by L</h2>
<p>Upsampling inserts L−1 zeros between samples, raising the rate to Lfₛ. The inserted zeros create spectral images; a low-pass interpolation filter removes those images and reconstructs intermediate values. The ideal filter's gain is scaled by L under common conventions.</p>
<h2>4. Rational conversion</h2>
<p>To convert by L/M, interpolate by L and then decimate by M, usually using one designed low-pass filter between the operations. Choose L and M after reducing the fraction to lowest terms. Polyphase structures compute only the samples actually needed and avoid wasting operations on inserted zeros.</p>
<h2>Common mistakes</h2><ul><li>Upsampling by zero insertion alone does not create a smooth reconstructed waveform.</li><li>Downsampling without anti-alias filtering loses information through aliasing.</li><li>Keep track of the new Nyquist frequency after every rate change.</li></ul>
<h4>Rational sampling-rate conversion</h4>
<p>To convert a sampling rate by a rational factor <code>L/M</code>, conceptually upsample by L (insert L−1 zeros), low-pass filter to remove spectral images, then downsample by M. The output sampling rate is <code>f_out=(L/M)f_in</code>. For example, <code>L=3</code> and <code>M=2</code> converts 48 kHz to 72 kHz.</p>
<p>Practical polyphase structures avoid computing values that will later be discarded. The anti-imaging and anti-alias filtering requirements depend on both interpolation and decimation stages.</p>
`},

  {id:'app', name:'Digital Filtering Applications & Spectral Analysis', body: T`<h2>1. Spectral analysis in practice</h2>
<p>Spectral analysis estimates how signal energy or power is distributed over frequency. Before applying an FFT, choose a sample rate, record length and window based on the frequencies and dynamics you need to observe. The FFT is only the computational step; interpretation depends on measurement setup.</p>
<h2>2. Frequency and amplitude calibration</h2>
<p>With N samples at rate fₛ, bin spacing is Δf=fₛ/N. A longer record improves bin spacing. For a real signal, the spectrum is conjugate-symmetric; a one-sided amplitude spectrum commonly doubles interior positive-frequency bins but not DC or the Nyquist bin (when N is even). Exact scaling depends on the FFT convention and window coherent gain.</p>
<h2>3. Power spectral density</h2>
<p>A power spectral density (PSD) describes average power per unit bandwidth, often in W/Hz or dB/Hz. Periodograms estimate PSD from finite records; Welch's method averages windowed, overlapping segments to reduce estimate variance at the cost of frequency resolution.</p>
<div class="ex"><b>Example.</b> At fₛ=10 kHz with N=1000, Δf=10 Hz. A peak near bin 120 suggests about 1200 Hz. If the tone lies between bins, leakage spreads energy, so peak interpolation or a longer record may improve the estimate.</div>
<h2>4. Filtering applications</h2>
<p>Low-pass filters suppress high-frequency noise; high-pass filters remove slow drift; band-pass filters isolate a band; notch filters reject a narrow interference such as mains hum. Always compare passband, stopband, phase and transient response, not just cutoff frequency.</p>
<h2>5. Practical checklist</h2><ul><li>Sample above twice the highest frequency of interest and use an analogue anti-alias filter.</li><li>Remove DC or trend if it is not part of the measurement.</li><li>Use a suitable window and account for its amplitude scaling.</li><li>Do not interpret FFT magnitude as PSD without correct normalization.</li></ul>
<h4>FFT-based spectral measurement checklist</h4>
<p>Before interpreting a spectrum, identify sampling rate, record length, frequency-bin spacing <code>Δf=f_s/N</code>, window, amplitude normalization, and whether the display is one-sided or two-sided. With <code>f_s=48 kHz</code> and <code>N=1024</code>, bin spacing is 46.875 Hz.</p>
<p>Averaging can reduce variance in noisy spectral estimates, but it does not automatically correct leakage or calibration errors. For amplitude measurement, account for the window's coherent gain; for noise-power measurement, use the appropriate window-power normalization.</p>
`}
  ]
},

  id:'mw', name:'Electromagnetic Waves & Microwave Engineering', icon:'📡',
  topics:[
  {id:'band', name:'Microwave Bands & Transmission Concepts', body: T`<h2>1. What counts as microwave?</h2>
<p>Microwaves are electromagnetic waves commonly associated with frequencies from roughly hundreds of megahertz to hundreds of gigahertz; exact boundaries vary by convention. At these frequencies, wavelength is short enough that transmission lines, waveguides, antennas and distributed circuit effects become central.</p>
\[ \lambda=\frac{c}{f}\quad\text{(free space)} \]
<p>Here c≈3×10⁸ m/s. Doubling frequency halves wavelength, so a structure that was electrically small may become electrically large.</p>
<h2>2. Common letter bands</h2>
<p>Typical engineering labels include L (about 1–2 GHz), S (2–4 GHz), C (4–8 GHz), X (8–12 GHz), Ku (12–18 GHz), K (18–27 GHz), Ka (27–40 GHz), V (40–75 GHz) and W (75–110 GHz). Definitions can vary slightly across standards and applications.</p>
<div class="ex"><b>Example.</b> At 10 GHz, λ≈3×10⁸/10¹⁰=0.03 m=3 cm. A 3 cm component is therefore about one wavelength long and cannot be treated as a lumped circuit element without justification.</div>
<h2>3. Why microwave design differs</h2>
<ul><li>Interconnects have distributed inductance and capacitance; phase varies along a line.</li><li>Parasitic capacitance, lead inductance and connector transitions can dominate.</li><li>Waveguides support modes with cutoff frequencies.</li><li>Impedance matching is critical because reflections can waste power or damage sources.</li><li>Measurements use calibrated standards and S-parameters rather than only DC-style voltage/current readings.</li></ul>
<h2>4. Applications and limits</h2>
<p>Radar, satellite links, point-to-point communication, microwave heating, sensing and radio astronomy use microwave bands. Higher frequency may offer wider available bandwidth, but propagation loss, rain attenuation, atmospheric absorption, alignment and component tolerances can become more demanding.</p>
<h2>Exam trap</h2><p>Frequency-band names are conventions, not fundamental physical boundaries. When a problem gives a frequency, calculate wavelength directly and use the specified waveguide or transmission-line model.</p>
<h4>Frequency, wavelength and band reasoning</h4>
<p>In free space, <code>λ=c/f</code>, with <code>c≈3×10⁸ m/s</code>. At 10 GHz, wavelength is about 3 cm. Higher frequency gives shorter wavelengths and smaller structures, but propagation loss, atmospheric absorption and manufacturing tolerances can become more significant.</p>
<p>Band labels vary somewhat across standards. For numerical problems, calculate from the frequency given rather than relying only on a band nickname.</p>

<h4>Additional calculation: frequency and wavelength</h4>
<p>In free space, <code>λ=c/f</code>, with <code>c≈3×10⁸ m/s</code>. At 10 GHz, wavelength is about 3 cm. Higher frequency gives shorter wavelengths and smaller structures, but propagation loss, atmospheric absorption and manufacturing tolerances can become more significant.</p>
<p>Band labels vary somewhat across standards. For numerical problems, calculate from the frequency given rather than relying only on a band nickname.</p>
`},

  {id:'wg', name:'Rectangular and Circular Waveguides', body: T`<h2>1. What a waveguide does</h2>
<p>A hollow conducting waveguide confines electromagnetic energy and carries it along a structure. Unlike an ideal TEM coaxial line, a single-conductor hollow waveguide does not support a TEM mode; its propagating modes are TE or TM and each has a cutoff frequency.</p>
<h2>2. Rectangular guide</h2>
<p>For a rectangular guide with broad dimension a and narrow dimension b, the cutoff frequency for TEₘₙ or TMₘₙ is</p>
\[f_c=\frac{c}{2}\sqrt{(m/a)^2+(n/b)^2}.\]
<p>For TE₁₀, f_c=c/(2a). It is the dominant mode because it has the lowest cutoff in a standard rectangular guide. A mode propagates only when f&gt;f_c.</p>
<div class="ex"><b>Example.</b> If a=2.0 cm, f_c,10≈3×10⁸/(0.04)=7.5 GHz. At 10 GHz the TE₁₀ mode propagates; at 6 GHz it is evanescent.</div>
<h2>3. Circular guide</h2>
<p>Circular guides use Bessel-function field solutions. The dominant mode is usually TE₁₁, with cutoff set by the first relevant derivative root (approximately 1.841): f_c≈1.841c/(2πa), where a is the guide radius.</p>
<h2>4. Guide wavelength and phase</h2>
<p>Above cutoff, guide wavelength λg=λ₀/√(1−(f_c/f)²), which is longer than the free-space wavelength λ₀. As f approaches cutoff from above, λg grows very large and propagation becomes highly dispersive.</p>
<h2>5. Design traps</h2><ul><li>At f=f_c, the ideal mode has zero longitudinal propagation constant; practical operation is above cutoff.</li><li>Higher modes may propagate if the operating frequency is too high, so single-mode operation requires staying below the next cutoff.</li><li>Do not use the TEM formulas for a hollow rectangular guide without adapting them to its mode.</li></ul>
<h4>Rectangular waveguide cutoff example</h4>
<p>For an air-filled rectangular guide with broad dimension a, the dominant TE₁₀ cutoff is <code>f_c=c/(2a)</code>. If <code>a=2 cm</code>, then <code>f_c≈3×10⁸/0.04=7.5 GHz</code>. The mode propagates only above cutoff; below cutoff it decays evanescently.</p>
<p>Single-mode operation requires a frequency range above the dominant-mode cutoff but below the next higher-mode cutoff. Circular waveguides use different mode roots, so do not apply the rectangular formula to them.</p>

<h4>Additional calculation: rectangular waveguide cutoff</h4>
<p>For an air-filled rectangular guide with broad dimension a, the dominant TE₁₀ cutoff is <code>f_c=c/(2a)</code>. If <code>a=2 cm</code>, then <code>f_c≈3×10⁸/0.04=7.5 GHz</code>. The mode propagates only above cutoff; below cutoff it decays evanescently.</p>
<p>Single-mode operation requires a frequency range above the dominant-mode cutoff but below the next higher-mode cutoff. Circular waveguides use different mode roots, so do not apply the rectangular formula to them.</p>
`},

  {id:'mode', name:'TE, TM, TEM Modes; Cutoff & Guide Wavelength', body: T`<h2>1. TE, TM and TEM</h2>
<p>TE means transverse electric: the electric field has no component along the direction of propagation. TM means transverse magnetic: the magnetic field has no longitudinal component. TEM has neither longitudinal electric nor longitudinal magnetic field and is supported by two-conductor structures such as ideal coaxial line, but not by a hollow single-conductor waveguide.</p>
<h2>2. Cutoff and propagation</h2>
<p>Below cutoff, fields decay exponentially along the guide rather than carrying power down it as a travelling mode. Above cutoff, the propagation constant is β=√(k²−k_c²), where k=2π/λ₀ and k_c is the transverse cutoff wavenumber.</p>
\[ \lambda_g=\frac{2\pi}{\beta}=\frac{\lambda_0}{\sqrt{1-(f_c/f)^2}} \]
<div class="ex"><b>Example.</b> If f=2f_c, then λg=λ₀/√(1−1/4)=1.155λ₀ approximately. Closer to cutoff, λg increases more sharply.</div>
<h2>3. Phase and group velocity</h2>
<p>For an ideal lossless guide, phase velocity v_p=c/√(1−(f_c/f)²), which can exceed c, while group velocity v_g=c√(1−(f_c/f)²) is below c. This does not violate relativity: information and energy are associated with group velocity in this ideal model.</p>
<h2>4. Mode indices</h2>
<p>In a rectangular guide, m and n count field variation across the two transverse dimensions. For TM modes both indices must be nonzero; TE modes can have one index zero but not both. The TE₁₀ mode has one half-wave variation across a and no variation across b.</p>
<h2>Exam traps</h2><ul><li>λg is not the same as λ₀.</li><li>Do not claim that a waveguide carries TEM mode in the usual hollow-guide geometry.</li><li>Near cutoff, dispersion is strong and practical attenuation is often high.</li></ul>
<h4>Guide wavelength versus free-space wavelength</h4>
<p>For a propagating waveguide mode, <code>λ_g=λ₀/√(1−(f_c/f)²)</code>. Since the denominator is less than one above cutoff, guide wavelength exceeds free-space wavelength. Near cutoff, <code>λ_g</code> becomes very large and group/phase velocity behavior differs from a plane wave in free space.</p>
<p>TE modes have no longitudinal electric-field component; TM modes have no longitudinal magnetic-field component. A TEM mode has neither longitudinal field component and cannot propagate in a hollow single-conductor waveguide.</p>

<h4>Additional concept check: guide wavelength</h4>
<p>For a propagating waveguide mode, <code>λ_g=λ₀/√(1−(f_c/f)²)</code>. Since the denominator is less than one above cutoff, guide wavelength exceeds free-space wavelength. Near cutoff, <code>λ_g</code> becomes very large.</p>
<p>TE modes have no longitudinal electric-field component; TM modes have no longitudinal magnetic-field component. A TEM mode has neither longitudinal field component and cannot propagate in a hollow single-conductor waveguide.</p>
`},

  {id:'cav', name:'Cavity Resonators & Q', body: T`<h2>1. A resonator stores energy</h2>
<p>A cavity resonator is a closed conducting volume in which electromagnetic fields form standing-wave patterns at specific resonant frequencies. At resonance, electric and magnetic energy exchange periodically; finite conductor and dielectric losses make the resonance bandwidth nonzero.</p>
<h2>2. Resonant frequency</h2>
<p>For a rectangular cavity of dimensions a, b, d filled with a medium of wave speed v, an ideal resonance is</p>
\[ f_{mnp}=\frac{v}{2}\sqrt{(m/a)^2+(n/b)^2+(p/d)^2}. \]
<p>The allowed mode indices depend on boundary conditions and whether the mode is TE or TM. Real designs must include wall losses, coupling and material properties.</p>
<h2>3. Quality factor</h2>
\[Q=2\pi\frac{\text{energy stored}}{\text{energy lost per cycle}}\approx\frac{f_0}{\Delta f}\]
<p>A high-Q resonator stores energy efficiently and has a narrow bandwidth. The loaded Q includes external coupling; unloaded Q reflects internal losses. They are related by 1/Q_L=1/Q_0+1/Q_e for a common coupling model.</p>
<div class="ex"><b>Example.</b> A resonance at 10 GHz with a 10 MHz 3-dB bandwidth has Q≈10,000/10=1000.</div>
<h2>4. Coupling and applications</h2>
<p>Coupling apertures or probes allow energy in and out. Excessive coupling broadens the resonance and lowers loaded Q. Cavities are used in filters, oscillators, frequency meters and particle accelerators.</p>
<h2>Common traps</h2><ul><li>Use consistent units when calculating Q.</li><li>Bandwidth is not the same as the resonant frequency.</li><li>High Q means narrow bandwidth, not automatically high output power.</li></ul>
<h4>Quality factor and bandwidth</h4>
<p>For a narrow resonance, <code>Q≈f₀/BW</code>. A resonator at 10 GHz with a 100 MHz 3 dB bandwidth has <code>Q≈100</code>. Higher Q means narrower fractional bandwidth. Coupling to ports or a load reduces loaded Q compared with the unloaded resonator Q.</p>
<p>Resonance frequency is set by geometry and material properties; dimensional errors can shift it. Measurement fixtures and coupling also affect the observed response.</p>

<h4>Additional calculation: resonator Q</h4>
<p>For a narrow resonance, <code>Q≈f₀/BW</code>. A resonator at 10 GHz with a 100 MHz 3 dB bandwidth has <code>Q≈100</code>. Higher Q means narrower fractional bandwidth. Coupling to ports or a load reduces loaded Q compared with unloaded Q.</p>
<p>Resonance frequency is set by geometry and material properties; dimensional errors can shift it. Measurement fixtures and coupling also affect the observed response.</p>
`},

  {id:'sp', name:'Scattering Parameters & Microwave Measurements', body: T`<h2>1. Why use S-parameters?</h2>
<p>At microwave frequencies, direct voltage/current measurements are difficult and reflections matter. Scattering parameters describe incident and outgoing travelling waves at defined ports. They are normally measured with a vector network analyser and a calibrated reference impedance, often 50 Ω.</p>
<h2>2. Two-port definitions</h2>
<p>With all other ports matched, S₁₁ is input reflection coefficient, S₂₂ is output reflection coefficient, S₂₁ is forward transmission and S₁₂ is reverse transmission. In a matched system, |S₂₁|² is the transmitted power ratio under the standard power-wave convention.</p>
\[S_{11}=\frac{b_1}{a_1}\Big|_{a_2=0},\qquad S_{21}=\frac{b_2}{a_1}\Big|_{a_2=0}\]
<p>a denotes incident waves and b outgoing waves. The condition a₂=0 means port 2 is terminated in the reference impedance.</p>
<div class="ex"><b>Example.</b> S₁₁=−20 dB means |Γ|=10^(−20/20)=0.1, so reflected power is |Γ|²=0.01, or 1% for a matched reference system.</div>
<h2>3. dB conversions</h2>
<p>For a wave-amplitude ratio use 20log₁₀|S|; for a power ratio use 10log₁₀(P₂/P₁). Thus −3 dB in transmitted power is about half power, while −20 dB reflection amplitude corresponds to 1% reflected power.</p>
<h2>4. Passive and reciprocal networks</h2><ul><li>A passive network cannot generate net power; its S-matrix obeys power constraints.</li><li>A reciprocal network has S₁₂=S₂₁ under consistent port definitions.</li><li>A lossless network has a unitary S-matrix.</li><li>Good matching means small |S₁₁|, not necessarily large |S₂₁| if the device itself is lossy.</li></ul>
<h2>Measurement workflow</h2><p>Calibrate at the measurement plane, connect the device without changing the reference plane, set frequency sweep and power, then interpret magnitude and phase. Poor connectors, calibration drift and cable movement can corrupt results.</p>
<h4>Reflection coefficient and return loss</h4>
<p><code>S₁₁</code> is the input reflection coefficient when other ports are terminated in reference impedances; <code>S₂₁</code> describes forward transmission under the defined conditions. For a matched one-port, <code>S₁₁=0</code>. Return loss is <code>RL=−20log₁₀|S₁₁|</code> dB, so smaller reflection gives larger positive return loss.</p>
<p>If <code>|S₁₁|=0.1</code>, return loss is 20 dB and reflected power fraction is <code>|S₁₁|²=0.01</code>, or 1%.</p>

<h4>Additional calculation: reflection and return loss</h4>
<p><code>S₁₁</code> is the input reflection coefficient with other ports terminated in reference impedances; <code>S₂₁</code> describes forward transmission. For a matched one-port, <code>S₁₁=0</code>. Return loss is <code>RL=−20log₁₀|S₁₁|</code> dB.</p>
<p>If <code>|S₁₁|=0.1</code>, return loss is 20 dB and reflected power fraction is <code>|S₁₁|²=0.01</code>, or 1%.</p>
`},

  {id:'match', name:'Impedance Matching & Microwave Networks', body: T`<h2>1. The goal of matching</h2>
<p>When a load impedance differs from the line's characteristic impedance Z₀, part of the incident wave reflects. Matching reduces reflection, improves delivered power and helps maintain predictable frequency response. For a real Z₀, Γ=(Z_L−Z₀)/(Z_L+Z₀).</p>
<h2>2. Quarter-wave transformer</h2>
<p>A lossless line of length λ/4 transforms a real load R_L to input resistance Z_in=Z_t²/R_L. Choosing Z_t=√(Z₀R_L) matches the line at the design frequency. It is narrowband because its electrical length changes with frequency.</p>
<div class="ex"><b>Example.</b> To match 50 Ω to 100 Ω, choose Z_t=√(50×100)=70.7 Ω and length λ/4 at the target frequency.</div>
<h2>3. Single-stub matching</h2>
<p>A short- or open-circuited stub supplies a reactive admittance that cancels the load's susceptance at a chosen position. A Smith chart visualises normalized impedance/admittance and helps locate the position and stub length. Stub solutions are generally frequency-sensitive.</p>
<h2>4. L-networks and practical matching</h2>
<p>At lower RF frequencies, lumped L, C and sometimes transformer networks may match complex impedances. Component parasitics become important as frequency rises. Matching networks trade bandwidth, insertion loss, size, power handling and tolerance.</p>
<h2>5. Reading the reflection</h2><ul><li>VSWR=(1+|Γ|)/(1−|Γ|).</li><li>Return loss = −20log₁₀|Γ| dB; a larger positive return loss means a better match.</li><li>Matching one frequency does not guarantee matching a wide band.</li><li>Power transfer matching and noise matching are not always the same design objective.</li></ul>
<h4>Quarter-wave transformer example</h4>
<p>A lossless quarter-wave transformer matches real <code>R_L</code> to line impedance <code>Z₀</code> at the design frequency using <code>Z_t=√(Z₀R_L)</code>. To match 50 Ω to 100 Ω, choose <code>Z_t≈70.7 Ω</code> and electrical length <code>λ_g/4</code>.</p>
<p>The match is frequency-sensitive because electrical length changes with frequency. Complex loads may need a preliminary reactance-cancellation or a multi-section matching network.</p>

<h4>Additional calculation: quarter-wave matching</h4>
<p>A lossless quarter-wave transformer matches real <code>R_L</code> to line impedance <code>Z₀</code> at the design frequency using <code>Z_t=√(Z₀R_L)</code>. To match 50 Ω to 100 Ω, choose <code>Z_t≈70.7 Ω</code> and electrical length <code>λ_g/4</code>.</p>
<p>The match is frequency-sensitive because electrical length changes with frequency. Complex loads may need preliminary reactance cancellation or a multi-section network.</p>
`},

  {id:'tube', name:'Klystron, Magnetron, TWT & Gunn Diode', body: T`<h2>1. Why microwave devices differ</h2>
<p>At high frequencies, transit time and parasitic capacitances limit conventional transistor operation. Microwave tubes and specialised semiconductor devices exploit electron interaction with RF fields or high-speed carrier transport to generate, amplify or control microwave energy.</p>
<h2>2. Klystron</h2>
<p>A klystron uses velocity modulation: an RF cavity changes electron velocities, electrons bunch during drift, and a later cavity extracts RF energy. Reflex klystrons use a repeller to send electrons back through the cavity and historically served as low-power oscillators.</p>
<h2>3. Magnetron and travelling-wave tube</h2>
<p>A magnetron uses crossed electric and magnetic fields to bunch electrons and transfer energy to resonant cavities; it is a high-power oscillator, commonly used in radar and microwave heating. A travelling-wave tube (TWT) couples an electron beam to an RF wave along a slow-wave structure, enabling wideband amplification.</p>
<h2>4. Gunn device</h2>
<p>A Gunn diode is a bulk semiconductor device exhibiting transferred-electron negative differential resistance in suitable materials. It can generate microwave oscillations without a conventional PN junction. Biasing and resonator design determine operating conditions.</p>
<div class="ex"><b>Identify by function.</b> Magnetron: high-power oscillator. TWT: wideband amplifier. Klystron: cavity-based amplifier or oscillator depending on configuration. Gunn diode: semiconductor microwave oscillator.</div>
<h2>Exam traps</h2><ul><li>Negative differential resistance means current may fall as voltage rises over a region; it is not ordinary negative resistance at all operating points.</li><li>Do not confuse electron bunching in a klystron with the continuous-wave interaction along a TWT.</li><li>Device power, bandwidth and efficiency depend on specific design and are not universal constants.</li></ul>
<h4>Microwave tube selection</h4>
<p>A klystron uses velocity modulation and electron bunching; a magnetron uses crossed electric and magnetic fields with resonant cavities to generate microwave power; a travelling-wave tube provides broadband amplification along a slow-wave structure.</p>
<p>Choose by power, bandwidth, efficiency, noise, size and operating frequency. A TWT is an amplifier; a magnetron is commonly an oscillator.</p>

<h4>Additional concept check: microwave tube roles</h4>
<p>A klystron uses velocity modulation and electron bunching; a magnetron uses crossed electric and magnetic fields with resonant cavities to generate microwave power; a travelling-wave tube provides broadband amplification along a slow-wave structure.</p>
<p>Choose by power, bandwidth, efficiency, noise, size and operating frequency. A TWT is an amplifier; a magnetron is commonly an oscillator.</p>
`},

  {id:'ss', name:'PIN, Varactor, Tunnel Diode & HEMT', body: T`<h2>1. Microwave semiconductor devices</h2>
<p>Different semiconductor structures are useful at microwave frequencies because of their fast carrier response, voltage-dependent capacitance or negative differential resistance. Device choice depends on frequency, noise, power, linearity and bias.</p>
<h2>2. PIN diode</h2>
<p>A PIN diode has an intrinsic region between P and N regions. Under forward bias, stored charge makes it useful as an RF switch or attenuator; under reverse bias it can act as a low-capacitance RF resistance. It is not simply an ideal rectifier at microwave frequencies.</p>
<h2>3. Varactor and tunnel diode</h2>
<p>A reverse-biased varactor behaves as a voltage-controlled capacitor because depletion width changes with voltage. It is used in tuning and frequency multiplication. A tunnel diode is very heavily doped and can show negative differential resistance due to quantum tunnelling, enabling oscillation in suitable circuits.</p>
<h2>4. HEMT</h2>
<p>A high-electron-mobility transistor uses a heterostructure to form a high-mobility carrier channel, often a two-dimensional electron gas. GaAs- and GaN-based HEMTs are used for low-noise or high-power microwave applications, respectively, depending on device design.</p>
<div class="ex"><b>Concept check.</b> Need voltage-controlled tuning? Consider a varactor. Need fast RF switching? A PIN diode is common. Need very low-noise high-frequency amplification? A suitable HEMT may be selected. The application, not just the device name, determines the answer.</div>
<h2>5. Practical limitations</h2><ul><li>Package inductance and capacitance matter at microwave frequencies.</li><li>Bias networks must feed DC while isolating RF appropriately.</li><li>Maximum power, breakdown voltage, thermal resistance and linearity must be checked.</li><li>Small-signal models are valid only around the specified bias and frequency range.</li></ul>
<h4>Microwave semiconductor devices</h4>
<p>A Gunn diode can exhibit negative differential resistance and generate microwave oscillations. A varactor uses voltage-dependent junction capacitance for tuning or frequency multiplication. A PIN diode can behave as a controlled RF resistance or switch depending on bias and frequency.</p>
<p>At microwave frequencies, package parasitics and layout are part of the circuit; a low-frequency equivalent model may no longer be adequate.</p>

<h4>Additional concept check: microwave semiconductor devices</h4>
<p>A Gunn diode can exhibit negative differential resistance and generate microwave oscillations. A varactor uses voltage-dependent junction capacitance for tuning or frequency multiplication. A PIN diode can behave as a controlled RF resistance or switch depending on bias and frequency.</p>
<p>At microwave frequencies, package parasitics and layout are part of the circuit; a low-frequency equivalent model may no longer be adequate.</p>
`},

  {id:'osc', name:'Microwave Oscillators, Mixers & Detectors', body: T`<h2>1. Microwave oscillation</h2>
<p>An oscillator converts DC power into a periodic RF signal. A feedback oscillator sustains oscillation when loop phase is an integer multiple of 360° and loop gain is at least unity at start-up; nonlinearities eventually limit amplitude. At microwave frequencies, resonators and transmission-line effects determine the feedback phase.</p>
<h2>2. Mixers</h2>
<p>A mixer is a nonlinear device that combines two frequencies. If inputs are f_RF and f_LO, outputs commonly include sum and difference frequencies; the intermediate frequency is often |f_RF−f_LO|. Filtering selects the desired product.</p>
<div class="ex"><b>Example.</b> With RF=2.45 GHz and LO=2.40 GHz, the difference IF is 50 MHz. The mixer also creates other products, so filtering and linearity are important.</div>
<h2>3. Conversion loss and image frequency</h2>
<p>Conversion loss is the difference in dB between available input RF power and desired output IF power for a passive mixer. A receiver can respond to both the wanted RF and an image frequency that converts to the same IF; preselection or image-reject architectures suppress it.</p>
<h2>4. Detectors</h2>
<p>Square-law detectors produce output approximately proportional to RF power at low levels; envelope detectors can recover amplitude modulation under appropriate conditions. Detector response, dynamic range and video bandwidth limit measurement accuracy.</p>
<h2>Exam checklist</h2><ul><li>Distinguish LO, RF and IF.</li><li>Check whether a question asks for sum or difference product.</li><li>Mixing creates multiple products, not only one IF.</li><li>Oscillation conditions apply at the oscillation frequency; gain and phase elsewhere can differ.</li></ul>
<h4>Mixer frequency products</h4>
<p>An ideal mixer produces sum and difference frequencies. With <code>f_RF=2.4 GHz</code> and <code>f_LO=2.3 GHz</code>, the difference intermediate frequency is <code>|f_RF−f_LO|=100 MHz</code>; the sum is 4.7 GHz and must be rejected if unwanted.</p>
<p>Real mixers also produce harmonics and intermodulation products. Filtering, linearity and local-oscillator leakage affect receiver performance.</p>

<h4>Additional calculation: mixer products</h4>
<p>An ideal mixer produces sum and difference frequencies. With <code>f_RF=2.4 GHz</code> and <code>f_LO=2.3 GHz</code>, the difference intermediate frequency is <code>|f_RF−f_LO|=100 MHz</code>; the sum is 4.7 GHz and must be rejected if unwanted.</p>
<p>Real mixers also produce harmonics and intermodulation products. Filtering, linearity and local-oscillator leakage affect receiver performance.</p>
`},

  {id:'radar', name:'Radar Basics & Microwave Applications', body: T`<h2>1. What radar measures</h2>
<p>Radar transmits electromagnetic energy and analyses returned echoes to estimate range, speed, angle or target characteristics. Range follows round-trip propagation time; the signal travels to the target and back.</p>
\[R=\frac{c\,\Delta t}{2}\]
<p>The factor 2 is essential. c is propagation speed and Δt is the measured round-trip delay.</p>
<div class="ex"><b>Example.</b> An echo returns after 20 μs. R≈(3×10⁸)(20×10⁻⁶)/2=3000 m, or 3 km.</div>
<h2>2. Range resolution and Doppler</h2>
<p>For a pulse of duration τ, simple pulse radar has range resolution about cτ/2. Pulse compression can improve resolution by using a waveform with bandwidth B, giving approximately c/(2B). Radial motion creates Doppler shift; for a monostatic radar at wavelength λ, f_D≈2v_r/λ, with sign depending on approach/recession convention.</p>
<h2>3. Radar equation idea</h2>
<p>Received power depends on transmitted power, antenna gains, wavelength, target radar cross section and the fourth power of range in the simple monostatic free-space model. Doubling range can reduce received power by a factor of 16. Real systems include losses, clutter, atmospheric effects and detection thresholds.</p>
<h2>4. Blocks and trade-offs</h2><ul><li>Transmitter and antenna radiate the waveform.</li><li>Duplexer or circulator protects the receiver during transmit.</li><li>Receiver amplifies and down-converts echoes.</li><li>Signal processing estimates delay and Doppler and decides whether a target is present.</li></ul>
<h2>Exam traps</h2><p>Range depends on round-trip delay; Doppler depends on radial velocity, not total velocity. Higher carrier frequency gives shorter wavelength and greater Doppler shift for the same radial speed, but propagation and hardware trade-offs also change.</p>
<h4>Radar range and resolution</h4>
<p>For a monostatic radar in free space, received echo power is proportional to <code>1/R⁴</code> when other parameters are fixed. Doubling range reduces received power by a factor of 16, approximately 12 dB. Simple pulse-radar range resolution is <code>ΔR=cτ/2</code>, where τ is pulse duration.</p>
<p>Shorter pulses improve range resolution but carry less energy at the same peak power. Pulse compression can provide fine resolution with longer transmitted pulses, at the cost of waveform and processing complexity.</p>

<h4>Additional calculation: radar range</h4>
<p>For a simple pulse radar, range resolution is approximately <code>ΔR=cτ/2</code>. A pulse width of 1 μs gives about 150 m resolution in free space. The factor of two accounts for round-trip travel time.</p>
<p>For a monostatic radar, received echo power often scales approximately as <code>1/R⁴</code> under the standard free-space model. Doubling range reduces echo power by a factor of 16, about 12 dB, with other parameters fixed.</p>
`}
  ]
},
