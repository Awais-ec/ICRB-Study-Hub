<p>A single-tone AM signal can be written s(t)=A_c[1+μcos(ω_m t)]cos(ω_c t), where μ is modulation index. The carrier is at f_c and sidebands occur at f_c±f_m. For conventional AM with μ≤1, the envelope does not cross zero and simple envelope detection works under suitable conditions.</p>
<div class="ex"><b>Example.</b> If A_max=9 V and A_min=3 V, μ=(A_max−A_min)/(A_max+A_min)=6/12=0.5. The modulation depth is 50%. If μ&gt;1, overmodulation distorts the envelope detector output.</div>
<p>For a single-tone AM signal, total sideband power is P_SB,total=(μ²/2)P_c and total transmitted power is P_T=P_c(1+μ²/2). At μ=1, sidebands carry one-third of total power, while the carrier itself carries no message information in ideal conventional AM.</p>
<h2>Bandwidth reminder</h2><p>Conventional DSB-AM bandwidth is 2f_m,max. DSB-SC also needs 2f_m,max but suppresses carrier; SSB needs about f_m,max and saves spectrum at the cost of more demanding generation/detection.</p>
`},

  {id:'fm', name:'Frequency and Phase Modulation', body: T`<h2>1. Frequency and phase carry the message</h2>
<p>In AM, message changes carrier amplitude. In frequency modulation (FM), the instantaneous frequency changes with the message; in phase modulation (PM), the instantaneous phase changes. FM and PM are angle-modulation schemes, and both can have nearly constant envelope.</p>
<div class="formula">$$s_{FM}(t)=A_c\cos\left(2\pi f_ct+2\pi k_f\int_{-\infty}^{t}m(\tau)d\tau\right)$$
$$\beta=\frac{\Delta f}{f_m},\qquad BW\approx2(\Delta f+f_m)\quad\text{(Carson's rule)}$$</div>
<p>For a single-tone FM message, Δf is peak frequency deviation and β is modulation index. Carson's rule estimates the bandwidth containing most significant FM power; it is not a strict spectral cutoff.</p>
<div class="ex"><b>Worked example.</b> If peak deviation is 75 kHz and the highest message frequency is 15 kHz, Carson's estimate is 2(75+15)=180 kHz. This is an estimate for design, not a statement that all sidebands outside 180 kHz are exactly zero.</div>
<h2>2. FM versus PM</h2>
<p>FM instantaneous frequency is proportional to message amplitude. PM instantaneous phase is proportional to message amplitude, so its frequency deviation depends on the message derivative. For a sinusoid, raising the message frequency changes FM and PM indices differently.</p>
<h2>3. Noise and demodulation</h2>
<p>FM can provide improved noise performance above threshold because amplitude noise can be limited before frequency discrimination. This benefit costs bandwidth and may disappear at low carrier-to-noise ratios. Common demodulators include slope detectors, Foster–Seeley/ratio discriminators and phase-locked loops.</p>
<h2>4. Common traps</h2><ul><li>FM modulation index is deviation divided by message frequency for a single tone.</li><li>Carson's rule uses peak deviation plus the highest significant message frequency.</li><li>Constant envelope does not mean constant instantaneous frequency.</li><li>PM and FM are related but not interchangeable without integration/differentiation of the message.</li></ul>
${FIGSLOT('fm')}
<h2>FM modulation index and bandwidth</h2>
<p>For a single-tone modulating signal, FM modulation index β=Δf/f_m, where Δf is peak frequency deviation and f_m is modulating frequency. FM amplitude is ideally constant, while instantaneous frequency varies with the message.</p>
<div class="ex"><b>Example.</b> If peak deviation is 75 kHz and the highest message tone is 15 kHz, β=75/15=5. Carson's rule estimates bandwidth B≈2(Δf+f_m)=2(75+15)=180 kHz.</div>
<p>Carson's rule is an engineering estimate of the bandwidth containing most of the FM signal power; it is not an exact finite boundary because ideal FM has infinitely many sidebands. Narrowband FM has β much less than 1; wideband FM has β much greater than 1.</p>
<h2>FM versus PM</h2><p>In FM, instantaneous frequency deviation is proportional to message amplitude. In PM, instantaneous phase deviation is proportional to message amplitude, so instantaneous frequency depends on the derivative of the message. A differentiator or integrator in the modulating path can convert between the two for appropriate signals.</p>
`},

  {id:'rx', name:'Transmitters, Receivers & Superheterodyne', body: T`<h2>1. The communication chain</h2>
<p>A transmitter conditions the message, modulates a carrier, amplifies it and sends it through an antenna or channel. A receiver selects the wanted signal, amplifies it, converts it to a convenient frequency if needed, demodulates it and reconstructs the message. Each block has a purpose: filtering rejects unwanted signals, gain compensates for path loss, and frequency conversion simplifies selectivity.</p>
<h2>2. Superheterodyne principle</h2>
<p>A superheterodyne receiver mixes the incoming RF signal with a local oscillator to produce a fixed intermediate frequency (IF). A mixer generates sum and difference frequencies. The IF filter and amplifier provide most of the selectivity and gain because their tuning need not change with the received station.</p>
<div class="formula">$$f_{IF}=|f_{LO}-f_{RF}|$$</div>
<div class="ex"><b>Worked example.</b> For a 1 MHz received signal and a 1.455 MHz local oscillator, the difference IF is 455 kHz. A signal at 1.910 MHz also produces a 455 kHz difference with that oscillator; it is an image-frequency candidate and must be rejected by RF preselection.</div>
<h2>3. Image frequency and trade-offs</h2>
<p>The image is another RF frequency that mixes to the same IF. A higher IF generally makes image rejection easier because the image is farther from the desired station, but it can complicate selectivity. Double-conversion receivers use a first IF for image rejection and a second IF for narrow-channel filtering.</p>
<h2>4. Receiver specifications</h2><ul><li><b>Sensitivity:</b> smallest signal that meets a stated output-quality criterion.</li><li><b>Selectivity:</b> ability to reject nearby unwanted channels.</li><li><b>Dynamic range:</b> range of input levels handled without unacceptable degradation.</li><li><b>Noise figure:</b> degradation in signal-to-noise ratio through the receiver.</li><li><b>AGC:</b> adjusts gain to manage changing input levels.</li></ul>
<h2>5. Common traps</h2><p>Write the LO injection side explicitly before finding the image frequency. Also distinguish RF, LO, IF and baseband; they are different points in the receiver chain.</p>
${FIGSLOT('superhet')}
<h2>Why a superheterodyne receiver converts frequency</h2>
<p>The incoming RF signal is mixed with a local oscillator (LO). The mixer produces sum and difference components; a fixed intermediate frequency (IF) is selected by filtering. Fixed-frequency amplification and filtering are easier to optimise than doing everything directly at a changing RF.</p>
<div class="ex"><b>Example.</b> If a receiver uses high-side injection with f_RF=100 MHz and f_IF=10.7 MHz, then f_LO=f_RF+f_IF=110.7 MHz. The difference product is 10.7 MHz. An image frequency also mixes to that IF and must be rejected by RF preselection.</div>
<h2>Receiver blocks</h2><ol><li>Antenna and RF preselector reject out-of-band signals and the image.</li><li>Low-noise amplifier boosts weak signals while adding little noise.</li><li>Mixer and LO translate RF to IF.</li><li>IF filter/amplifier provides selectivity and gain.</li><li>Detector/demodulator recovers the message.</li><li>Audio/baseband stages and AGC control output and dynamic range.</li></ol>
<h2>Trade-offs</h2><p>A higher IF can improve image rejection because the image is farther from the wanted RF, but may complicate filtering. A lower IF can ease selectivity in some designs but worsen image separation. Double-conversion receivers use two IF stages to balance these trade-offs.</p>
`},

  {id:'noise', name:'Noise, SNR & Noise Figure', body: T`<h2>1. What noise means</h2>
<p>Noise is an unwanted random variation added to a signal. Thermal noise arises from random carrier motion in resistive materials. Shot noise comes from discrete charge crossing a junction. Flicker noise is more important at low frequencies. Noise can be described statistically even when its exact instantaneous waveform is unpredictable.</p>
<div class="formula">$$P_n=kTB,\qquad SNR=\frac{P_s}{P_n},\qquad SNR_{dB}=10\log_{10}(SNR)$$</div>
<p>k is Boltzmann's constant, T is absolute temperature in kelvin, and B is noise bandwidth in hertz. Increasing bandwidth or temperature increases available thermal-noise power.</p>
<div class="ex"><b>Worked example.</b> At 290 K over 1 MHz, thermal noise power is about 1.38×10⁻²³×290×10⁶≈4.0×10⁻¹⁵ W, or roughly −114 dBm. Real receiver noise is higher by its noise figure.</div>
<h2>2. Noise figure</h2>
<div class="formula">$$F=\frac{SNR_{in}}{SNR_{out}},\qquad NF=10\log_{10}F$$</div>
<p>An ideal noiseless device has F=1 or 0 dB. A real device adds noise and typically reduces SNR. Friis' formula for cascaded stages shows why the first stage matters: F_total=F_1+(F_2−1)/G_1+… using linear noise factors and linear power gains, not dB values.</p>
<h2>3. Equivalent noise bandwidth and noise sources</h2>
<p>A filter's noise bandwidth is the width of an ideal rectangular filter that would pass the same noise power. It may differ from its nominal 3 dB bandwidth. Thermal noise is approximately white over many practical bands, while flicker noise rises as frequency falls.</p>
<h2>4. Common traps</h2><ul><li>Use kelvin and hertz in kTB.</li><li>Use 10log for power ratios and 20log for voltage ratios under the appropriate impedance assumptions.</li><li>Convert dB gains and noise figures to linear values before applying Friis' formula.</li><li>State the bandwidth when quoting a noise power.</li></ul>
<h2>Noise power and SNR</h2>
<p>For thermal noise over bandwidth B, available noise power is N=kTB, where k≈1.38×10⁻²³ J/K and T is absolute temperature in kelvin. Doubling bandwidth doubles noise power, raising the noise floor by about 3 dB.</p>
<div class="ex"><b>Example.</b> At T=290 K and B=1 MHz, N≈1.38×10⁻²³×290×10⁶≈4.0×10⁻¹⁵ W. In dBm, this is about −114 dBm. Real receiver noise is higher by its noise figure.</div>
<h2>Noise figure</h2>
<p>Noise factor F=(SNR_in)/(SNR_out), and noise figure NF=10log₁₀F dB. An ideal noiseless stage has F=1 or 0 dB. For cascaded stages, Friis' formula is F_total=F₁+(F₂−1)/G₁+(F₃−1)/(G₁G₂)+…, where gains are linear, not dB. Therefore the first stage's gain and noise figure strongly affect the total.</p>
<h2>Distinguish noise types</h2><ul><li>Thermal noise: associated with resistive elements and temperature.</li><li>Shot noise: charge-carrier discreteness in devices.</li><li>Flicker noise: often dominates at low frequencies.</li><li>Quantisation noise: introduced by finite-resolution conversion under its modelling assumptions.</li></ul>
`},

  {id:'pcm', name:'Sampling, Quantisation, PCM, DPCM, Delta Modulation', body: T`<h2>1. Sampling is not quantisation</h2>
<p>Sampling records the signal at discrete times. Quantisation rounds each sampled amplitude to one of a finite set of levels. Encoding maps the level index into bits. These are three separate operations. A digital representation therefore has both a time resolution (sampling rate) and an amplitude resolution (number of quantisation levels).</p>
<div class="formula">$$L=2^n,\qquad \Delta\approx\frac{V_{range}}{L},\qquad SNR_q\approx6.02n+1.76\text{ dB}$$</div>
<p>For an ideal uniform quantiser and a full-scale sinusoid, the familiar SNR formula is an approximation under standard assumptions. The quantisation step Δ depends on the full-scale range and number of levels.</p>
<div class="ex"><b>Worked example.</b> An 8-bit converter has 2⁸=256 levels. If its full-scale span is 2 V, step size is about 2/256=7.8125 mV. More bits make the steps smaller but do not prevent aliasing; anti-alias filtering is a separate requirement.</div>
<h2>2. PCM and differential methods</h2>
<p>Pulse-code modulation transmits the quantised sample code. DPCM sends a prediction error rather than the whole sample, exploiting correlation between adjacent samples. Delta modulation sends a one-bit indication of whether the reconstructed signal should step up or down. Delta modulation can suffer slope-overload distortion when the input changes too quickly and granular noise when the step is too large for a slowly varying signal.</p>
<h2>3. Bit rate</h2>
<div class="formula">$$R_b=n f_s\quad\text{(one channel, n bits/sample)}$$</div>
<p>If audio is sampled at 8 ksample/s with 8 bits per sample, the raw PCM rate is 64 kbit/s before framing or error-control overhead.</p>
<h2>4. Common traps</h2><ul><li>Quantisation error and aliasing are different problems.</li><li>PCM bit rate is samples per second times bits per sample, per channel.</li><li>Compression or DPCM can reduce bit rate, but the result depends on coding assumptions.</li><li>Do not apply the ideal SNR formula blindly to non-full-scale or nonuniform quantisers.</li></ul>
${FIGSLOT('pcm')}
<h2>Sampling, quantisation and coding are different steps</h2>
<p>Sampling selects values in time; quantisation maps each sample to one of a finite set of amplitudes; encoding assigns bits to the quantised level. A digital representation therefore has both a sampling rate and a bit depth.</p>
<div class="ex"><b>Worked example.</b> An 8 kHz speech signal sampled at 8,000 samples/s with 8 bits/sample has an uncompressed bit rate of 8,000×8=64 kb/s per channel. If 256 uniform quantisation levels span a 2 V range, the step is Δ=2/256≈7.8125 mV, assuming endpoint convention consistent with the design.</div>
<h2>Quantisation SNR</h2><p>For an ideal uniform quantiser and full-scale sinusoid, SQNR≈6.02N+1.76 dB. This estimate assumes no overload and a suitable quantisation-error model. Doubling the number of levels adds one bit and about 6 dB SQNR under these assumptions.</p>
<h2>DPCM and delta modulation</h2><p>DPCM encodes a prediction error rather than the full sample, exploiting correlation between neighbouring samples. Delta modulation uses a one-bit up/down decision to track the signal; too small a step causes slope-overload distortion, while too large a step increases granular noise. Adaptive delta modulation changes step size to balance the two.</p>
`},

  {id:'dmod', name:'Digital Modulation — ASK, FSK, PSK, QPSK, QAM', body: T`<h2>1. Digital symbols and carrier changes</h2>
<p>Digital modulation maps bits or groups of bits to a transmitted waveform. ASK changes amplitude, FSK changes frequency, and PSK changes phase. QPSK uses four phase states, so each ideal symbol carries log₂4=2 bits. M-ary QAM varies both amplitude and phase and can carry log₂M bits per symbol.</p>
<div class="formula">$$R_s=\frac{R_b}{\log_2 M}\quad\text{for fixed-length M-ary symbols}$$</div>
<p>R_b is bit rate and R_s is symbol rate. Higher-order modulation can send more bits per symbol but requires better signal quality because constellation points are closer together.</p>
<div class="ex"><b>Worked example.</b> A 16-QAM signal carries log₂16=4 bits per symbol. At 1 Msymbol/s, the uncoded bit rate is 4 Mbit/s, excluding framing and coding overhead.</div>
<h2>2. Constellations and error performance</h2>
<p>A constellation plots the possible complex symbols: horizontal axis is in-phase I and vertical axis is quadrature Q. Noise moves a received point away from its ideal location. A decision boundary divides the plane into regions; errors occur when noise pushes the point into the wrong region. For the same average energy, larger constellations generally have smaller minimum distance and need higher SNR for the same error rate.</p>
<h2>3. Coherent and noncoherent detection</h2>
<p>Coherent detection uses a phase/frequency reference aligned with the received carrier. Noncoherent detection avoids exact phase recovery but often pays a performance penalty. FSK can be detected coherently or noncoherently depending on the system; PSK commonly uses coherent detection.</p>
<h2>4. Common traps</h2><ul><li>Bit rate and symbol rate are not the same for M-ary modulation.</li><li>QPSK carries 2 bits per symbol, while 8-PSK carries 3.</li><li>Higher spectral efficiency generally requires higher SNR for a target error probability.</li><li>State whether bandwidth is ideal Nyquist bandwidth or a practical bandwidth including pulse-shaping roll-off.</li></ul>
${FIGSLOT('const')}
<h2>Digital modulation in one framework</h2>
<p>Digital modulation maps bits or bit groups to a set of signal waveforms called symbols. ASK varies amplitude, FSK varies frequency, PSK varies phase, and QAM varies both amplitude and phase. The constellation is a diagram of allowed complex symbol values.</p>
<div class="ex"><b>Bits per symbol.</b> M-ary modulation carries log₂M bits/symbol when M is a power of two. QPSK has M=4 and therefore 2 bits/symbol; 16-QAM carries 4 bits/symbol. At a fixed symbol rate, higher-order modulation raises bit rate but generally needs higher SNR for the same error probability.</div>
<h2>Bandwidth and energy</h2><p>Symbol rate R_s is measured in baud. For uncoded modulation, bit rate R_b=R_s log₂M. Pulse shaping controls occupied bandwidth; ideal Nyquist signalling with raised-cosine roll-off α has approximate one-sided baseband bandwidth R_s(1+α)/2. Real passband bandwidth depends on modulation and filtering conventions.</p>
<h2>Error performance intuition</h2><ul><li>Coherent BPSK and QPSK have robust error performance in AWGN; Gray-coded QPSK has bit error performance comparable to BPSK at the same E_b/N₀ under standard assumptions.</li><li>Higher-order QAM packs constellation points closer, increasing sensitivity to noise and nonlinear distortion.</li><li>FSK can trade bandwidth for implementation simplicity and envelope properties.</li></ul>
`},

  {id:'det', name:'Detection, Matched Filters & Probability of Error', body: T`<h2>1. Detection is a decision problem</h2>
<p>A receiver observes a noisy waveform and decides which transmitted symbol is most likely. For binary antipodal signalling in additive white Gaussian noise, the optimum threshold under equal priors is halfway between the two noiseless signal levels. Unequal prior probabilities or unequal costs can shift the threshold.</p>
<h2>2. Matched filtering</h2>
<p>A matched filter is designed to maximise output signal-to-noise ratio at a chosen sampling instant in white Gaussian noise. Its impulse response is a time-reversed, conjugated version of the known signal, shifted to the decision time. The receiver samples its output and compares it with decision thresholds.</p>
<div class="formula">$$P_b=Q\!\left(\sqrt{\frac{2E_b}{N_0}}\right)\quad\text{(coherent BPSK in AWGN)}$$</div>
<p>E_b is energy per bit, N_0 is the one-sided noise spectral-density convention used in this formula, and Q(x) is the Gaussian tail probability. This formula is specific to coherent BPSK in AWGN; do not transfer it unchanged to every modulation.</p>
<div class="ex"><b>Worked example.</b> Increasing E_b/N_0 moves the Q-function argument higher, so bit-error probability falls. The relationship is nonlinear: a modest SNR increase can produce a large error-rate improvement in the steep part of the curve.</div>
<h2>3. Error probabilities and assumptions</h2>
<p>BER is the fraction of detected bits that are wrong; symbol-error probability counts incorrect symbols. They are not identical for multibit symbols. Coding can lower BER at the cost of redundancy, delay and complexity.</p>
<h2>4. Common traps</h2><ul><li>Check coherent/noncoherent detection, modulation type and noise model before selecting a BER formula.</li><li>Convert dB SNR to linear ratio when substituting into equations.</li><li>Do not confuse E_b/N_0 with carrier-to-noise ratio unless the bandwidth and bit rate relationship is included.</li></ul>
<h2>Matched filter: maximise sampled SNR</h2>
<p>In additive white Gaussian noise, the matched filter for a known signal s(t) over a specified interval has impulse response proportional to the time-reversed conjugate of the signal: h(t)=k s*(T−t). Sampling its output at T maximises output SNR under the model assumptions.</p>
<div class="ex"><b>Interpretation.</b> The filter correlates the received waveform with the expected signal. A strong match produces a large output; uncorrelated noise tends to average out. This is why matched filtering is central to digital receivers and radar pulse detection.</div>
<h2>Probability of error</h2>
<p>For coherent BPSK in AWGN, P_b=Q(√(2E_b/N₀))=½ erfc(√(E_b/N₀)). Here E_b is energy per bit and N₀ is the one-sided noise power spectral density convention. As E_b/N₀ increases, the decision point is farther from the noise distribution and bit-error probability falls.</p>
<h2>Decision rules</h2><p>For equally likely symbols in AWGN with equal-energy signals, maximum-likelihood detection selects the closest constellation point. With unequal priors or unequal costs, the optimum Bayesian decision threshold may shift. Always check the noise model, symbol probabilities and coherent/noncoherent assumption before using a formula.</p>
`},

  {id:'line', name:'Line Coding, Pulse Shaping & ISI', body: T`<h2>1. Line coding</h2>
<p>Line coding maps bits into voltage or pulse patterns on a physical link. NRZ uses a level for a bit over its interval; RZ returns to a reference level during part of the bit; Manchester coding has a mid-bit transition that helps clock recovery but uses more bandwidth. Bipolar schemes such as AMI alternate the polarity of successive marks.</p>
<h2>2. Why pulse shape matters</h2>
<p>Sharp transitions have broad spectra. Pulse shaping limits bandwidth and controls intersymbol interference (ISI). The Nyquist zero-ISI criterion says the overall pulse response should be zero at every other symbol sampling instant and have the desired value at the correct instant.</p>
<div class="formula">$$B_{baseband,min}\approx\frac{R_s}{2}\quad\text{(ideal Nyquist signalling, one real baseband channel)}$$</div>
<p>A raised-cosine pulse uses roll-off factor α between 0 and 1. Its ideal one-sided baseband bandwidth is (1+α)R_s/2; α=0 is the minimum-bandwidth limit but requires a long sinc-like pulse.</p>
<div class="ex"><b>Worked example.</b> At R_s=1 Msymbol/s and α=0.25, the ideal baseband bandwidth is 0.625 MHz. A practical implementation needs filtering and timing recovery, and its measured occupied bandwidth depends on the stated criterion.</div>
<h2>3. ISI and clock recovery</h2>
<p>ISI occurs when neighbouring pulses overlap at the sampling time because of channel dispersion or imperfect filtering. Equalisation, suitable pulse shaping and correct timing reduce it. Long runs without transitions can make clock recovery difficult for some line codes.</p>
<h2>4. Common traps</h2><ul><li>Bit rate equals symbol rate only for one bit per symbol.</li><li>Manchester's transition helps timing but costs bandwidth.</li><li>Zero-ISI is a condition at sampling instants, not a claim that pulses never overlap in continuous time.</li></ul>
${FIGSLOT('linecode')}
<h2>Nyquist pulse shaping and ISI</h2>
<p>Intersymbol interference (ISI) occurs when the tail of one pulse contributes at the sampling time of a neighbouring symbol. The Nyquist zero-ISI criterion requires the overall pulse response to be zero at every nonzero integer multiple of the symbol interval and nonzero at the intended sample.</p>
<h2>Raised-cosine family</h2>
<p>A raised-cosine response uses roll-off factor α between 0 and 1. Smaller α saves bandwidth but requires more precise timing and longer practical filters; larger α widens the spectrum but eases timing tolerance. Root-raised-cosine filters are often split between transmitter and receiver; cascading the two gives a raised-cosine overall response.</p>
<div class="ex"><b>Bandwidth example.</b> If R_s=1 Msymbol/s and α=0.25, the ideal raised-cosine baseband bandwidth is R_s(1+α)/2=625 kHz on each side under the usual low-pass convention; the corresponding real passband null-to-null bandwidth is about 1.25 MHz.</div>
<h2>Line codes</h2><p>NRZ, RZ, Manchester and bipolar AMI differ in DC content, transition density, bandwidth and clock recovery. Manchester guarantees a mid-bit transition but uses more bandwidth; long runs without transitions can challenge timing recovery in some codes.</p>
`},

  {id:'info', name:'Information Theory — Entropy, Capacity', body: T`<h2>1. Entropy measures uncertainty</h2>
<p>Information theory quantifies uncertainty and the limits of compression and reliable communication. A highly predictable source has low average information per symbol; a source with many equally likely outcomes has higher uncertainty.</p>
<div class="formula">$$H(X)=-\sum_x p(x)\log_2p(x)\quad\text{bits/symbol}$$</div>
<p>Terms with probability zero contribute zero by the limiting convention. For a binary source with probabilities p and 1−p, entropy is largest at p=0.5 and is zero when one outcome is certain.</p>
<div class="ex"><b>Worked example.</b> For a fair binary source, H=−0.5log₂0.5−0.5log₂0.5=1 bit per symbol. If one outcome occurs with probability 1, H=0 because there is no uncertainty.</div>
<h2>2. Mutual information and channel capacity</h2>
<p>Mutual information I(X;Y) measures how much observing Y reduces uncertainty about X. Channel capacity is the maximum reliable information rate under the specified channel model and constraints.</p>
<div class="formula">$$C=B\log_2\left(1+\frac{S}{N}\right)\quad\text{bits/s (AWGN channel)}$$</div>
<p>This Shannon formula assumes bandwidth B and signal-to-noise power ratio S/N over that bandwidth. Doubling bandwidth does not simply double capacity at every fixed total power, because noise power and spectral assumptions matter.</p>
<h2>3. Practical meaning</h2>
<p>Capacity is a theoretical limit, not a promise that a particular code achieves it at finite length and complexity. Error-control coding can approach capacity by adding structured redundancy; it cannot exceed the capacity of the assumed channel.</p>
<h2>4. Common traps</h2><ul><li>Use log base 2 for bits.</li><li>State whether entropy is per symbol or per second.</li><li>Use linear S/N inside the logarithm, not a dB value.</li><li>Capacity depends on the channel model and constraints.</li></ul>
<h2>Entropy: average uncertainty</h2>
\[H(X)=-\sum_x p(x)\log_2p(x)\]
<p>Entropy is measured in bits per source symbol. A fair binary source has H=1 bit/symbol; a highly biased binary source has lower entropy because its outcome is more predictable.</p>
<div class="ex"><b>Example.</b> For probabilities 0.5 and 0.5, H=−2(0.5log₂0.5)=1 bit. For probabilities 0.9 and 0.1, H≈−0.9log₂0.9−0.1log₂0.1≈0.469 bits.</div>
<h2>Channel capacity</h2>
<p>For an ideal band-limited AWGN channel, Shannon capacity is C=B log₂(1+S/N) bits/s, where S/N is a linear power ratio across the stated bandwidth. Capacity is a theoretical limit: reliable communication below it is possible with suitable coding and long block lengths, while reliable communication above it is not possible under the model.</p>
<div class="ex"><b>Example.</b> If B=1 MHz and S/N=15 (not 15 dB), C=10⁶log₂(16)=4 Mb/s. If the given SNR is 15 dB, first convert it to linear: 10^(15/10)≈31.6.</div>
<h2>Important distinctions</h2><ul><li>Entropy is source uncertainty; capacity is the maximum reliable channel rate.</li><li>Use a linear SNR in Shannon's formula, not a dB value.</li><li>Compression cannot generally reduce average lossless code length below source entropy.</li></ul>
`},

  {id:'src', name:'Source Coding, Huffman & Error-Control Coding', body: T`<h2>1. Source coding and redundancy</h2>
<p>Source coding represents common source symbols with short codewords and rare symbols with longer ones, reducing average length. A prefix code has no codeword that is the beginning of another codeword, so decoding can proceed unambiguously as bits arrive.</p>
<p>Huffman coding repeatedly combines the two least-probable nodes to build a binary tree. It produces an optimal prefix code among symbol-by-symbol binary codes for the given probabilities, but it does not guarantee the average length equals entropy.</p>
<div class="ex"><b>Small example.</b> If symbol probabilities are 1/2, 1/4, 1/8 and 1/8, a Huffman code can assign lengths 1, 2, 3 and 3. The average length is 0.5(1)+0.25(2)+0.125(3)+0.125(3)=1.75 bits/symbol.</div>
<h2>2. Error-control coding</h2>
<p>Channel coding adds redundancy so the receiver can detect or correct errors. A code with minimum Hamming distance d_min can detect up to d_min−1 bit errors and correct up to floor((d_min−1)/2) errors under the usual hard-decision model.</p>
<div class="formula">$$R_c=\frac{k}{n}\quad\text{(k information bits encoded into n bits)}$$</div>
<p>A lower code rate means more redundancy. Block codes encode fixed-size blocks; convolutional codes use memory and can be decoded with algorithms such as Viterbi. Modern systems may use turbo, LDPC or polar codes.</p>
<h2>3. Source coding versus channel coding</h2>
<p>Source coding removes statistical redundancy; channel coding adds controlled redundancy to improve reliability. They solve different problems and may be combined in one system.</p>
<h2>4. Common traps</h2><ul><li>Do not confuse codeword length with code rate.</li><li>Huffman optimality is for the stated symbol probabilities and coding model.</li><li>Error correction depends on minimum distance and decoding assumptions.</li><li>Compression cannot make every possible source representation shorter without assumptions about the source.</li></ul>
${FIGSLOT('huffman')}
<h2>Huffman coding</h2>
<p>Huffman coding builds a prefix code by repeatedly combining the two least-probable symbols or groups, then assigning binary branches. A prefix code has no codeword that is the prefix of another, allowing unambiguous decoding without separators.</p>
<div class="ex"><b>Simple example.</b> For symbol probabilities A=0.5, B=0.25, C=0.125, D=0.125, one valid Huffman assignment gives A=0, B=10, C=110, D=111. The average length is 0.5(1)+0.25(2)+0.125(3)+0.125(3)=1.75 bits/symbol.</div>
<h2>Source coding versus channel coding</h2>
<p>Source coding removes statistical redundancy to compress data. Channel coding adds structured redundancy so errors can be detected or corrected. These objectives are different and can be used together in a communication system.</p>
<h2>Error-control coding</h2><ul><li>Parity detects some errors but cannot correct arbitrary errors by itself.</li><li>Block codes map k information bits to n coded bits; code rate is R=k/n.</li><li>Convolutional codes use memory and are often decoded with the Viterbi algorithm.</li><li>Modern LDPC and turbo codes approach capacity under suitable conditions.</li></ul>
<p>Do not infer that a longer code always performs better: coding gain depends on distance properties, rate, decoder, channel and latency constraints.</p>
`},

  {id:'mux', name:'Multiplexing & Multiple Access', body: T`<h2>1. Why multiplexing exists</h2>
<p>Multiplexing lets several information streams share a communication resource. The receiver separates them by allocating different time slots, frequency bands, codes, wavelengths or spatial channels. Multiple access describes how multiple users share the same medium, especially on the uplink or a shared network.</p>
<ul><li><b>FDM:</b> users occupy different frequency bands, often separated by guard bands.</li><li><b>TDM:</b> users take turns in assigned time slots.</li><li><b>CDM:</b> users are distinguished by spreading codes; code correlation and power control matter.</li><li><b>WDM:</b> optical channels use different wavelengths in a fibre.</li><li><b>OFDMA:</b> users receive subsets of orthogonal subcarriers and/or time-frequency resource blocks.</li></ul>
<h2>2. Capacity and guard resources</h2>
<p>Guard bands and guard intervals reduce interference but consume resources. Synchronisation is essential in TDM and OFDM-based systems. In code-division systems, imperfect orthogonality or unequal received powers can cause multiple-access interference.</p>
<div class="ex"><b>Worked example.</b> If a 1 ms frame contains 10 equal TDM slots with no guard overhead, each slot is 100 μs. If guard time is added, payload time per slot is less than 100 μs and useful throughput falls.</div>
<h2>3. Multiple-access trade-offs</h2>
<p>FDMA needs frequency planning and filtering; TDMA needs timing alignment; CDMA needs code management and power control; OFDMA needs accurate frequency/time synchronisation and handles multipath with suitable cyclic prefixes and equalisation.</p>
<h2>4. Common traps</h2><ul><li>Multiplexing combines streams; demultiplexing separates them.</li><li>Multiple access is the resource-sharing method for multiple transmitters/users.</li><li>Nominal channel bandwidth is not the same as net user throughput after guards, pilots and coding.</li></ul>
<h2>Multiplexing and multiple access</h2>
<p>Multiplexing combines several information streams over a shared link. Multiple access describes how multiple users share a communication resource. The terms are related but not identical: multiplexing may happen inside one transmitter, while multiple access coordinates separate users.</p>
<ul><li>FDM: users occupy different frequency bands.</li><li>TDM: users occupy different time slots.</li><li>CDM/CDMA: users use distinguishable spreading codes.</li><li>OFDMA: users receive subsets of orthogonal subcarriers and time-frequency resources.</li><li>WDM: optical channels use different wavelengths.</li></ul>
<div class="ex"><b>Rate example.</b> If a TDM frame has 8 equal slots and each slot carries 1 kb of payload every 10 ms, each slot's rate is 100 kb/s; all eight slots together carry 800 kb/s before framing overhead.</div>
<h2>Trade-offs</h2><p>FDM needs guard bands and filtering; TDM needs synchronisation and buffering; CDMA depends on code properties and power control; OFDMA needs accurate timing/frequency synchronisation and handles frequency-selective channels through subcarriers. No access method is universally best.</p>
<h2>Exam traps</h2><p>Distinguish carrier frequency from subcarrier allocation, and distinguish bit rate from symbol rate. Resource allocation overhead and guard intervals reduce net payload rate below the raw aggregate.</p>
`},

  {id:'eq', name:'Equalisation, Eye Diagrams & Spread Spectrum', body: T`<h2>1. Equalisation</h2>
<p>A channel may smear a transmitted pulse so that it extends into neighbouring symbol intervals. Equalisation attempts to undo this distortion. A zero-forcing equaliser tries to invert the channel response, but it can amplify noise where the channel response is very small. An MMSE equaliser balances residual ISI against noise enhancement.</p>
<div class="formula">$$G_{ZF}(f)=\frac{1}{H(f)}$$</div>
<p>This inverse is unstable or noise-sensitive near spectral nulls, so real designs regularise the inverse or use MMSE/adaptive approaches. Adaptive LMS adjusts coefficients using an error signal and a step-size parameter; a large step size converges quickly but may be noisy or unstable.</p>
<h2>2. Eye diagrams</h2>
<p>An eye diagram overlays many symbol intervals on the same time axis. A wide vertical opening indicates noise margin; a wide horizontal opening indicates timing margin. Closure suggests ISI, noise, jitter or bandwidth limitations. The best sampling instant is near the centre of the eye, where the waveform is least sensitive to timing error.</p>
<div class="ex"><b>Interpretation example.</b> If the eye is vertically closed, amplitude decisions are unreliable; if it is horizontally narrow, even small clock jitter can cause errors. Both can happen at once.</div>
<h2>3. Spread spectrum</h2>
<p>Direct-sequence spread spectrum multiplies data by a faster pseudo-noise chip sequence, spreading energy over a wider bandwidth. Frequency-hopping spread spectrum changes carrier frequency according to a sequence. Processing gain is related to spread bandwidth divided by information bandwidth, though practical interference rejection depends on synchronisation and system details.</p>
<h2>4. Common traps</h2><ul><li>Zero-forcing removes ISI only under an accurate channel model and may amplify noise.</li><li>Eye diagrams are qualitative views of timing and amplitude margins, not a substitute for BER measurement.</li><li>Spread spectrum does not create free capacity; it trades bandwidth and complexity for robustness or sharing benefits.</li></ul>
${FIGSLOT('eye')}
<h2>Why equalisation is needed</h2>
<p>A channel can attenuate different frequencies differently and spread each transmitted pulse in time. The receiver then sees overlapping symbol contributions, causing ISI. An equaliser attempts to compensate for the channel response using a training sequence, known pilots or decision-directed adaptation.</p>
<h2>Linear and decision-feedback equalisers</h2>
<p>A linear equaliser filters the received sequence. A zero-forcing equaliser tries to invert the channel response, but can greatly amplify noise near channel spectral nulls. An MMSE equaliser balances residual ISI against noise enhancement. A decision-feedback equaliser uses past detected symbols to cancel postcursor ISI, but incorrect decisions can propagate.</p>
<h2>Eye diagram</h2>
<p>Overlaying many symbol intervals produces an eye diagram. A wide vertical opening suggests noise margin; a wide horizontal opening suggests timing margin. Eye closure can indicate ISI, jitter, noise, bandwidth limitation or nonlinear distortion.</p>
<div class="ex"><b>Interpretation.</b> If the eye is vertically small, amplitude/noise margin is poor. If its crossing points vary horizontally, timing jitter or timing recovery may be the issue. An eye diagram is diagnostic evidence, not a unique proof of one cause.</div>
<h2>Spread spectrum</h2><p>Direct-sequence spread spectrum multiplies data by a faster chip sequence; frequency hopping changes carrier frequency according to a pattern. Processing gain can improve resistance to narrowband interference and support code separation, but practical performance depends on synchronisation, code correlation and power control.</p>
`}
  ]
},

/* ============================================================ 8 EMFT */
{
  id:'em', name:'Electromagnetics, Transmission Lines & Antennas', icon:'🌐',
  topics:[
  {id:'vec', name:'Vector Fields & Coordinate Systems', body: T`<h2>1. Vectors describe direction and magnitude</h2>
<p>A scalar has magnitude only; a vector has magnitude and direction. Electric field, magnetic field and force are vectors. In Cartesian coordinates a vector is written A=A_x a_x+A_y a_y+A_z a_z. Unit vectors a_x, a_y and a_z point along the coordinate axes.</p>
<h2>2. Dot and cross products</h2>
<div class="formula">$$\vec A\cdot\vec B=|A||B|\cos\theta,\qquad |\vec A\times\vec B|=|A||B|\sin\theta$$</div>
<p>The dot product gives a scalar and measures alignment; the cross product gives a vector perpendicular to both inputs. Electric flux uses a dot product with the surface normal. The Poynting vector uses a cross product of electric and magnetic fields.</p>
<h2>3. Coordinate systems</h2>
<p>Cartesian coordinates suit rectangular geometry; cylindrical coordinates suit wires and coaxial structures; spherical coordinates suit point charges and spherical symmetry. The differential line elements are:</p>
<div class="formula">$$d\vec l_{cyl}=d\rho\,a_\rho+\rho d\phi\,a_\phi+dz\,a_z$$
$$d\vec l_{sph}=dr\,a_r+r d\theta\,a_\theta+r\sin\theta d\phi\,a_\phi$$</div>
<h2>4. Gradient, divergence and curl</h2>
<p>Gradient points toward the steepest increase of a scalar field; divergence measures net outward flux density; curl measures local circulation. These are not interchangeable operations. Learn the Cartesian formulas first, then use the appropriate cylindrical/spherical scale factors.</p>
<div class="ex"><b>Example.</b> For a uniform field A=3a_x+4a_y, its magnitude is √(3²+4²)=5. If B=a_x, then A·B=3, while A×B points in the z direction with magnitude 4 and sign determined by the right-hand rule.</div>
<h2>5. Common traps</h2><ul><li>Angle units in calculus and wave equations are radians.</li><li>Coordinate unit vectors change direction with position in cylindrical/spherical systems.</li><li>Use the surface normal in flux integrals and the right-hand rule for cross products.</li></ul>
<h4>Extra worked check: field units</h4>
<p>Electric field has units V/m and magnetic field strength H has units A/m; magnetic flux density B has units tesla. In a linear medium, <code>B=μH</code> and <code>D=εE</code>. In free space, <code>ε₀μ₀=1/c²</code>, which connects electromagnetic material constants to wave speed.</p>
<p>For a scalar potential V, the electric field is <code>E=−∇V</code>. The minus sign means the field points toward decreasing potential. If potential changes by 10 V over 2 mm in a uniform one-dimensional approximation, field magnitude is about 5000 V/m.</p>
`},

  {id:'estat', name:'Electrostatics — Gauss\'s Law, Potential, Capacitance', body: T`<h2>1. Electric charge creates electric field</h2>
<p>Electrostatics studies charges at rest. The electric field E is force per unit positive test charge; electric flux density D includes the material response. In a linear isotropic dielectric, D=εE. Potential V is energy per unit charge, and electric field points toward decreasing potential.</p>
<div class="formula">$$\vec E=-\nabla V,\qquad \oint_S\vec D\cdot d\vec S=Q_{enc}$$</div>
<p>Gauss's law says total outward electric flux through a closed surface equals enclosed free charge. It is always true, but it is easiest for calculating E when symmetry makes the field constant over a useful surface.</p>
<h2>2. Using Gauss's law</h2>
<p>For a point charge, a spherical Gaussian surface gives E=Q/(4π ε r²). For an infinitely long line charge with density λ, a cylindrical surface gives E=λ/(2π ε ρ). For an infinite sheet with surface charge density ρ_s, the field magnitude on either side is ρ_s/(2ε) for a single sheet in a uniform medium.</p>
<div class="ex"><b>Worked example.</b> A point charge Q=1 nC in free space at r=0.1 m gives E≈(9×10⁹)(10⁻⁹)/(0.1²)=900 N/C, directed radially outward for positive Q.</div>
<h2>3. Potential and capacitance</h2>
<p>Potential difference is the negative line integral of E along a path. Capacitance C=Q/V measures charge stored per voltage. For parallel plates with area A and separation d, ignoring fringing, C=εA/d. Energy stored is W=½CV².</p>
<h2>4. Boundary conditions and conductors</h2>
<p>In electrostatic equilibrium, E inside an ideal conductor is zero and its surface is equipotential. The tangential electric field at a conductor surface is zero; the normal D field relates to surface charge. At dielectric interfaces, tangential E is continuous and normal D changes according to free surface charge.</p>
<h2>5. Common traps</h2><ul><li>Gauss's law is always valid, but a Gaussian surface does not automatically make the field easy to find.</li><li>Use the permittivity of the medium, not always ε₀.</li><li>Distinguish electric field E (V/m) from flux density D (C/m²).</li></ul>
${FIGSLOT('gauss')}`},

  {id:'mstat', name:'Magnetostatics — Ampere\'s Law, Inductance', body: T`<h2>1. Magnetic field from current</h2>
<p>Magnetostatics studies steady currents and the magnetic fields they create. The magnetic flux density B is measured in tesla; H is magnetic field intensity in A/m. In a linear medium, B=μH. Magnetic field lines form closed loops, so the net magnetic flux through a closed surface is zero.</p>
<div class="formula">$$\oint_C\vec H\cdot d\vec l=I_{enc},\qquad \nabla\cdot\vec B=0$$</div>
<p>Ampere's law is especially useful when current geometry has symmetry. A long straight wire produces circular field lines, with direction from the right-hand rule.</p>
<div class="ex"><b>Worked example.</b> For a long wire carrying 2 A, H=I/(2πρ). At ρ=0.1 m, H≈2/(0.628)=3.18 A/m. In free space B=μ₀H≈4 μT.</div>
<h2>2. Biot–Savart and common geometries</h2>
<p>Biot–Savart law calculates the contribution from a small current element and integrates over the conductor. It handles finite wires and loops when Ampere symmetry is insufficient. At the centre of a circular loop of radius a, B=μI/(2a) for one turn.</p>
<h2>3. Magnetic force and materials</h2>
<div class="formula">$$\vec F=q\vec v\times\vec B,\qquad \vec F=I\vec L\times\vec B$$</div>
<p>A moving charge or current-carrying wire feels a force perpendicular to the relevant motion/current and magnetic field. Magnetic materials can have nonlinear B-H curves; ferromagnetic cores may saturate and show hysteresis.</p>
<h2>4. Common traps</h2><ul><li>Use H for Ampere's law in the common material form and B for magnetic flux density.</li><li>Apply the right-hand rule carefully; force direction depends on charge sign.</li><li>Ampere's law is easiest when H is tangent and constant along the chosen path.</li><li>Do not assume μ=μ₀ inside a magnetic material.</li></ul>
${FIGSLOT('ampere')}`},

  {id:'max', name:'Maxwell\'s Equations & Boundary Conditions', body: T`<h2>1. Maxwell's equations connect fields and sources</h2>
<p>Electric and magnetic fields are coupled. Changing magnetic flux produces circulating electric field; current and changing electric flux produce magnetic circulation. Maxwell's equations unify electrostatics, magnetostatics, induction and electromagnetic waves.</p>
<div class="formula">$$\nabla\cdot\vec D=\rho_v,\qquad \nabla\cdot\vec B=0$$
$$\nabla\times\vec E=-\frac{\partial\vec B}{\partial t},\qquad \nabla\times\vec H=\vec J+\frac{\partial\vec D}{\partial t}$$</div>
<p>The last term, displacement current density ∂D/∂t, is essential for time-varying fields and for consistency of charge conservation, including the gap between capacitor plates.</p>
<h2>2. Integral meanings</h2>
<ul><li>Gauss electric law: closed-surface electric flux relates to enclosed charge.</li><li>Gauss magnetic law: net magnetic flux through a closed surface is zero.</li><li>Faraday law: changing magnetic flux induces electric circulation.</li><li>Ampere–Maxwell law: conduction current and changing electric flux create magnetic circulation.</li></ul>
<h2>3. Constitutive relations and wave equation</h2>
<p>In a simple linear medium, D=εE, B=μH and J=σE. Combining Maxwell's equations in a source-free, lossless medium leads to wave propagation with speed v=1/√(με). In free space this is approximately 3×10⁸ m/s.</p>
<div class="ex"><b>Concept check.</b> A capacitor is charging. Conduction current flows in the wires, while the changing electric field between the plates contributes displacement current. Omitting the displacement term would make the magnetic-field description inconsistent.</div>
<h2>4. Boundary conditions and traps</h2><p>Field components can change across material interfaces according to surface charge and current. Keep the field symbols straight: E and H are field intensities; D and B are flux densities. Signs in Faraday's law encode Lenz's law and the opposition to the change that produced the induced effect.</p>`},

  {id:'pw', name:'Plane Waves, Polarisation & Poynting Vector', body: T`<h2>1. What a plane wave is</h2>
<p>A plane electromagnetic wave has fields whose constant-phase surfaces are planes. In a uniform lossless medium, E, H and the propagation direction are mutually perpendicular for a transverse electromagnetic wave. The fields oscillate in time and vary with position according to the phase term.</p>
<div class="formula">$$v=\frac{1}{\sqrt{\mu\epsilon}},\qquad \eta=\sqrt{\frac{\mu}{\epsilon}},\qquad \frac{|E|}{|H|}=\eta$$</div>
<p>v is wave speed and η is intrinsic wave impedance. In free space, η₀≈377 Ω. The ratio E/H is not a resistor connected between field lines; it is a property of the travelling wave.</p>
<h2>2. Polarisation</h2>
<p>Polarisation describes the direction traced by the electric-field vector at a fixed point. If it stays along one line, the wave is linearly polarised. Two perpendicular components with equal amplitudes and a ±90° phase difference produce circular polarisation; other amplitude/phase combinations generally produce elliptical polarisation.</p>
<div class="ex"><b>Example.</b> E_x=E₀cos(ωt−βz) and E_y=E₀cos(ωt−βz) are in phase and equal amplitude, so the resultant direction is fixed at 45°: linear polarisation. A 90° phase offset with equal amplitudes gives circular polarisation.</div>
<h2>3. Poynting vector and power</h2>
<div class="formula">$$\vec S=\vec E\times\vec H\quad\text{W/m}^2$$</div>
<p>The Poynting vector indicates electromagnetic power-flow direction and density. For a uniform sinusoidal plane wave, average power depends on field amplitude and impedance; distinguish peak fields from RMS fields when calculating average power.</p>
<h2>4. Common traps</h2><ul><li>Use a consistent phasor convention for phase differences.</li><li>The propagation direction follows E×H for the usual passive-medium convention.</li><li>Wave impedance depends on medium properties and can be complex in lossy media.</li><li>Polarisation is determined by relative amplitudes and phase, not by either component alone.</li></ul>
${FIGSLOT('planewave')}
<h4>Extra worked check: Poynting power density</h4>
<p>For a uniform plane wave in free space, <code>|E|/|H|≈377 Ω</code>. If the RMS electric-field magnitude is 10 V/m, then RMS magnetic-field magnitude is about <code>10/377=26.5 mA/m</code>. Average power density for RMS fields is <code>S=E_rms²/η≈100/377=0.265 W/m²</code>.</p>
<p>Peak-amplitude phasors require a factor of one half in the time-average power expression; RMS phasors do not. Mixing conventions causes a factor-of-two error.</p>
`},

  {id:'refl', name:'Reflection, Transmission & Wave Impedance', body: T`<h2>1. What happens at an interface?</h2>
<p>When a wave meets a boundary between two media, part may reflect and part may transmit. The amounts depend on wave impedances, incidence angle, polarisation and material loss. At normal incidence, the electric-field reflection coefficient is a signed ratio; the sign tells whether the reflected electric field undergoes a 180° phase reversal.</p>
<div class="formula">$$\Gamma=\frac{\eta_2-\eta_1}{\eta_2+\eta_1},\qquad \tau_E=1+\Gamma=\frac{2\eta_2}{\eta_1+\eta_2}$$</div>
<p>These expressions assume normal incidence for uniform plane waves. A reflected power fraction is |Γ|² for the usual same-reference power comparison; transmitted power must account for the different impedances.</p>
<div class="ex"><b>Worked example.</b> A wave travels from free space (η₁≈377 Ω) into a medium with η₂=188.5 Ω. Γ=(188.5−377)/(188.5+377)=−1/3. The negative sign indicates phase reversal; reflected power fraction is 1/9≈11.1%.</div>
<h2>2. Standing waves and impedance</h2>
<p>Incident and reflected waves interfere, producing spatial maxima and minima. A perfect match gives Γ=0 and no reflected wave. A perfect electric conductor has Γ≈−1 for tangential electric field at normal incidence, so the total tangential E is zero at the surface.</p>
<h2>3. Oblique incidence</h2>
<p>For oblique incidence, Snell's law relates angles and refractive indices. Reflection depends on TE (perpendicular) and TM (parallel) polarisation; the Fresnel coefficients differ. TM reflection can vanish at the Brewster angle for suitable lossless nonmagnetic media.</p>
<h2>4. Common traps</h2><ul><li>Field reflection coefficient is not the same as reflected power percentage.</li><li>The sign of Γ contains phase information.</li><li>Use the appropriate polarisation coefficient for oblique incidence.</li><li>Do not use normal-incidence formulas for oblique geometry.</li></ul>
${FIGSLOT('refl')}
<h4>Extra worked check: transmitted field</h4>
<p>At normal incidence, tangential electric-field continuity gives <code>E_t=E_i+E_r=E_i(1+Γ)</code>. If <code>Γ=−1/3</code>, then <code>E_t=(2/3)E_i</code>. For lossless media, transmitted power fraction must account for the different wave impedances; it is not always simply <code>|E_t/E_i|²</code>.</p>
<p>At oblique incidence, TE and TM polarizations have different Fresnel coefficients. The Brewster angle for TM polarization can make the reflected coefficient zero for suitable lossless dielectric media.</p>
`},

  {id:'tl', name:'Transmission-Line Equations & Characteristic Impedance', body: T`<h2>1. A transmission line is a distributed circuit</h2>
<p>At low frequency, wires are often treated as ideal connections. At high frequency or over long distances, voltage and current vary with position because the line stores electric and magnetic energy continuously. A transmission line is described per unit length by resistance R, inductance L, conductance G and capacitance C.</p>
<div class="formula">$$\frac{\partial V}{\partial z}=-(R+j\omega L)I,\qquad \frac{\partial I}{\partial z}=-(G+j\omega C)V$$</div>
<p>For a lossless line (R=G=0), characteristic impedance Z₀=√(L/C), phase constant β=ω√(LC), and wave velocity v=1/√(LC). Z₀ is not the line's DC resistance; it is the ratio of travelling-wave voltage to current.</p>
<h2>2. Forward and reflected waves</h2>
<div class="formula">$$V(z)=V^+e^{-\gamma z}+V^-e^{\gamma z},\qquad Z_0=\sqrt{\frac{R+j\omega L}{G+j\omega C}}$$</div>
<p>The propagation constant γ=α+jβ describes attenuation and phase. A matched load absorbs the incident wave and creates no reflection. A mismatched load sends some energy back toward the source.</p>
<div class="ex"><b>Worked example.</b> A lossless line has L=250 nH/m and C=100 pF/m. Z₀=√(250×10⁻⁹/100×10⁻¹²)=50 Ω. Wave velocity is 1/√(LC)=2×10⁸ m/s.</div>
<h2>3. Electrical length and delay</h2>
<p>Electrical length is βl radians. A quarter-wave line has length λ/4 and can transform impedance; a half-wave line repeats the load impedance at its input for an ideal lossless line. Propagation delay is l/v and matters in fast digital interconnects.</p>
<h2>4. Common traps</h2><ul><li>Z₀ is not simply the load impedance.</li><li>Use physical length and wavelength in the line's medium, not automatically free-space wavelength.</li><li>Quarter-wave transformations assume the design frequency and ideal/lossless conditions unless losses are included.</li></ul>
${FIGSLOT('tl')}
<h4>Extra worked check: quarter-wave transformation</h4>
<p>For a lossless line of length <code>λ/4</code>, <code>βl=π/2</code>. The input impedance reduces to <code>Z_in=Z₀²/Z_L</code> for finite nonzero load impedance. Thus a 50 Ω line terminated in 100 Ω appears as 25 Ω at a quarter wavelength from the load.</p>
<p>This transformation depends on electrical length and frequency. A physical line is λg/4 at one design frequency, not necessarily at all frequencies.</p>
`},

  {id:'vswr', name:'Reflection Coefficient, VSWR & Matching', body: T`<h2>1. Reflection coefficient</h2>
<p>The load reflection coefficient measures the reflected voltage wave relative to the incident wave. It is determined by load impedance Z_L and characteristic impedance Z₀.</p>
<div class="formula">$$\Gamma_L=\frac{Z_L-Z_0}{Z_L+Z_0},\qquad VSWR=\frac{1+|\Gamma|}{1-|\Gamma|}$$</div>
<p>If Z_L=Z₀, Γ=0 and VSWR=1, the best possible match. As |Γ| approaches 1, VSWR becomes very large. For a passive load, 0≤|Γ|≤1; an active load can behave differently.</p>
<div class="ex"><b>Worked example.</b> If |Γ|=0.2, VSWR=1.2/0.8=1.5. Reflected power fraction is |Γ|²=0.04, or 4%.</div>
<h2>2. Input impedance</h2>
<p>For a lossless line of length l, input impedance varies with electrical length. An open or short at the load can look like a different impedance at the input. At λ/4, an impedance inverter gives Z_in=Z₀²/Z_L; at λ/2, the input repeats the load impedance.</p>
<h2>3. Matching purpose</h2>
<p>Impedance matching reduces reflections and maximises power transfer for the specified source/load conditions. Methods include quarter-wave transformers, single or double stubs, and lumped L-networks at lower frequencies.</p>
<h2>4. Common traps</h2><ul><li>VSWR uses the magnitude of Γ, not signed Γ.</li><li>Reflected power fraction is |Γ|², not |Γ|.</li><li>A purely reactive mismatch can reflect power even though it consumes no average power itself.</li><li>Matching is frequency-dependent; a match at one frequency may not hold across a wide band.</li></ul>
${FIGSLOT('vswr')}
<h4>Extra worked check: mismatch loss</h4>
<p>If <code>|Γ|=0.2</code>, reflected power fraction is <code>|Γ|²=0.04</code>, so 4% of incident power is reflected. The mismatch loss is <code>−10log₁₀(1−0.04)≈0.177 dB</code>. VSWR is <code>(1.2)/(0.8)=1.5</code>.</p>
<p>Return loss, VSWR and mismatch loss all describe matching, but their numeric values are not interchangeable. State which one the question asks for.</p>
`},

  {id:'smith', name:'Smith Chart Fundamentals', body: T`<h2>1. What the Smith chart represents</h2>
<p>The Smith chart is a graphical map between normalised impedance and reflection coefficient. It helps visualise how impedance changes along a transmission line and how to choose matching components. Normalise load impedance by Z₀: z_L=Z_L/Z₀.</p>
<div class="formula">$$\Gamma=\frac{z-1}{z+1},\qquad z=\frac{1+\Gamma}{1-\Gamma}$$</div>
<p>Constant-resistance circles and constant-reactance arcs form the familiar chart. The centre is z=1, a perfect match; the outer circle corresponds to |Γ|=1, total reflection. The upper half represents positive reactance and the lower half negative reactance under the usual impedance chart convention.</p>
<h2>2. Moving along a line</h2>
<p>For a lossless line, moving toward the generator rotates Γ around the chart at constant magnitude. Impedance changes but VSWR remains constant. A quarter wavelength corresponds to a half-turn in reflection-coefficient phase, while a half wavelength makes the impedance repeat.</p>
<div class="ex"><b>Worked approach.</b> Given Z_L=25+j25 Ω and Z₀=50 Ω, first normalise to z_L=0.5+j0.5. Plot the point, then read the corresponding Γ or VSWR. Normalisation is essential; do not plot ohms directly on a normalised chart.</div>
<h2>3. Matching workflow</h2>
<ol><li>Compute and normalise Z_L.</li><li>Plot the load point and read |Γ|/VSWR if needed.</li><li>Move toward generator to a point with a convenient resistance or conductance.</li><li>Add a series or shunt reactance/stub to cancel the remaining imaginary component.</li><li>Check the result analytically if precision matters.</li></ol>
<h2>4. Common traps</h2><ul><li>Impedance and admittance charts use different plotting interpretations.</li><li>Moving toward generator and toward load rotate in opposite directions.</li><li>Chart readings are approximate; verify calculations for exam precision.</li></ul>
${FIGSLOT('smith')}
<h4>Extra worked check: move along a line</h4>
<p>On a lossless line, moving along the line changes the phase of the reflection coefficient but not its magnitude. Therefore, VSWR remains constant along the line even though input impedance changes. Lossy lines reduce the magnitude of Γ as the observation point moves away from the load toward the generator.</p>
<p>Normalize impedance before using a standard Smith chart: divide the complex load impedance by the chart's reference impedance. Convert back by multiplying the normalized result by the reference impedance.</p>
`},

  {id:'wg', name:'Waveguides, Modes & Cutoff', body: T`<h2>1. Why waveguides have cutoff</h2>
<p>A hollow conducting waveguide confines fields and supports particular field patterns called modes. Unlike a two-conductor TEM line, a hollow single-conductor waveguide has no TEM mode in the usual uniform hollow-waveguide model. Each TE or TM mode has a cutoff frequency below which it does not propagate as a travelling wave.</p>
<div class="formula">$$f_{c,mn}=\frac{c}{2\sqrt{\epsilon_r}}\sqrt{\left(\frac{m}{a}\right)^2+\left(\frac{n}{b}\right)^2}\quad\text{(rectangular guide, ideal fill)}$$</div>
<p>a and b are the broad and narrow dimensions. For the dominant TE₁₀ mode, f_c=c/(2a√ε_r). Above cutoff, propagation constant is real in a lossless guide; below cutoff, fields decay evanescently.</p>
<div class="ex"><b>Worked example.</b> An air-filled rectangular guide has broad dimension a=3 cm. TE₁₀ cutoff is about 3×10⁸/(2×0.03)=5 GHz. To propagate in this mode, operating frequency must exceed 5 GHz, and practical single-mode operation also stays below the next-mode cutoff.</div>
<h2>2. Guide wavelength and dispersion</h2>
<div class="formula">$$\lambda_g=\frac{\lambda}{\sqrt{1-(f_c/f)^2}},\qquad v_p=\frac{v}{\sqrt{1-(f_c/f)^2}}$$</div>
<p>As f approaches cutoff from above, guide wavelength and phase velocity become very large in the ideal model. Group velocity changes oppositely, and their product equals v² for the simple lossless waveguide relation.</p>
<h2>3. TE and TM modes</h2>
<p>TE means the electric field has no longitudinal component; TM means the magnetic field has no longitudinal component. The mode indices describe field variation across the guide. Higher modes have higher cutoff frequencies and can cause unwanted field patterns if the operating frequency is too high.</p>
<h2>4. Common traps</h2><ul><li>Use the broad dimension for TE₁₀ cutoff in a rectangular guide.</li><li>Free-space wavelength and guide wavelength are not the same.</li><li>Below cutoff, a mode is evanescent, not a normal travelling wave.</li><li>State the dielectric filling when calculating cutoff.</li></ul>
${FIGSLOT('wg')}
<h4>Extra worked check: propagation constant</h4>
<p>Above cutoff, the guide propagation constant is <code>β=(2π/λ₀)√(1−(f_c/f)²)</code>. As operating frequency approaches cutoff from above, β approaches zero and guide wavelength <code>λ_g=2π/β</code> becomes very large.</p>
<p>Cutoff is mode-specific. The dominant mode is the mode with the lowest cutoff for the specified guide geometry; do not assume every TE or TM mode shares the same cutoff.</p>
`},

  {id:'cav', name:'Cavity Resonators & Quality Factor', body: T`<h2>1. A cavity stores electromagnetic energy</h2>
<p>A cavity resonator confines electromagnetic fields inside a conducting enclosure. At certain resonant frequencies, the field pattern satisfies the boundary conditions and energy alternates between electric and magnetic storage. Conductors and dielectrics dissipate some energy, so practical resonance has a finite bandwidth.</p>
<div class="formula">$$Q=2\pi\frac{\text{energy stored}}{\text{energy dissipated per cycle}}\approx\frac{f_0}{BW_{3dB}}$$</div>
<p>High Q means low fractional bandwidth and low loss. The bandwidth relation is approximate for a lightly damped single resonance.</p>
<div class="ex"><b>Worked example.</b> A resonator has f₀=10 GHz and 3 dB bandwidth 10 MHz. Q≈10,000 MHz/10 MHz=1000. A higher Q gives sharper frequency selectivity but slower energy build-up/decay.</div>
<h2>2. Resonant modes</h2>
<p>Different field patterns have different resonant frequencies. The allowed patterns depend on cavity dimensions, shape, material permittivity/permeability and boundary conditions. A rectangular cavity's modes can be derived by enforcing tangential electric field zero at conducting walls.</p>
<h2>3. Loaded and unloaded Q</h2>
<p>Unloaded Q accounts for internal losses. Loaded Q also includes energy coupled out to external circuits, so it is usually lower. Coupling strength changes loaded Q and bandwidth; this matters in filters, oscillators and microwave measurement systems.</p>
<h2>4. Common traps</h2><ul><li>Q is dimensionless.</li><li>Use consistent frequency units in f₀/BW.</li><li>Higher Q means narrower bandwidth, not broader bandwidth.</li><li>Do not confuse resonant frequency with cutoff frequency of a waveguide.</li></ul>
${FIGSLOT('cavity')}
<h4>Extra worked check: stored energy and loss</h4>
<p>Quality factor is <code>Q=ω₀W/P_loss</code>, where W is average stored energy and <code>P_loss</code> is average dissipated power. At a fixed resonant frequency, reducing loss raises Q and narrows the resonance bandwidth. External coupling adds another loss path and lowers loaded Q.</p>
<p>High Q is useful for selective filters and stable resonators, but narrow bandwidth can be undesirable for broadband communication links.</p>
`},

  {id:'sp', name:'Scattering Parameters & Microwave Measurements', body: T`<h2>1. Why S-parameters are used</h2>
<p>At microwave frequencies, measuring open-circuit voltage and short-circuit current is difficult because fixtures and probes alter the circuit. Scattering parameters describe incident and reflected travelling waves at defined ports with reference impedances. They are especially useful when power waves are easier to measure than internal voltages and currents.</p>
<ul><li><b>S₁₁:</b> input reflection coefficient when other ports are terminated in the reference impedance.</li><li><b>S₂₁:</b> forward transmission from port 1 to port 2.</li><li><b>S₁₂:</b> reverse transmission from port 2 to port 1.</li><li><b>S₂₂:</b> output reflection coefficient with the other port matched.</li></ul>
<div class="formula">$$S_{11}=\frac{b_1}{a_1}\Big|_{a_2=0},\qquad S_{21}=\frac{b_2}{a_1}\Big|_{a_2=0}$$</div>
<p>a_i is an incident wave and b_i is an outgoing wave. The condition a₂=0 means port 2 is matched so no wave is incident from that port.</p>
<div class="ex"><b>Worked example.</b> If |S₁₁|=0.1, the reflected power fraction at port 1 is approximately 0.01, or 1%, under the matched-reference conditions. Return loss is −20log₁₀|S₁₁|=20 dB.</div>
<h2>2. Network properties</h2>
<p>A reciprocal network has S₁₂=S₂₁ under the same reference conditions. A lossless network has a unitary S matrix. An ideal matched port has reflection coefficient zero. Insertion loss is often reported as a positive loss number, whereas S₂₁ in dB is often negative for a passive lossy device; watch the convention.</p>
<h2>3. Measurement workflow</h2>
<p>A vector network analyser uses calibration standards to move the measurement reference plane and correct systematic errors. Cable movement, poor connector torque, calibration drift and incorrect reference impedance can corrupt results.</p>
<h2>4. Common traps</h2><ul><li>S₁₁ is not simply the impedance; it is related to impedance through the reference impedance.</li><li>Use magnitude squared for reflected power fraction.</li><li>State port termination conditions.</li><li>Do not interpret S₂₁ as a voltage gain without checking the power-wave and impedance conventions.</li></ul>
<h4>Extra worked check: S-parameter dB</h4>
<p>If a matched two-port has <code>|S₂₁|=0.5</code>, the transmitted power ratio is approximately <code>|S₂₁|²=0.25</code>, corresponding to <code>10log₁₀(0.25)=−6.02 dB</code>. The voltage-wave amplitude ratio and power ratio use different logarithmic factors.</p>
<p>For a passive lossless network with matched reference impedances, power is conserved across reflected and transmitted waves. Real devices may dissipate power internally.</p>
`},

  {id:'match', name:'Impedance Matching & Microwave Networks', body: T`<h2>1. What matching achieves</h2>
<p>Impedance matching reduces reflected power on a transmission line and can maximise power delivered under specified source and load conditions. At RF, even a short wire can have significant inductance and capacitance, so matching networks are designed using complex impedances rather than only resistance.</p>
<h2>2. Quarter-wave transformer</h2>
<div class="formula">$$Z_{in}=\frac{Z_t^2}{Z_L}\quad\text{for a lossless }\lambda/4\text{ section},\qquad Z_t=\sqrt{Z_0Z_L}$$</div>
<p>For real positive Z₀ and Z_L, a quarter-wave transformer with Z_t=√(Z₀Z_L) transforms the load to Z₀ at the design frequency. It is narrowband because the electrical length changes with frequency.</p>
<div class="ex"><b>Worked example.</b> To match 50 Ω to 100 Ω, choose Z_t=√(50×100)=70.7 Ω. A quarter-wave section of that impedance transforms the 100 Ω load to 50 Ω at its design frequency.</div>
<h2>3. Lumped and stub matching</h2>
<p>At lower frequencies, L and C components can cancel the reactive part of a load and transform resistance. Single-stub matching uses a line section plus a short/open stub. A shunt stub is easiest to analyse with admittance; a series stub is often analysed with impedance. Component parasitics and finite Q limit real performance.</p>
<h2>4. Design checks</h2><ul><li>Matching depends on frequency and the reference impedance.</li><li>Quarter-wave transformer formulas assume a lossless line and real positive impedances.</li><li>Choose a component topology that can realise the required reactance at the operating frequency.</li><li>Check bandwidth, power handling and component Q, not only the ideal match.</li></ul>
<h4>Extra worked check: quarter-wave matching</h4>
<p>To match a 50 Ω feed to a 100 Ω real load, choose <code>Z_t=√(50×100)≈70.7 Ω</code> and a quarter-guide-wavelength section at the design frequency. The input impedance is <code>Z_t²/Z_L≈50 Ω</code>.</p>
<p>A single quarter-wave section is narrowband and assumes a real load at the design plane. For complex impedances, use a stub or another matching network to cancel reactance before applying the real-resistance transformer formula.</p>
`},

  {id:'tubes', name:'Microwave Tubes — Klystron, Magnetron, TWT, Gunn', body: T`<h2>1. Why microwave devices are different</h2>
<p>At microwave frequencies, transit time and parasitic capacitance/inductance can make ordinary lumped-device behaviour inadequate. Some high-power microwave sources use electron beams interacting with RF fields in resonant cavities or slow-wave structures.</p>
<h2>2. Klystron, magnetron and travelling-wave tube</h2>
<ul><li><b>Klystron:</b> velocity modulation bunches an electron beam; bunches transfer energy to a cavity field. Reflex klystrons can act as oscillators; multi-cavity klystrons commonly amplify.</li><li><b>Magnetron:</b> crossed electric and magnetic fields produce electron motion that transfers energy to resonant cavity modes; it is a high-power oscillator.</li><li><b>TWT:</b> an electron beam interacts with an RF wave along a slow-wave structure, allowing broadband amplification.</li></ul>
<p>These devices are not interchangeable: cavity-based klystrons offer high gain and power, magnetrons are efficient oscillators, and TWTs are valued for wide bandwidth.</p>
<h2>3. Gunn diode</h2>
<p>A Gunn device uses transferred-electron effects in certain semiconductors. Above a threshold field, electrons transfer to a higher-energy valley with lower mobility, producing negative differential resistance over a region of its current-voltage characteristic. This can sustain microwave oscillation in a suitable resonator.</p>
<div class="ex"><b>Concept check.</b> Negative differential resistance means current decreases as voltage increases over a particular operating region; it does not mean the device's resistance is negative at every voltage or that its static power must be negative.</div>
<h2>4. Common traps</h2><ul><li>Distinguish an oscillator from an amplifier.</li><li>Gunn oscillation does not rely on a PN junction in the usual diode sense.</li><li>Device choice depends on frequency, output power, bandwidth, efficiency and noise.</li></ul>
<h4>Extra worked check: device roles</h4>
<p>Klystrons and TWTs amplify by exchanging energy between electron beams and RF fields, but their interaction structures differ. Magnetrons generate oscillation using resonant cavities and crossed fields. Gunn devices use a semiconductor negative-resistance effect rather than a vacuum electron beam.</p>
<p>When comparing devices, list whether the task is generation or amplification, required bandwidth, continuous-wave or pulsed power, efficiency, and operating frequency.</p>
`},

  {id:'ss', name:'PIN, Varactor, Tunnel Diode & HEMT', body: T`<h2>1. Microwave semiconductor devices</h2>
<p>Different semiconductor structures are designed to control capacitance, breakdown, carrier transit and high-frequency gain. Their labels describe distinct physical mechanisms, so learn the device structure and operating principle rather than treating all microwave diodes as equivalent.</p>
<ul><li><b>PIN diode:</b> a wide intrinsic region between p and n regions; at RF it can act as a current-controlled resistor or switch because stored charge changes its RF resistance.</li><li><b>Varactor diode:</b> reverse bias changes depletion width and junction capacitance; used for electronic tuning and frequency control.</li><li><b>Tunnel diode:</b> heavy doping enables quantum tunnelling and a negative differential-resistance region.</li><li><b>HEMT:</b> a high-electron-mobility transistor uses a heterostructure to form a high-mobility carrier channel, useful at high frequency and low noise.</li></ul>
<div class="formula">$$C_j\approx\frac{\epsilon A}{W_d}$$</div>
<p>For a reverse-biased junction, depletion width W_d grows with reverse bias, so junction capacitance falls. The exact voltage law depends on junction profile.</p>
<div class="ex"><b>Worked reasoning.</b> Increase reverse bias on a varactor: depletion width increases, capacitance decreases, and an LC resonant frequency f₀=1/(2π√LC) increases if the other components stay fixed.</div>
<h2>2. Device selection</h2>
<p>PIN diodes suit RF switching/attenuation; varactors suit tuning; tunnel diodes can support oscillation or fast switching in specialised circuits; HEMTs provide high-frequency gain with low noise when properly biased.</p>
<h2>3. Common traps</h2><ul><li>Reverse bias usually reduces a PN junction's capacitance.</li><li>Negative differential resistance is a region of the I–V curve, not a universal property across all operating points.</li><li>High mobility helps high-frequency performance but does not alone determine noise or gain.</li></ul>
<h4>Extra worked check: negative differential resistance</h4>
<p>Negative differential resistance means a region where increasing voltage causes current to decrease, so <code>dI/dV&lt;0</code>. This can support oscillation when combined with a suitable resonator and bias network. It does not mean the device has negative absolute resistance at every operating point.</p>
<p>Varactor capacitance is commonly used in tuning networks; PIN diodes are common RF switches/attenuators. Check reverse-bias limits, RF power handling and package parasitics.</p>
`},

  {id:'osc', name:'Microwave Oscillators, Mixers & Detectors', body: T`<h2>1. Microwave oscillators</h2>
<p>An oscillator converts DC power into a periodic RF signal. A resonator selects frequency, while an active device supplies energy to replace losses. Start-up requires sufficient loop gain; nonlinear behaviour limits the amplitude after oscillation grows.</p>
<h2>2. Mixers</h2>
<p>A mixer is a nonlinear circuit that combines two signals and produces sum and difference frequencies. With input frequencies f_RF and f_LO, common products occur at f_RF±f_LO, along with harmonics and other spurious products. A filter selects the desired product, often the intermediate frequency.</p>
<div class="formula">$$f_{IF}=|f_{RF}-f_{LO}|$$</div>
<div class="ex"><b>Worked example.</b> A 9.5 GHz RF input mixed with a 10.0 GHz LO gives a 0.5 GHz difference component and a 19.5 GHz sum component. The IF filter selects the 500 MHz component in a conventional down-converter.</div>
<h2>3. Detectors</h2>
<p>Power detectors convert RF energy into a measurable voltage or current. Diode detectors are simple and can be square-law at low input levels; logarithmic detectors provide an output related to input power over a wider dynamic range. Detector response depends on frequency, matching and calibration.</p>
<h2>4. Common traps</h2><ul><li>A mixer creates multiple products; it does not output only the desired IF automatically.</li><li>Image-frequency rejection is a filtering problem before or around the mixer.</li><li>Oscillator phase noise can degrade communication and radar performance.</li><li>Distinguish RF frequency, LO frequency and IF frequency.</li></ul>
<h4>Extra worked check: image frequency</h4>
<p>A superheterodyne receiver mixes RF with a local oscillator to produce an intermediate frequency. Because both a higher-side and lower-side input can produce the same difference frequency, an image-frequency signal may also convert to the IF. The RF preselector rejects this unwanted signal before mixing.</p>
<p>For high-side injection, <code>f_LO=f_RF+f_IF</code> and the image is typically <code>f_image=f_RF+2f_IF</code>. For low-side injection, the image lies on the opposite side; derive it from the absolute difference equation.</p>
`},

  {id:'radar', name:'Radar Basics & Microwave Applications', body: T`<h2>1. Radar measures by transmitting and listening</h2>
<p>Radar transmits electromagnetic energy and analyses echoes. The delay estimates range; Doppler shift estimates radial velocity; antenna direction or array processing estimates angle. Performance depends on transmitted energy, antenna gain, target radar cross-section, propagation loss, receiver noise and processing.</p>
<div class="formula">$$R=\frac{c\Delta t}{2},\qquad f_D=\frac{2v_r}{\lambda}\quad\text{(monostatic radar, sign convention dependent)}$$</div>
<p>The factor of two appears because the wave travels to the target and back. Doppler sign depends on whether approaching or receding velocity is defined positive.</p>
<div class="ex"><b>Worked example.</b> An echo returns after 20 μs. Range is R≈(3×10⁸×20×10⁻⁶)/2=3000 m. The round-trip delay, not one-way delay, is measured.</div>
<h2>2. Range resolution and waveform choice</h2>
<p>For a pulse-compression radar with effective signal bandwidth B, ideal range resolution is approximately ΔR=c/(2B). Wider bandwidth distinguishes targets closer together in range. Pulse repetition frequency affects unambiguous range and Doppler sampling, creating a design trade-off.</p>
<h2>3. Radar equation intuition</h2>
<p>Received echo power falls steeply with range because energy spreads on the outward and return paths. Antenna gain, transmitted power, wavelength and target radar cross-section influence the return. The radar equation is commonly used for a point target in a specified propagation model; clutter, multipath and detection thresholds modify practical performance.</p>
<h2>4. Common traps</h2><ul><li>Range uses round-trip delay and includes a factor of 1/2.</li><li>Range resolution depends on bandwidth, not simply pulse repetition frequency.</li><li>Doppler measures radial motion, not full tangential velocity.</li><li>State the radar geometry and sign convention when interpreting Doppler.</li></ul>
${FIGSLOT('radar')}
<h4>Extra worked check: round-trip timing</h4>
<p>Radar range follows <code>R=ct/2</code> because the measured time t includes travel to the target and back. An echo delay of 20 μs corresponds to <code>R≈(3×10⁸)(20×10⁻⁶)/2=3000 m</code>.</p>
<p>Range resolution depends on pulse width or effective waveform bandwidth; detection range depends on transmitted energy, antenna gain, target radar cross-section, losses and receiver noise.</p>
`}
  ]
},

/* ============================================================ 9 DEVICES */
{
  id:'dev', name:'Electronic Devices and Circuits', icon:'▣',
  topics:[
  {id:'pn', name:'PN Junctions, Breakdown & Diode Models', body: T`<h2>1. Begin with the junction</h2>
<p>A semiconductor such as silicon can be made <b>p-type</b> by adding acceptor atoms and <b>n-type</b> by adding donor atoms. Joining the two creates a PN junction. Electrons diffuse from the n-side to the p-side and holes diffuse the opposite way. They recombine near the boundary, leaving fixed charged ions. This region has few mobile carriers, so it is called the <b>depletion region</b>.</p>
${FIGSLOT('pn')}
<p>The fixed ions create an electric field and a built-in potential barrier. At equilibrium, diffusion and drift balance; the junction does not continuously create a net current.</p>
<h2>2. Forward and reverse bias</h2>
