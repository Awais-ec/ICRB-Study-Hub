<p><b>Forward bias</b> means the p-side is at a higher potential than the n-side. It reduces the barrier and narrows depletion, allowing substantial current. <b>Reverse bias</b> raises the barrier and widens depletion; only a small minority-carrier leakage current flows until breakdown.</p>
<div class="formula">$$I_D=I_S\left(e^{V_D/(nV_T)}-1\right),\qquad V_T=\frac{kT}{q}\approx25.9\text{ mV at }300\text{ K}$$</div>
<p>Here I_S is the tiny reverse saturation current, n is the ideality factor (often between 1 and 2), and V_T is thermal voltage. Because voltage appears in an exponential, a small increase in forward voltage can produce a large current increase.</p>
<h2>3. Depletion width and capacitance</h2>
<div class="formula">$$V_{bi}=V_T\ln\!\left(\frac{N_A N_D}{n_i^2}\right),\quad W\approx\sqrt{\frac{2\epsilon_s}{q}\left(\frac1{N_A}+\frac1{N_D}\right)(V_{bi}-V_A)}$$</div>
<p>N_A and N_D are doping concentrations, n_i is intrinsic carrier concentration, and V_A is positive for forward bias under this convention. More reverse bias widens W. The depletion region behaves like a capacitor because opposite charges are separated by a distance:</p>
<div class="formula">$$C_j=\frac{\epsilon_s A}{W}\approx\frac{C_{j0}}{(1+V_R/V_{bi})^m}$$</div>
<p>The exponent m depends on junction grading; common ideal values are about 1/2 for an abrupt junction and 1/3 for a linearly graded junction.</p>
<h2>4. Breakdown and practical models</h2>
<ul><li><b>Zener breakdown:</b> strong electric field in a heavily doped, thin junction permits tunnelling; it is common at lower breakdown voltages.</li><li><b>Avalanche breakdown:</b> carriers gain energy and create more carriers by impact ionisation; it is common in more lightly doped junctions at higher voltages.</li><li><b>Ideal model:</b> ON is a short circuit and OFF is an open circuit.</li><li><b>Constant-drop model:</b> use about 0.7 V for a silicon diode as an approximation, not a universal physical constant.</li><li><b>Small-signal model:</b> around a chosen DC operating current, r_d≈nV_T/I_D.</li></ul>
<div class="ex"><b>Worked example.</b> At room temperature, if I_D=1 mA and n=1, r_d≈25.9 mV/1 mA=25.9 Ω. This is the incremental resistance for small changes around that bias point, not the ratio V_D/I_D.</div>
<div class="tip"><b>Check yourself:</b> Reverse bias generally widens depletion and reduces junction capacitance. Zener and avalanche are both breakdown mechanisms; a properly rated diode can operate there, but ordinary forward-junction assumptions no longer apply.</div>
<h4>Diode current and temperature</h4>
<p>The ideal diode equation is <code>I_D=I_S(e^(V_D/(nV_T))−1)</code>, where <code>V_T≈25.9 mV</code> near room temperature and n is the ideality factor. Because current depends exponentially on voltage, a small forward-voltage change can cause a large current change. The 0.7 V silicon-drop model is a convenient circuit approximation, not a universal fixed voltage.</p>
<p>Reverse breakdown is not automatically destructive if the device is designed for avalanche/Zener operation and current is limited. Always check power dissipation, maximum reverse voltage and temperature derating.</p>
`},

  {id:'fet', name:'JFET & MOSFET Characteristics', body: T`<h2>1. Why use a field-effect transistor?</h2>
<p>A FET controls current through a channel using an electric field. Unlike a BJT, whose collector current is strongly controlled by base current, a MOSFET ideally draws almost no steady-state gate current because its gate is insulated. Real devices still have leakage and require current to charge and discharge gate capacitance.</p>
<h2>2. JFET basics</h2>
<p>A JFET has a semiconductor channel whose width is controlled by a reverse-biased gate-channel PN junction. Increasing the magnitude of gate reverse bias widens depletion regions and narrows the channel. For an n-channel JFET, making V_GS more negative reduces I_D.</p>
<div class="formula">$$I_D=I_{DSS}\left(1-\frac{V_{GS}}{V_P}\right)^2$$</div>
<p>This Shockley relation is an approximate transfer characteristic between cutoff and pinch-off for a JFET; V_P is the signed gate-source voltage at cutoff and I_DSS is the zero-gate-bias saturation current. Check the sign convention in the problem before substituting values.</p>
<h2>3. MOSFET regions</h2>
<p>For a common enhancement nMOS, V_GS must exceed threshold V_TH to form an inversion channel. In the <b>cutoff</b> region V_GS≤V_TH and the ideal channel current is zero. In the <b>triode/linear</b> region, small V_DS makes the channel act approximately like a voltage-controlled resistor. In <b>saturation</b>, the channel pinches off near the drain and current is mainly controlled by overdrive V_OV=V_GS−V_TH.</p>
<div class="formula">$$I_D\approx\mu_n C_{ox}\frac WL\left[(V_{GS}-V_{TH})V_{DS}-\frac{V_{DS}^2}{2}\right]\quad(\text{triode})$$
$$I_D\approx\frac12\mu_n C_{ox}\frac WL(V_{GS}-V_{TH})^2\quad(\text{saturation, ideal})$$</div>
<p>These long-channel equations ignore effects such as channel-length modulation, mobility degradation and subthreshold conduction. With channel-length modulation, saturation current rises slightly with V_DS.</p>
<h2>4. Read characteristic curves</h2>
<ul><li>The <b>output curve</b> plots I_D against V_DS for several fixed V_GS values.</li><li>The <b>transfer curve</b> plots I_D against V_GS.</li><li>Transconductance is g_m=∂I_D/∂V_GS at fixed V_DS; it tells how strongly the gate controls drain current.</li><li>Input resistance is high, but not infinite in real devices; ESD protection and gate leakage matter.</li></ul>
<div class="ex"><b>Example.</b> If V_TH=2 V and V_GS=3 V, the overdrive is 1 V. For an ideal long-channel MOSFET in saturation, doubling W/L doubles I_D at the same overdrive.</div>
<div class="tip"><b>Exam trap:</b> “Saturation” means different things in a BJT and MOSFET. A saturated BJT is strongly ON; a MOSFET in saturation is often the desired amplifier region.</div>
<h4>MOSFET region check</h4>
<p>For an enhancement NMOS, the channel begins to form when <code>V_GS&gt;V_TH</code>. In the long-channel model, the triode region has <code>V_DS&lt;V_GS−V_TH</code>; saturation has <code>V_DS≥V_GS−V_TH</code>. In saturation, ignoring channel-length modulation, <code>I_D≈(1/2)k_n(V_GS−V_TH)²</code>, where <code>k_n=μ_nC_ox(W/L)</code>.</p>
<p>“Saturation” means current is relatively insensitive to V_DS in this ideal model; it does not mean the MOSFET is fully on as a switch. A low-resistance switch is normally designed in the ohmic/triode region.</p>
`},

  {id:'moscap', name:'MOS Capacitor, Threshold Voltage & CMOS', body: T`<h2>1. The MOS structure</h2>
<p>MOS means metal–oxide–semiconductor. A gate electrode is separated from the semiconductor body by a thin insulating oxide. Applying gate voltage changes the charge at the semiconductor surface. The three ideal surface conditions are <b>accumulation</b>, <b>depletion</b> and <b>inversion</b>.</p>
<ul><li><b>Accumulation:</b> majority carriers are attracted to the surface.</li><li><b>Depletion:</b> majority carriers are pushed away, leaving fixed ionised dopants.</li><li><b>Inversion:</b> the surface carrier type becomes opposite to the bulk type; in a p-type body, a sufficiently positive gate can create an electron channel.</li></ul>
<h2>2. Oxide capacitance and threshold</h2>
<div class="formula">$$C_{ox}=\frac{\epsilon_{ox}}{t_{ox}}\quad\text{(per unit area)},\qquad V_{OV}=V_{GS}-V_{TH}$$</div>
<p>A thinner oxide gives larger capacitance per area, so the gate couples more strongly to the surface. Threshold voltage is the gate voltage at which strong inversion is conventionally established; it depends on work-function difference, oxide charge, doping and body bias.</p>
<div class="formula">$$V_{TH}(V_{SB})=V_{TH0}+\gamma\left(\sqrt{2\phi_F+V_{SB}}-\sqrt{2\phi_F}\right)$$</div>
<p>This body-effect expression is for a common nMOS convention with source-body reverse bias V_SB≥0. Increasing reverse body bias generally raises threshold magnitude.</p>
<h2>3. CMOS logic and power</h2>
<p>CMOS combines nMOS pull-down and pMOS pull-up networks. In steady logic states, ideally one network is OFF, so static power is small. During switching, both the load capacitance and internal capacitances are charged or discharged.</p>
<div class="formula">$$P_{dynamic}\approx\alpha C_L V_{DD}^2 f$$</div>
<p>Here α is switching activity, C_L is effective switched capacitance, V_DD is supply voltage and f is clock frequency. Dynamic power falls approximately with the square of supply voltage, but reducing voltage also affects speed and noise margins.</p>
<div class="ex"><b>Example.</b> If supply voltage is reduced from 5 V to 2.5 V with α, C_L and f unchanged, ideal dynamic power becomes (2.5/5)²=1/4 of its original value.</div>
<div class="tip"><b>Exam trap:</b> Gate current is ideally zero in MOS analysis, but CMOS inputs are capacitive. A driver must still supply transient current to change their voltage.</div>
<h4>MOS capacitor operating regions</h4>
<p>For a p-type substrate, a sufficiently negative gate bias accumulates holes, a small positive bias depletes holes, and a sufficiently positive bias can create an inversion layer of electrons. Threshold voltage marks the conventional onset of strong inversion and depends on substrate doping, oxide capacitance, work-function difference and fixed charge.</p>
<p>In CMOS, complementary NMOS and PMOS devices enable low static power in ideal steady logic states, but dynamic power is spent charging/discharging capacitances: <code>P_dyn≈αC V_DD² f</code>, where α is switching activity.</p>
`},

  {id:'bias', name:'Biasing, Load Lines & Small-Signal Analysis', body: T`<h2>1. Why bias an amplifier?</h2>
<p>A transistor is nonlinear. To amplify a small AC signal without severe distortion, we first choose a steady DC operating point called the <b>Q-point</b>. The input signal then causes small excursions around that point. Poor bias can force the device into cutoff or saturation during part of the waveform, clipping the output.</p>
<h2>2. Load-line method</h2>
<p>For a common-emitter BJT with collector resistor R_C and supply V_CC, Kirchhoff’s voltage law gives:</p>
<div class="formula">$$V_{CE}=V_{CC}-I_C R_C$$</div>
<p>This is the DC load line. Its intercepts are I_C=0, V_CE=V_CC and V_CE=0, I_C=V_CC/R_C. The transistor output characteristic selects the actual Q-point where the load line intersects the curve for the chosen base drive.</p>
<h2>3. Common bias circuits</h2>
<ul><li><b>Fixed bias:</b> simple but Q-point depends strongly on β and temperature.</li><li><b>Collector-to-base feedback bias:</b> rising I_C lowers collector voltage and reduces base drive, giving negative feedback.</li><li><b>Voltage-divider bias:</b> a resistor divider sets base voltage; an emitter resistor improves stability.</li></ul>
<p>For a sufficiently stiff divider, V_B≈V_CC R_2/(R_1+R_2), V_E≈V_B−V_BE, and I_E≈V_E/R_E. If β is large, I_C≈I_E. The “stiff divider” approximation is good when divider current is several times the base current.</p>
<div class="ex"><b>Worked example.</b> Let V_CC=12 V, R_1=40 kΩ, R_2=10 kΩ and R_E=1 kΩ. Then V_B≈12×10/(40+10)=2.4 V. Taking V_BE≈0.7 V gives V_E≈1.7 V and I_E≈1.7 mA. This is an estimate; a more exact solution includes base loading and R_C.</div>
<h2>4. Small-signal parameters</h2>
<div class="formula">$$g_m=\frac{I_C}{V_T},\qquad r_\pi=\frac{\beta}{g_m},\qquad r_e\approx\frac{V_T}{I_E}$$</div>
<p>At room temperature V_T≈25.9 mV. These are local, small-signal quantities at the chosen Q-point; changing the bias changes g_m and the gain.</p>
<div class="tip"><b>Exam habit:</b> Solve DC bias first, then calculate small-signal parameters, then analyse the AC equivalent circuit. Do not mix DC and AC assumptions prematurely.</div>
<h4>Load-line operating point</h4>
<p>For a common-emitter transistor with emitter grounded, the DC collector loop gives <code>V_CE=V_CC−I_C R_C</code>. With <code>V_CC=12 V</code>, <code>R_C=2 kΩ</code> and <code>I_C=2 mA</code>, the resistor drop is 4 V and <code>V_CE=8 V</code>. The Q-point should leave headroom for the intended signal swing.</p>
<p>Cutoff corresponds approximately to zero collector current; saturation occurs when the transistor can no longer sustain the active-region collector voltage. A bias circuit should be checked at supply and temperature extremes, not just at nominal β.</p>
`},

  {id:'fetamp', name:'JFET / MOSFET Amplifier Configurations', body: T`<h2>1. What a FET amplifier does</h2>
<p>A small change in gate-source voltage changes drain current. The drain resistor converts that current change into an output-voltage change. Amplification comes from energy supplied by the DC supply; the input signal controls how that energy appears at the output.</p>
<h2>2. Common-source stage</h2>
<p>The source is the common reference for input and output. A rise in V_GS raises I_D, causing a larger drop across R_D and lowering the drain voltage. Therefore the voltage gain is inverted (approximately 180° phase shift).</p>
<div class="formula">$$A_v\approx-g_m(R_D\parallel R_L\parallel r_o)$$</div>
<p>The approximation assumes a midband small-signal model and a bypassed source resistor. If R_S is not bypassed, source degeneration introduces negative feedback and reduces gain, often improving linearity.</p>
<h2>3. Common-drain and common-gate</h2>
<ul><li><b>Common drain/source follower:</b> output follows the input, gain is slightly below unity, input resistance is high and output resistance is relatively low. Useful as a buffer.</li><li><b>Common gate:</b> low input resistance, current gain near unity, useful for wideband stages and impedance matching; voltage gain can be high.</li><li><b>Common source:</b> high voltage gain with phase inversion; widely used as a voltage amplifier.</li></ul>
<h2>4. Worked gain estimate</h2>
<div class="ex"><b>Example.</b> If g_m=4 mS and the total small-signal drain load is 2 kΩ, A_v≈−0.004×2000=−8. The minus sign means inversion. If an unbypassed source resistor causes degeneration, the actual magnitude is smaller.</div>
<h2>5. Input and output limits</h2>
<p>The Q-point must leave enough voltage headroom for the output to swing without cutoff or leaving the desired MOSFET region. Coupling capacitors block DC between stages; bypass capacitors can increase AC gain while leaving DC bias unchanged. At low frequency, these capacitors are not ideal shorts; at high frequency, device capacitances reduce gain.</p>
<div class="tip"><b>Exam trap:</b> A high input resistance does not guarantee high voltage gain. Gain depends on transconductance and the effective load.</div>
<h4>Common-source gain estimate</h4>
<p>A common-source MOSFET amplifier in midband has approximate gain <code>A_v≈−g_m(R_D∥R_L)</code> when source degeneration and output resistance are neglected. If <code>g_m=5 mS</code> and <code>R_D∥R_L=2 kΩ</code>, then gain is about −10. The negative sign indicates phase inversion.</p>
<p>Gate current is nearly zero in the ideal model, but input capacitances still load high-frequency signals. Bias first, verify the region of operation, then apply the small-signal model.</p>
`},

  {id:'multidev', name:'Multistage Amplifiers & Frequency Response', body: T`<h2>1. Why cascade stages?</h2>
<p>One stage may not provide enough gain or drive capability. Cascading means feeding one stage’s output into the next stage’s input. In an ideal unloaded chain, gains multiply; in real circuits, each stage loads the preceding stage.</p>
<div class="formula">$$A_{v,total}=A_{v1}A_{v2}\cdots A_{vn},\qquad A_{v,total}(dB)=\sum_i A_{vi}(dB)$$</div>
<p>Voltage gain in decibels is 20 log₁₀|A_v|. Gains of 10 and 5 give total gain 50, or about 34 dB. If one stage inverts, the total phase must account for the number of inversions.</p>
<h2>2. Loading and coupling</h2>
<p>The input resistance of stage 2 appears as a load on stage 1, so the effective load is often R_out1 in parallel with R_in2. RC coupling capacitors pass AC but block DC, allowing each stage to have a separate bias point. Their reactance X_C=1/(2πfC) is large at low frequency and small at high frequency.</p>
<h2>3. Frequency response</h2>
<p>At midband, coupling and bypass capacitors act approximately as shorts and transistor parasitic capacitances are small. At low frequencies, external capacitors reduce gain. At high frequencies, internal capacitances and the Miller effect reduce gain.</p>
<div class="formula">$$f_c=\frac{1}{2\pi RC}\quad\text{for a single ideal RC pole}$$</div>
<p>For a single-pole low-pass response, gain falls to 1/√2≈0.707 of its passband value at cutoff, which is −3 dB. With multiple poles, corner frequencies and phase shifts interact; do not simply assume every stage’s bandwidth is unchanged after cascading.</p>
<div class="ex"><b>Example.</b> Two stages each have voltage gain −10 and −4. Overall gain is +40, because two inversions cancel. In dB, 20log₁₀(10)+20log₁₀(4)≈20+12.04=32.04 dB.</div>
<div class="tip"><b>Exam trap:</b> Gains multiply as ratios but add in decibels. A cascade’s bandwidth is generally narrower than the bandwidth of each identical stage alone.</div>
<h4>Cascaded gain and loading</h4>
<p>If two stages have gains <code>A₁=−10</code> and <code>A₂=−5</code> and loading is already included in each gain, total gain is <code>A=A₁A₂=+50</code>. Two inversions give a non-inverting overall polarity. In decibels, gains in magnitude add: <code>20log₁₀|A|=20log₁₀10+20log₁₀5≈34 dB</code>.</p>
<p>Do not multiply unloaded stage gains when the stages significantly load one another. Coupling and bypass capacitors also create low-frequency poles; device and Miller capacitances create high-frequency poles.</p>
`},

  {id:'fbdev', name:'Feedback, Oscillators & Waveform Generation', body: T`<h2>1. Feedback in one picture</h2>
<p>Feedback takes some output and returns it to the input. In <b>negative feedback</b>, the returned signal opposes the input change. This reduces sensitivity to component variation and distortion, usually at the cost of lower gain. Positive feedback reinforces changes and can cause oscillation.</p>
<div class="formula">$$A_f=\frac{A}{1+A\beta}\quad\text{(negative feedback)},\qquad A\beta=\text{loop gain}$$</div>
<p>A is open-loop gain and β is feedback factor. If |Aβ| is much larger than 1 and the system is stable, A_f≈1/β; gain is then mainly set by the feedback network.</p>
<h2>2. Four amplifier feedback topologies</h2>
<ul><li><b>Voltage-series:</b> samples output voltage and mixes a voltage in series; tends to raise input resistance and lower output resistance.</li><li><b>Voltage-shunt:</b> samples voltage and mixes current in shunt; tends to lower both input and output resistance.</li><li><b>Current-series:</b> samples output current and mixes in series; tends to raise both resistances.</li><li><b>Current-shunt:</b> samples current and mixes in shunt; tends to lower input resistance and raise output resistance.</li></ul>
<p>These trends assume the standard idealised feedback model. Identify what is sampled at the output and how the feedback is mixed at the input before choosing a topology.</p>
<h2>3. Oscillator condition</h2>
<p>An oscillator uses positive feedback and a frequency-selective network. At the oscillation frequency, the total loop phase must be 0° (or 360°) and loop-gain magnitude must be at least unity to start oscillation. In steady state, nonlinearities usually reduce effective loop gain to unity.</p>
<div class="formula">$$|A\beta|=1,\qquad \angle A\beta=2\pi k$$</div>
<p>Examples include RC phase-shift and Wien-bridge oscillators at lower frequencies, and LC Hartley/Colpitts oscillators at higher frequencies. A crystal oscillator uses the crystal’s high-Q resonance for frequency stability.</p>
<div class="ex"><b>Example.</b> If an amplifier has gain magnitude 20 and the feedback network attenuates by 1/20 at the target frequency, the loop-gain magnitude is 1. The phase condition must still be satisfied.</div>
<div class="tip"><b>Exam trap:</b> Barkhausen’s criterion is a useful steady sinusoidal oscillation condition, not a guarantee that any circuit satisfying the magnitude alone will oscillate.</div>
<h4>Oscillation condition</h4>
<p>A feedback oscillator sustains a sinusoid when loop gain has magnitude one and total loop phase is an integer multiple of 360° at the oscillation frequency, in the ideal Barkhausen description. Startup usually requires loop gain slightly greater than one; nonlinearities then limit amplitude.</p>
<p>These conditions are useful design intuition but are not, alone, a complete proof of startup or steady-state behavior. Check amplifier bandwidth, phase shift, amplitude limiting, component tolerance and loading.</p>
`},

  {id:'diffdev', name:'Differential Pairs & Current Sources', body: T`<h2>1. Differential amplification</h2>
<p>A differential amplifier responds to the difference between two input voltages and ideally rejects a voltage common to both inputs. Define v_d=v_1−v_2 and v_cm=(v_1+v_2)/2.</p>
<div class="formula">$$v_o=A_d v_d+A_{cm}v_{cm},\qquad CMRR=\left|\frac{A_d}{A_{cm}}\right|$$</div>
<p>Common-mode rejection ratio (CMRR) is often expressed in dB as 20log₁₀(CMRR). Infinite CMRR is ideal; real transistor mismatch and finite tail-source resistance make it finite.</p>
<h2>2. Long-tailed pair intuition</h2>
<p>Two matched transistors share a tail current. If one input rises relative to the other, current is steered toward one transistor and away from the other. The sum of their currents is approximately fixed, so the pair converts a differential voltage into complementary current changes.</p>
<h2>3. Current mirrors</h2>
<p>A current mirror uses a reference branch to establish a V_BE (BJT) or V_GS (MOSFET), then copies approximately the same current into another branch. For matched devices with equal geometry, I_OUT≈I_REF. In a MOS mirror, changing device width-to-length ratio scales current approximately by the same ratio in ideal saturation.</p>
<p>Accuracy is limited by transistor mismatch, finite output resistance, unequal drain/collector voltages, temperature and insufficient voltage headroom. A mirror only regulates current while its output transistor remains in the required operating region.</p>
<div class="ex"><b>Example.</b> A reference current of 100 µA feeding a mirror with output-device W/L four times the reference device ideally produces about 400 µA, provided both devices are matched and in saturation.</div>
<div class="tip"><b>Exam trap:</b> Differential gain and common-mode gain are different quantities. A circuit can have large differential gain but still be a poor differential amplifier if common-mode gain is not small.</div>
<h4>Common-mode rejection example</h4>
<p>If a differential amplifier has differential gain <code>A_d=2000</code> and common-mode gain <code>A_cm=0.2</code>, then <code>CMRR=2000/0.2=10,000</code>, or <code>20log₁₀(10,000)=80 dB</code>. High CMRR helps reject interference shared by both inputs.</p>
<p>Resistor mismatch, transistor mismatch, finite tail-source resistance and input common-mode limits degrade practical performance. A large common-mode voltage can saturate an amplifier even when the differential signal is tiny.</p>
`},

  {id:'pwrdev', name:'SCR, TRIAC, DIAC & Power Devices', body: T`<h2>1. Why power devices differ</h2>
<p>Power electronics switches must withstand large voltage and current while dissipating as little heat as possible. They are commonly operated either OFF (blocking voltage) or ON (carrying current with a relatively small drop). The control signal determines when they switch.</p>
<h2>2. SCR</h2>
<p>An SCR is a four-layer PNPN device with anode, cathode and gate. Forward anode voltage alone may leave it in forward blocking. A gate pulse can trigger conduction. Once latched, it stays ON while anode current exceeds the holding current; removing the gate signal usually does not turn it OFF. Current must fall below holding current or the device must be reverse-biased for sufficient time.</p>
<ul><li><b>Latching current:</b> minimum anode current needed immediately after triggering for the SCR to remain ON when the gate pulse is removed.</li><li><b>Holding current:</b> minimum anode current below which an already conducting SCR turns OFF. Usually latching current is greater than holding current.</li><li><b>Commutation:</b> process of turning an SCR OFF.</li></ul>
<h2>3. TRIAC and DIAC</h2>
<p>A TRIAC conducts in both directions and is useful for AC power control, such as lamp dimming. A DIAC is a bidirectional trigger device that remains off until its breakover voltage is reached, then conducts and can provide a sharp trigger pulse for a TRIAC.</p>
<h2>4. Safe operation</h2>
<p>Power devices have limits on blocking voltage, current, junction temperature, rate of voltage rise (dv/dt), rate of current rise (di/dt) and switching energy. Heat sinks, snubbers, fuses and gate-drive protection help keep operation inside the safe operating area.</p>
<div class="ex"><b>Example.</b> An SCR carries 10 A with an on-state drop of 1.5 V. Its approximate conduction loss is P≈VI=15 W, before switching and thermal effects. That heat must be removed safely.</div>
<div class="tip"><b>Exam trap:</b> A gate pulse triggers an SCR; it does not normally command turn-off. Do not confuse SCRs with fully controllable MOSFETs or IGBTs.</div>
<h4>SCR latching and holding current</h4>
<p>An SCR is triggered into conduction by a suitable gate pulse while forward-biased, then remains on after the gate signal disappears if anode current exceeds the latching/holding requirements. Latching current is the current needed immediately after triggering to stay on; holding current is the lower current below which it turns off in the usual case.</p>
<p>The gate does not normally turn off a conventional SCR. Turn-off requires anode current to fall below holding current for the required recovery interval or an appropriate commutation method. TRIACs can conduct both AC half-cycles but have quadrant and commutation limitations.</p>
`},

  {id:'sw', name:'Switching, Capacitances & Temperature Effects', body: T`<h2>1. Switching is not instantaneous</h2>
<p>Real semiconductor switches need finite time to turn on and turn off. During transitions, voltage across the device and current through it can both be significant, producing switching energy and heat. The gate or base drive must supply the charge needed to move the device between states.</p>
<h2>2. Capacitances and charge storage</h2>
<p>MOSFETs have gate-source, gate-drain and drain-source capacitances. The gate-drain capacitance produces the Miller plateau during switching. BJTs store minority-carrier charge; deep saturation can increase turn-off time. Reverse recovery in a diode occurs because stored charge must be removed before it blocks reverse voltage.</p>
<div class="formula">$$P_{cond}\approx I_{RMS}^2R_{DS(on)}\quad\text{(MOSFET resistive approximation)}$$
$$P_{sw}\approx\frac12 V_{DS}I_D(t_r+t_f)f_s$$</div>
<p>The switching-loss expression is a rough hard-switching estimate for approximately linear voltage/current transitions. Actual loss depends on waveform shape, gate resistance, diode recovery, parasitics and operating conditions.</p>
<h2>3. Temperature effects</h2>
<p>On-resistance of a power MOSFET generally rises with junction temperature. BJT saturation voltage and leakage also vary with temperature. Thermal runaway can occur when increased temperature causes more current and more heating without sufficient stabilising feedback. Check junction temperature, thermal resistance and maximum ratings.</p>
<div class="ex"><b>Example.</b> If V_DS=100 V, I_D=5 A, combined rise/fall time is 100 ns and switching frequency is 20 kHz, the simple estimate gives P_sw≈0.5×100×5×100 ns×20 kHz=5 W.</div>
<div class="tip"><b>Exam trap:</b> Lower gate resistance often speeds switching but increases peak gate current and ringing/EMI. Faster is not automatically safer.</div>
<h4>Switching loss and parasitic capacitance</h4>
<p>During a real switching transition, voltage and current overlap, creating energy loss. A rough estimate for one transition is <code>E_sw≈(1/2)V I(t_r+t_f)</code> under a simplified linear-overlap model; average switching loss is approximately <code>P_sw≈E_sw f_s</code>, with turn-on and turn-off contributions considered consistently.</p>
<p>Junction capacitances vary with voltage, and charge must be moved each cycle. Higher frequency can shrink magnetics and filters but increases switching loss and EMI. Use datasheet switching waveforms and gate-charge curves for realistic estimates.</p>
`}
  ]
},

/* ============================================================ 10 MICRO */
{
  id:'mic', name:'Microprocessors, Microcontrollers & Embedded', icon:'▤',
  topics:[
  {id:'8085', name:'8085 / 8086 Architecture', body: T`<h2>1. What is a microprocessor?</h2>
<p>A microprocessor is a CPU implemented on a chip. It fetches instructions from memory, decodes them and performs operations using registers, an arithmetic-logic unit (ALU), a control unit and buses. The 8085 is an 8-bit processor: its ALU and data bus operate on 8-bit data, while its 16-bit address bus can select 2^16=65,536 byte locations, or 64 KiB.</p>
${FIGSLOT('8085')}
<h2>2. 8085 registers and flags</h2>
<ul><li><b>A (accumulator):</b> central 8-bit register for many arithmetic and logic operations.</li><li><b>B, C, D, E, H, L:</b> general-purpose registers; pairs BC, DE and HL can hold 16-bit values. HL often acts as a memory pointer.</li><li><b>PC:</b> 16-bit program counter, normally points to the next instruction byte.</li><li><b>SP:</b> stack pointer, points into memory used for return addresses and saved data.</li><li><b>Flags:</b> Sign, Zero, Auxiliary Carry, Parity and Carry describe aspects of an ALU result.</li></ul>
<h2>3. Buses and control signals</h2>
<p>The address bus selects a location; the data bus carries the byte being read or written. In the 8085, the lower address byte and data share multiplexed pins AD0–AD7. ALE tells an external latch when to capture the low address. RD̅ and WR̅ control reads and writes, while IO/M distinguishes memory from I/O operations.</p>
<h2>4. 8086 comparison</h2>
<p>The 8086 has a 16-bit data bus and 20-bit physical address space, allowing 2^20=1 MiB. Its Bus Interface Unit and Execution Unit support instruction prefetching. A physical address is computed from segment and offset:</p>
<div class="formula">$$\text{Physical address}=16\times\text{segment}+\text{offset}$$</div>
<div class="ex"><b>Example.</b> CS=2000H and IP=0050H gives 2000H×10H+0050H=20050H. Segment values are shifted left by four bit positions, not simply added as ordinary hexadecimal numbers.</div>
<div class="tip"><b>Exam trap:</b> Address-space size comes from address-bus width: n address bits select 2^n locations. Data-bus width instead describes how much data transfers at once.</div>
<h4>Architecture and address space</h4>
<p>The 8085 is an 8-bit processor: its ALU and general-purpose data operations are 8-bit, while its 16-bit address bus can address <code>2¹⁶=65,536</code> byte locations (64 KiB). The program counter identifies the next instruction address; the stack pointer identifies the top of the stack in memory. Do not confuse data width with address width.</p>
<p>Registers B, C, D, E, H and L can be paired as BC, DE and HL for 16-bit operations. HL often acts as a memory pointer. The accumulator is central to arithmetic and many logical operations; flags record results such as zero, sign, carry and parity.</p>
`},

  {id:'addr', name:'Addressing Modes, Instruction Execution & Timing', body: T`<h2>1. What an addressing mode answers</h2>
<p>An instruction needs an operand. The <b>addressing mode</b> specifies where that operand is found or how its effective address is calculated. The instruction’s opcode says what operation to perform; the addressing mode says how to locate the data.</p>
<ul><li><b>Immediate:</b> constant is part of the instruction, e.g. MVI A,32H.</li><li><b>Register:</b> operand is in a named register, e.g. MOV A,B.</li><li><b>Direct memory:</b> instruction contains the memory address, e.g. LDA 2050H.</li><li><b>Register indirect:</b> a register pair holds the memory address, e.g. MOV A,M uses HL in 8085.</li><li><b>Implied:</b> operand is understood from the opcode, e.g. CMA complements A.</li></ul>
<h2>2. Instruction execution cycle</h2>
<p>A machine cycle is a basic bus operation such as opcode fetch, memory read, memory write or I/O read. An instruction cycle may contain several machine cycles, and each machine cycle contains T-states (clock periods). Do not assume every instruction takes the same number of clocks.</p>
<h2>3. Effective address and timing</h2>
<p>For a memory operand, first identify the addressing mode, then calculate the effective address, then determine which read/write cycles are required. Conditional branches may take different time depending on whether the condition is true. Wait states can be inserted when READY indicates that a peripheral or memory is not ready.</p>
<div class="ex"><b>Example.</b> If HL=2050H, an 8085 instruction MOV A,M reads the byte stored at memory address 2050H into A. The letter M is shorthand for the memory location pointed to by HL; it is not a separate register.</div>
<h2>4. 8086 segmented addressing</h2>
<p>8086 memory operands can use a segment register and an offset. For example, DS:1234H means physical address DS×16+1234H. Default segment choice depends on the instruction and addressing form; BP-based references commonly use SS unless overridden.</p>
<div class="tip"><b>Exam method:</b> For every instruction, identify operand source/destination, flags affected, memory accesses and cycles. Keep architecture-specific rules separate between 8085 and 8086.</div>
<h4>Instruction timing and addressing</h4>
<p>Immediate addressing places the operand in the instruction; register addressing names a register; direct addressing supplies a memory address; register-indirect addressing uses a register pair as a pointer. For example, <code>MOV A,M</code> copies the byte at the address in HL into A; the letter M means memory addressed by HL, not a physical register.</p>
<p>Machine cycles are the bus-level parts of instruction execution, while T-states are clock periods within those cycles. Instruction timing depends on the instruction and whether memory or I/O cycles are needed. When calculating execution time, multiply total T-states by the clock period, not by the clock frequency.</p>
`},

  {id:'asm', name:'Assembly-Language Fundamentals', body: T`<h2>1. Assembly language is symbolic machine code</h2>
<p>Each assembly mnemonic represents an operation supported by the processor. A programmer writes readable mnemonics and operands; an assembler converts them to machine-code bytes. Labels name addresses, directives guide the assembler, and comments explain intent but do not execute.</p>
<h2>2. Common instruction groups</h2>
<ul><li><b>Data transfer:</b> MOV, MVI, LXI, LDA, STA, PUSH, POP.</li><li><b>Arithmetic:</b> ADD, ADC, SUB, SBB, INR, DCR, DAD.</li><li><b>Logic:</b> ANA, ORA, XRA, CMA, CMP, rotates.</li><li><b>Control flow:</b> JMP, conditional jumps, CALL, RET, RST.</li><li><b>Processor control:</b> NOP, HLT, EI, DI.</li></ul>
<p>Exact mnemonics and flag behaviour vary by processor. Learn them from the relevant instruction set rather than assuming the 8085, 8086 and 8051 are interchangeable.</p>
<h2>3. Flags and arithmetic</h2>
<p>For an 8-bit unsigned addition, the mathematical result may need 9 bits. The low 8 bits are stored and the carry flag records the extra carry. Zero indicates a zero result; sign reflects the most significant result bit; parity commonly indicates even parity of the result. Signed overflow is not identical to unsigned carry.</p>
<div class="ex"><b>Example.</b> 0FFH+01H=100H mathematically. In an 8-bit accumulator the stored result is 00H and carry is set. The zero flag is also set because the stored 8-bit result is zero.</div>
<h2>4. Loops and subroutines</h2>
<p>A loop uses a counter or a condition to repeat instructions. A subroutine is entered by CALL and normally returns with RET; the return address is stored on the stack. Ensure the stack pointer is initialised and every push has a corresponding pop where required.</p>
<p>When tracing code, make a table of PC, registers, flags, memory and stack after each relevant instruction. This avoids guessing from mnemonics alone.</p>
<div class="tip"><b>Exam trap:</b> A carry flag answers an unsigned arithmetic question; overflow answers whether a signed two’s-complement result fits in its range. They can differ.</div>
<h4>Flags and arithmetic example</h4>
<p>After an 8-bit addition, the carry flag records carry out of bit 7, while the zero flag is set if the stored 8-bit result is zero. For example, <code>0xF0 + 0x30 = 0x120</code>; the stored low byte is <code>0x20</code> and carry is set. The exact flag definitions vary by processor, so use the relevant instruction-set manual.</p>
<p>A loop counter must be initialized and updated explicitly. Off-by-one errors often arise from deciding whether the branch is tested before or after decrement. Trace the register values and program counter for a small example before generalizing.</p>
`},

  {id:'io', name:'Memory and I/O Interfacing', body: T`<h2>1. Memory and I/O are different resources</h2>
<p>Memory stores instructions and data. I/O devices provide external functions such as reading switches, driving displays or communicating with sensors. A processor needs address decoding and control signals so that only the intended device responds to a bus operation.</p>
<h2>2. Memory map</h2>
<p>A memory map assigns address ranges to ROM/Flash, RAM and peripherals. If a processor has 16 address bits, it has 64 KiB of byte-addressable locations, but the entire range need not be RAM. Chip-select logic compares high-order address bits to activate the correct device.</p>
<h2>3. Memory-mapped versus isolated I/O</h2>
<ul><li><b>Memory-mapped I/O:</b> peripheral registers occupy normal address space and are accessed with ordinary load/store or memory instructions. This consumes address space but allows regular addressing modes.</li><li><b>Isolated/port-mapped I/O:</b> a separate I/O address space and special I/O instructions are used where supported.</li></ul>
<h2>4. Interfacing and timing</h2>
<p>Check address/data bus widths, read/write polarity, access time, setup/hold requirements and voltage compatibility. Latches hold multiplexed address bits; buffers provide drive strength; decoders create chip-select signals. If memory is too slow, wait states may be required.</p>
<div class="ex"><b>Example.</b> A 2 KiB memory chip needs 11 address bits because 2^11=2048. If mapped at 4000H–47FFH, the lower 11 bits address locations inside the chip while upper bits help decode the range.</div>
<div class="tip"><b>Exam habit:</b> To size an address decoder, calculate the capacity in powers of two first. Then distinguish internal chip address pins from the high bits used for chip selection.</div>
<h4>Memory decoding and address lines</h4>
<p>A memory chip with <code>2^k</code> locations needs k address inputs. A 2 KiB chip has 2048 locations and needs 11 address bits if each location is one byte. Higher address lines and decoder logic select which chip responds; lower address lines select a location inside the chip.</p>
<p>Memory-mapped I/O uses part of the memory address space for peripheral registers; isolated I/O uses a separate I/O address space and specific instructions on processors that support it. Check chip-select polarity, data-bus direction, read/write timing, and address overlap in an interface design.</p>
`},

  {id:'int', name:'Interrupts, Timers & Serial Communication', body: T`<h2>1. Why interrupts exist</h2>
<p>Polling means repeatedly asking a device whether it needs service. An interrupt lets a device request attention, allowing the CPU to do other work until service is needed. The CPU saves enough state to resume the interrupted program, branches to an interrupt service routine (ISR), handles the event and returns.</p>
<h2>2. 8085 interrupt priorities</h2>
<p>The classic priority order is TRAP, RST 7.5, RST 6.5, RST 5.5 and INTR. TRAP is non-maskable and highest priority. The RST 7.5, 6.5 and 5.5 lines are maskable vectored interrupts; INTR is maskable and non-vectored, requiring an interrupt-acknowledge sequence.</p>
<h2>3. Timers and counters</h2>
<p>A timer counts clock ticks; a counter counts external events. If a timer receives a clock of frequency f and counts N ticks, the nominal interval is N/f, subject to reload, prescaler and inclusive-count conventions. Timer overflow can generate an interrupt.</p>
<h2>4. Serial communication</h2>
<p>UART sends asynchronous serial data with agreed baud rate, start bit, data bits, optional parity and stop bit(s). Both ends must agree on framing and baud rate. A timer can generate the baud-rate timing on small microcontrollers.</p>
<div class="ex"><b>Example.</b> At 9600 bit/s, one bit lasts about 1/9600≈104.2 µs. A frame containing 1 start + 8 data + 1 stop bit uses 10 bit periods, so one byte takes about 1.042 ms before protocol overhead.</div>
<div class="tip"><b>ISR rule:</b> Keep interrupt handlers short, preserve required registers/state, clear the correct interrupt source and beware of shared data that can change asynchronously.</div>
<h4>Interrupt priority and latency</h4>
<p>An interrupt lets hardware request service without the processor continuously polling. The processor typically completes an instruction, saves or otherwise preserves required context, branches to a service routine, services the source, and returns. Actual context-saving behavior depends on the CPU and compiler/runtime.</p>
<p>Interrupt latency is the time from request to start of service. It can be affected by disabled interrupts, higher-priority interrupts, instruction completion, and bus wait states. Keep interrupt handlers short: capture essential state, clear the source as required, and defer long work to the main loop or a task.</p>
`},

  {id:'8051', name:'Microcontroller Architecture & Register-Level Programming', body: T`<h2>1. Microcontroller versus microprocessor</h2>
<p>A microcontroller integrates a CPU with memory, timers, I/O ports and serial peripherals on one chip. The 8051 family is an 8-bit microcontroller architecture with accumulator A, B register, program status word (PSW), data pointer DPTR, stack pointer SP, program counter PC and four 8-bit ports in the classic form.</p>
<h2>2. Memory spaces and special function registers</h2>
<p>Classic 8051 distinguishes program memory from internal data memory; external memory can also be used. Special Function Registers (SFRs) control ports, timers, serial I/O and interrupts. Some address ranges and bit-addressable areas have special meanings, so always use the memory map for the exact derivative.</p>
<h2>3. Timers, ports and serial interface</h2>
<p>Timers/counters are configured through timer control and mode registers. Ports are not all identical: classic Port 0 has open-drain behaviour when used as GPIO, while other ports generally have internal pull-ups. External memory cycles also reuse some port pins.</p>
<h2>4. Register-level programming</h2>
<p>Embedded code configures registers to set pin direction/function, timer mode, interrupt enable and baud rate. A safe sequence is: configure clock/peripheral, clear pending flags, configure pin multiplexing, enable the peripheral, then enable interrupts. Read the datasheet for register names and reset values because modern 8051 derivatives vary.</p>
<div class="ex"><b>Example.</b> To toggle an output periodically, configure a timer to overflow at the desired interval, enable its interrupt, and toggle the pin in the ISR. The interval depends on oscillator frequency, timer prescaler and reload value.</div>
<div class="tip"><b>Exam trap:</b> Do not transfer an 8051 register address or timer formula to an AVR, PIC, MSP430 or ARM MCU without checking its architecture.</div>
<h4>Timers and baud-rate thinking</h4>
<p>For a timer, first determine the timer clock and whether the selected mode counts machine cycles or another configured clock. The overflow interval is approximately <code>counts × timer_tick_period</code>. The preload is the modulus minus the desired count, but the exact modulus and reload behavior depend on timer mode.</p>
<p>8051 variants differ: classic 12-clock cores and modern 1T derivatives do not share the same timing assumptions. Always use the exact device datasheet before converting a timer count into milliseconds or a UART baud rate.</p>
`},

  {id:'peri', name:'ADC/DAC and Peripheral Interfacing', body: T`<h2>1. Analog and digital worlds</h2>
<p>A sensor may output a continuously varying voltage, but a CPU processes numbers. An ADC samples the voltage and converts it to a digital code. A DAC performs the reverse mapping from a code to an analog output.</p>
<h2>2. ADC resolution and quantisation</h2>
<div class="formula">$$\text{Number of codes}=2^N,\qquad \text{LSB size}\approx\frac{V_{FS}}{2^N}$$</div>
<p>N is the number of bits and V_FS is the full input span under the stated convention. Ideal quantisation error is about ±½ LSB for a mid-tread quantiser. Actual ADC accuracy also depends on offset, gain, integral nonlinearity, noise, reference quality and settling.</p>
<div class="ex"><b>Example.</b> An ideal 10-bit ADC spanning 0–5 V has 1024 codes and an LSB size near 5/1024=4.88 mV. The code is approximately input voltage divided by LSB size, with endpoint and coding conventions considered.</div>
<h2>3. DAC and interfacing</h2>
<p>An ideal N-bit DAC has 2^N output levels. A binary-weighted or R–2R ladder network converts bits into weighted current or voltage. Output range depends on reference voltage and whether the DAC is unipolar or bipolar.</p>
<h2>4. Peripheral interfacing checklist</h2>
<ul><li>Confirm logic voltage and common ground.</li><li>Check input range, reference voltage and source impedance.</li><li>Provide an anti-alias filter before ADC sampling when needed.</li><li>Allow acquisition/settling time before reading.</li><li>Use isolation or level shifting if voltages are incompatible.</li></ul>
<div class="tip"><b>Exam trap:</b> Resolution is the smallest code step; accuracy is closeness to the true value. A high-resolution ADC can still be inaccurate.</div>
<h4>ADC quantization and sensor scaling</h4>
<p>For an ideal N-bit ADC over a 0–Vref range, a useful LSB estimate is <code>Vref/2ᴺ</code>. A 12-bit ADC with 3.3 V reference has an LSB of about <code>3.3/4096 ≈ 0.806 mV</code>. If a sensor produces 0–10 V, it cannot be connected directly to a 3.3 V input without appropriate scaling and protection.</p>
<p>Check input range, source impedance, acquisition time, reference accuracy, and whether the ADC code maps to <code>2ᴺ−1</code> or <code>2ᴺ</code> in the chosen conversion convention. A DAC's settling time and output drive capability matter as well as resolution.</p>
`},

  {id:'proto', name:'UART, SPI and I²C Protocols', body: T`<h2>1. UART: asynchronous serial</h2>
<p>UART typically uses TX and RX lines plus a common reference. It has no shared clock; both ends agree on baud rate and frame format. A typical frame is idle-high, start-low, 8 data bits, optional parity and one or more stop bits. TX of one device connects to RX of the other.</p>
<h2>2. SPI: synchronous serial</h2>
<p>SPI commonly uses SCLK, MOSI, MISO and chip-select. A controller supplies clock and selects a peripheral. Data can shift in both directions simultaneously. CPOL defines the clock’s idle level and CPHA defines which edge samples data; both ends must use compatible settings. Multiple peripherals usually need separate chip-selects.</p>
<h2>3. I²C: two-wire shared bus</h2>
<p>I²C uses SDA and SCL, usually with pull-up resistors because devices pull the lines low rather than actively driving them high. A transaction has START, address, read/write bit, ACK/NACK, data bytes and STOP. Multiple devices can share the bus using unique addresses; clock stretching and arbitration may be supported.</p>
<table><tr><th>Protocol</th><th>Wires</th><th>Key idea</th><th>Typical trade-off</th></tr><tr><td>UART</td><td>TX/RX</td><td>No clock line</td><td>Simple point-to-point</td></tr><tr><td>SPI</td><td>Clock + data + select</td><td>Fast full-duplex</td><td>More wires/pins</td></tr><tr><td>I²C</td><td>SDA/SCL</td><td>Addressed shared bus</td><td>Pull-ups and bus capacitance limit speed</td></tr></table>
<div class="ex"><b>Example.</b> If an I²C device ACKs its address, it has acknowledged receipt of the address byte; that does not guarantee that every subsequent data operation will succeed.</div>
<div class="tip"><b>Exam trap:</b> UART is asynchronous, SPI uses a chip-select and clock, and I²C uses open-drain-style shared lines with pull-ups. Do not mix their wiring or framing.</div>
<h4>UART, SPI and I²C practical comparison</h4>
<p>UART is asynchronous and typically needs TX, RX and a shared ground; both sides must agree on baud rate, data bits, parity and stop bits. SPI is synchronous and commonly uses clock, controller-out, controller-in and chip-select signals; it can be fast but uses more wires per peripheral. I²C uses open-drain SDA/SCL lines with pull-up resistors and addressed devices.</p>
<p>For I²C, pull-up resistance trades rise time against sink current. For SPI, check clock polarity and phase (CPOL/CPHA). For UART, mismatched baud rates or incorrect framing commonly cause framing errors or corrupted bytes.</p>
`},

  {id:'emb', name:'Embedded Architecture, Firmware & Real-Time Concepts', body: T`<h2>1. Firmware runs close to hardware</h2>
<p>Embedded firmware is software designed for a specific device with limits on memory, timing, power and reliability. It often reads sensors, updates outputs and responds to events. Unlike desktop programs, it may run indefinitely and must handle faults and timing constraints.</p>
<h2>2. Main loop and interrupt-driven design</h2>
<p>A simple super-loop repeatedly checks inputs, updates state and services tasks. Interrupts handle events that need prompt response. Shared variables modified by an ISR may need atomic access or carefully designed synchronization; declaring a variable volatile prevents some compiler optimisations but does not make compound operations atomic.</p>
<h2>3. Real-time concepts</h2>
<p>A real-time system is correct only when it produces the right result within the required time. A <b>hard deadline</b> must not be missed; a soft deadline allows degraded usefulness. Latency is delay before response; jitter is variation in timing. Worst-case execution time and interrupt interference matter more than average speed for deadline guarantees.</p>
<h2>4. Reliability and debugging</h2>
<ul><li>Use watchdog timers to recover from certain hangs.</li><li>Validate sensor ranges and handle communication timeouts.</li><li>Keep ISRs short and avoid blocking delays inside them.</li><li>Use state machines for clear event-driven behaviour.</li><li>Record faults and test startup, brownout and reset paths.</li></ul>
<div class="ex"><b>Example.</b> A 1 kHz control loop has a 1 ms period. If computation and worst-case interrupt overhead exceed 1 ms, the next cycle can start late or be missed even if average execution time is lower.</div>
<div class="tip"><b>Exam trap:</b> “Real-time” does not necessarily mean “very fast”; it means timing requirements are explicit and met predictably.</div>
<h4>Real-time correctness is about deadlines</h4>
<p>A real-time system is not defined simply by being fast; it must produce correct results within timing constraints. A hard deadline miss may be system failure, while a soft deadline miss degrades service. Worst-case execution time and scheduling interference matter more than average execution time for deadline guarantees.</p>
<p>Use interrupts for event capture, queues or buffers to transfer data safely, and tasks for longer processing. Shared data between an interrupt and a task may require atomic access or synchronization. A race condition occurs when behavior depends on the uncontrolled timing of concurrent accesses.</p>
`},

  {id:'dma', name:'DMA, Memory-Mapped I/O & Bus Concepts', body: T`<h2>1. What DMA solves</h2>
<p>Without Direct Memory Access (DMA), the CPU may have to copy every byte between a peripheral and memory. DMA allows a controller to transfer a block after the CPU configures source, destination, length and direction. The CPU can do other work and may be interrupted when the transfer completes.</p>
<h2>2. Transfer sequence</h2>
<ol><li>Configure peripheral and DMA channel.</li><li>Provide source/destination addresses and transfer count.</li><li>Set width, increment mode and trigger source.</li><li>Enable the channel and start the peripheral transaction.</li><li>Handle completion/error flags and confirm the buffer is safe to use.</li></ol>
<p>DMA can still compete with the CPU for memory-bus access. Cache-equipped systems may require cache clean/invalidate operations so CPU and DMA observe the same data.</p>
<h2>3. Memory-mapped I/O and buses</h2>
<p>In memory-mapped I/O, peripheral registers occupy addresses. Reads and writes can have side effects, so software should follow register documentation; a read-to-clear status bit must not be treated like ordinary RAM. A bus connects masters, slaves and control/address/data paths. Arbitration decides which master gets access.</p>
<h2>4. Endianness and alignment</h2>
<p>Endianness defines byte order in multi-byte values. Little-endian stores the least significant byte at the lowest address; big-endian stores the most significant byte there. Alignment rules determine whether a multi-byte access must start at a particular address boundary.</p>
<div class="ex"><b>Example.</b> The 16-bit value 1234H is stored at addresses 1000H and 1001H as 34H,12H in little-endian memory and 12H,34H in big-endian memory.</div>
<div class="tip"><b>Exam trap:</b> DMA does not eliminate data-coherency, bus-contention or peripheral-timing issues; it removes much of the CPU’s byte-by-byte transfer work.</div>
<h4>DMA and cache coherency</h4>
<p>DMA transfers data between a peripheral and memory with less CPU copying. Before starting DMA, configure source/destination, transfer length, direction and completion/error handling. The CPU must not assume the buffer is ready until the device signals completion or the driver establishes the required synchronization.</p>
<p>On cache-equipped processors, DMA and CPU caches can disagree about buffer contents. Depending on the platform, software may need to clean cache lines before a device reads memory and invalidate them before the CPU consumes device-written data. Follow the MCU/SoC and driver documentation; cache handling is platform-specific.</p>
`}
  ]
},

/* ============================================================ 11 MEAS */
{
  id:'me', name:'Electronic Measurements & Instrumentation', icon:'📏',
  topics:[
  {id:'err', name:'Measurement Errors, Accuracy, Precision & Resolution', body: T`<h2>1. Measurement is an estimate</h2>
<p>A measured value is never automatically identical to the true value. The instrument, environment, operator, calibration and random noise all contribute uncertainty. <b>Accuracy</b> describes closeness to the accepted value; <b>precision</b> describes repeatability; <b>resolution</b> is the smallest change the instrument can display or distinguish.</p>
<div class="formula">$$\text{Relative error}=\frac{x_m-x_{ref}}{x_{ref}},\qquad \%\text{ error}=100\times\text{relative error}$$</div>
<p>The sign indicates whether the reading is high or low. Percentage error magnitude is often reported as an absolute value.</p>
<h2>2. Error sources</h2>
<ul><li><b>Systematic:</b> calibration offset, scale error, loading, temperature drift.</li><li><b>Random:</b> unpredictable noise and fluctuations; repeated readings help estimate spread.</li><li><b>Gross:</b> mistakes such as wrong range or incorrect connection.</li></ul>
<h2>3. Accuracy class and range</h2>
<p>For an analogue instrument whose class is specified as a percentage of full-scale value, maximum absolute error is class% × full scale—not class% of the displayed reading.</p>
<div class="ex"><b>Example.</b> A class 1.0 meter on a 100 V range has a limiting error of ±1 V. If it reads 25 V, the error relative to the reading can be ±1/25×100=±4%, despite the 1% full-scale class.</div>
<h2>4. Combining uncertainties</h2>
<p>For independent small uncertainties in a product or quotient, relative uncertainties are often combined approximately in quadrature for statistical standard uncertainties, but worst-case limiting errors are commonly added in magnitude. For R=V/I, the worst-case approximation is |ΔR|/R≈|ΔV|/V+|ΔI|/I. State which convention the question asks for.</p>
<div class="tip"><b>Exam trap:</b> Do not confuse absolute error (volts, ohms) with relative or percentage error. Always check whether an instrument’s class is based on full scale.</div>
<h4>Accuracy, precision and uncertainty</h4>
<p>Accuracy describes closeness to the true/reference value; precision describes repeatability or spread. A meter can give tightly clustered readings that are all biased. If a reading is <code>10.0 V ± 0.2 V</code>, the absolute uncertainty is 0.2 V and the relative uncertainty is <code>0.2/10×100%=2%</code>.</p>
<p>For independent random uncertainties, a common first-order combination is root-sum-square: <code>u_c=√(u₁²+u₂²+…)</code>. Do not use this blindly for correlated uncertainties or systematic calibration errors; report the assumptions and units.</p>
`},

  {id:'analog', name:'PMMC, Moving-Iron & Electrodynamometer Instruments', body: T`<h2>1. A meter movement creates torque</h2>
<p>Analogue instruments convert electrical input into mechanical pointer movement. The deflecting torque is opposed by a controlling torque, often from springs. At steady state, the pointer settles where the torques balance. Damping reduces oscillation and helps the pointer settle quickly.</p>
<h2>2. PMMC instruments</h2>
<p>A permanent-magnet moving-coil instrument uses a coil in a magnetic field. Deflecting torque is proportional to coil current, so the scale is approximately uniform. It is naturally suited to DC; with AC, average torque over a cycle is zero unless rectification is used.</p>
<h2>3. Moving-iron instruments</h2>
<p>Moving-iron instruments use magnetisation of soft iron by the coil field. Deflection is approximately proportional to current squared, so they can measure AC and DC. The scale is generally nonlinear and crowded near the low end.</p>
<h2>4. Electrodynamometer instruments</h2>
<p>Fixed and moving coils interact magnetically. These instruments can measure AC and DC and are used as wattmeters. For a wattmeter, average torque depends on the product of voltage-coil and current-coil quantities and their phase relation, yielding real power under the intended connection.</p>
<table><tr><th>Type</th><th>Principle</th><th>AC/DC</th><th>Scale</th></tr><tr><td>PMMC</td><td>Moving coil in permanent field</td><td>DC directly</td><td>Nearly uniform</td></tr><tr><td>Moving iron</td><td>Iron magnetisation</td><td>Both</td><td>Nonlinear</td></tr><tr><td>Electrodynamometer</td><td>Interaction of coils</td><td>Both</td><td>Depends on use</td></tr></table>
<div class="tip"><b>Exam trap:</b> PMMC is not directly an AC ammeter because the torque reverses with current; a rectifier can make an AC instrument, with waveform-related errors.</div>
<h4>Instrument loading and sensitivity</h4>
<p>A voltmeter is connected in parallel and should have high input resistance to reduce loading. An ammeter is connected in series and should have low burden resistance. If a 10 kΩ voltmeter is placed across a 10 kΩ source resistance, the effective load is 5 kΩ, so the reading is only half the ideal source voltage in that simple divider model.</p>
<p>PMMC instruments are naturally suited to DC; with AC, torque reversals average to nearly zero unless rectification or another conversion method is used. Moving-iron instruments can measure AC and DC, but their scale is generally nonlinear.</p>
`},

  {id:'meas', name:'Measurement of V, I, R, Power & Energy', body: T`<h2>1. Measuring voltage and current</h2>
<p>An ammeter is connected in series and should have very low resistance so it does not change the current. A voltmeter is connected in parallel and should have very high resistance so it draws little current. Incorrect connection can damage instruments or disturb the circuit.</p>
<h2>2. Extending meter range</h2>
<p>A sensitive galvanometer can be converted into an ammeter by placing a low-resistance shunt in parallel. A voltmeter is made by adding a high resistance in series.</p>
<div class="formula">$$R_s=\frac{I_gR_g}{I-I_g},\qquad R_{series}=\frac{V}{I_g}-R_g$$</div>
<p>I_g and R_g are the full-scale current and internal resistance of the movement. The equations assume a linear movement and ideal resistor network.</p>
<h2>3. Power and energy</h2>
<p>For DC, P=VI. For sinusoidal AC, real power is P=V_rms I_rms cosφ, reactive power is Q=V_rms I_rms sinφ and apparent power is S=V_rms I_rms. A wattmeter’s current coil is placed in series and voltage coil across the load, following the instrument’s terminal markings.</p>
<div class="formula">$$P_{1\phi}=VI\cos\phi,\qquad P_{3\phi}=\sqrt3\,V_L I_L\cos\phi$$</div>
<p>The three-phase expression assumes a balanced sinusoidal system using line-to-line voltage and line current. Energy is power integrated over time; utility energy is commonly measured in kWh.</p>
<div class="ex"><b>Example.</b> A 230 V load draws 5 A at power factor 0.8. Real power is 230×5×0.8=920 W, not 1150 W; 1150 VA is apparent power.</div>
<div class="tip"><b>Exam trap:</b> Use RMS values for sinusoidal AC power formulas. Low power factor means current is large relative to real power delivered.</div>
<h4>Four-wire resistance measurement</h4>
<p>Two-wire resistance measurements include lead and contact resistance. In a four-wire (Kelvin) measurement, one pair supplies current and a separate pair senses voltage, reducing the effect of lead resistance. If the measured drop is 20 mV at 100 mA, the resistance is <code>R=V/I=0.02/0.1=0.2 Ω</code>.</p>
<p>For power in a DC resistive load, <code>P=VI=I²R=V²/R</code>. For sinusoidal AC, real power is <code>P=V_rms I_rms cosφ</code>; using only <code>VI</code> gives apparent power, not necessarily real power.</p>
`},

  {id:'bridge', name:'Bridges — Wheatstone, Maxwell, Hay, Schering, Wien', body: T`<h2>1. Why use a bridge?</h2>
<p>A bridge compares unknown and known impedances. At balance, the detector branch has zero voltage and no current, so the balance equation can be derived by equating divider ratios. Null methods can be accurate because the detector need not measure the unknown directly.</p>
<div class="formula">$$\frac{Z_1}{Z_2}=\frac{Z_3}{Z_4}\quad\text{(one common bridge labelling at balance)}$$</div>
<p>Bridge arm labels differ between diagrams, so derive the ratio from the actual circuit rather than memorising a formula without its layout.</p>
<h2>2. Common bridges</h2>
<ul><li><b>Wheatstone:</b> unknown resistance; at balance, the product of opposite arms is equal.</li><li><b>Maxwell:</b> inductance and resistance using a standard capacitor/resistor network.</li><li><b>Hay:</b> often suited to high-Q inductors.</li><li><b>Schering:</b> capacitance and dielectric loss.</li><li><b>Wien:</b> frequency measurement or frequency-selective networks.</li></ul>
<h2>3. AC bridge balance</h2>
<p>For AC bridges, both magnitude and phase must balance. Since impedance is complex, the balance equation generally yields two real equations: one for resistance/loss and one for reactance/capacitance/inductance. A bridge can fail to balance if the component model or frequency assumption is unsuitable.</p>
<div class="ex"><b>Example.</b> In a Wheatstone bridge with arms R1=100 Ω, R2=200 Ω and R3=150 Ω arranged so R1/R2=R3/Rx, balance gives 100/200=150/Rx, hence Rx=300 Ω. If the diagram uses another arm arrangement, the equation changes accordingly.</div>
<div class="tip"><b>Exam method:</b> Write the detector current as zero, equate the two node potentials, then simplify. This protects you from swapped-arm formula errors.</div>
<h4>Bridge balance condition</h4>
<p>A Wheatstone bridge is balanced when the detector current is zero. With arms R1, R2, R3 and unknown Rx arranged so the detector joins the divider midpoints, the balance condition is <code>R1/R2=R3/Rx</code>, giving <code>Rx=R2R3/R1</code> for that labeling. Always derive the ratio from the actual diagram because arm labels vary.</p>
<p>AC bridges balance both magnitude and phase and can measure inductance, capacitance, frequency or dielectric loss. Parasitic capacitance, lead inductance, shielding and source frequency affect practical accuracy.</p>
`},

  {id:'cro', name:'Oscilloscopes, Probes & Frequency Counters', body: T`<h2>1. What an oscilloscope displays</h2>
<p>An oscilloscope plots voltage vertically against time horizontally. The vertical scale is volts per division; the horizontal scale is seconds per division. The trigger selects a repeatable point in the waveform so the display appears stationary.</p>
<h2>2. Read amplitude and time</h2>
<p>Count divisions, multiply by the scale and account for probe attenuation. Peak-to-peak voltage is the difference between maximum and minimum. For a sine wave with zero DC offset, V_rms=V_peak/√2 and V_pp=2V_peak.</p>
<div class="formula">$$f=\frac1T,\qquad V_{rms}=\frac{V_p}{\sqrt2}\quad\text{(zero-offset sine)}$$</div>
<div class="ex"><b>Example.</b> If one period spans 4 divisions at 0.5 ms/div, T=2 ms and f=500 Hz. If the sine spans 6 vertical divisions at 2 V/div peak-to-peak, V_pp=12 V and V_p=6 V.</div>
<h2>3. Probes, bandwidth and loading</h2>
<p>A 10× probe attenuates the signal by ten but usually presents higher input resistance and lower capacitance than a 1× probe. The scope’s bandwidth limits fast edges and high-frequency signals. Probe compensation must be adjusted for accurate square-wave shape. Long ground leads can add inductance and ringing.</p>
<h2>4. Frequency counters</h2>
<p>A frequency counter counts input cycles during a known gate interval. Counting uncertainty of about ±1 count gives relative uncertainty roughly 1/N, where N is the number of cycles counted. Longer gate time improves resolution for direct counting, while reciprocal methods measure period for better low-frequency resolution.</p>
<div class="tip"><b>Exam trap:</b> Check whether the question asks peak, peak-to-peak or RMS voltage. Also multiply by the probe factor if the scope does not automatically account for it.</div>
<h4>Oscilloscope probes and bandwidth</h4>
<p>A 10× passive probe attenuates the signal by about ten and presents higher input resistance and lower capacitance than a 1× setting, reducing circuit loading. The scope must be configured for the probe factor or displayed amplitudes will be wrong by a factor of ten.</p>
<p>Rise time and bandwidth are related approximately by <code>t_r≈0.35/BW</code> for a single-pole response. A scope with 100 MHz bandwidth has an instrument rise time near 3.5 ns, so very fast edges will appear slower. Probe bandwidth and grounding also matter.</p>
`},

  {id:'trans', name:'Transducers & Sensors', body: T`<h2>1. What is a transducer?</h2>
<p>A transducer converts a physical quantity—temperature, pressure, force, displacement or light—into a usable signal. A sensor is the sensing element; a complete transducer may include excitation, conversion and conditioning. The output might be resistance, voltage, current, charge or a digital code.</p>
<h2>2. Important specifications</h2>
<ul><li><b>Sensitivity:</b> output change per unit input change, e.g. mV/°C.</li><li><b>Range:</b> minimum to maximum measurable input.</li><li><b>Linearity:</b> closeness to a straight-line input-output relationship.</li><li><b>Hysteresis:</b> different output for the same input depending on direction of approach.</li><li><b>Repeatability:</b> agreement among repeated measurements under same conditions.</li><li><b>Response time/bandwidth:</b> how quickly the sensor follows a changing input.</li></ul>
<h2>3. Common sensor examples</h2>
<p>RTDs and thermistors infer temperature from resistance; thermocouples generate a voltage from a temperature difference; strain gauges change resistance under strain; LVDTs convert displacement to a differential AC output; piezoelectric sensors produce charge under dynamic force; photodiodes convert light into current.</p>
<h2>4. Bridge and conditioning circuits</h2>
<p>Small sensor signals may need amplification, filtering, linearisation, isolation and calibration. A Wheatstone bridge converts small resistance changes into a differential voltage. High input impedance reduces loading; common-mode rejection helps when both sensor leads share interference.</p>
<div class="ex"><b>Example.</b> A sensor sensitivity of 10 mV/°C produces an ideal change of 0.25 V for a 25°C rise. Offset and calibration error must be considered separately from sensitivity.</div>
<div class="tip"><b>Exam trap:</b> Sensitivity is a slope, not the same as resolution or accuracy. A very sensitive sensor can still be noisy or poorly calibrated.</div>
<h4>Sensor sensitivity and calibration</h4>
<p>Sensitivity is output change per input change, such as <code>10 mV/°C</code>. If a linear sensor follows <code>V_out=Sx+b</code>, then the measured input is <code>x=(V_out−b)/S</code>. Calibration estimates slope S and offset b against known reference points.</p>
<p>Resolution, sensitivity, accuracy, repeatability, hysteresis and response time are distinct specifications. A highly sensitive sensor can still be inaccurate; a sensor with excellent steady-state accuracy may respond too slowly for a fast-changing process.</p>
`},

  {id:'ina', name:'Instrumentation Amplifiers & Signal Conditioning', body: T`<h2>1. Why an instrumentation amplifier?</h2>
<p>Many sensors produce a small differential voltage on top of a much larger common-mode voltage. An instrumentation amplifier amplifies the difference while rejecting the voltage common to both inputs. It typically offers high input impedance, high CMRR and gain set by one or a few resistors.</p>
<div class="formula">$$V_o=A_d(V_+-V_-)+A_{cm}V_{cm}$$</div>
<p>Ideally A_cm=0. In practice, resistor matching, amplifier mismatch, frequency and source impedance limit common-mode rejection.</p>
<h2>2. Gain and signal conditioning</h2>
<p>Choose gain so the smallest signal is above noise but the largest expected signal does not saturate the output. Check input common-mode range, output swing, supply rails, offset voltage, bias current, bandwidth and slew rate. A rail-to-rail label does not mean the device reaches the exact rail under every load.</p>
<h2>3. Filtering and isolation</h2>
<p>Low-pass filtering can reduce high-frequency noise; notch filters can reject a known interference frequency. Isolation protects users and equipment and breaks ground loops, but the isolation barrier has voltage, bandwidth and safety limits.</p>
<div class="ex"><b>Example.</b> A sensor provides 20 mV differential and an amplifier gain of 50 gives an ideal output of 1.0 V, provided common-mode input and output swing limits are respected.</div>
<div class="tip"><b>Exam trap:</b> High CMRR does not automatically remove differential noise. It rejects only the component common to both inputs.</div>
<h4>Instrumentation amplifier CMRR</h4>
<p>An instrumentation amplifier provides high input impedance and rejects common-mode voltage while amplifying a small differential signal. <code>CMRR=|A_d/A_cm|</code> and <code>CMRR_dB=20log₁₀(CMRR)</code>. A CMRR of 100,000 corresponds to 100 dB.</p>
<p>Even high CMRR cannot fix input common-mode voltage beyond the device's allowed range. Check input common-mode range, output swing, gain-setting resistor tolerance, offset, noise, and supply rails.</p>
`},

  {id:'dvm', name:'Digital Voltmeters, Multimeters & Frequency Measurement', body: T`<h2>1. Digital voltmeter basics</h2>
<p>A digital voltmeter (DVM) conditions the input, converts it to a digital value using an ADC and displays the result. Range selection, input impedance, integration time and calibration affect performance. A high input impedance reduces loading, especially in high-resistance circuits.</p>
<h2>2. ADC conversion and counts</h2>
<p>A display with N counts can show a limited number of discrete values on each range. Resolution is approximately full-scale range divided by the number of available steps. More display digits do not guarantee more accuracy; the ADC reference and analogue front end still matter.</p>
<h2>3. Integrating converters</h2>
<p>Dual-slope conversion integrates the unknown input for a fixed time, then integrates a reference of opposite polarity until the integrator returns to zero. The de-integration time is proportional to input magnitude and can reject certain periodic interference when the integration interval is chosen appropriately.</p>
<h2>4. Resistance and frequency</h2>
<p>A digital multimeter measures resistance by applying a known test current or voltage and measuring the response. Never measure resistance on an energised circuit. Frequency measurement counts cycles or measures period; input amplitude and trigger threshold affect results.</p>
<div class="ex"><b>Example.</b> If a 20,000-count display uses a 2 V range, a rough one-count step is 2/20,000=100 µV. Actual specified resolution may depend on how the manufacturer defines counts and range.</div>
<div class="tip"><b>Exam trap:</b> Resolution, accuracy and number of digits are related but not interchangeable. A DMM may display many digits while its uncertainty remains much larger than one count.</div>
<h4>Digital resolution versus accuracy</h4>
<p>A 3½-digit display often indicates up to 1999 counts, but digit conventions depend on the meter. If the selected range is 20 V with 0.01 V display resolution, that does not mean the measurement is accurate to ±0.01 V. Accuracy specifications often combine a percentage of reading with a number of counts.</p>
<p>Frequency counters can have reciprocal-counting and gate-time errors. Longer gate time generally improves resolution for direct counting, while reference oscillator accuracy limits absolute frequency accuracy.</p>
`},

  {id:'daq', name:'Data Acquisition & Calibration', body: T`<h2>1. From physical signal to stored data</h2>
<p>A data-acquisition (DAQ) system measures real-world signals and stores or processes samples. A typical chain is sensor → excitation/signal conditioning → anti-alias filter → sample-and-hold/ADC → digital interface → software or storage.</p>
<h2>2. Sampling and multiplexing</h2>
<p>Sampling converts a changing signal into a sequence of values. The sampling rate must be high enough for the signal bandwidth, and an anti-alias filter removes out-of-band energy before conversion. A multiplexed ADC shares one converter among channels, so channel-to-channel sample times may be offset.</p>
<h2>3. Calibration</h2>
<p>Calibration compares an instrument with a known reference and records the relationship between indicated and reference values. A two-point calibration can estimate offset and gain: y_corrected=a·y_measured+b. Calibration does not remove random noise, and it remains valid only within specified environmental and time conditions.</p>
<h2>4. Grounding, isolation and noise</h2>
<p>Ground loops arise when multiple ground paths carry unwanted current. Differential measurement, proper shield termination, isolation and careful cable routing can reduce interference. Check common-mode voltage limits and ensure the input never exceeds the DAQ’s absolute maximum ratings.</p>
<div class="ex"><b>Example.</b> A sensor gives 0.5 V at 0 units and 4.5 V at 100 units. Assuming a linear response, sensitivity is (4.5−0.5)/100=0.04 V/unit. A 2.5 V reading corresponds to (2.5−0.5)/0.04=50 units.</div>
<div class="tip"><b>Exam trap:</b> Increasing ADC bit depth does not fix aliasing. Anti-alias filtering and sampling rate must be designed before conversion.</div>
<h4>DAQ sampling and anti-alias filter</h4>
<p>A data-acquisition chain often includes sensor, signal conditioning, anti-alias filter, sample-and-hold/ADC, and digital processing. The analogue filter must attenuate frequencies that would fold into the sampled band. Select sampling rate and filter transition band together; Nyquist alone does not specify a realizable filter.</p>
<p>Calibration traceability means relating results through documented comparisons to recognized standards. Keep calibration date, range, uncertainty, environmental conditions and as-found/as-left results when the application requires auditability.</p>
`}
  ]
},

/* ============================================================ 12 POWER */
{
  id:'pw', name:'Power Electronics', icon:'⚙',
  topics:[
  {id:'sw', name:'Power Semiconductor Switches', body: T`<h2>1. Power switches as controlled valves</h2>
<p>A power semiconductor is used to control energy flow. An ideal switch has zero voltage drop when ON and zero current when OFF; real switches have conduction losses, switching losses, leakage and thermal limits. The control method differs by device.</p>
<table><tr><th>Device</th><th>Control</th><th>Typical key point</th></tr><tr><td>Power diode</td><td>Uncontrolled</td><td>Conducts when forward biased</td></tr><tr><td>SCR</td><td>Gate turn-on; external commutation in many circuits</td><td>Latching device</td></tr><tr><td>MOSFET</td><td>Voltage-controlled gate</td><td>Fast switching; R_DS(on) loss</td></tr><tr><td>IGBT</td><td>Voltage-controlled gate</td><td>Useful at higher voltage/power; tail current during turn-off</td></tr></table>
<h2>2. Ratings and safe operation</h2>
<p>Check repetitive peak blocking voltage, average/RMS current, surge current, switching frequency, junction temperature, safe operating area, dv/dt, di/dt and gate limits. A device rating is not a recommended continuous operating point under every cooling condition.</p>
<h2>3. Losses and heat</h2>
<div class="formula">$$P_{cond}\approx V_{on}I_{avg}\text{ (constant-drop model)},\qquad P_{cond}\approx I_{RMS}^2R_{on}\text{ (resistive model)}$$</div>
<p>Use the model matching the device and conduction waveform. Switching loss is concentrated during transitions, when voltage and current overlap. Junction temperature is estimated from power dissipation and thermal resistance.</p>
<div class="ex"><b>Example.</b> A switch with a 1.2 V on-state drop carrying 8 A for half of each cycle has approximate average conduction loss 1.2×8×0.5=4.8 W if the stated 8 A is the on-state current and duty ratio is 0.5.</div>
<div class="tip"><b>Exam trap:</b> Choose average, RMS or peak current according to the specified rating and waveform; these are not interchangeable.</div>
<h4>Switch choice: conduction and switching loss</h4>
<p>For an ideal switch, on-state voltage is zero and switching is instantaneous. Real devices have conduction loss and switching loss. A MOSFET conduction estimate is <code>P_cond≈I_rms²R_DS(on)</code>; an IGBT or diode often uses an on-state voltage model such as <code>P≈V_on I_avg</code> for the appropriate conduction interval.</p>
<p>Choose voltage/current ratings with transient margin and check safe operating area, switching frequency, thermal resistance, gate charge, reverse recovery and avalanche limits. The best device is not always the one with the lowest on-resistance.</p>
`},
