{
  id:'op', name:'Optical Communication', icon:'🔆',
  topics:[
  {id:'fib', name:'Fibre Structure, Numerical Aperture & Acceptance Angle', body: T`<h2>1. What an optical fibre is</h2>
<p>An optical fibre is a thin dielectric waveguide. Its central core has refractive index n₁ and the surrounding cladding has slightly lower index n₂. Light can be guided because the core-cladding boundary supports total internal reflection for suitable ray angles, or more exactly guided optical modes.</p>
${FIGSLOT('fiber')}
<h2>2. Critical angle and acceptance</h2>
<p>For a ray travelling from the higher-index core toward lower-index cladding, the critical angle measured from the normal satisfies sin θc=n₂/n₁. Rays incident above this angle undergo total internal reflection.</p>
\[NA=\sqrt{n_1^2-n_2^2}=n_0\sin\theta_{\max}\]
<p>NA is numerical aperture; θmax is the maximum external acceptance half-angle, and n₀ is the refractive index outside the fibre. In air n₀≈1. The formula assumes a step-index fibre and meridional-ray approximation.</p>
<div class="ex"><b>Example.</b> For n₁=1.50 and n₂=1.48, NA=√(2.25−2.1904)=√0.0596≈0.244. In air, θmax=sin⁻¹(0.244)≈14.1°.</div>
<h2>3. Relative index difference</h2>
<p>For a weakly guiding fibre, Δ=(n₁−n₂)/n₁ and NA≈n₁√(2Δ). This is an approximation for small Δ, not a replacement for the exact square-root expression in every case.</p>
<h2>4. What changes coupling?</h2><ul><li>Higher NA generally makes coupling alignment easier.</li><li>Core diameter and numerical aperture affect the number of modes accepted.</li><li>NA is not the same as the external acceptance angle; convert with the surrounding index.</li><li>Light launched outside the acceptance cone is not efficiently guided.</li></ul>
<h4>Numerical aperture example</h4>
<p>For a step-index fibre in air, <code>NA=√(n₁²−n₂²)</code>. If <code>n₁=1.48</code> and <code>n₂=1.46</code>, then <code>NA≈√(2.1904−2.1316)=0.242</code>, and the acceptance half-angle is <code>sin⁻¹(0.242)≈14°</code>. In an external medium of index n₀, use <code>n₀ sin θₐ=√(n₁²−n₂²)</code>.</p>
<p>A larger NA eases light coupling but allows a wider range of ray angles and can increase modal dispersion in multimode fibre.</p>

<h4>Additional calculation: numerical aperture</h4>
<p>For a step-index fibre in air, <code>NA=√(n₁²−n₂²)</code>. If <code>n₁=1.48</code> and <code>n₂=1.46</code>, then <code>NA≈√(2.1904−2.1316)=0.242</code>, and the acceptance half-angle is <code>sin⁻¹(0.242)≈14°</code>. In an external medium of index n₀, use <code>n₀ sin θₐ=√(n₁²−n₂²)</code>.</p>
<p>A larger NA eases coupling but permits a wider range of ray angles and can increase modal dispersion in multimode fibre.</p>
`},

  {id:'step', name:'Step-Index and Graded-Index Fibres', body: T`<h2>1. Step-index versus graded-index</h2>
<p>In a step-index fibre, refractive index changes abruptly from core value n₁ to cladding value n₂. In a graded-index fibre, the core index decreases gradually from the centre toward the cladding. This index profile changes ray travel times and therefore modal dispersion.</p>
${FIGSLOT('graded')}
<h2>2. Multimode dispersion</h2>
<p>In a multimode fibre, different modes can travel along different paths and arrive at different times. Step-index multimode fibre has substantial modal dispersion because high-angle rays travel longer paths. A graded-index profile bends rays and raises their speed in lower-index outer regions, helping equalise transit times.</p>
<h2>3. Single-mode fibre</h2>
<p>A single-mode fibre guides only the fundamental mode over its operating range. It typically has a small core and very low modal dispersion, making it suitable for long-distance, high-bandwidth links. Chromatic dispersion and polarisation-mode dispersion can still matter.</p>
<table><tr><th>Type</th><th>Main feature</th><th>Typical use</th></tr><tr><td>Step-index multimode</td><td>High modal dispersion</td><td>Short links</td></tr><tr><td>Graded-index multimode</td><td>Reduced modal dispersion</td><td>Building/campus links</td></tr><tr><td>Single-mode</td><td>No intermodal dispersion in ideal single-mode operation</td><td>Long-haul links</td></tr></table>
<div class="ex"><b>Reasoning example.</b> If a link has severe pulse spreading caused by many modes, changing from step-index multimode to graded-index multimode reduces that mechanism. For very long distance, single-mode fibre is generally preferred.</div>
<h2>4. Common traps</h2><ul><li>Single-mode does not mean dispersion-free.</li><li>Graded-index reduces modal dispersion; it does not eliminate all dispersion.</li><li>Fibre type should be selected with wavelength, bandwidth, distance, source and connector constraints in mind.</li></ul>
<h4>Why graded-index fibre reduces modal dispersion</h4>
<p>In step-index multimode fibre, different modes travel different path lengths and arrive at different times. Graded-index fibre reduces this spread by varying the refractive index across the core, so rays taking longer paths travel through lower-index regions where propagation is faster.</p>
<p>Single-mode fibre eliminates intermodal dispersion but can still suffer chromatic and polarization-mode dispersion. Single-mode does not mean zero dispersion.</p>

<h4>Additional concept check: modal dispersion</h4>
<p>In step-index multimode fibre, different modes travel different path lengths and arrive at different times. Graded-index fibre reduces this spread by varying the refractive index across the core, so rays taking longer paths travel through lower-index regions where propagation is faster.</p>
<p>Single-mode fibre eliminates intermodal dispersion but can still suffer chromatic and polarization-mode dispersion. Single-mode does not mean zero dispersion.</p>
`},

  {id:'att', name:'Attenuation, Dispersion & Bandwidth', body: T`<h2>1. Attenuation: optical power decreases</h2>
<p>Attenuation is the loss of optical power as light travels through fibre. It is commonly specified in dB/km. If input power is P_in and output is P_out, loss in dB is 10log₁₀(P_in/P_out). Over length L, the fibre loss is approximately αL dB when α is in dB/km.</p>
<div class="ex"><b>Example.</b> A 12 km fibre with 0.25 dB/km attenuation contributes 3 dB loss, meaning the output power is about half the input power before connector and splice losses.</div>
<h2>2. Sources of attenuation</h2><ul><li>Material absorption, including intrinsic and impurity absorption.</li><li>Rayleigh scattering from microscopic index fluctuations.</li><li>Bending loss when tight bends allow guided power to escape.</li><li>Connector, splice and coupling losses in the installed link.</li></ul>
<h2>3. Dispersion broadens pulses</h2>
<p>Dispersion causes different parts of a pulse to arrive at different times, spreading the pulse and limiting bit rate. Modal dispersion arises from different guided modes; chromatic dispersion arises because different wavelengths travel at different group velocities; polarisation-mode dispersion arises from birefringence.</p>
<h2>4. Bandwidth and dispersion</h2>
<p>For a simplified Gaussian pulse, dispersion contributions may be combined in quadrature when independent: σ_total²≈Σσ_i². A rough bandwidth-distance product is often used for multimode fibre, but its exact value depends on fibre profile and launch conditions. Single-mode fibre avoids intermodal dispersion but not chromatic dispersion.</p>
<h2>Exam traps</h2><ul><li>Power ratios use 10log₁₀, not 20log₁₀.</li><li>3 dB loss is approximately half power; 10 dB loss is one tenth power.</li><li>Attenuation reduces amplitude/power; dispersion spreads the pulse in time. They are different failure mechanisms.</li></ul>
<h4>Attenuation and dispersion calculation</h4>
<p>For attenuation α dB/km over length L, fibre loss is <code>αL</code>. At <code>0.25 dB/km</code> over 40 km, the loss is 10 dB, meaning output power is one tenth of input power. Chromatic pulse spreading is approximately <code>Δt≈|D|LΔλ</code>; with <code>D=17 ps/(nm·km)</code>, L=50 km and <code>Δλ=0.1 nm</code>, broadening is about 85 ps.</p>
<p>Attenuation reduces power; dispersion spreads pulses and can cause intersymbol interference. They are different link limitations.</p>

<h4>Additional calculation: fibre loss and pulse spreading</h4>
<p>For attenuation α dB/km over length L, fibre loss is <code>αL</code>. At <code>0.25 dB/km</code> over 40 km, the loss is 10 dB, meaning output power is one tenth of input power. Chromatic pulse spreading is approximately <code>Δt≈|D|LΔλ</code>; with <code>D=17 ps/(nm·km)</code>, L=50 km and <code>Δλ=0.1 nm</code>, broadening is about 85 ps.</p>
<p>Attenuation reduces power; dispersion spreads pulses and can cause intersymbol interference. They are different link limitations.</p>
`},

  {id:'src', name:'LEDs, Laser Diodes & Photodetectors', body: T`<h2>1. Optical transmitters</h2>
<p>An optical transmitter converts an electrical signal into modulated light. Common sources are LEDs and laser diodes. LEDs emit spontaneous, relatively broad-spectrum light and are often used for short links. Laser diodes provide stimulated emission, narrower spectral width and higher optical power, and are common in high-speed or long-distance links.</p>
<h2>2. Direct modulation</h2>
<p>In direct modulation, the drive current of the LED or laser changes with the data signal. It is simple, but laser chirp and nonlinearities can affect high-speed transmission. External modulation uses a separate modulator and can improve performance in demanding systems.</p>
<h2>3. Photodetectors</h2>
<p>A PIN photodiode converts incident optical power into photocurrent. An avalanche photodiode (APD) uses internal avalanche multiplication to increase sensitivity, but requires higher bias and introduces excess noise. Responsivity is R=I_ph/P_opt in A/W.</p>
<div class="ex"><b>Example.</b> A detector with responsivity 0.8 A/W receiving 100 μW produces ideal photocurrent I=0.8×100 μW=80 μA, ignoring dark current and other effects.</div>
<h2>4. Receiver noise and sensitivity</h2>
<p>Receiver performance depends on photon shot noise, thermal noise, bandwidth, detector responsivity, amplifier noise and required bit-error rate. APD gain raises signal current but also increases multiplication noise; it does not improve every noise-limited system automatically.</p>
<h2>Exam checks</h2><ul><li>LED: spontaneous emission, broad spectrum, generally lower speed/power.</li><li>Laser: stimulated emission, narrow spectrum, coherent output, often higher speed.</li><li>PIN: no internal avalanche gain; APD: internal gain with added noise and bias complexity.</li></ul>
<h4>LED, laser and detector trade-offs</h4>
<p>LEDs generally have broader spectral width and lower optical power, but are simpler and often cheaper. Laser diodes offer narrower linewidth and higher power for higher-rate or longer-distance links, but require suitable drive and thermal control.</p>
<p>PIN photodiodes are common for speed and linearity; APDs provide internal gain but need higher bias and introduce excess noise. Receiver sensitivity depends on bandwidth, noise, modulation and target bit-error rate—not detector type alone.</p>

<h4>Additional comparison: optical sources and detectors</h4>
<p>LEDs generally have broader spectral width and lower optical power, but are simpler and often cheaper. Laser diodes offer narrower linewidth and higher power for higher-rate or longer-distance links, but require suitable drive and thermal control.</p>
<p>PIN photodiodes are common for speed and linearity; APDs provide internal gain but need higher bias and introduce excess noise. Receiver sensitivity depends on bandwidth, noise, modulation and target bit-error rate—not detector type alone.</p>
`},

  {id:'txrx', name:'Optical Transmitters and Receivers', body: T`<h2>1. Optical link blocks</h2>
<p>A basic optical communication link has a transmitter, fibre channel and receiver. The transmitter encodes electrical data onto light; the fibre introduces attenuation and dispersion; the receiver converts light back to an electrical signal and decides which symbols were sent.</p>
<h2>2. Transmitter chain</h2><p>Typical blocks include data source, line coding or pulse shaping, driver circuit and optical source. The optical launch power must be high enough to meet the receiver budget without violating source, fibre or safety limits.</p>
<h2>3. Receiver chain</h2><p>Typical blocks are photodetector, transimpedance amplifier, filtering/equalisation, clock and data recovery, and decision circuit. The receiver's sensitivity is the minimum received power required to meet a specified performance, often a target bit-error rate.</p>
<div class="ex"><b>Link reasoning.</b> If launch power is +0 dBm and total channel/connector loss is 18 dB, received power is −18 dBm. If receiver sensitivity is −22 dBm, the nominal margin is 4 dB before extra ageing or engineering margins.</div>
<h2>4. Analogue versus digital links</h2>
<p>Digital links are often evaluated by bit-error rate and eye opening. Analogue links may be evaluated by signal-to-noise ratio and distortion. Both are affected by attenuation, dispersion, reflections, source noise and receiver bandwidth.</p>
<h2>5. Common traps</h2><ul><li>dBm is absolute power relative to 1 mW; dB is a ratio.</li><li>Optical power budget is not the same as dispersion budget.</li><li>More received power cannot fully repair severe intersymbol interference caused by excessive dispersion.</li></ul>
<h4>Receiver photocurrent example</h4>
<p>With responsivity <code>R=0.8 A/W</code> and received optical power <code>−20 dBm=10 μW</code>, average photocurrent is approximately <code>I_p=RP=0.8×10 μW=8 μA</code>. This is a first-order estimate before noise and circuit effects.</p>
<p>Increasing receiver bandwidth can capture faster data but generally increases integrated noise. Equalization can compensate some channel distortion, but cannot restore information buried below the noise floor.</p>

<h4>Additional calculation: receiver photocurrent</h4>
<p>With responsivity <code>R=0.8 A/W</code> and received optical power <code>−20 dBm=10 μW</code>, average photocurrent is approximately <code>I_p=RP=0.8×10 μW=8 μA</code>. This is a first-order estimate before noise and circuit effects.</p>
<p>Increasing receiver bandwidth can capture faster data but generally increases integrated noise. Equalization can compensate some channel distortion, but cannot restore information buried below the noise floor.</p>
`},

  {id:'link', name:'Optical Link Budget & Repeaters', body: T`<h2>1. The power budget</h2>
<p>A link budget checks whether enough optical power reaches the receiver. Use consistent dB units: received power equals launched power minus all losses plus any gains expressed in dB.</p>
\[P_R=P_T-\alpha L-L_{\mathrm{connectors}}-L_{\mathrm{splices}}-L_{\mathrm{other}}\quad\text{(dBm)}\]
<p>P_T and P_R are in dBm; α is fibre attenuation in dB/km and L is length in km. The result must exceed the receiver sensitivity plus a chosen engineering margin.</p>
<div class="ex"><b>Worked example.</b> Launch power = −2 dBm; fibre loss = 0.25 dB/km × 20 km = 5 dB; connectors and splices total 2 dB. Then P_R=−2−5−2=−9 dBm. If sensitivity is −18 dBm, the margin is 9 dB before any reserve requirement.</div>
<h2>2. dBm versus dB</h2>
<p>dBm is referenced to 1 mW: P(dBm)=10log₁₀(P_mW). Thus 0 dBm=1 mW, +3 dBm≈2 mW and −10 dBm=0.1 mW. Losses are expressed in dB and are added/subtracted from power levels in dBm.</p>
<h2>3. Repeaters and amplifiers</h2>
<p>A regenerator detects and retransmits a digital signal, potentially restoring timing and pulse shape. An optical amplifier boosts optical power without full electrical regeneration but also adds noise. The choice depends on distance, format, noise accumulation and system design.</p>
<h2>4. Power is not the only limit</h2><ul><li>Dispersion may close the eye even if received power is adequate.</li><li>Receiver overload is possible if received power is too high.</li><li>Include ageing, temperature, repair and design margins as required by the specification.</li><li>Calculate the weakest link, not just fibre attenuation.</li></ul>
<h4>Optical link budget example</h4>
<p>Suppose launch power is <code>0 dBm</code>, fibre loss is 12 dB, connectors/splices add 2 dB and design margin is 3 dB. Estimated received power is <code>0−12−2−3=−17 dBm</code>. If receiver sensitivity is <code>−22 dBm</code>, the remaining margin is 5 dB beyond those allowances.</p>
<p>dBm is an absolute power level; dB is a ratio or gain/loss. Include worst-case transmitter power, wavelength-dependent fibre loss, connector count, aging, temperature and receiver sensitivity at the required BER.</p>

<h4>Additional calculation: optical link budget</h4>
<p>Suppose launch power is <code>0 dBm</code>, fibre loss is 12 dB, connectors/splices add 2 dB and design margin is 3 dB. Estimated received power is <code>0−12−2−3=−17 dBm</code>. If receiver sensitivity is <code>−22 dBm</code>, the remaining margin is 5 dB beyond those allowances.</p>
<p>dBm is an absolute power level; dB is a ratio or gain/loss. Include worst-case transmitter power, wavelength-dependent fibre loss, connector count, aging, temperature and receiver sensitivity at the required BER.</p>
`},

  {id:'wdm', name:'WDM and Optical Systems', body: T`<h2>1. Wavelength-division multiplexing</h2>
<p>WDM sends multiple optical channels through the same fibre by assigning each channel a different wavelength. A multiplexer combines the wavelengths at the transmitter; a demultiplexer separates them at the receiver. This increases capacity without laying additional fibre.</p>
<h2>2. CWDM and DWDM</h2>
<p>Coarse WDM uses wider wavelength spacing and simpler components in many access or metro applications. Dense WDM uses closely spaced channels and highly stable lasers/filters, allowing many channels in a narrow optical band. Exact channel grids and spacing are standard-dependent.</p>
<h2>3. Capacity and impairments</h2>
<p>Total capacity is approximately the number of channels multiplied by the bit rate per channel, subject to overhead and practical constraints. Channel spacing must account for laser drift, filter bandwidth, modulation format and nonlinear effects. Amplifier gain spectrum and fibre dispersion can differ across wavelengths.</p>
<div class="ex"><b>Example.</b> Forty channels each carrying 25 Gb/s provide a gross aggregate rate of 40×25=1000 Gb/s=1 Tb/s before overheads.</div>
<h2>4. Other optical system concepts</h2><ul><li>Optical amplifiers such as EDFAs boost many wavelengths together in their gain band.</li><li>Dispersion compensation or coherent DSP may be needed for high-capacity long-haul systems.</li><li>Optical add-drop multiplexers allow selected wavelengths to be inserted or removed at network nodes.</li><li>Power equalisation helps avoid some channels overpowering others.</li></ul>
<h2>Exam traps</h2><p>WDM separates channels by wavelength, not by time slot. TDM separates them by time; FDM generally separates electrical/RF channels by frequency. Wavelength and optical frequency are related by f=c/λ, so a smaller wavelength means a higher frequency.</p>
<h4>WDM capacity calculation</h4>
<p>Wavelength-division multiplexing carries separate optical channels at different wavelengths through one fibre. Forty channels at 25 Gb/s each give a raw aggregate line rate of <code>40×25=1000 Gb/s=1 Tb/s</code>, before protocol overhead.</p>
<p>Channel spacing must account for laser stability, filter bandwidth, modulation spectrum and nonlinear effects. More channels do not guarantee proportionally more usable capacity if optical signal-to-noise ratio or nonlinear penalties become limiting.</p>

<h4>Additional calculation: WDM aggregate capacity</h4>
<p>Wavelength-division multiplexing carries separate optical channels at different wavelengths through one fibre. Forty channels at 25 Gb/s each give a raw aggregate line rate of <code>40×25=1000 Gb/s=1 Tb/s</code>, before protocol overhead.</p>
<p>Channel spacing must account for laser stability, filter bandwidth, modulation spectrum and nonlinear effects. More channels do not guarantee proportionally more usable capacity if optical signal-to-noise ratio or nonlinear penalties become limiting.</p>
`}
  ]
},

/* ============================================================ 16 APTITUDE */
{
  id:'apt', name:'Aptitude and Ability Test', icon:'🧮',
  topics:[
  {id:'num', name:'Percentages, Ratios, Averages, Profit/Loss, Mixtures', body: T`<h2>1. Percentages and ratios</h2>
<p>Percent means “per hundred.” If a quantity changes by p%, multiply by 1+p/100 for an increase or 1−p/100 for a decrease. Ratios compare quantities in the same units; simplify before calculating.</p>
<div class="ex"><b>Example.</b> A ₹800 item rises by 15%: new price=800×1.15=₹920. A later 10% discount gives 920×0.90=₹828, not ₹800, because successive percentage changes act on different bases.</div>
<h2>2. Averages and mixtures</h2>
<p>Average = total sum / number of items. When combining groups, use a weighted average: (n₁a₁+n₂a₂)/(n₁+n₂). For mixtures, total amount of a component is conserved; set up an equation using concentration or price per unit.</p>
<h2>3. Profit, loss and discount</h2>
<p>Profit%=(SP−CP)/CP×100; loss%=(CP−SP)/CP×100. Discount percentage is calculated on marked price, not cost price. Profit percentage is normally calculated on cost price unless the question states otherwise.</p>
<h2>4. Speed shortcuts</h2><p>For equal distances at speeds u and v, average speed is 2uv/(u+v), not (u+v)/2. For equal time intervals, the arithmetic mean of speeds is appropriate.</p>
<h2>Exam checklist</h2><ul><li>Identify the base quantity before applying a percentage.</li><li>Convert ratios into actual parts only after finding the total parts.</li><li>Do not average rates blindly; determine whether distances or times are equal.</li><li>Estimate the answer to catch arithmetic mistakes.</li></ul>
<h4>Percentage change: base matters</h4>
<p>If a value rises from 80 to 100, the increase is 20 on a base of 80, so percentage increase is <code>20/80×100=25%</code>. If it then falls from 100 to 80, the decrease is 20 on a base of 100, or 20%. Equal absolute increases and decreases do not cancel in percentage terms because the bases differ.</p>
<p>For successive percentage changes a% and b%, multiply factors: <code>(1+a/100)(1+b/100)</code>. A 20% increase followed by a 20% decrease gives <code>1.2×0.8=0.96</code>, a net 4% decrease.</p>
`},

  {id:'tsd', name:'Time, Speed, Distance and Work', body: T`<h2>1. The basic relationship</h2>
\[ \text{Speed}=\frac{\text{Distance}}{\text{Time}},\quad d=vt,\quad t=d/v. \]
<p>Use consistent units. A speed of 72 km/h equals 72×5/18=20 m/s. Convert before substituting if distance is in metres and time in seconds.</p>
<h2>2. Relative speed</h2>
<p>For two objects moving in the same direction, relative speed is the difference of their speeds. For opposite directions, it is the sum. Relative speed tells how quickly the distance between them changes.</p>
<div class="ex"><b>Example.</b> A 120 m train passes a pole in 6 s, so speed=120/6=20 m/s=72 km/h. To pass a 180 m platform, it must cover 120+180=300 m, taking 300/20=15 s.</div>
<h2>3. Average speed</h2>
<p>Average speed is total distance divided by total time. For equal distances at speeds u and v, average speed is 2uv/(u+v). For equal time intervals, average speed is (u+v)/2.</p>
<h2>4. Work and pipes</h2>
<p>If A completes a job in x days, A's rate is 1/x job per day. If A and B work together, add rates: 1/T=1/x+1/y, so T=xy/(x+y) for two workers. A leak or worker undoing work contributes a negative rate.</p>
<div class="ex"><b>Example.</b> A takes 6 days and B takes 3 days. Combined rate=1/6+1/3=1/2 job/day, so together they finish in 2 days.</div>
<h2>5. Traps</h2><ul><li>Train-crossing questions use total length of train plus object when both have length.</li><li>Work rates add, completion times do not.</li><li>Check whether the question asks for relative speed, average speed, or time to overtake.</li></ul>
<h4>Relative speed and work rate</h4>
<p>For two objects moving toward each other, relative speed is the sum of speeds; moving in the same direction, it is the absolute difference. If two trains travel at 50 and 70 km/h toward each other, their closing speed is 120 km/h.</p>
<p>Work problems are rate problems: if a person finishes a job in 6 hours, the rate is <code>1/6</code> job/hour. If another finishes in 3 hours, combined rate is <code>1/6+1/3=1/2</code> job/hour, so together they take 2 hours. Add rates, not completion times.</p>
`},

  {id:'alg', name:'Algebra, Geometry, Mensuration & Number Series', body: T`<h2>1. Algebra essentials</h2>
<p>Translate words into equations before solving. If a number x is increased by 5, write x+5; “three times the number is 21” becomes 3x=21. Keep operations balanced on both sides of an equation.</p>
<h2>2. Indices and roots</h2>
<p>For nonzero a, aᵐaⁿ=aᵐ⁺ⁿ, aᵐ/aⁿ=aᵐ⁻ⁿ, and (aᵐ)ⁿ=aᵐⁿ. Fractional powers represent roots when defined over the real numbers. Be careful: (a+b)² is a²+2ab+b², not a²+b².</p>
<h2>3. Geometry and mensuration</h2>
<p>Memorise core formulas with units: rectangle area=lb; triangle area=½bh; circle area=πr² and circumference=2πr; cuboid volume=lbh; cylinder volume=πr²h; sphere volume=4πr³/3. Surface area and volume are different quantities.</p>
<div class="ex"><b>Example.</b> A cylinder with radius 3 cm and height 10 cm has volume π×3²×10=90π cm³. If radius doubles, volume becomes four times as large when height stays fixed.</div>
<h2>4. Number series</h2>
<p>Check differences, second differences, ratios, alternating terms, squares/cubes, primes and combinations. For example, 2, 5, 10, 17, 26 has differences 3,5,7,9, so the next difference is 11 and next term is 37.</p>
<h2>Exam approach</h2><ul><li>Draw a diagram for geometry problems.</li><li>Check whether dimensions are length, area or volume units.</li><li>In series, test the simplest consistent rule before inventing a complicated one.</li></ul>
<h4>Algebraic simplification and units</h4>
<p>For an equation, perform the same valid operation on both sides and note restrictions before dividing. For example, <code>x²−5x+6=0</code> factors as <code>(x−2)(x−3)=0</code>, so x is 2 or 3. If an equation was obtained by multiplying by an expression that may be zero, check candidate roots in the original equation.</p>
<p>Geometry and mensuration questions often become straightforward after writing the correct formula and units. For a circle, <code>A=πr²</code> and circumference is <code>2πr</code>; doubling radius quadruples area but only doubles circumference.</p>
`},

  {id:'prob', name:'Probability and Elementary Counting', body: T`<h2>1. Counting outcomes</h2>
<p>The fundamental counting principle says that if a task has m choices followed by n choices, there are mn ordered combinations. Use permutations when order matters and combinations when order does not.</p>
\[{}^nP_r=\frac{n!}{(n-r)!},\qquad {n\choose r}=\frac{n!}{r!(n-r)!}.\]
<div class="ex"><b>Example.</b> Choose 2 people from 5 for a team: C(5,2)=5!/(2!3!)=10. Assign a president and secretary from 5 people: 5×4=20 because roles make order matter.</div>
<h2>2. Probability basics</h2>
<p>For equally likely outcomes, P(A)=favourable outcomes/total outcomes. Probability lies between 0 and 1. The complement rule is P(not A)=1−P(A), often easier when the event is “at least one.”</p>
<h2>3. Addition and multiplication rules</h2>
<p>P(A∪B)=P(A)+P(B)−P(A∩B). If events are mutually exclusive, the intersection is zero. P(A∩B)=P(A)P(B|A); for independent events, P(B|A)=P(B), so probabilities multiply.</p>
<div class="ex"><b>Example.</b> Draw one card from a standard deck. P(heart)=13/52=1/4. P(heart or king)=13/52+4/52−1/52=16/52=4/13 because the king of hearts was counted twice.</div>
<h2>4. Common traps</h2><ul><li>Independent does not mean mutually exclusive.</li><li>Without replacement, probabilities usually change after each draw.</li><li>For “at least one,” use 1−P(none) when convenient.</li><li>State whether order matters before selecting permutations or combinations.</li></ul>
<h4>Counting without overcounting</h4>
<p>For ordered arrangements of r objects chosen from n distinct objects, <code>P(n,r)=n!/(n−r)!</code>. For unordered selections, <code>C(n,r)=n!/[r!(n−r)!]</code>. Choose permutations when order matters and combinations when only the chosen set matters.</p>
<p>For two events, <code>P(A∪B)=P(A)+P(B)−P(A∩B)</code>. Subtract the overlap once; adding probabilities directly is valid only when the events are mutually exclusive.</p>
`},

  {id:'logic', name:'Logical Reasoning, Syllogisms & Statements', body: T`<h2>1. Translate statements precisely</h2>
<p>Logical reasoning rewards exact interpretation. “All A are B” means every A belongs to B; it does not mean every B is A. “Some A are B” means at least one overlap exists. “No A are B” means the sets do not overlap.</p>
<h2>2. Syllogisms</h2>
<p>Represent categories with Venn diagrams. Draw the universal statements first, then place any existence implied by “some.” Do not assume that a category has members unless the statement guarantees it.</p>
<div class="ex"><b>Example.</b> All engineers are graduates. Some graduates are artists. It does not follow that some engineers are artists: the artists could be graduates outside the engineer set.</div>
<h2>3. If-then statements</h2>
<p>For “if P then Q,” P is sufficient for Q and Q is necessary for P. The contrapositive “if not Q then not P” is logically equivalent. The converse “if Q then P” and inverse “if not P then not Q” are not automatically equivalent to the original.</p>
<h2>4. Statements and conclusions</h2>
<p>Use only information provided, not real-world assumptions. A conclusion follows only if it must be true whenever the premises are true. Distinguish possibility from certainty, and watch quantifiers such as all, some, none, only and unless.</p>
<h2>Exam traps</h2><ul><li>“Only A are B” means all B are A.</li><li>“Some” means one or more, not necessarily “some but not all.”</li><li>A conclusion that might be true is not necessarily logically entailed.</li></ul>
<h4>Validity versus truth</h4>
<p>A logical argument is valid when its conclusion follows from its premises; that is different from whether a premise is factually true. For example, “If P then Q; P; therefore Q” is modus ponens. “If P then Q; Q; therefore P” is the fallacy of affirming the consequent.</p>
<p>For syllogisms, translate statements carefully: “all A are B” does not mean “all B are A.” Test whether a proposed conclusion must hold in every arrangement consistent with the premises.</p>
`},

  {id:'code', name:'Coding-Decoding, Analogies & Classification', body: T`<h2>1. Coding-decoding</h2>
<p>Look for a consistent transformation from the original letters/numbers to the coded form. Common rules include shifting letters forward/backward, reversing order, alternating shifts, replacing letters by alphabet positions, or combining two operations.</p>
<div class="ex"><b>Example.</b> If each letter is shifted forward by one, CAT becomes DBU: C→D, A→B, T→U. To decode, shift each coded letter backward by one.</div>
<h2>2. Alphabet positions</h2>
<p>Remember A=1 through Z=26. The reverse position of a letter can be found from 27−position: A↔Z, B↔Y, C↔X. This helps with mirror-alphabet and opposite-letter coding.</p>
<h2>3. Analogies and classification</h2>
<p>An analogy asks for the same relationship, not merely a similar word. Identify the relation explicitly: tool→function, part→whole, cause→effect, degree, sequence, category or synonym/antonym. For odd-one-out questions, test one property shared by most choices.</p>
<div class="ex"><b>Reasoning example.</b> Thermometer : temperature :: barometer : pressure. The relation is instrument-to-quantity measured.</div>
<h2>4. A disciplined method</h2><ul><li>Compare at least two letter positions before guessing the code.</li><li>Test the rule on every character, including repeated letters.</li><li>For number codes, inspect differences, ratios, squares and digit operations.</li><li>For analogies, phrase the relationship in a short sentence and apply that exact sentence to the answer choices.</li></ul>
<h2>Common trap</h2><p>One example may fit several possible rules. Prefer the simplest rule that explains all given examples and verify it on every position.</p>
<h4>Coding-decoding: infer the rule</h4>
<p>Check simple transformations first: letter shifts, reverse order, alternating rules, position numbers (A=1 through Z=26), or a combination. For example, shifting each letter forward by 2 maps CAT to ECV. If a rule wraps past Z, confirm whether it cycles back to A.</p>
<p>Do not infer a complicated rule from only one example if several rules fit. Use every given pair to test the hypothesis, then apply the simplest consistent transformation.</p>
`},

  {id:'vis', name:'Visual Patterns, Figure Series & Mirror Images', body: T`<h2>1. How to approach visual patterns</h2>
<p>Visual reasoning tests systematic changes in shapes. Do not stare at the whole figure at once; inspect one feature at a time: count, position, orientation, shading, size, line type and overlap.</p>
<h2>2. Rotation and reflection</h2>
<p>A rotation turns a figure around a point; a reflection flips it across an axis. They are not the same: a shape with a directional mark can distinguish clockwise rotation from mirror reversal. Track a marked corner or arrow to avoid intuition errors.</p>
<h2>3. Series and matrices</h2>
<p>Across a sequence, ask whether the object rotates by a fixed angle, adds/removes one element, alternates shading, moves one position, or combines the previous two figures. In a 3×3 visual matrix, inspect each row and column for the same transformation rule.</p>
<div class="ex"><b>Example strategy.</b> If a triangle rotates 90° clockwise at each step, its orientation after two steps is 180° from the start. Check whether any internal dot or shaded region rotates with the triangle or stays fixed.</div>
<h2>4. Mirror-image questions</h2>
<p>A vertical mirror reverses left and right but not top and bottom. A horizontal mirror reverses top and bottom. Clock hands, letters and asymmetric arrows are useful anchors for deciding the transformation.</p>
<h2>Exam checklist</h2><ul><li>Count elements before analysing their shape.</li><li>Check rotation, reflection and translation separately.</li><li>Track a distinctive feature through every frame.</li><li>Use the same rule across the entire sequence or matrix, not just one pair.</li></ul>`},

  {id:'di', name:'Data Interpretation', body: T`<h2>1. Read before calculating</h2>
<p>Data interpretation uses tables, bar charts, line graphs, pie charts and mixed displays. First read the title, units, legend, time range and whether values are absolute counts, percentages or rates. Many errors come from using the wrong unit or denominator.</p>
<h2>2. Common calculations</h2>
<p>Percentage change=(new−old)/old×100. Ratio a:b means a/b. Pie-chart angle=(category/total)×360°. If a chart uses stacked bars, add only the relevant segments; do not confuse a segment value with the total.</p>
<div class="ex"><b>Example.</b> Sales rise from 240 units to 300 units. Increase=60; percentage increase=60/240×100=25%. The denominator is the original value, 240.</div>
<h2>3. Averages and weighted values</h2>
<p>Average across equal-sized groups may be averaged directly; unequal-sized groups require weighting by group size. For example, if 20 students average 70 and 30 students average 80, combined average=(20×70+30×80)/50=76, not 75.</p>
<h2>4. Efficient workflow</h2><ul><li>Locate the two values and units needed.</li><li>Estimate before exact arithmetic.</li><li>Keep percentage change distinct from percentage-point change.</li><li>For pie charts, check that category shares sum to 100% (allowing rounding).</li><li>For multi-step questions, write intermediate totals to avoid mixing categories.</li></ul>
<h2>Common trap</h2><p>A rise from 20% to 25% is an increase of 5 percentage points, but a relative increase of 25%. Read the wording carefully.</p>
<h4>Data interpretation: calculate before comparing</h4>
<p>For a table or chart, identify the denominator and unit before calculating. Percentage share is <code>part/whole×100</code>; percentage growth is <code>(new−old)/old×100</code>. A difference of 10 units is not necessarily a 10% change.</p>
<p>Estimate first to catch arithmetic errors, then calculate precisely. Check whether chart axes start at zero; a truncated axis can visually exaggerate differences. Keep units consistent when combining thousands, lakhs, millions or percentages.</p>
`},

  {id:'verb', name:'Verbal Ability & Comprehension', body: T`<h2>1. Read for meaning, not just keywords</h2>
<p>Verbal ability may test comprehension, grammar, vocabulary, sentence ordering and inference. Read the complete sentence or passage before choosing an answer. A familiar word can change meaning with context, and an option that sounds plausible may still be unsupported by the passage.</p>
<h2>2. Main idea and inference</h2>
<p>The main idea is the central claim that organises the passage. A detail supports that claim but is not necessarily the main point. An inference must follow from the text; it should not introduce outside assumptions or stronger claims than the author makes.</p>
<h2>3. Grammar and sentence structure</h2>
<p>Check subject-verb agreement, tense consistency, pronoun reference, parallel structure, modifiers and articles. In long sentences, identify the main subject and verb first; intervening phrases can distract from agreement.</p>
<div class="ex"><b>Example.</b> “Each of the circuits are tested” is incorrect in standard usage because “each” is singular. Write “Each of the circuits is tested.”</div>
<h2>4. Vocabulary in context</h2>
<p>Use nearby contrast words (however, although), cause words (because, therefore) and examples to infer meaning. For sentence completion, test whether the selected word fits both grammar and the passage's logic.</p>
<h2>5. Time-saving method</h2><ul><li>Read the question first when it helps you target the passage.</li><li>Eliminate options contradicted by the text.</li><li>Prefer the answer supported by explicit evidence, not the most dramatic one.</li><li>For sentence rearrangement, identify opening context, pronoun references, transition words and the concluding idea.</li></ul>
<h4>Reading comprehension strategy</h4>
<p>Answer from the passage rather than from outside assumptions. Distinguish the author's claim, evidence, inference and tone. A statement can be plausible in general but still be unsupported by the text.</p>
<p>For grammar and sentence correction, check subject–verb agreement, pronoun reference, parallel structure, tense consistency and modifier placement. Prefer the clearest grammatically correct option, not the most elaborate one.</p>
`}
  ]
}

];

const DEEP_GUIDES = {
 math:{label:'Mathematical reasoning',intuition:'Mathematics is a toolkit for turning a physical or abstract question into a structure you can manipulate. First identify the object (matrix, function, random variable, differential equation or vector field); then identify what is being asked; only then choose the theorem or computation.',steps:['Write down the given quantities and the unknown clearly.','Identify the mathematical family and its assumptions (dimension, continuity, independence, boundary/initial conditions).','Choose the shortest valid method and simplify symbolically before substituting numbers.','Check units, domain, sign, limiting cases and whether the answer satisfies the original condition.'],traps:['A formula may require assumptions such as independence, differentiability or a nonzero determinant.','Do not confuse a necessary condition with a sufficient condition.','Check endpoint behaviour and singular cases; algebraic cancellation can hide an excluded value.'],worked:'For a matrix problem, inspect dimensions and rank before expanding determinants. For calculus, simplify the expression and identify the relevant theorem before differentiating or integrating. For probability, define the event/random variable first and verify that probabilities sum to one.',checks:['Can I state the theorem’s assumptions?','Can I solve a small numerical example without looking at the notes?','Can I check the result by a second method or a limiting case?']},
 net:{label:'Circuit reasoning',intuition:'A circuit is a set of constraints. KCL expresses charge conservation at nodes, KVL expresses energy conservation around loops, and each element contributes its voltage-current law. The solution is the set of values satisfying all constraints simultaneously.',steps:['Mark reference ground, node voltages, branch currents and polarities.','Count independent nodes/loops to avoid redundant equations.','Choose nodal analysis when there are fewer essential nodes; choose mesh analysis when there are fewer meshes.','Keep dependent sources active; deactivate only independent sources when finding equivalent resistance.','Solve the linear equations, then verify KCL, KVL and power balance.'],traps:['A current source is opened and a voltage source shorted only when independently deactivated.','A negative solved current means the real direction is opposite to your assumed arrow.','Maximum power transfer does not mean maximum efficiency.','Use RMS values in average AC power formulas unless the formula says otherwise.'],worked:'For a Thevenin equivalent, remove the load, find open-circuit voltage, then find resistance seen from the terminals with independent sources deactivated (or use a test source when dependent sources remain). Reconnect the load only after the equivalent is established.',checks:['Are current directions and voltage polarities consistent?','Did I preserve dependent sources?','Does the calculated power satisfy the circuit’s energy balance?']},
 sig:{label:'Signal and system reasoning',intuition:'A signal represents information as a function of time or index. A system transforms an input into an output. The most powerful habit is to classify the signal/system first, then select a representation (time domain, frequency domain, Laplace or Z domain) that makes the operation easier.',steps:['Classify continuous/discrete, periodic/aperiodic, energy/power and causal/noncausal.','For systems, test linearity, time invariance, causality and BIBO stability separately.','For LTI systems, find the impulse response and use convolution or the transform-domain product.','Track transform conventions, initial/rest conditions and the region of convergence.','For sampling, compare the sampling rate with the highest signal frequency and check for anti-alias filtering.'],traps:['Causality and stability are different properties.','A pole-zero plot alone may not determine ROC for a bilateral transform.','Convolution involves time reversal and shifting; do not confuse it with pointwise multiplication.','The Nyquist rate is at least twice the highest frequency for ideal bandlimited sampling; practical systems need margin and anti-alias filtering.'],worked:'For an LTI system described by a differential/difference equation, transform under the stated initial/rest assumptions, solve for the transfer function, identify poles and zeros, and then use the impulse response or frequency response to answer the requested property.',checks:['Can I distinguish a signal property from a system property?','Can I sketch the ROC and explain what it means?','Can I predict output behaviour before doing the full calculation?']},
 ana:{label:'Analog circuit reasoning',intuition:'Analog circuits are built from device laws plus circuit constraints. The efficient method is to determine the operating region first, solve the DC bias point, and only then use a small-signal model for gain, input/output resistance and frequency response.',steps:['Identify supply rails, device type, terminal conventions and intended operating region.','Solve DC bias with capacitors open and small-signal sources set to zero.','Check the assumed region against junction voltages and current conditions.','Replace the active device with the appropriate small-signal model.','Derive gain and impedances, then include coupling/bypass capacitors and parasitic capacitances for frequency limits.'],traps:['A transistor model is valid only in its assumed operating region.','Do not mix DC and incremental quantities without labelling them.','The ideal op-amp assumptions do not permit arbitrary output voltage or current.','Miller effect depends on gain and can strongly change input capacitance.'],worked:'For a common-emitter/common-source stage, establish the quiescent point first, calculate small-signal transconductance, form the incremental equivalent circuit, then derive midband gain and identify the dominant low/high-frequency poles.',checks:['Is the device biased in the intended region?','Did I state the small-signal model assumptions?','Are gain sign, units and limiting behaviour plausible?']},
 dig:{label:'Digital logic reasoning',intuition:'Digital design is about mapping a specification into Boolean functions and then into state or combinational hardware. Keep the truth table, Boolean expression, timing and implementation as separate representations of the same design.',steps:['Translate the verbal specification into inputs, outputs and a truth table.','Simplify with Boolean algebra or K-map while respecting don’t-care conditions.','Choose a suitable implementation: gates, MUX, decoder, arithmetic block or sequential machine.','For sequential logic, define states, reset behaviour and next-state/output equations.','Check timing: propagation delay, setup/hold, clock edges and hazards.'],traps:['K-map groups must be powers of two and wrap around edges.','A latch is level-sensitive; a flip-flop is edge-triggered.','Setup/hold violations are timing failures, not Boolean-logic errors.','Don’t-care states can simplify logic, but only if the specification truly permits them.'],worked:'For an FSM, write the state diagram, build a state table, choose an encoding, derive next-state equations, simplify them, implement the registers and combinational logic, and inspect reset and unreachable-state behaviour.',checks:['Does the truth table match the original specification?','Did I distinguish combinational from sequential behaviour?','Have I checked timing and reset conditions?']},
 ctl:{label:'Feedback and stability reasoning',intuition:'Control theory asks how a system responds and whether feedback makes its behaviour accurate, fast and stable. The characteristic equation determines closed-loop poles; the response specifications tell you where those poles should be.',steps:['Draw the physical signal flow and define input, output, disturbance and feedback sign.','Derive the plant/controller transfer functions under stated assumptions.','Reduce the block diagram carefully and write the closed-loop characteristic equation.','Assess stability before tuning; then evaluate transient response and steady-state error.','Use root locus, Bode/Nyquist or state-space tools according to the question.'],traps:['Negative feedback signs must be preserved during block reduction.','A stable open-loop plant does not guarantee a stable closed-loop system for every controller.','Dominant-pole approximations work only when other poles are sufficiently faster.','Gain margin and phase margin are meaningful only with the relevant crossover definitions.'],worked:'For unity negative feedback, start from T(s)=G(s)/(1+G(s)); the roots of 1+G(s)=0 are the closed-loop poles. Then evaluate pole locations, damping/natural frequency, steady-state error constants and robustness as requested.',checks:['Have I identified the feedback sign?','Did I separate stability, transient response and steady-state accuracy?','Can I connect pole location to physical response?']},
 com:{label:'Communication-system reasoning',intuition:'A communication link converts information into a waveform, sends it through a noisy/channel-limited medium, and estimates the transmitted information at the receiver. Track bandwidth, power, noise and probability of error together rather than treating them as unrelated formulas.',steps:['Identify the message, modulation format, channel and receiver decision rule.','Calculate the relevant bandwidth and average/peak power with the correct convention.','Refer noise to the specified point and convert SNR/energy-per-bit ratios carefully.','For digital modulation, map bits to symbols and identify the detector and decision regions.','Check whether the requested metric is bit error rate, symbol error rate, SNR or spectral efficiency.'],traps:['Bit error probability and symbol error probability are not generally equal.','SNR and Eb/N0 are related through bit rate and bandwidth; do not interchange them blindly.','Coherent and noncoherent detection have different performance.','Quantisation noise, channel noise and intersymbol interference are different mechanisms.'],worked:'For a digital modulation problem, draw the constellation, state the assumed noise model and detector, identify the minimum decision distance, then use the appropriate error-probability expression and convert to the metric requested.',checks:['Have I used the correct bandwidth definition?','Is the noise model explicit?','Am I reporting bit or symbol performance?']},
 em:{label:'Electromagnetic-field reasoning',intuition:'Electromagnetics links fields to sources and boundary conditions. Begin with geometry and material properties, choose the right coordinate system, and use Maxwell’s equations or transmission-line models that match the physical regime.',steps:['Sketch the geometry, coordinate system, propagation direction and field polarisation.','List material parameters and assumptions (lossless/lossy, uniform plane wave, steady state).','Choose the relevant Maxwell equation, boundary condition or transmission-line relation.','Track phasor sign convention, propagation constant and units consistently.','Check power flow, limiting cases and boundary continuity.'],traps:['TE/TM labels are defined relative to the direction of propagation or guide axis.','Intrinsic impedance, characteristic impedance and wave impedance are related but not interchangeable in every context.','Reflection coefficient is complex; VSWR uses its magnitude.','A TEM mode cannot propagate in a hollow single-conductor waveguide.'],worked:'At a dielectric boundary, determine intrinsic impedances and incidence angle, apply tangential field boundary conditions, solve reflection/transmission coefficients, then verify power conservation for a lossless interface.',checks:['Is the coordinate and phasor convention stated?','Have I applied the correct boundary conditions?','Does the power flow point in the expected direction?']},
 dev:{label:'Semiconductor-device reasoning',intuition:'Device behaviour follows carrier populations, electric fields and junction conditions. Translate the bias into a physical operating region, then select the large-signal or small-signal model appropriate to the question.',steps:['Identify device structure, terminal polarity and bias conditions.','Determine the operating region using junction bias and terminal-voltage conditions.','Apply the relevant current-voltage relation or characteristic curve.','For incremental analysis, linearise at the operating point and compute model parameters.','Check power dissipation, temperature effects and model validity.'],traps:['The threshold voltage is not the same as the minimum useful supply voltage in every circuit.','Small-signal parameters depend on the DC operating point.','Breakdown mechanisms and forward conduction are distinct.','Ideal equations become inaccurate at high current, high frequency or strong temperature variation.'],worked:'For a MOSFET bias problem, calculate VGS and VDS, compare VDS with the overdrive voltage, select cutoff/triode/saturation equations, solve the operating point and verify the region assumption afterward.',checks:['Did I prove the operating region rather than assume it?','Are terminal signs consistent with the device type?','Are the model’s limits relevant here?']},
 mic:{label:'Processor and embedded reasoning',intuition:'A processor executes instructions by moving data through registers, buses, memory and peripherals. Embedded questions become easier when the instruction-level behaviour, address map, timing and hardware side effects are made explicit.',steps:['Identify the CPU family, word size, register set and memory/I/O model.','Trace each instruction: fetch, decode, operand access, execution and flag updates.','Track addresses, data widths, stack effects and condition flags line by line.','For peripherals, check clocking, pin multiplexing, register configuration and interrupt priority.','For real-time code, consider latency, deadlines, atomicity and shared-state access.'],traps:['An address can refer to memory or an I/O register depending on architecture.','Interrupt flags may need explicit clearing; exact behaviour is peripheral-specific.','Volatile prevents certain compiler optimisations but does not make operations atomic.','UART, SPI and I²C differ in clocking, framing, addressing and electrical behaviour.'],worked:'For an assembly trace, make a table of PC, instruction, affected registers, flags, memory writes and stack pointer after each instruction. Never skip implicit effects such as auto-increment or flag updates.',checks:['Can I trace every register and memory change?','Have I checked instruction width and addressing mode?','Is the peripheral timing/configuration consistent with the clock?']},
 me:{label:'Measurement reasoning',intuition:'Measurement is an estimate of a true quantity, produced by a sensor, conversion chain and instrument. The result is only meaningful when range, loading, calibration, uncertainty and bandwidth are considered.',steps:['Define the measurand, range, expected accuracy and operating conditions.','Choose the transducer/instrument and identify its transfer function and loading effect.','Separate systematic error, random error, resolution and calibration uncertainty.','Propagate uncertainty through calculations with appropriate sensitivity coefficients.','Check calibration, grounding, bandwidth, sampling and environmental effects.'],traps:['Accuracy and precision are not synonyms.','Instrument input impedance can alter the circuit being measured.','Resolution is not the same as accuracy.','A calibration correction does not automatically remove uncertainty.'],worked:'For a bridge or sensor chain, write the measurement equation, identify each uncertain input, linearise the equation if appropriate, combine independent uncertainty contributions and report the result with units and sensible significant figures.',checks:['What exactly is being measured?','What are the dominant error sources?','Could the instrument change the value being measured?']},
 pw:{label:'Power-electronics reasoning',intuition:'Power converters control energy by switching semiconductor devices. Average conversion ratios come from the inductor/capacitor volt-second and charge balance under stated conduction modes; real performance depends on switching losses, ripple and protection.',steps:['Draw the switching states and current paths for each interval.','State continuous/discontinuous conduction and ideal/nonideal assumptions.','Apply inductor volt-second balance and capacitor charge balance over one period.','Derive conversion ratio, ripple and device stress.','Then account for efficiency, thermal limits, gate drive, snubbers and protection.'],traps:['Duty-ratio formulas change with topology and conduction mode.','An inductor current or capacitor voltage cannot change instantaneously in the ideal model.','Switching and conduction losses are different and both matter.','Never ignore dead time, reverse recovery or safe operating area in hardware design.'],worked:'For an ideal buck converter in CCM, equate average inductor voltage to zero over a period: D(Vin−Vo)+(1−D)(−Vo)=0, giving Vo=D Vin. Then calculate ripple and verify current remains continuous.',checks:['Have I drawn each switch state correctly?','Are CCM/DCM assumptions satisfied by the calculated current?','Have I checked device voltage/current and thermal stress?']},
 dsp:{label:'Discrete-time signal-processing reasoning',intuition:'DSP represents signals as samples and uses transforms and digital filters to analyse or change them. The key is to keep sequence indexing, transform convention, sampling rate and finite-precision effects consistent.',steps:['Write the sequence and index range explicitly.','Choose DTFT, DFT, Z-transform or FFT based on whether the task is analysis, finite-block computation or system behaviour.','Use symmetry and transform properties before performing long sums.','For filters, inspect poles/zeros, causality, stability, phase and implementation structure.','Check quantisation, overflow, leakage, windowing and sample-rate conversion when relevant.'],traps:['The DFT assumes a periodic extension of the finite block.','Zero-padding improves spectral interpolation but does not create new information or true resolution.','A causal IIR filter is BIBO stable only when its poles satisfy the relevant stability condition.','Linear phase is straightforward for FIR structures with symmetric/antisymmetric coefficients, not arbitrary IIR filters.'],worked:'For a radix-2 FFT, verify N is a power of two, identify bit-reversal ordering, apply butterflies stage by stage and check a small N case against the direct DFT.',checks:['Are the indices and transform convention correct?','Did I distinguish FFT algorithm from DFT definition?','Have I checked filter stability and finite-word-length effects?']},
 mw:{label:'Microwave-system reasoning',intuition:'Microwave circuits are often best described using travelling waves and power flow rather than only lumped voltages/currents. S-parameters, matching and guided-wave modes make the measurement setup part of the problem.',steps:['Identify frequency band, structure and propagation mode.','Calculate cutoff, propagation constant or guide wavelength as applicable.','Use reference impedance and wave direction consistently for S-parameters.','Translate reflection coefficient into return loss, VSWR or mismatch loss as required.','Account for calibration planes, connector losses and measurement uncertainty.'],traps:['Below cutoff, a waveguide mode is evanescent rather than power-propagating.','S11 and S21 depend on reference impedance and port definitions.','Return loss is positive by common convention while S11 in dB is often negative.','A perfect match at one frequency does not imply broadband matching.'],worked:'Given |Γ|, compute VSWR=(1+|Γ|)/(1−|Γ|), return loss=−20 log10|Γ| and mismatch loss=−10 log10(1−|Γ|²), checking that the reflection magnitude lies between zero and one for a passive matched reference case.',checks:['What are the port reference impedances?','Is the mode above cutoff?','Am I using linear magnitude or dB correctly?']},
 op:{label:'Optical-link reasoning',intuition:'An optical link carries information through a source, fibre channel and detector. The link budget tracks optical power while dispersion and bandwidth determine how quickly pulses can travel without overlapping.',steps:['Identify wavelength, source power, receiver sensitivity and fibre type.','Calculate fibre attenuation and connector/splice losses over the link length.','Include engineering margin and compare received power with sensitivity.','Evaluate dispersion, bit rate, pulse broadening and bandwidth-distance limits.','Check detector type, wavelength compatibility and any amplifier/repeater assumptions.'],traps:['dB losses add; linear powers multiply through ratios.','Attenuation and dispersion are different limitations.','Numerical aperture and acceptance angle depend on refractive indices and the medium outside the fibre.','A positive power margin is necessary but does not guarantee dispersion performance.'],worked:'Compute received power in dBm as transmitter power minus fibre loss minus connection/splice losses; subtract receiver sensitivity to obtain margin. Then independently verify the dispersion/bandwidth constraint.',checks:['Did I keep dBm and dB operations consistent?','Did I include all loss terms and a margin?','Have I checked both power budget and dispersion?']},
 apt:{label:'Aptitude problem-solving',intuition:'Aptitude rewards clear variable definitions, unit discipline and efficient estimation. Translate the wording into a small equation or diagram before calculating; use exact arithmetic only when it changes the answer choice.',steps:['Underline what is asked and list the given values with units.','Choose a representation: ratio table, timeline, work-rate table, diagram, Venn diagram or probability tree.','Reduce fractions and use proportional reasoning before multiplying large numbers.','Estimate the magnitude, then calculate accurately enough to distinguish options.','Check whether the answer is logically possible and matches the requested units.'],traps:['Average speed is total distance divided by total time, not generally the mean of speeds.','Work rates add; completion times do not.','Percentage increases and decreases use different bases.','In data interpretation, inspect axis scales and totals before comparing bars.'],worked:'For work-rate questions, define each person’s rate as work per unit time, add rates for simultaneous work, and invert the combined rate to get completion time. Keep units consistent throughout.',checks:['Can I estimate the answer before calculating?','Have I used the correct base for each percentage?','Does the final unit match the question?']}
};

function escapeDeepText(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function topicTags(t){
 const text=(t.name+' '+t.body.replace(/<[^>]*>/g,' ')).toLowerCase();
 const tags=[];
 [['formula',/formula|equation|transfer function|gain|impedance|probability|transform/],['diagram',/diagram|plot|figure|circuit|block|state/],['derivation',/derive|derivation|theorem|proof|equation/],['numerical practice',/example|calculate|solve|value|numerical/],['conceptual MCQ',/stability|causality|bias|mode|property|principle/]].forEach(([n,r])=>{if(r.test(text))tags.push(n)});
 return (tags.length?tags:['conceptual MCQ','worked problems','revision']).map(x=>`<span class="deep-tag">${x}</span>`).join('');
}
function deepDive(s,t){
 const g=DEEP_GUIDES[s.id]||DEEP_GUIDES.math;
 const title=escapeDeepText(t.name);
 const plain=t.body.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
 const excerpt=plain.length>700?plain.slice(0,700).replace(/\s+\S*$/,'')+'…':plain;
 const steps=g.steps.map((x,i)=>`<div class="deep-step"><span class="deep-num">${i+1}</span><div>${x}</div></div>`).join('');
 const traps=g.traps.map(x=>`<li>${x}</li>`).join('');
 const checks=g.checks.map((x,i)=>`<label><input type="checkbox" data-deep-check="${s.id}/${t.id}/${i}"><span>${x}</span></label>`).join('');
 return `<section class="deep-master" aria-label="Topic study guide">
   <h2>Topic Study Guide</h2>
   <p class="deep-lead">An additional guided layer for <b>${title}</b>. Your original lesson above is preserved; use this section to connect the theory to exam-style problem solving.</p>
   <div>${topicTags(t)}</div>
   <div class="deep-grid">
    <div class="deep-card"><h3>1 · The mental model</h3><p>${g.intuition}</p><p><b>Apply it to this topic:</b> ${escapeDeepText(t.name)} should be treated as a model with stated assumptions, defined variables and a result that can be checked independently.</p></div>
    <div class="deep-card"><h3>2 · Step-by-step attack plan</h3>${steps}</div>
    <div class="deep-card"><h3>3 · Worked-problem strategy</h3><p>${g.worked}</p><p><b>Before calculating:</b> write the requested quantity, the known values and the assumptions in one place.</p></div>
    <div class="deep-card"><h3>4 · Common traps to avoid</h3><ul>${traps}</ul></div>
   </div>
   <h3>Use the original notes actively</h3>
   <p>Here is a short extract of the existing lesson to revisit while studying. The full original explanation, formulas, examples and diagrams remain above.</p>
   <details><summary>Show lesson recap</summary><p>${escapeDeepText(excerpt)}</p></details>
   <h3>Active recall checklist</h3>
   <div class="deep-card deep-check">${checks}</div>
   <div class="deep-quiz">
    <h3>Self-test prompts</h3>
    <details><summary>Explain ${title} in 60 seconds without looking at the notes.</summary><p>Include: definition, assumptions, governing relationship, one real interpretation, and one limitation. If any part is missing, revisit that subsection and explain it again in your own words.</p></details>
    <details><summary>How would I solve a standard numerical question from this topic?</summary><p>State the data and units, write the governing equation before substituting, show intermediate steps, then verify the result by checking dimensions, signs, limits or an independent relation.</p></details>
    <details><summary>What changes if one assumption is removed?</summary><p>Identify which step of the method relies on that assumption. Explain whether the formula changes, the method becomes invalid, or an extra parameter/boundary condition is needed.</p></details>
    <details><summary>Make one exam trap of my own.</summary><p>Create two nearly identical answer choices where one confuses a definition, sign convention, unit or special case. Explain why the wrong option is tempting and exactly why it fails.</p></details>
   </div>
   <div class="tip"><b>Completion check</b> Mark this topic as complete only when you can explain the idea, reproduce its key formulas, solve one numerical problem without notes, and identify at least one common trap.</div>
  </section>`;
}

function subjProgress(s){
  const d=s.topics.filter(t=>done[s.id+'/'+t.id]).length;
  return {d,n:s.topics.length,pct:s.topics.length?Math.round(100*d/s.topics.length):0};
}
function globalProgress(){
  const d=Object.keys(done).filter(k=>done[k]).length;
  return {d,pct:Math.round(100*d/TOTAL)};
}
function updateTopProgress(){
  const g=globalProgress();
  $('#pfill').style.width=g.pct+'%';

}
function renderMath(el){
  if(!window.renderMathInElement) return;
  renderMathInElement(el,{
    delimiters:[

      {left:'\\(',right:'\\)',display:false},
      {left:'$',right:'$',display:false}
    ],
    throwOnError:false
  });
}

window.addEventListener('hashchange',route);
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const p=h.split('/').filter(Boolean);
  if(p[0]==='t'&&p[1]&&p[2]) renderTopic(p[1],p[2]);

  else if(p[0]==='formulas') renderFormulas();
  else renderHome();
  window.scrollTo(0,0);
}
