<p>Average real power is <code>P=VI cosφ</code>; reactive power is <code>Q=VI sinφ</code>; apparent power is <code>|S|=VI</code>, using RMS magnitudes. Keep peak and RMS values consistent throughout a calculation.</p>
`},

  {id:'res', name:'Resonance, Q-Factor, Bandwidth & Coupled Circuits', body: T`<h2>1. Resonance in RLC circuits</h2><p>Resonance occurs when inductive and capacitive reactances cancel: ω0L=1/(ω0C). Therefore \(\omega_0=1/\sqrt{LC}\) and \(f_0=1/(2\pi\sqrt{LC})\). At resonance, a series RLC circuit has impedance R and current is maximum for a fixed voltage; an ideal parallel resonant circuit can have high input impedance.</p><h2>2. Quality factor and bandwidth</h2><p>Quality factor Q measures how selective a resonant circuit is: high Q generally means a narrower bandwidth and sharper resonance. For a simple series RLC, \(Q=\omega_0L/R=1/(\omega_0CR)\). For a lightly damped resonator, bandwidth is approximately \(BW=f_0/Q\). Be careful: formulas differ between series and parallel configurations and with loading.</p><div class="ex"><b>Example.</b> If a resonator has f0=1 MHz and Q=50, its approximate bandwidth is 1 MHz/50=20 kHz. A higher Q at the same resonant frequency gives a narrower bandwidth.</div><h2>3. Coupled circuits</h2><p>Two inductors are magnetically coupled when flux from one links the other. Mutual inductance M is related to self-inductances by \(M=k\sqrt{L_1L_2}\), with coupling coefficient 0≤k≤1 for ideal passive coupling. Dot convention determines whether mutual terms appear as +jωM or −jωM in the equations. The sign follows whether referenced currents enter or leave dotted terminals together.</p><h2>4. Interpreting resonance questions</h2><ul><li>Calculate ω0 in rad/s and f0 in Hz separately.</li><li>Identify whether the circuit is series or parallel before deciding what is maximum at resonance.</li><li>Use Q and bandwidth relationships only under the stated/simple resonator assumptions.</li><li>Account for load resistance: loading red
${FIGSLOT('resonance')}
uces selectivity and changes the effective Q.</li><li>For coupled inductors, draw the dots and define current directions before assigning mutual-voltage signs.</li></ul>
<h4>Series resonance calculation</h4>
<p>For <code>L=10 mH</code> and <code>C=100 nF</code>, <code>f₀=1/(2π√LC)≈5.03 kHz</code>. At ideal series resonance, <code>X_L=X_C</code>, net reactance is zero, impedance is minimum and equal to R, and current is maximum for a fixed source voltage. The power factor is unity at resonance for the ideal series RLC circuit.</p>
<p>In a parallel resonant circuit, source current is typically minimum near resonance, but practical coil resistance and circuit topology alter the exact result. Do not transfer every series-resonance statement directly to parallel resonance.</p>
`},

  {id:'twoport', name:'Two-Port Networks — Z, Y, h, ABCD', body: T`<h2>1. What is a two-port network?</h2><p>A two-port has an input port and an output port, each consisting of a pair of terminals. The variables are port voltages V1,V2 and currents I1,I2, with currents conventionally defined entering the network. Two-port parameters summarise the relationship between these variables and simplify amplifier, filter and cascade analysis.</p><h2>2. Parameter sets</h2><p><b>Z parameters:</b> \(V_1=z_{11}I_1+z_{12}I_2\), \(V_2=z_{21}I_1+z_{22}I_2\). They are found using open-circuit conditions on the opposite port. <b>Y parameters:</b> currents are expressed in terms of voltages and are found using short-circuit conditions. <b>h parameters:</b> hybrid form uses V1 and I2 as dependent variables. <b>ABCD parameters:</b> relate input variables to output variables and are especially useful for cascaded networks; sign conventions vary, so read the definition used.</p><h2>3. Physical meaning and tests</h2><p>For Z parameters, z11 is input impedance with I2=0 (output open), and z22 is output impedance with I1=0. z12 and z21 are transfer impedances. A reciprocal network often satisfies z12=z21 (or corresponding conditions in another parameter set). Symmetry for a reciprocal two-port often gives z11=z22. These conditions require the appropriate network assumptions.</p><div class="ex"><b>How to extract z11.</b> Open port 2, drive port 1 with a test current I1, measure V1, and calculate z11=V1/I1. Then measure V2 to obtain z21=V2/I1. Repeat with port 1 open to obtain the second column.</div><h2>4. Loading and cascade</h2><p>When a load is connected at port 2, it changes the relationship between V2 and I2 and therefore the input impedance seen at port 1. ABCD matrices are powerful for cascades because the overall matrix is the product of the stage matrices in the correct order. Do not multiply parameter matrices from different definitions without converting conventions.</p><h2>5. Common traps</h2><ul><li>State whether currents enter or leave each port.</li><li>Open-circuit tests are used for Z parameters; short-circuit tests for Y parameters.</li><li>Do not confuse reciprocity with symmetry.</li><li>ABCD sign conve
${FIGSLOT('twoport')}
ntions differ between textbooks; use the equations supplied in the question.</li><li>Two-port parameters describe terminal behaviour under their assumptions, not every internal detail.</li></ul>
<h4>Two-port parameter meaning</h4>
<p>For Z-parameters, <code>V₁=z₁₁I₁+z₁₂I₂</code> and <code>V₂=z₂₁I₁+z₂₂I₂</code>, with currents defined entering both ports. The open-circuit conditions used to measure Z-parameters are important because they set the opposite port current to zero. For Y-parameters, the corresponding convenient condition is short circuit, setting the opposite port voltage to zero.</p>
<p>For a reciprocal two-port, <code>z₁₂=z₂₁</code>; for a symmetrical two-port, <code>z₁₁=z₂₂</code>. These are different properties. Cascaded networks are often easier to combine using ABCD parameters, provided the current direction convention is consistent.</p>
`},

  {id:'pz', name:'Network Functions, Poles, Zeros & Stability', body: T`<h2>1. Network function</h2><p>A network function is a ratio of a selected output transform to a selected input transform under zero initial conditions, such as voltage gain or transfer impedance. It is generally a rational function of s for lumped linear circuits. The exact function depends on which input and output are selected.</p><h2>2. Poles, zeros and response</h2><p>Zeros are roots of the numerator; poles are roots of the denominator after simplification. Poles describe natural modes and strongly influence transient response. For a term e^(pt), negative real part means decay, positive real part means growth, and imaginary part produces oscillation. Zeros shape the response and may attenuate certain frequencies.</p><div class="ex"><b>Example.</b> For \(H(s)=\frac{s+2}{(s+1)(s+4)}\), the zero is −2 and poles are −1 and −4. Both poles are in the left half-plane, so the causal rational system is stable.</div><h2>3. Frequency response</h2><p>The frequency response is obtained by setting s=jω when the imaginary axis is in the region of convergence. It shows magnitude and phase versus frequency. A pole near the imaginary axis can create a strong, slowly decaying mode; a zero near the imaginary axis can create a notch or attenuation near its frequency.</p><h2>4. Stability and ROC</h2><p>For a causal rational continuous-time system, all poles must lie strictly in the left half-plane for BIBO stability. A transfer function alone may not specify the ROC for a two-sided signal, so stability claims should include causality/ROC assumptions. Pole-zero cancellation in an external transfer function does not necessarily remove an internal unstable mode.</p><h2>5. Quick checks</h2><ul><li>Factor numerator and denominator before listing poles/zeros.</li><li>Cancel common factors only when defining the reduced input-output transfer f
${FIGSLOT('pz')}
unction; remember hidden internal dynamics may remain.</li><li>Use s=jω for frequency response only when it exists.</li><li>Check the final expression against low- and high-frequency limits where meaningful.</li></ul>
<h4>Poles, zeros, and stability intuition</h4>
<p>For a transfer function <code>H(s)=N(s)/D(s)</code>, zeros are roots of <code>N(s)</code> and poles are roots of <code>D(s)</code> after any cancellations are considered. Poles shape natural modes and transient response; zeros shape frequency response and can create notches or nonminimum-phase behavior.</p>
<p>For a causal continuous-time LTI system, BIBO stability requires the ROC to include the imaginary axis and, for a rational system with a right-sided impulse response, all poles must lie strictly in the left half-plane. Pole-zero cancellation in a transfer function can hide an internal mode, so it does not always mean the physical realization is internally stable.</p>
`},

  {id:'graph', name:'Graph Theory & Network Topology', body: T`<h2>1. Why network graphs help</h2><p>A circuit graph records connectivity without carrying all component details. Nodes are vertices; branches are edges. This abstraction helps count independent equations and organise large circuits. A branch may contain a single element or a defined two-terminal subnetwork.</p><h2>2. Paths, loops, trees and links</h2><p>A path joins nodes through branches. A loop is a closed path. A tree connects all nodes without forming a loop; a connected graph with N nodes has N−1 tree branches (twigs). The remaining branches are links or chords. For a connected graph with B branches and N nodes, the number of independent loops is B−N+1.</p><h2>3. Incidence, tie-set and cut-set ideas</h2><p>An incidence matrix records which branches connect to which nodes, using signs to indicate branch orientation. One row is dependent in a connected graph if all node equations are included, because total KCL sums to zero. A tie-set corresponds to adding one link to a tree to form a fundamental loop; a cut-set is a set of branches whose removal separates the graph into components.</p><div class="ex"><b>Count example.</b> A connected circuit graph has 6 branches and 4 nodes. A tree has 4−1=3 twigs, so there are 6−3=3 links and B−N+1=6−4+1=3 independent loops.</div><h2>4. Planarity and duality</h2><p>A planar graph can be drawn on a plane without branches crossing except at nodes. Planar networks can have dual networks where node and loop concepts exchange roles and series/parallel relations may map into dual forms. Not every graph is planar, and drawing a crossing wire without a node does not create an electrical connection.</p><h2>5. Checks and applications</h2><ul><li>Count independent KCL equations as N−1 for a connected graph.</li><li>Count independent loops as B−N+1.</li><li>Choose branch reference directions before building incidence matrices.</li><li>Use graph methods to structure equations; still apply element laws and source constraints.</li><li>Check whether crossing lines represent a junction in the actual circuit diagram.</li></ul>
<h4>Graph theory in circuits</h4>
<p>For a connected graph with <code>b</code> branches and <code>n</code> nodes, the number of independent loops is <code>b−n+1</code>. A spanning tree contains <code>n−1</code> branches; the remaining branches are links, each creating one fundamental loop. The corresponding cut-set viewpoint supports independent KCL equations.</p>
<p>Graph counts help organize equations but do not replace element laws. A circuit's independent equations depend on topology and reference choices, while resistor, source, capacitor, and inductor relationships supply the constitutive equations.</p>
`}
  ]
},

/* ============================================================ 3 SIGNALS */
{
  id:'sig', name:'Signals and Systems', icon:'∿',
  topics:[
  {id:'ctdt', name:'Continuous-Time and Discrete-Time Signals', body: T`<h2>1. What is a signal?</h2>
<p>A <b>signal</b> is a quantity that carries information and varies with an independent variable. A microphone produces a voltage that varies with time; a sensor may produce temperature versus time. We write a continuous-time signal as \(x(t)\), where t can be any real number, and a discrete-time signal as \(x[n]\), where n is an integer sample index.</p>
<p><b>Important:</b> discrete-time does not automatically mean digital. A sampled signal has discrete time indices, but each sample may still have a continuous range of amplitudes. Digital systems additionally represent amplitude using finite quantization levels.</p>
<h2>2. Basic classifications</h2>
<ul><li><b>Real/complex:</b> real signals have real values; complex signals can be written \(x=x_R+jx_I\).</li><li><b>Deterministic/random:</b> a deterministic signal is specified exactly; a random signal is described statistically.</li><li><b>Periodic/aperiodic:</b> continuous-time periodicity means \(x(t+T_0)=x(t)\) for all t and some smallest positive T0. Discrete-time periodicity means \(x[n+N_0]=x[n]\) for a positive integer N0.</li><li><b>Even/odd:</b> even means mirror symmetry, \(x(-t)=x(t)\); odd means \(x(-t)=-x(t)\).</li><li><b>Right-sided/left-sided:</b> a right-sided signal is zero before some time/index; a left-sided signal is zero after some time/index.</li></ul>
<h2>3. Transforming a signal in time</h2>
<p>Amplitude scaling changes height: \(y(t)=A x(t)\). A delay shifts the waveform right: \(x(t-t_0)\); an advance shifts it left: \(x(t+t_0)\). Time reversal reflects it about the vertical axis: \(x(-t)\). For \(x(at)\), |a|&gt;1 compresses the signal in time and 0&lt;|a|&lt;1 expands it. A negative a also reverses it.</p>
<div class="ex"><b>Worked transformation.</b> Rewrite \(x(2t-4)\) as \(x(2(t-2))\). The inside argument equals zero when t=2, so the original signal's origin appears at t=2. The factor 2 compresses the waveform by two, and the shift places it at t=2. To sketch reliably, track a few original landmarks rather than relying on visual intuition alone.</div>
<h2>4. Periodicity tests</h2>
<p>A continuous sinusoid \(A\cos(\omega_0t+\phi)\) with nonzero angular frequency has period \(T_0=2\pi/|\omega_0|\). For a discrete sinusoid \(\cos(\omega_0n+\phi)\), a period N exists only if \(\omega_0N=2\pi k\) for integers N&gt;0 and k; equivalently, \(\omega_0/(2\pi)\) must be rational.</p>
<div class="ex"><b>Example.</b> \(x[n]=\cos(\pi n/3)\). We need \((\pi/3)N=2\pi k\), so N=6k. The smallest positive integer period is N0=6. In contrast, a discrete sinusoid with frequency ratio \(\sqrt2\) relative to 2π is not periodic.</div>
<h2>5. Building and sketching signals</h2>
<p>Piecewise signals can be written with unit steps. A pulse of height A from t1 to t2 is \(A[u(t-t_1)-u(t-t_2)]\). A shifted step turns on at its shift time. An impulse is idealised as having zero duration but unit area; it is used to model an instantaneous event and to probe a system.</p>
<p>When sketching, mark the time axis, identify discontinuities, apply transformations in a consistent order, and check endpoint conventions. A signal may be both periodic and even, or deterministic and complex: classifications are not mutually exclusive.</p>
<h2>6. Common traps and checklist</h2>
<ul><li>\(x(t-t_0)\) is a delay, not an advance.</li><li>For \(x(at)\), the horizontal scale changes inversely with |a|.</li><li>A discrete signal is indexed by integers; values between samples are not automatically defined.</li><li>Fundamental period means the smallest positive period.</li><li>A signal that is both even and odd must be identically zero.</li></ul>
<p>You should be able to classify a signal, sketch scaling/shifting/reversal, express a rectangular pulse using steps, and test periodicity without guessing.</p>
${FIGSLOT('ctdt')}

<h4>Continuous-time versus discrete-time</h4>
<p>A continuous-time signal is written <code>x(t)</code> and is defined for continuous values of time; a discrete-time signal is written <code>x[n]</code> and is indexed by integers. Sampling a continuous signal at interval <code>T_s</code> gives <code>x[n]=x(nT_s)</code>. The sampling interval and sampling frequency are related by <code>f_s=1/T_s</code>.</p>
<p>Time shifting has different notation: <code>x(t−t₀)</code> delays a continuous-time signal by <code>t₀</code>; <code>x[n−n₀]</code> delays a sequence by <code>n₀</code> samples. For time reversal, <code>x[−n]</code> reflects the sequence around zero; it does not simply reverse a finite list unless the indexing origin is handled carefully.</p>
`},

  {id:'energy', name:'Energy, Power, Even/Odd Signals', body: T`<h2>1. Energy versus power: the intuition</h2>
<p>Energy adds the squared signal magnitude over all time. Average power measures the long-term average squared magnitude. Squaring makes positive and negative portions contribute positively and supports complex signals through \(|x|^2=x x^*\).</p>
<p>Continuous-time energy: \(E=\int_{-\infty}^{\infty}|x(t)|^2dt\). Discrete-time energy: \(E=\sum_{n=-\infty}^{\infty}|x[n]|^2\). Average power uses a long symmetric observation window: \(P=\lim_{T\to\infty}\frac{1}{2T}\int_{-T}^{T}|x(t)|^2dt\), or \(P=\lim_{N\to\infty}\frac{1}{2N+1}\sum_{n=-N}^{N}|x[n]|^2\), when the limits exist.</p>
<h2>2. Classifying a signal</h2>
<ul><li><b>Energy signal:</b> \(0&lt;E&lt;\infty\). Its long-term average power is zero.</li><li><b>Power signal:</b> \(0&lt;P&lt;\infty\). Its total energy is infinite.</li><li><b>Neither:</b> energy and average power do not meet either definition; for example, some growing exponentials.</li></ul>
<p>The zero signal is usually classified as neither because both its energy and power are zero. A finite-duration, finite-amplitude pulse is usually an energy signal. A nonzero periodic signal is usually a power signal because it repeats forever.</p>
<div class="ex"><b>Example 1: rectangular pulse.</b> If x(t)=A for 0≤t≤T and zero elsewhere, then \(E=\int_0^T|A|^2dt=|A|^2T\), which is finite. Average power over an ever-longer window tends to zero.</div>
<div class="ex"><b>Example 2: constant signal.</b> For x(t)=A≠0, energy over the whole real line is infinite, but average power is \(|A|^2\). So it is a power signal.</div>
<div class="ex"><b>Example 3: sinusoid.</b> For \(x(t)=A\cos(\omega_0t)\) with nonzero frequency, the average of cos² over a period is 1/2, so \(P=|A|^2/2\). Its energy over infinite time is infinite.</div>
<h2>3. Even and odd decomposition</h2>
<p>Any signal can be split into an even part and an odd part: \(x_e(t)=\frac{x(t)+x(-t)}2\), \(x_o(t)=\frac{x(t)-x(-t)}2\), and \(x=x_e+x_o\). The same formula applies to discrete sequences using x[−n].</p>
<p>Cosine is even and sine is odd. Even×even and odd×odd are even; even×odd is odd. Over symmetric limits, the integral of an integrable odd function is zero. This can simplify energy and Fourier calculations, but only when the relevant symmetry actually holds.</p>
<h2>4. A reliable exam method</h2>
<ol><li>Write the correct energy or average-power definition.</li><li>Use \(|x|^2\), especially if x is complex.</li><li>For finite-duration signals, calculate energy directly.</li><li>For periodic signals, average over one period instead of integrating indefinitely.</li><li>For infinite intervals, use limits and check convergence.</li></ol>
<p>Do not confuse energy with the area \(\int x(t)dt\): signal energy uses squared magnitude. A signal can have zero signed area and still have positive energy.</p>
<h4>Energy versus average power</h4>
<p>For a continuous-time signal, energy is <code>E=∫₋∞∞ |x(t)|²dt</code>; average power is <code>P=lim(T→∞)(1/2T)∫₋Tᵀ|x(t)|²dt</code>, when the limit exists. For a discrete sequence, replace the integral with a sum. A finite-duration nonzero signal usually has finite energy and zero long-term average power; a nonzero periodic signal usually has infinite energy but finite average power.</p>
<p>Example: for <code>x(t)=e^(−at)u(t)</code> with <code>a&gt;0</code>, <code>E=∫₀∞e^(−2at)dt=1/(2a)</code>. The unit step sets the signal to zero for negative time. Use magnitude squared for complex signals, not simply <code>x²</code>.</p>
`},

  {id:'elem', name:'Elementary Signals — Impulse, Step, Ramp, Exponential', body: T`<h2>1. Unit step and impulse</h2>
<p>The unit step \(u(t)\) represents a switch that turns on at t=0: it is zero before zero and one after zero. Its value exactly at zero depends on convention and usually does not change ordinary integrals. A shifted step \(u(t-t_0)\) turns on at t=t0.</p>
<p>The unit impulse \(\delta(t)\) is an idealised signal that is zero away from t=0 and has unit area: \(\int_{-\infty}^{\infty}\delta(t)dt=1\). Its key property is sifting: \(\int x(t)\delta(t-t_0)dt=x(t_0)\), provided the integration interval includes t0. Informally, the impulse “picks out” the signal value at its location.</p>
<p>In discrete time, \(\delta[n]=1\) at n=0 and zero otherwise. It is an ordinary sequence, not a zero-width continuous impulse. The step-impulse relationships are \(du(t)/dt=\delta(t)\) in the generalised sense and \(u[n]-u[n-1]=\delta[n]\).</p>
<h2>2. Ramp, parabola and exponential</h2>
<p>The unit ramp is \(r(t)=t u(t)\); it is zero before t=0 and increases linearly afterwards. Multiplying or shifting ramps can build triangular and piecewise-linear waveforms. A parabolic signal can similarly be written \(t^2u(t)\) up to scaling.</p>
<p>An exponential \(Ae^{at}u(t)\) decays for a&lt;0 and grows for a&gt;0 as t increases. If a is complex, its real part controls growth/decay and its imaginary part creates oscillation. Complex exponentials are central because many system equations respond to them in a simple way.</p>
<h2>3. Sinusoids and Euler's identity</h2>
<p>Euler's identity is \(e^{j\theta}=\cos\theta+j\sin\theta\). Therefore \(\cos\theta=(e^{j\theta}+e^{-j\theta})/2\) and \(\sin\theta=(e^{j\theta}-e^{-j\theta})/(2j)\). This lets us analyse sine waves using exponentials, which simplify differential equations and Fourier transforms.</p>
<h2>4. Rectangular pulses, signum and sinc</h2>
<p>A rectangular pulse from t1 to t2 is \(A[u(t-t_1)-u(t-t_2)]\). The signum function is +1 for positive t and −1 for negative t, with a convention at zero. The normalized sinc is \(\operatorname{sinc}(t)=\sin(\pi t)/(\pi t)\), with its limiting value defined as 1 at t=0. Some references use sin(t)/t, so always check the convention.</p>
<div class="ex"><b>Example.</b> A pulse of amplitude 3 from t=1 to t=4 is \(x(t)=3[u(t-1)-u(t-4)]\). Before 1 both steps are zero; between 1 and 4 only the first is one; after 4 both are one and subtract to zero.</div>
<h2>5. How to solve signal-building questions</h2>
<ul><li>Sketch each step before combining them.</li><li>For an impulse, track its location and weight; \(A\delta(t-t_0)\) has area A.</li><li>For a shifted exponential, inspect both the exponential and the step that restricts its support.</li><li>Use the impulse sampling property only when the integration interval contains the impulse location.</li><li>Use normalized sinc only when the problem's definition matches it.</li></ul>
<p>These signals are building blocks: steps describe switching, impulses probe systems, ramps model linear growth, exponentials describe natural modes, and sinc functions appear in ideal bandlimited
${FIGSLOT('elem')}
 reconstruction.</p>
<h4>Impulse and step relationship</h4>
<p>The unit impulse is the generalized derivative of the unit step: <code>d u(t)/dt=δ(t)</code>. Conversely, <code>u(t)=∫₋∞ᵗδ(τ)dτ</code>. The impulse has zero width and unit area in the idealized model, so its ordinary peak height is not a finite number.</p>
<p>For a continuous-time exponential <code>e^{st}</code>, the real part of <code>s</code> determines growth or decay. If <code>s=σ+jω</code>, then <code>e^{st}=e^{σt}(cosωt+j sinωt)</code>. Positive σ grows, negative σ decays, and zero σ gives a constant-amplitude sinusoidal component.</p>
`},

  {id:'props', name:'System Properties — Linearity, Time-Invariance, Causality, Stability', body: T`<h2>1. A system maps an input to an output</h2>
<p>We write a system as \(y=T\{x\}\). A system might square a signal, delay it, filter it, or combine its past values. To test a property, do not rely on the system's name; apply the definition to an arbitrary input.</p>
<h2>2. Memoryless versus dynamic</h2>
<p>A memoryless system's output at time t depends only on the input at that same time. For example, \(y(t)=x^2(t)\) is memoryless. A system such as \(y(t)=x(t-1)\) has memory because it needs a past input; an integrator also has memory.</p>
<h2>3. Linearity: additivity plus homogeneity</h2>
<p>Linearity requires both additivity and scaling. For any inputs x1,x2 and constants a,b, \(T\{ax_1+bx_2\}=aT\{x_1\}+bT\{x_2\}\). A quick necessary test is zero input must produce zero output. Thus \(y=2x+3\) is not linear because x=0 gives y=3. But passing the zero-input test alone does not prove linearity.</p>
<div class="ex"><b>Example.</b> \(T\{x\}=3x\) is linear: scaling and adding inputs scales and adds the outputs in the same way. \(T\{x\}=x^2\) is nonlinear because \((x_1+x_2)^2\) includes the extra term 2x1x2.</div>
<h2>4. Time invariance</h2>
<p>A system is time-invariant if shifting the input by t0 shifts the output by the same amount, with no other change. If input x(t) produces y(t), then input x(t−t0) must produce y(t−t0). \(y(t)=3x(t)\) is time-invariant; \(y(t)=t x(t)\) is time-varying because the explicit time multiplier changes under a shift.</p>
<div class="ex"><b>Test method.</b> First calculate the output for x(t), then replace the input by x(t−t0) and calculate again. Separately shift the original output. If the two expressions differ for any valid input and shift, the system is time-varying.</div>
<h2>5. Causality and invertibility</h2>
<p>A causal system at time t uses no future input values. \(y(t)=x(t-1)\) is causal; \(y(t)=x(t+1)\) is noncausal. Invertibility means the output uniquely determines the input. \(y=2x\) is invertible with x=y/2, but \(y=x^2\) is not invertible for arbitrary real x because x and −x give the same output.</p>
<h2>6. BIBO stability</h2>
<p>Bounded-input/bounded-output stability means every bounded input (|x|≤M for some finite M) produces a bounded output. A system can be linear but unstable; for example, an ideal integrator can accumulate a bounded constant input into an unbounded ramp.</p>
<h2>7. Interconnections and combinations</h2>
<p>Cascade means the output of one system feeds another; parallel means outputs are added; feedback routes some output back to the input. A combined system may gain or lose properties depending on the blocks and connection. For LTI systems, causality and stability can be tested using the impulse response, which is the next key concept.</p>
<p>Checklist: test linearity with arbitrary inputs, time invariance by shifting, causality by checking future dependence, invertibility by checking uniqueness, and stability using boundedness rather than whether an output “looks reasonable.”</p>
<h4>Test each system property separately</h4>
<p>Linearity requires both additivity and homogeneity: <code>T{ax₁+bx₂}=aT{x₁}+bT{x₂}</code>. Time invariance means shifting the input shifts the output by the same amount. Causality means the output now does not depend on future input. BIBO stability means every bounded input produces a bounded output.</p>
<p>Counterexamples help: <code>y(t)=x²(t)</code> is time-invariant but nonlinear; <code>y(t)=x(t+1)</code> is linear and time-invariant but noncausal; <code>y(t)=t x(t)</code> is linear but time-varying. For an LTI continuous-time system, BIBO stability is equivalent to absolute integrability of <code>h(t)</code>: <code>∫|h(t)|dt&lt;∞</code>.</p>
`},

  {id:'conv', name:'Convolution and Impulse Response', body: T`<h2>1. Why impulse response matters</h2>
<p>For a linear time-invariant (LTI) system, the impulse response h(t) is the output produced by a unit impulse. The remarkable result is that h completely determines the system's zero-state response to any input: the input can be viewed as a weighted collection of shifted impulses, and linearity plus time invariance tells us how their responses add.</p>
<h2>2. Convolution formulas</h2>
<p>Continuous time: \(y(t)=x(t)*h(t)=\int_{-\infty}^{\infty}x(\tau)h(t-\tau)d\tau\). Discrete time: \(y[n]=\sum_{k=-\infty}^{\infty}x[k]h[n-k]\). The star means convolution, not ordinary pointwise multiplication.</p>
<h2>3. The folding-and-sliding picture</h2>
<ol><li>Keep x(τ) fixed.</li><li>Reverse h(τ) to get h(−τ).</li><li>Shift it by t to obtain h(t−τ).</li><li>Multiply the two functions.</li><li>Integrate their product over the overlap. Change t and repeat.</li></ol>
<p>For discrete sequences, replace the integral by a sum. With finite sequences, only the overlapping samples contribute, which makes a table or stem-plot method convenient.</p>
<div class="ex"><b>Worked discrete example.</b> Let x[n]={1,2} and h[n]={1,3}, both starting at n=0. Then y[0]=1·1=1; y[1]=1·3+2·1=5; y[2]=2·3=6. Therefore y[n]={1,5,6}. The output length is 2+2−1=3.</div>
<h2>4. Limits and finite sequence length</h2>
<p>For finite sequences with lengths Lx and Lh, full linear convolution has length \(L_y=L_x+L_h-1\). For causal signals starting at zero, the sum often reduces to \(y[n]=\sum_{k=0}^{n}x[k]h[n-k]\), with limits adjusted to the actual supports. Always track starting indices; sequence length alone does not tell you the first index.</p>
<h2>5. Properties and what they mean</h2>
<ul><li><b>Commutative:</b> x*h=h*x; either signal may be viewed as the sliding one.</li><li><b>Associative:</b> x*(h1*h2)=(x*h1)*h2; useful for cascaded LTI systems.</li><li><b>Distributive:</b> x*(h1+h2)=x*h1+x*h2; useful for parallel paths.</li><li><b>Identity:</b> x*δ=x.</li><li><b>Shift:</b> x(t)*δ(t−t0)=x(t−t0).</li></ul>
<h2>6. Causality and stability from h</h2>
<p>A continuous-time LTI system is causal if h(t)=0 for t&lt;0; discrete-time causality requires h[n]=0 for n&lt;0. BIBO stability requires \(\int|h(t)|dt&lt;\infty\) in continuous time or \(\sum|h[n]|&lt;\infty\) in discrete time. Absolute value is essential: cancellation in a signed integral is not enough to prove stability.</p>
<h2>7. Common errors</h2>
<ul><li>Do not multiply x(t)h(t) pointwise; convolution shifts one signal before multiplying.</li><li>Do not forget to reverse h before sliding in the graphical method.</li><li>Do not omit overlap limits.</li><li>Linear convolution is not circular convolution; circular convolution belongs to finite-period/DFT contexts.</li><li>For nonzero initial conditions, total response includes a zero-input component in addition to the ze
${FIGSLOT('conv')}
ro-state convolution response.</li></ul>
<h4>Convolution by the overlap method</h4>
<p>For continuous time, <code>y(t)=∫x(τ)h(t−τ)dτ</code>; for discrete time, <code>y[n]=Σₖx[k]h[n−k]</code>. The procedure is: reverse one signal, shift it, multiply the overlapping values, and sum or integrate. For <code>x[n]=δ[n]</code>, convolution gives <code>y[n]=h[n]</code>; this is why the impulse response fully characterizes an LTI system.</p>
<p>Example: if <code>x[n]=[1,1]</code> and <code>h[n]=[1,1]</code>, both indexed from n=0, the convolution is <code>[1,2,1]</code>. Output length is <code>L_x+L_h−1</code> for finite sequences. Do not forget the index origin when either sequence starts at a negative index.</p>
`},

  {id:'de', name:'Differential- and Difference-Equation Models', body: T`<h2>1. Why equations model systems</h2>
<p>A differential equation describes continuous-time relationships between input x(t), output y(t), and their derivatives. A difference equation describes discrete-time relationships between present/past samples. These equations encode memory: derivatives and delayed terms mean the output is not determined by the current input alone.</p>
<h2>2. Continuous-time example</h2>
<p>Consider \(\frac{dy}{dt}+2y=x(t)\). Take the Laplace transform with zero initial condition: \(sY(s)+2Y(s)=X(s)\). Hence the transfer function is \(H(s)=Y/X=1/(s+2)\). Its causal impulse response is \(h(t)=e^{-2t}u(t)\), because the inverse transform of 1/(s+2) is the decaying exponential restricted to t≥0.</p>
<p>If the initial condition y(0−) is not zero, the transformed derivative includes that value: \(\mathcal L\{y'\}=sY(s)-y(0^-)\). This creates a zero-input response. The transfer function describes zero-state input-output behaviour under zero initial conditions.</p>
<h2>3. Discrete-time example</h2>
<p>Consider \(y[n]-0.5y[n-1]=x[n]\). Under zero initial conditions, the Z-transform gives \(Y(z)(1-0.5z^{-1})=X(z)\), so \(H(z)=1/(1-0.5z^{-1})\). For a causal system, expand the geometric series to obtain \(h[n]=(0.5)^n u[n]\).</p>
<h2>4. Feedforward, feedback, FIR and IIR</h2>
<p>Terms involving present/past input samples are feedforward terms. Terms involving past output samples create feedback. A finite impulse response (FIR) system has an impulse response that becomes zero after finitely many samples; a typical nonrecursive FIR equation has no previous-output feedback. An infinite impulse response (IIR) system can have an indefinitely continuing response, often because of feedback.</p>
<h2>5. Poles, roots and natural modes</h2>
<p>The denominator of H(s) or H(z) gives the characteristic equation. Its roots are poles and correspond to natural modes such as exponentials. In continuous time, a term e^(pt) decays if Re(p)&lt;0 and grows if Re(p)&gt;0. In discrete time, a mode p^n decays when |p|&lt;1 and grows when |p|&gt;1. These are key links to stability and control systems.</p>
<h2>6. Solving a model reliably</h2>
<ol><li>Write the original equation and identify input/output.</li><li>State whether initial conditions are zero.</li><li>Apply Laplace or Z transform using the correct derivative/shift rules.</li><li>Collect Y and X terms and form H=Y/X.</li><li>Factor the denominator, identify poles, and check the ROC/causality assumption.</li><li>Use inverse transforms or a recurrence to recover the response.</li></ol>
<p>Common trap: H(s)=Y(s)/X(s) is not automatically valid without the zero-initial-condition convention, and a rational expression without an ROC may not uniquely identify a signal.</p>`},

  {id:'fourier', name:'Fourier Series and Fourier Transform', body: T`<h2>1. Why use Fourier analysis?</h2>
<p>Many signals are easier to understand as sums of sinusoids. Fourier series represents a periodic signal using harmonics; Fourier transforms represent aperiodic signals by a continuous frequency spectrum. Frequency analysis is central to communication systems, filtering and signal bandwidth.</p>
<h2>2. Continuous-time Fourier series</h2>
<p>For period T0, fundamental angular frequency is \(\omega_0=2\pi/T_0\). Exponential form: \(x(t)=\sum_{k=-\infty}^{\infty}C_ke^{jk\omega_0t}\), where \(C_k=\frac1{T_0}\int_{T_0}x(t)e^{-jk\omega_0t}dt\), integrating over any full period.</p>
<p>In trigonometric form, \(x(t)=a_0/2+\sum_{n=1}^{\infty}[a_n\cos(n\omega_0t)+b_n\sin(n\omega_0t)]\). The coefficients are obtained by multiplying by the matching sine/cosine and integrating over one period. Even symmetry makes all bn zero; odd symmetry makes an and a0 zero. For a real signal, \(C_{-k}=C_k^*\).</p>
<h2>3. Fourier transform pair and properties</h2>
<p>Using the angular-frequency convention: \(X(j\omega)=\int_{-\infty}^{\infty}x(t)e^{-j\omega t}dt\), and \(x(t)=\frac1{2\pi}\int_{-\infty}^{\infty}X(j\omega)e^{j\omega t}d\omega\). The 1/(2π) appears in the inverse under this convention; other conventions distribute constants differently.</p>
<table><thead><tr><th>Time operation</th><th>Frequency-domain result</th></tr></thead><tbody><tr><td>ax1+bx2</td><td>aX1+bX2</td></tr><tr><td>x(t−t0)</td><td>e^(−jωt0)X(jω)</td></tr><tr><td>e^(jω0t)x(t)</td><td>X(j(ω−ω0))</td></tr><tr><td>x(at)</td><td>(1/|a|)X(jω/a)</td></tr><tr><td>x(−t)</td><td>X(−jω)</td></tr><tr><td>dx/dt</td><td>jωX(jω)</td></tr><tr><td>x*h</td><td>XH</td></tr></tbody></table>
<p>For real x(t), the spectrum has conjugate symmetry \(X(-j\omega)=X^*(j\omega)\), so its magnitude is even. Parseval's relation connects time-domain energy to spectral energy: \(\int|x(t)|^2dt=\frac1{2\pi}\int|X(j\omega)|^2d\omega\).</p>
<h2>4. DTFT and LTI frequency response</h2>
<p>The DTFT maps a sequence to a continuous function of frequency: \(X(e^{j\omega})=\sum_nx[n]e^{-j\omega n}\). It is 2π-periodic because e^(−j(ω+2π)n)=e^(−jωn) for integer n. For an LTI system, \(Y=HX\) in the frequency domain when the transforms exist. The frequency response H tells how each sinusoidal frequency is scaled and phase-shifted.</p>
<h2>5. Magnitude, phase and delay</h2>
<p>Write \(H(e^{j\omega})=|H(e^{j\omega})|e^{j\angle H(e^{j\omega})}\). Magnitude describes gain versus frequency; phase describes phase shift. Phase delay is −phase/ω where defined; group delay is −d(phase)/dω and describes the delay of a narrowband signal envelope under suitable conditions. They are not generally identical.</p>
<h2>6. Convergence and discontinuities</h2>
<p>Fourier series may converge at a jump to the midpoint of the left and right limits. Near a jump, partial sums exhibit Gibbs overshoot; adding more terms narrows the region but does not eliminate the limiting overshoot height. Always state the transform convention and distinguish periodic F
${FIGSLOT('fsquare')}
ourier series from the transform of an aperiodic signal.</p>
<h4>Fourier coefficients and interpretation</h4>
<p>A periodic signal with period <code>T₀</code> has fundamental frequency <code>f₀=1/T₀</code> and angular frequency <code>ω₀=2π/T₀</code>. Its complex Fourier-series coefficients are <code>Cₖ=(1/T₀)∫ over one period x(t)e^(−jkω₀t)dt</code>. Each coefficient measures the complex amplitude of a harmonic.</p>
<p>For a real signal, <code>C₋ₖ=Cₖ*</code>. Even symmetry removes sine terms in the trigonometric series; odd symmetry removes cosine and DC terms. A time shift changes phase but not the magnitude spectrum. A time-scale change changes frequency scale inversely.</p>
`},

  {id:'laplace', name:'Laplace Transform, ROC and System Analysis', body: T`<h2>1. The Laplace transform</h2>
<p>The bilateral Laplace transform is \(X(s)=\int_{-\infty}^{\infty}x(t)e^{-st}dt\), where \(s=\sigma+j\omega\). The real part σ weights the signal exponentially; the imaginary part represents sinusoidal frequency. The unilateral transform integrates from 0− to infinity and is especially useful for initial-value differential equations.</p>
<h2>2. Common pairs</h2>
<table><thead><tr><th>Signal</th><th>Transform</th><th>ROC</th></tr></thead><tbody><tr><td>δ(t)</td><td>1</td><td>All finite s</td></tr><tr><td>u(t)</td><td>1/s</td><td>Re(s)&gt;0</td></tr><tr><td>e^(−at)u(t)</td><td>1/(s+a)</td><td>Re(s)&gt;−a</td></tr><tr><td>t e^(−at)u(t)</td><td>1/(s+a)²</td><td>Re(s)&gt;−a</td></tr><tr><td>e^(at)u(−t)</td><td>−1/(s−a)</td><td>Re(s)&lt;a</td></tr><tr><td>cos(ω0t)u(t)</td><td>s/(s²+ω0²)</td><td>Re(s)&gt;0</td></tr></tbody></table>
<h2>3. Region of convergence (ROC)</h2>
<p>The ROC is the set of s values for which the integral converges. It cannot contain a pole. Right-sided signals generally have an ROC to the right of the rightmost pole; left-sided signals have an ROC to the left of the leftmost pole; two-sided signals can have an ROC between pole lines. The same rational expression can represent different time signals when the ROC differs.</p>
<h2>4. Properties and inverse transform</h2>
<ul><li>Linearity: \(a x_1+b x_2\leftrightarrow aX_1+bX_2\).</li><li>Delay of a causal shifted signal: \(x(t-t_0)u(t-t_0)\leftrightarrow e^{-st_0}X(s)\).</li><li>Exponential multiplication: \(e^{at}x(t)\leftrightarrow X(s-a)\).</li><li>Convolution: \(x*h\leftrightarrow XH\), when the transforms converge.</li><li>Unilateral derivative: \(\mathcal L_u\{x'\}=sX_u(s)-x(0^-)\).</li></ul>
<p>For rational transforms, inverse Laplace often means factor the denominator, use partial fractions, and match each term to a transform pair. Repeated poles produce terms such as t e^(−at); complex-conjugate poles produce damped sine/cosine terms.</p>
<div class="ex"><b>Example.</b> \(H(s)=1/(s+2)\) with causal ROC Re(s)&gt;−2 corresponds to \(h(t)=e^{-2t}u(t)\). The pole at −2 gives a decaying mode.</div>
<h2>5. Stability and final-value cautions</h2>
<p>For an LTI system, BIBO stability requires the ROC of H(s) to include the imaginary axis. A causal rational stable system has all poles strictly in the left half-plane. Do not infer stability from a denominator alone if the ROC/realisation is unknown.</p>
<p>The final-value theorem \(\lim_{t\to\infty}x(t)=\lim_{s\to0}sX(s)\) is valid only when the relevant poles of sX(s) are in the left half-plane, with no unstable or sustain
${FIGSLOT('roc')}
ed oscillatory modes that invalidate the limit. It is not a universal shortcut.</p>
<h4>Laplace transform and ROC example</h4>
<p>The bilateral Laplace transform is <code>X(s)=∫₋∞∞x(t)e^(−st)dt</code>. For <code>x(t)=e^(−at)u(t)</code>, the transform is <code>1/(s+a)</code> with ROC <code>Re(s)&gt;−a</code>. The pole is at <code>s=−a</code>; the ROC is part of the transform pair, not optional decoration.</p>
<p>The same algebraic expression can describe different time signals if the ROC differs. For a right-sided rational signal the ROC lies to the right of the rightmost pole; for a left-sided signal it lies to the left of the leftmost pole. For a stable LTI system, the ROC must include the <code>jω</code> axis.</p>
`},

  {id:'z', name:'Z-Transform, Inverse Z and ROC', body: T`<h2>1. Z-transform meaning</h2>
<p>The bilateral Z-transform of a sequence is \(X(z)=\sum_{n=-\infty}^{\infty}x[n]z^{-n}\). The unilateral transform starts at n=0 and is often used to solve difference equations with initial conditions. Write \(z=re^{j\omega}\): the radius r weights samples exponentially and angle ω represents discrete-time frequency.</p>
<h2>2. Common pairs and ROC</h2>
<table><thead><tr><th>Sequence</th><th>Transform</th><th>ROC</th></tr></thead><tbody><tr><td>δ[n]</td><td>1</td><td>All finite z</td></tr><tr><td>u[n]</td><td>1/(1−z⁻¹)</td><td>|z|&gt;1</td></tr><tr><td>aⁿu[n]</td><td>1/(1−az⁻¹)</td><td>|z|&gt;|a|</td></tr><tr><td>−aⁿu[−n−1]</td><td>1/(1−az⁻¹)</td><td>|z|&lt;|a|</td></tr></tbody></table>
<p>The right-sided and left-sided versions of an exponential can have the same algebraic transform but different ROCs. The ROC never contains a pole. Right-sided sequences have an ROC outside the outermost pole; left-sided sequences have an ROC inside the innermost pole; two-sided sequences have an annular ROC between pole magnitudes.</p>
<h2>3. Properties and shifts</h2>
<ul><li>Bilateral delay: \(x[n-n_0]\leftrightarrow z^{-n_0}X(z)\).</li><li>Exponential multiplication: \(a^nx[n]\leftrightarrow X(z/a)\).</li><li>Convolution: \(x*h\leftrightarrow X(z)H(z)\).</li><li>Index multiplication: \(n x[n]\leftrightarrow -z\,dX(z)/dz\).</li><li>Unilateral advance: \(Z_u\{x[n+1]\}=z(X_u(z)-x[0])\).</li><li>Unilateral delay: \(Z_u\{x[n-1]\}=z^{-1}X_u(z)+z^{-1}x[-1]\), depending on the pre-origin sample convention.</li></ul>
<h2>4. Solving a difference equation</h2>
<p>For \(y[n]-0.5y[n-1]=x[n]\) with zero initial conditions, \(Y(z)(1-0.5z^{-1})=X(z)\), so \(H(z)=1/(1-0.5z^{-1})\). For a causal system, the geometric-series expansion yields \(h[n]=(0.5)^n u[n]\). Its pole is z=0.5, inside the unit circle.</p>
<h2>5. Stability and the unit circle</h2>
<p>A discrete-time LTI system is BIBO stable when \(\sum_n|h[n]|&lt;\infty\). Equivalently, the ROC of H(z) must include the unit circle |z|=1. A causal rational stable system has all poles strictly inside the unit circle. A pole on the unit circle generally prevents BIBO stability for a causal rational system.</p>
<h2>6. Laplace versus Z transform</h2>
<p>Laplace uses continuous time and s; Z-transform uses integer-indexed sequences and z. The continuous-time stability boundary is the imaginary axis; the discrete-time boundary is the unit circle. Under sampling period T, the mapping \(z=e^{sT}\) maps the left half-plane into the inside of the unit circle.</p>
<p>Exam checklist: state bilateral or unilateral convention, track initial samples in shift rules, find the ROC, and do not claim stability from poles alone without knowing causality/ROC.</p>
<h4>Z-transform and initial conditions</h4>
<p>The bilateral Z-transform is <code>X(z)=Σₙ₌₋∞∞x[n]z^(−n)</code>. For <code>x[n]=aⁿu[n]</code>, it is <code>1/(1−az⁻¹)</code> with ROC <code>|z|&gt;|a|</code>. The pole is at <code>z=a</code>. The ROC indicates whether the sequence is right-sided, left-sided, or two-sided.</p>
<p>When transforming difference equations, the unilateral Z-transform is useful for initial conditions, but its shift formulas include initial-value terms. Do not apply bilateral shift identities blindly to a unilateral transform.</p>
`},

  {id:'sampling', name:'Sampling Theorem, Aliasing & Reconstruction', body: T`<h2>1. Sampling converts time into a sequence</h2>
<p>Sampling takes measurements of a continuous signal at regular intervals: \(x[n]=x(nT_s)\), where Ts is the sampling period and \(f_s=1/T_s\) is the sampling frequency. Sampling discretises time; it does not by itself quantise amplitude. An ADC usually adds quantisation and encoding as separate operations.</p>
<h2>2. Nyquist–Shannon theorem</h2>
<p>If a signal is bandlimited so that it contains no frequencies above fmax, ideal reconstruction is possible from uniform samples when \(f_s&gt;2f_{max}\), under the theorem's assumptions. The Nyquist rate is 2fmax, and the Nyquist frequency for a given sampler is fs/2. Equality is a delicate boundary case; practical systems use margin and an anti-aliasing filter.</p>
<h2>3. Aliasing: why too-slow sampling fails</h2>
<p>Sampling creates repeated copies of the signal spectrum separated by fs. If the copies overlap, distinct original frequencies become indistinguishable in the samples. This is aliasing. Once components fold onto the same discrete-time frequency, later processing cannot generally recover which original frequency was present.</p>
<div class="ex"><b>Example.</b> A 900 Hz sinusoid sampled at 1000 samples/s is indistinguishable, up to phase/sign representation, from a 100 Hz real sinusoid because 900 Hz is 1000−100 Hz. The alias lies within the Nyquist band 0 to 500 Hz.</div>
<h2>4. Anti-aliasing and reconstruction</h2>
<p>An anti-aliasing low-pass filter is applied before sampling to suppress frequencies that would fold into the wanted band. Ideal reconstruction uses sinc interpolation: \(x(t)=\sum_nx[n]\operatorname{sinc}((t-nT_s)/T_s)\), where normalized sinc is sin(πu)/(πu). Each sample contributes a shifted sinc; the curves add to reproduce the bandlimited signal under ideal conditions.</p>
<h2>5. Discrete-time frequency</h2>
<p>A continuous sinusoid \(A\cos(2\pi f_0t+\phi)\) sampled at fs becomes \(A\cos(2\pi(f_0/f_s)n+\phi)\). Frequencies separated by integer multiples of fs produce the same samples. In radians/sample, discrete-time frequency is \(\omega=2\pi f_0/f_s\), and spectra repeat every 2π.</p>
<h2>6. Common traps and checklist</h2>
<ul><li>Nyquist rate depends on the highest frequency present, not the signal's average frequency.</li><li>Use an anti-aliasing filter before sampling, not after aliasing has occurred.</li><li>Sampling is not quantisation; amplitude resolution depends on the ADC bit count.</li><li>Check units: Hz is cycles/second, rad/s is angular frequency, rad/sample is discrete-time frequenc
${FIGSLOT('sampling')}
y.</li><li>At practical boundaries, allow for filter transition bands and nonideal hardware.</li></ul>
<h4>Why aliasing happens</h4>
<p>Sampling repeats the continuous-time spectrum every <code>f_s</code>. To reconstruct a bandlimited signal with highest frequency <code>f_max</code> under ideal assumptions, require <code>f_s&gt;2f_max</code>; this is the Nyquist sampling condition. An anti-alias low-pass filter is used before the ADC because frequency components above the usable band can fold into lower frequencies.</p>
<p>Example: a 6 kHz sinusoid sampled at 8 kHz aliases to 2 kHz in the principal Nyquist band because <code>|6−8|=2 kHz</code>. Sampling exactly at twice the highest frequency is fragile for a sinusoid of unknown phase and does not provide a practical transition band.</p>
`},

  {id:'pz2', name:'Poles, Zeros, Transfer Functions & Frequency Response', body: T`<h2>1. Transfer function</h2>
<p>For an LTI system with zero initial conditions, the transfer function is \(H(s)=Y(s)/X(s)\) in continuous time or \(H(z)=Y(z)/X(z)\) in discrete time. It describes the zero-state input-output relationship. A transfer function alone does not always reveal internal states or hidden unstable modes.</p>
<h2>2. Poles and zeros</h2>
<p>For a rational function \(H(s)=K\frac{\prod_i(s-z_i)}{\prod_k(s-p_k)}\), zeros zi make the numerator zero and poles pk make the denominator zero after simplification. Poles govern natural modes and strongly affect transient response and stability; zeros shape how frequencies are amplified or attenuated.</p>
<div class="ex"><b>Worked example.</b> \(H(s)=\frac{s+2}{(s+1)(s+4)}\) has a zero at s=−2 and poles at s=−1 and s=−4. For a causal realization, the ROC is to the right of the rightmost pole: Re(s)&gt;−1. Both poles are in the left half-plane, so this causal rational system is BIBO stable.</div>
<h2>3. Stability must include the ROC</h2>
<p>For a causal continuous-time rational system, poles strictly in the left half-plane imply BIBO stability. In discrete time, causal rational stability requires poles strictly inside |z|=1. But the same algebraic transform with a different ROC can represent a different signal. For general two-sided systems, the ROC must include the imaginary axis for continuous-time stability or the unit circle for discrete-time stability.</p>
<h2>4. Frequency response</h2>
<p>Continuous-time frequency response is \(H(j\omega)\), obtained by evaluating H(s) at s=jω only when the imaginary axis is in the ROC. Discrete-time frequency response is \(H(e^{j\omega})\), evaluated on the unit circle only when that circle is in the ROC. Magnitude tells gain; phase tells phase shift. Pole/zero locations influence both.</p>
<h2>5. Real coefficients and cancellation</h2>
<p>For real-coefficient systems, non-real poles and zeros occur in complex-conjugate pairs. A pole-zero cancellation may simplify the external input-output transfer function, but it does not necessarily establish internal stability: a hidden internal mode can remain. In a block diagram, cancellation should therefore be interpreted cautiously.</p>
<h2>6. Quick comparisons</h2>
<table><thead><tr><th>System function</th><th>Pole</th><th>For causal realization</th></tr></thead><tbody><tr><td>1/(s+2)</td><td>−2</td><td>Stable</td></tr><tr><td>1/(s−3)</td><td>+3</td><td>Unstable</td></tr><tr><td>1/(1−0.5z⁻¹)</td><td>0.5</td><td>Stable</td></tr><tr><td>1/(1−1.5z⁻¹)</td><td>1.5</td><td>Unstable</td></tr></tbody></table>
<p>Mastery means deriving H from a system equation, locating poles and zeros, checking ROC before stability claims, and interpreting magnitude/phase response without confusing poles with zeros.</p>
<h4>Frequency response from a transfer function</h4>
<p>For a stable LTI system with transfer function <code>H(s)</code>, frequency response is obtained by evaluating <code>H(jω)</code> when the imaginary axis lies in the ROC. Magnitude tells how much each sinusoidal frequency is scaled; phase tells its phase shift. For <code>H(s)=1/(1+sτ)</code>, <code>|H(jω)|=1/√(1+(ωτ)²)</code> and phase is <code>−tan⁻¹(ωτ)</code>.</p>
<p>At <code>ω=1/τ</code>, magnitude is <code>1/√2</code> of the DC value, the −3 dB corner. A pole near the imaginary axis can create a sharp response peak, while zeros can suppress selected frequencies.</p>
`}
  ]
},

/* ============================================================ 4 ANALOG */
{
  id:'ana', name:'Analog Electronics', icon:'◑',
  topics:[
  {id:'semi', name:'Semiconductor Physics — Intrinsic & Extrinsic', body: T`<h2>1. Begin with the material</h2>
<p>Every solid contains atoms with allowed electron-energy ranges. In a conductor, electrons can move easily; in an insulator, the energy gap makes that difficult. A semiconductor lies between these cases. Its conductivity can be controlled by temperature, light and, especially, deliberately adding tiny amounts of impurity atoms. This process is called <b>doping</b>.</p>
<h2>2. Electrons, holes and doping</h2>
<p>An electron that leaves a covalent bond leaves behind a missing-electron state called a <b>hole</b>. A hole behaves as a positive mobile carrier. Pure silicon is intrinsic: electron and hole concentrations are equal, n=p=n_i. Donor atoms create n-type material, where electrons are majority carriers; acceptors create p-type material, where holes are majority carriers. The material as a whole remains electrically neutral.</p>
<div class="formula">$$np=n_i^2,\qquad \sigma=q(n\mu_n+p\mu_p),\qquad V_T=\frac{kT}{q}$$</div>
<p>The mass-action law applies at thermal equilibrium. Here q is the magnitude of electron charge, μ is mobility, and σ is conductivity. At room temperature, thermal voltage V_T is about 25.9 mV. The intrinsic concentration rises strongly with temperature, so semiconductor resistance usually falls as temperature rises.</p>
<div class="ex"><b>Worked example.</b> If n=10^16 cm⁻³ and n_i=10^10 cm⁻³, then p=n_i²/n=10^20/10^16=10^4 cm⁻³. The material is strongly n-type: electrons greatly outnumber holes.</div>
<h2>3. Energy bands and Fermi level</h2>
<p>The valence band contains bonding states; the conduction band contains states in which electrons can contribute to conduction. The band gap E_g separates them. Doping shifts the Fermi level toward the conduction band for n-type material and toward the valence band for p-type material. Remember: doping changes carrier concentration much more than it changes the silicon band gap.</p>
<h2>4. Common traps</h2><ul><li>Majority carrier does not mean the only carrier; minority carriers still exist.</li><li>n-type material is not negatively charged overall; donor ions balance the extra mobile electrons.</li><li>Conductivity depends on both carrier concentration and mobility.</li><li>Use kelvin in temperature-dependent semiconductor equations.</li></ul>
<h4>Worked example: conductivity and doping</h4>
<p>For a semiconductor, conductivity is <code>σ = q(nμₙ + pμₚ)</code>. Here <code>q</code> is electron charge, <code>n,p</code> are carrier concentrations, and <code>μₙ,μₚ</code> are mobilities. In an n-type sample with <code>n ≈ Nᴅ</code> and <code>n ≫ p</code>, use <code>σ ≈ qNᴅμₙ</code>. Increasing donor concentration usually increases conductivity, although mobility can fall at very high doping because of impurity scattering.</p>
<p><b>Do not confuse:</b> doping changes carrier concentration; temperature also changes intrinsic carrier generation. At sufficiently high temperature, even a doped semiconductor can become dominated by thermally generated electron–hole pairs.</p>
`},

  {id:'diode', name:'PN Junction Diodes, Zener, Rectifiers, Clippers & Clampers', body: T`<h2>1. What a PN junction does</h2>
<p>A diode is made by joining p-type and n-type semiconductor. Electrons and holes initially diffuse across the junction and recombine. This leaves fixed ionized atoms, forming a depletion region and a built-in electric field. The field opposes further diffusion. Forward bias reduces the barrier; reverse bias increases it.</p>
<h2>2. The current-voltage relationship</h2>
<div class="formula">$$I_D=I_S\left(e^{V_D/(\eta V_T)}-1\right),\qquad V_T=\frac{kT}{q}\approx25.9\text{ mV at 300 K}$$</div>
<p>I_S is the small reverse saturation current and η is the ideality factor. The exponential model is more accurate than the convenient silicon constant-drop model. In quick circuit analysis, a conducting silicon diode is often approximated as a 0.7 V drop, but this is not a universal physical constant.</p>
<div class="ex"><b>Worked example.</b> A 5 V source drives a silicon diode and 1 kΩ resistor in series. With the 0.7 V approximation, current is (5−0.7)/1000=4.3 mA. Always check the assumed current direction and whether the diode is actually forward-biased.</div>
<h2>3. Rectification and waveform shaping</h2>
<p>A half-wave rectifier passes one half-cycle; a full-wave rectifier flips the negative half-cycles so both halves contribute to the output. For an ideal sinusoid with peak V_m, half-wave average is V_m/π and full-wave average is 2V_m/π. A bridge rectifier has two conducting diode drops in each half-cycle; a centre-tapped rectifier uses one diode drop but requires a centre-tapped transformer.</p>
<div class="formula">$$r=\frac{V_{AC,rms}}{V_{DC}},\qquad \eta=\frac{P_{DC}}{P_{AC}}$$</div>
<p>A capacitor filter charges near waveform peaks and discharges into the load between peaks, reducing ripple. Approximate ripple for a full-wave rectifier is ΔV≈I_L/(2fC), where f is the AC supply frequency.</p>
<h2>4. Zener, clipper and clamper</h2>
<p>A Zener diode operated in reverse breakdown can hold a nearly constant voltage if current remains within its specified range. A clipper limits waveform amplitude; a clamper shifts the waveform's DC level while ideally retaining its peak-to-peak value.</p>
<div class="ex"><b>Check yourself.</b> If a 50 Hz supply is full-wave rectified, ripple repeats at 100 Hz. A larger filter capacitor or lighter load generally reduces ripple.</div>
<h2>5. Limits and exam traps</h2><ul><li>Breakdown is not automatically destructive; current must still be limited.</li><li>Never use the 0.7 V model to calculate small-signal diode resistance.</li><li>Distinguish peak, RMS and average voltage.</li><li>Rectifier formulas assume ideal components unless diode drops are explicitly included.</li></ul>
${FIGSLOT('diode')}
${FIGSLOT('rectwave')}
<h4>Worked example: diode load line</h4>
<p>For a silicon diode in series with a 5 V source and 1 kΩ resistor, the constant-drop approximation gives <code>I_D ≈ (5 − 0.7)/1000 = 4.3 mA</code>. The resistor, not the diode alone, sets the current. If the supply polarity is reversed, the diode is reverse-biased and the current is approximately leakage current until breakdown.</p>
<p><b>Rectifier check:</b> an ideal half-wave rectifier supplied by a sinusoid of peak <code>Vₘ</code> has average output <code>V_DC = Vₘ/π</code>; a full-wave rectifier has <code>V_DC = 2Vₘ/π</code>. These are ideal, unfiltered results. A capacitor filter changes ripple and average output, and a real bridge has two conducting diode drops.</p>
`},

  {id:'bjt', name:'BJT & MOSFET — Operation, Characteristics & Biasing', body: T`<h2>1. Transistors as controlled devices</h2>
<p>A transistor lets a small input control a larger current. A BJT uses both electrons and holes; its collector current is controlled approximately by base-emitter voltage in active operation. A MOSFET uses an electric field to control a conducting channel, so its gate draws almost no steady DC current in the ideal model.</p>
<h2>2. BJT operating regions</h2>
<ul><li><b>Cutoff:</b> base-emitter junction is not sufficiently forward biased; transistor is approximately off.</li><li><b>Forward active:</b> base-emitter junction forward biased and base-collector junction reverse biased; useful for amplification.</li><li><b>Saturation:</b> both junctions forward biased; useful as a closed switch, but not the linear amplifier region.</li></ul>
<div class="formula">$$I_C\approx\beta I_B,\qquad I_E=I_C+I_B,\qquad I_C\approx I_S e^{V_{BE}/V_T}$$</div>
<p>β is current gain and varies substantially between devices and operating conditions. For first-pass silicon calculations, V_BE≈0.7 V is often used, but the exponential relation explains why this is only an approximation.</p>
<div class="ex"><b>Worked example.</b> If β=100 and base current is 20 μA, the active-region estimate is I_C≈2 mA. If the collector circuit cannot supply 2 mA, the transistor will leave active operation and may saturate; the gain equation cannot override the external circuit.</div>
<h2>3. MOSFET regions</h2>
<p>For an enhancement NMOS, V_GS below threshold V_TH means cutoff in the ideal model. Above threshold, a small V_DS gives the triode/linear region; larger V_DS can produce saturation when V_DS≥V_GS−V_TH. In the long-channel square-law model, saturation current is approximately (1/2)μ_n C_ox(W/L)(V_GS−V_TH)², ignoring channel-length modulation.</p>
<h2>4. Biasing and stability</h2>
<p>Biasing establishes the DC operating point, or Q-point, before an AC signal is applied. A good amplifier bias keeps the transistor in its intended region over temperature and device-to-device variation. Emitter/source resistors provide negative feedback: if current rises, the resistor voltage rises and opposes the change.</p>
<h2>5. Common traps</h2><ul><li>BJT β is not a fixed universal constant.</li><li>Do not use active-region equations after the calculated collector voltage forces saturation.</li><li>MOSFET gate current is tiny at DC, but gate capacitance must be charged and discharged during switching.</li><li>Always solve the DC circuit before the small-signal AC circuit.</li></ul>
${FIGSLOT('bjtchar')}
${FIGSLOT('moschar')}
${FIGSLOT('loadline')}
<h4>Bias calculation: the operating point comes first</h4>
<p>For a common-emitter stage with <code>V_CC = 10 V</code>, <code>R_C = 2 kΩ</code>, and a designed collector current of <code>2 mA</code>, the collector resistor drop is <code>I_C R_C = 4 V</code>, so <code>V_C = 6 V</code>. If the emitter is grounded, <code>V_CE ≈ 6 V</code>. This leaves room for an AC signal to swing before cutoff or saturation.</p>
<p>In forward-active operation, <code>I_C ≈ βI_B</code> is a useful first model, but β varies between devices and with temperature. A robust bias network should therefore rely less strongly on β. For a MOSFET, first identify the region using the correct polarity and inequalities; in saturation, the ideal long-channel model is <code>I_D ≈ (1/2)μₙC_ox(W/L)(V_GS−V_TH)²</code>, ignoring channel-length modulation.</p>
`},

  {id:'ss', name:'Small-Signal Models & Equivalent Circuits', body: T`<h2>1. Why small-signal models exist</h2>
<p>A transistor is nonlinear: doubling its input does not generally double its output. An amplifier is usually biased at a DC operating point and then given a small AC signal. Near that operating point, the nonlinear curve can be approximated by a tangent line. This local linear approximation is the <b>small-signal model</b>.</p>
<h2>2. BJT hybrid-π model</h2>
<div class="formula">$$g_m=\frac{I_C}{V_T},\qquad r_\pi=\frac{\beta}{g_m},\qquad r_e\approx\frac{V_T}{I_E}$$</div>
<p>g_m is transconductance: the change in collector current per small change in base-emitter voltage. r_π is the small-signal resistance looking into the base in the hybrid-π model. At room temperature, a 1 mA collector current gives g_m≈1 mA/25.9 mV≈38.6 mS.</p>
<div class="ex"><b>Worked example.</b> With I_C=2 mA and β=100, g_m≈0.002/0.0259=0.0772 S and r_π≈100/0.0772≈1.30 kΩ. These are incremental quantities, not the transistor's DC resistance.</div>
<h2>3. MOSFET small-signal model</h2>
<p>For a MOSFET biased in saturation, the gate controls drain current. The small-signal transconductance in the long-channel model is g_m≈2I_D/V_OV, where V_OV=V_GS−V_TH is overdrive voltage. A finite output resistance r_o models channel-length modulation; neglecting it is an approximation.</p>
<h2>4. How to analyse a small-signal circuit</h2>
<ol><li>Find the DC operating point and confirm the operating region.</li><li>Set independent DC voltage sources to AC ground and DC current sources to open circuits for the incremental model.</li><li>Replace the transistor by its small-signal equivalent.</li><li>Keep coupling and bypass capacitors as shorts only in the midband approximation.</li><li>Calculate gain and input/output resistance, then check whether loading changes the answer.</li></ol>
<h2>5. Limitations</h2><p>The model is valid only for sufficiently small variations around the chosen Q-point and over the frequency range for which its parasitic capacitances are treated correctly. Large signals can cause clipping and distortion; high frequencies require device capacitances and transit effects.</p>
${FIGSLOT('hybridpi')}
<h4>Small-signal model: why it works</h4>
<p>A transistor is nonlinear, but around a fixed Q-point a small change can be approximated by the tangent slope. For a BJT, <code>gₘ = I_C/V_T</code>, where <code>V_T ≈ 25–26 mV</code> near room temperature. At <code>I_C = 1 mA</code>, <code>gₘ ≈ 0.04 S</code>. Thus a small input change of 1 mV corresponds approximately to a controlled collector-current change of 40 μA.</p>
<p>The small-signal model is valid only for sufficiently small variations around the chosen bias point. It does not replace DC bias analysis; first solve the DC circuit, then replace incremental sources and use the small-signal model.</p>
`},

  {id:'multi', name:'Single-Stage and Multistage Amplifiers', body: T`<h2>1. What an amplifier stage does</h2>
<p>An amplifier takes a signal from a source and produces a larger voltage, current or power variation at its output. The power comes from the DC supply, not from the input signal alone. A single stage offers a certain gain; cascading stages can increase total gain but also adds loading, noise, distortion and bandwidth limitations.</p>
<h2>2. Common-emitter, common-source and followers</h2>
<p>A common-emitter BJT stage usually provides voltage gain with phase inversion. A common-source MOSFET stage behaves similarly. A common-collector emitter follower and common-drain source follower have voltage gain near one, but offer useful impedance buffering: relatively high input resistance and lower output resistance.</p>
<div class="formula">$$A_v=\frac{v_o}{v_i},\qquad A_i=\frac{i_o}{i_i},\qquad G_P=\frac{P_o}{P_i}$$</div>
<p>Voltage gain is a signed ratio; a negative sign indicates inversion. Gain in decibels is 20log₁₀|A_v| for voltage or current ratios when the impedance conditions are appropriate, and 10log₁₀(P_o/P_i) for power.</p>
<div class="ex"><b>Worked example.</b> Three cascaded stages have voltage gains −10, +2 and −3. Overall gain is their product, (+60); two inversions produce a non-inverted final signal. Do not add linear gains; multiply them. In decibels, gains add.</div>
<h2>3. Loading and interstage coupling</h2>
<p>The input resistance of the next stage loads the previous stage. A source resistance R_S and amplifier input resistance R_in form a divider, so the actual input may be less than the source's open-circuit voltage. Coupling capacitors pass AC while blocking DC, allowing each stage to maintain its own bias. Their reactance can reduce low-frequency gain.</p>
<h2>4. Multistage gain and design trade-offs</h2>
<p>For cascaded stages, A_v,total=A_v1 A_v2 … A_vn if each stage gain is defined using the actual loaded input and output. The product is only as accurate as those loading assumptions. Adding stages can increase gain but usually complicates stability and frequency response.</p>
<h2>5. Common traps</h2><ul><li>Voltage gain near one does not mean the stage is useless; impedance transformation may be its purpose.</li><li>Account for loading before multiplying nominal stage gains.</li><li>Check the DC Q-point to ensure the output can swing without clipping.</li><li>Power gain depends on both voltage and current, not voltage gain alone.</li></ul>
${FIGSLOT('cecb')}
<h4>Common-emitter gain estimate</h4>
<p>With the emitter AC-grounded, a first-order midband estimate is <code>Aᵥ ≈ −gₘ(R_C ∥ R_L)</code>. If <code>gₘ = 40 mS</code>, <code>R_C = 2 kΩ</code>, and <code>R_L = 2 kΩ</code>, then <code>R_C ∥ R_L = 1 kΩ</code> and <code>Aᵥ ≈ −40</code>. The minus sign means a 180° phase inversion.</p>
<p>Real gain is lower when source resistance, transistor output resistance, emitter degeneration, and loading are included. Cascading stages can increase gain, but each stage loads the previous one and adds its own noise and bandwidth limitation.</p>
`},

  {id:'freq', name:'Frequency Response, Bandwidth & Miller Effect', body: T`<h2>1. Why gain changes with frequency</h2>
<p>Real amplifiers contain capacitors and parasitic capacitances. At low frequency, coupling and bypass capacitors may have large reactance, reducing gain. At high frequency, transistor junction capacitances and wiring capacitance shunt signal current and reduce gain. Between these regions is the midband, where gain is approximately constant.</p>
<div class="formula">$$|X_C|=\frac{1}{2\pi fC},\qquad BW=f_H-f_L$$</div>
<p>For a single-pole response, the cutoff frequency is the point where voltage gain falls to 1/√2≈0.707 of its midband value, equivalent to −3 dB. Bandwidth is the upper cutoff minus the lower cutoff; if f_L is very small relative to f_H, BW≈f_H.</p>
<div class="ex"><b>Worked example.</b> If f_L=100 Hz and f_H=100 kHz, the bandwidth is 99.9 kHz. At either cutoff, the gain magnitude is approximately 0.707 times the midband magnitude, not half of it.</div>
<h2>2. Miller effect</h2>
<p>A capacitance connected between an amplifier's input and output can appear much larger at the input when the stage has voltage gain. For a capacitance C_f between input and output, the approximate input-equivalent capacitance is C_in≈C_f(1−A_v). With an inverting gain A_v=−9, C_in≈10C_f. This is called the Miller effect and is a major reason common-emitter/common-source stages lose high-frequency gain.</p>
<h2>3. Bode plots and cascaded poles</h2>
<p>A Bode magnitude plot uses logarithmic frequency. A first-order pole contributes approximately −20 dB/decade beyond its corner; a first-order zero contributes +20 dB/decade. Phase shifts gradually around the corner. Multiple poles accumulate slope and phase lag, which matters for feedback stability.</p>
<h2>4. Limits and exam traps</h2><ul><li>The −3 dB point is half power only under the usual same-impedance comparison; voltage magnitude is 0.707.</li><li>Do not confuse bandwidth with the upper cutoff frequency when the lower cutoff is significant.</li><li>Miller approximation assumes a known gain over the frequency range of interest.</li><li>High-frequency parasitic capacitances are not usually short circuits at every frequency; calculate their reactance.</li></ul>
<h4>Bandwidth and the Miller effect</h4>
<p>For a single dominant pole, magnitude is approximately flat below the corner and falls at about 20 dB/decade above it. The corner frequency is <code>f_c = 1/(2πRC)</code>. For <code>R = 10 kΩ</code> and <code>C = 100 pF</code>, <code>f_c ≈ 159 kHz</code>.</p>
<p>A capacitance between input and output of an inverting amplifier appears larger at the input: approximately <code>C_in ≈ C_μ(1 − Aᵥ)</code>. If <code>Aᵥ = −20</code>, the multiplier is about 21. This Miller multiplication can make the input pole much lower than expected from the physical capacitance alone.</p>
`},

  {id:'fb', name:'Feedback Amplifiers & Oscillators', body: T`<h2>1. Feedback in plain language</h2>
<p>Feedback samples the output and returns a portion to the input. Negative feedback subtracts the returned signal, reducing the error between desired and measured output. It usually sacrifices some gain to improve gain stability, linearity, bandwidth and sensitivity to component variations. Positive feedback reinforces the input and can produce oscillation or bistability.</p>
<div class="formula">$$A_f=\frac{A}{1+A\beta}\quad\text{(negative feedback)},\qquad A\beta=\text{loop gain}$$</div>
<p>A is open-loop gain and β is the feedback factor. When |Aβ| is large and the loop remains stable, A_f≈1/β: the closed-loop gain depends mainly on the feedback network.</p>
<div class="ex"><b>Worked example.</b> If A=1000 and β=0.1, A_f=1000/(1+100)=9.90. If A changes modestly, the large loop gain makes closed-loop gain less sensitive to that change.</div>
<h2>2. Four feedback topologies</h2>
<p>Voltage-series feedback samples output voltage and mixes a voltage in series at the input; it tends to increase input resistance and decrease output resistance. Current-series feedback samples output current and tends to increase both resistances. Voltage-shunt tends to reduce both; current-shunt tends to reduce input resistance and increase output resistance. Remember the sampling and mixing method rather than memorising a table without meaning.</p>
<h2>3. Oscillator conditions</h2>
<p>An oscillator uses positive feedback and an energy source to sustain a periodic output. The Barkhausen conditions for an ideal steady sinusoid are loop-gain magnitude |Aβ|=1 and total loop phase 0° (or 360° multiples). Start-up generally requires loop gain slightly above one; nonlinearities eventually reduce the effective gain to unity.</p>
<div class="formula">$$f_{RC}\approx\frac{1}{2\pi RC\sqrt{6}}\quad\text{(three-section RC phase-shift oscillator, equal sections)}$$</div>
<p>LC oscillators use resonant energy exchange between inductance and capacitance. Crystal oscillators use a high-Q resonator for frequency stability.</p>
<h2>4. Common traps</h2><ul><li>Negative feedback is not automatically stable; phase lag can turn it effectively positive.</li><li>Barkhausen conditions are necessary for ideal sinusoidal steady oscillation, not a complete guarantee of a practical oscillator.</li><li>Feedback changes input/output resistance according to topology.</li><li>Distinguish the feedback factor β from transistor current gain β.</li></ul>
${FIGSLOT('feedback')}
${FIGSLOT('osc')}
<h4>Negative feedback: calculate sensitivity</h4>
<p>For forward gain <code>A</code> and feedback factor <code>β</code>, the closed-loop gain is <code>A_f = A/(1+Aβ)</code> for negative feedback. If <code>A = 100</code> and <code>β = 0.1</code>, then <code>A_f = 100/11 ≈ 9.09</code>. If open-loop gain changes slightly, the closed-loop gain changes less when loop gain <code>Aβ</code> is large.</p>
<p>Feedback does not automatically guarantee stability. Phase shift through frequency-dependent stages can turn negative feedback into effective positive feedback near a loop-gain magnitude of one. Oscillators deliberately satisfy the Barkhausen condition at a frequency; amplifiers must maintain adequate stability margins.</p>
`},

  {id:'diff', name:'Differential Amplifiers, Current Mirrors & Active Loads', body: T`<h2>1. Differential amplification</h2>
<p>A differential amplifier responds to the difference between two input voltages while ideally rejecting a voltage common to both inputs. Define v_d=v_1−v_2 and v_cm=(v_1+v_2)/2. A useful amplifier produces v_o=A_d v_d+A_cm v_cm. The common-mode gain A_cm should be small.</p>
<div class="formula">$$CMRR=\left|\frac{A_d}{A_{cm}}\right|,\qquad CMRR_{dB}=20\log_{10}(CMRR)$$</div>
<div class="ex"><b>Worked example.</b> If differential gain is 1000 and common-mode gain is 0.1, CMRR=10,000 and CMRR_dB=80 dB. Higher CMRR means better rejection of interference that appears equally on both inputs.</div>
<h2>2. Differential pair operation</h2>
<p>A matched transistor pair shares a tail current. With equal inputs, the current ideally splits equally. If one input rises relative to the other, current steers toward that side while the total tail current remains nearly constant. This current steering is the core mechanism behind many op-amp input stages.</p>
<h2>3. Current mirrors and active loads</h2>
<p>A current mirror uses a reference branch to establish a current and a matched transistor to reproduce it elsewhere. Ideally I_out≈I_ref times a device-size ratio. Real accuracy is limited by mismatch, finite output resistance, compliance voltage and temperature. An active load replaces a resistor with a transistor current source, giving high small-signal resistance and therefore high gain in a compact integrated circuit.</p>
<h2>4. Design and exam checks</h2><ul><li>Common-mode voltage must remain inside the input common-mode range.</li><li>High CMRR does not mean infinite differential gain.</li><li>Current mirrors require sufficient voltage headroom to remain in the intended region.</li><li>Device mismatch converts common-mode signals into differential error.</li></ul>
${FIGSLOT('diffpair')}
<h4>Differential pair intuition</h4>
<p>A matched differential pair steers an approximately fixed tail current between two transistors. With equal inputs, each side carries about half the tail current. A differential input nudges current toward one side and away from the other; the difference output rejects signals that appear equally on both inputs, ideally.</p>
<p>Common-mode rejection is measured by <code>CMRR = |A_d/A_cm|</code>, or <code>CMRR_dB = 20log₁₀(CMRR)</code>. If differential gain is 1000 and common-mode gain is 0.1, CMRR is 10,000, or 80 dB. Mismatch and finite tail-source resistance limit real CMRR.</p>
`},

  {id:'opamp', name:'Operational Amplifiers — Ideal & Non-Ideal', body: T`<h2>1. What an op-amp is</h2>
<p>An operational amplifier is a high-gain differential amplifier with non-inverting (+) and inverting (−) inputs. It amplifies the difference v_+−v_−. With negative feedback and operation away from output saturation, the large open-loop gain drives the input difference close to zero. This is the origin of the familiar “virtual short” rule.</p>
<div class="formula">$$v_o=A_{OL}(v_+-v_-),\qquad A_{OL}\to\infty\Rightarrow v_+\approx v_-\text{ under negative feedback}$$</div>
<p>For an ideal op-amp, input current is zero, input resistance is infinite, output resistance is zero, bandwidth and slew rate are infinite, and input offset voltage is zero. Real devices only approximate these assumptions.</p>
<h2>2. Inverting and non-inverting configurations</h2>
<div class="formula">$$A_{v,inv}=-\frac{R_f}{R_{in}},\qquad A_{v,noninv}=1+\frac{R_f}{R_g}$$</div>
<p>The inverting input node is at virtual ground only when the non-inverting input is grounded and negative feedback is operating properly. It is not physically connected to ground. The non-inverting configuration preserves signal polarity and has high ideal input resistance.</p>
<div class="ex"><b>Worked example.</b> With R_in=10 kΩ and R_f=100 kΩ, the inverting gain is −10. A +0.2 V input ideally produces −2 V output, provided the supply rails allow that output swing.</div>
<h2>3. Real limitations</h2>
<p>Open-loop gain is finite; gain-bandwidth product limits closed-loop bandwidth; slew rate limits how fast output voltage can change; input offset and bias currents create errors; common-mode range and output swing are restricted. Output cannot normally reach the supply rails unless the device is specifically designed for rail-to-rail operation.</p>
<h2>4. Common traps</h2><ul><li>Virtual short applies only with effective negative feedback, not in open-loop comparator operation.</li><li>Never assume the output can exceed the supply rails.</li><li>Check the sign of the feedback and the gain before applying v_+≈v_-.</li><li>Ideal input current is zero; real bias current is small, not necessarily zero.</li></ul>
<h4>Ideal op-amp rules are conditional</h4>
<p>For an ideal op-amp operating with negative feedback and not saturated, the input currents are approximately zero and the input voltage difference is approximately zero. These are not universal laws for every op-amp circuit: without suitable feedback, the output can saturate and the input voltages need not be equal.</p>
<p>For an inverting amplifier, <code>Aᵥ = −R_f/R_in</code>. If <code>R_f = 47 kΩ</code> and <code>R_in = 10 kΩ</code>, gain is −4.7. The output cannot exceed the supply rails, and practical bandwidth and slew rate limit fast or large signals.</p>
`},

  {id:'opapps', name:'Op-Amp Applications', body: T`<h2>1. Summing and difference circuits</h2>
