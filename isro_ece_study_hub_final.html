<li><b>Hold time:</b> data stable after the clock edge.</li>
<li><b>Static-1 hazard:</b> two paths of different length in SOP; fixed by a redundant consensus term.</li>
<li><b>Static-0 hazard:</b> in POS form; fixed by a redundant term.</li>
<li><b>Dynamic hazard:</b> multiple output transitions.</li>
</ul>
<div class="tip"><b>Exam tip</b> Hazards matter only in asynchronous circuits; synchronous designs mask glitches with the clock. If the question says "asynchronous", look for hazards.</div>
`},

  {id:'adc', name:'ADC and DAC Fundamentals', body: T`
<p><b>Core idea.</b> Convert between analog and digital while trading resolution for speed.</p>
${FIGSLOT('adc')}
<div class="formula">$$\text{Resolution}=\frac{V_{FS}}{2^n},\qquad V_{LSB}=\frac{V_{ref}}{2^n},\qquad \text{SNR}_{ideal}=6.02n+1.76\ \text{dB}$$</div>
<table><tr><th>ADC type</th><th>Speed</th><th>Resolution</th><th>Notes</th></tr>
<tr><td>Flash</td><td>Fastest (1 clock)</td><td>Low–medium</td><td>\(2^n-1\) comparators</td></tr>
<tr><td>SAR</td><td>Medium (n clocks)</td><td>Medium–high</td><td>Best general-purpose</td></tr>
<tr><td>Dual slope</td><td>Slow</td><td>Very high</td><td>Rejects mains noise</td></tr>
<tr><td>Counter (ramp)</td><td>Slow</td><td>Medium</td><td>Simple</td></tr>
</table>
<div class="formula">$$\text{DAC output: }V_o=\frac{V_{ref}}{2^n}\big(b_{n-1}2^{n-1}+\cdots+b_02^0\big)$$</div>
<ul>
<li>Quantisation error = ±½ LSB.</li>
<li>R-2R ladder uses only two resistor values — easy to fabricate.</li>
<li>Each extra bit improves SNR by ~6 dB.</li>
</ul>
<div class="tip"><b>Exam tip</b> For a 5 V, 8-bit ADC: LSB = 19.5 mV, error ≈ ±9.8 mV. Memorise this pair.</div>
`},

  {id:'fam', name:'Logic Families — TTL, CMOS & Interfacing', body: T`
<p><b>Core idea.</b> Compare families on speed, power, noise margin and fan-out.</p>
${FIGSLOT('levels')}
<div class="formula">$$NM_H=V_{OH}-V_{IH},\qquad NM_L=V_{IL}-V_{OL}$$</div>
<table><tr><th>Family</th><th>Speed</th><th>Static power</th><th>Noise margin</th><th>Notes</th></tr>
<tr><td>TTL</td><td>Medium</td><td>mW/gate</td><td>~0.4 V</td><td>Floating input = logic 1</td></tr>
<tr><td>CMOS</td><td>Medium–high</td><td>nW (leakage only)</td><td>~45% V_DD</td><td>Inputs must never float</td></tr>
<tr><td>ECL</td><td>Fastest</td><td>High</td><td>Low</td><td>Non-saturated</td></tr>
</table>
<div class="formula">$$P_{CMOS}=C_LV_{DD}^2f+P_{short\text{-}circuit}$$</div>
<div class="tip"><b>Exam tip</b> "Fastest" → ECL. "Lowest power" → CMOS. "Best power-delay product" → CMOS.</div>
`},

  {id:'mem', name:'Memories — SRAM, DRAM, ROM, Flash', body: T`
<p><b>Core idea.</b> Volatile vs non-volatile, and the speed/density/cost trade-off.</p>
${FIGSLOT('mem')}
<table><tr><th>Type</th><th>Cell</th><th>Refresh</th><th>Speed</th><th>Use</th></tr>
<tr><td>SRAM</td><td>6 transistors</td><td>No</td><td>Fastest</td><td>Cache</td></tr>
<tr><td>DRAM</td><td>1T + 1C</td><td>Yes</td><td>Medium</td><td>Main memory</td></tr>
<tr><td>ROM</td><td>Mask-programmed</td><td>—</td><td>Fast read</td><td>Firmware</td></tr>
<tr><td>Flash</td><td>Floating gate</td><td>No</td><td>Slow write</td><td>Storage</td></tr>
</table>
<div class="formula">$$\text{Capacity}=(\text{words})\times(\text{bits/word}),\qquad \text{chips needed}=\frac{\text{required}}{\text{per chip}}$$</div>
<div class="ex"><b>Worked example</b> To build 4K×8 from 1K×8 chips you need 4 chips plus a 2-to-4 decoder for chip selection.</div>
<div class="tip"><b>Exam tip</b> Address lines for \(2^n\) locations = n. To expand word size, place chips in parallel; to expand capacity, use a decoder.</div>
`},

  {id:'pld', name:'Programmable Logic — PAL, PLA, CPLD, FPGA', body: T`
<p><b>Core idea.</b> Programmable devices implement logic without custom silicon.</p>
${FIGSLOT('pla')}
<table><tr><th>Device</th><th>AND plane</th><th>OR plane</th></tr>
<tr><td>PROM</td><td>Fixed</td><td>Programmable</td></tr>
<tr><td>PAL</td><td>Programmable</td><td>Fixed</td></tr>
<tr><td>PLA</td><td>Programmable</td><td>Programmable</td></tr>
</table>
<ul>
<li><b>CPLD:</b> array of PAL-like macrocells with central interconnect; deterministic, non-volatile.</li>
<li><b>FPGA:</b> LUTs, flip-flops, routing fabric, block RAM, DSP slices; usually SRAM-based (volatile).</li>
<li>An n-input LUT implements any n-variable Boolean function.</li>
</ul>
<div class="tip"><b>Exam tip</b> PLA = both arrays programmable; PAL = AND only; PROM = OR only. This mnemonic answers every "which array is programmable" question.</div>
`},

  {id:'hdl', name:'HDL Fundamentals — Verilog / VHDL', body: T`
<p><b>Core idea.</b> Blocking vs non-blocking assignment is the classic HDL interview question.</p>
<pre class="ascii">// Combinational
assign y = a & b;

// Sequential — non-blocking
always @(posedge clk)
  q <= d;

// Combinational always block
always @(*) begin
  case (sel)
    2'b00: y = a;
    2'b01: y = b;
    default: y = 0;
  endcase
end</pre>
<ul>
<li><b>Blocking (=):</b> sequential execution, combinational logic.</li>
<li><b>Non-blocking (<=):</b> parallel execution, sequential logic.</li>
<li><b>always @(posedge clk)</b> infers flip-flops; <b>always @(*)</b> infers combinational logic.</li>
<li>Verilog is case-sensitive; VHDL is not.</li>
</ul>
<div class="warn"><b>Common trap</b> Using blocking assignment in a clocked always block can infer a shift register instead of parallel flip-flops. Always use non-blocking for sequential logic.</div>
`}
  ]
},

/* ============================================================ 6 CONTROL */
{
  id:'ctl', name:'Control Systems', icon:'⧉',
  topics:[
  {id:'loop', name:'Open-Loop vs Closed-Loop & Feedback', body: T`
<p><b>Core idea.</b> Feedback reduces sensitivity to parameter variation at the cost of stability margin.</p>
${FIGSLOT('loop')}
<div class="formula">$$T(s)=\frac{G(s)}{1+G(s)H(s)},\qquad E(s)=\frac{R(s)}{1+G(s)H(s)}$$
$$S_A^T=\frac{1}{1+GH}\quad\text{(sensitivity)}$$</div>
<ul>
<li><b>Open-loop:</b> simple, cheap, sensitive to disturbances.</li>
<li><b>Closed-loop:</b> accurate, but can become unstable.</li>
<li>Negative feedback reduces gain by \((1+GH)\) and increases bandwidth by the same factor.</li>
</ul>
<div class="tip"><b>Exam tip</b> Gain and bandwidth trade off one-for-one in a single-pole system — that is the gain-bandwidth product.</div>
`},

  {id:'model', name:'Mathematical Modelling & Transfer Functions', body: T`
<p><b>Core idea.</b> Convert physical systems into transfer functions.</p>
<div class="formula">$$\text{Mass–spring–damper: }M\ddot x+B\dot x+Kx=F\;\Rightarrow\;\frac{X(s)}{F(s)}=\frac{1}{Ms^2+Bs+K}$$
$$\text{Series RLC: }\frac{V_C(s)}{V_i(s)}=\frac{1/LC}{s^2+(R/L)s+1/LC}$$</div>
<table><tr><th>Mechanical</th><th>Electrical analogue</th></tr>
<tr><td>Force</td><td>Voltage</td></tr>
<tr><td>Velocity</td><td>Current</td></tr>
<tr><td>Mass</td><td>Inductance</td></tr>
<tr><td>Damper</td><td>Resistance</td></tr>
<tr><td>Spring</td><td>1/Capacitance</td></tr>
</table>
<div class="tip"><b>Exam tip</b> Transfer functions are defined only for LTI systems with zero initial conditions. DC gain is \(H(0)\).</div>
`},

  {id:'block', name:'Block Diagram Reduction & Signal Flow Graphs', body: T`
<p><b>Core idea.</b> Reduce complex interconnections to one transfer function.</p>
<div class="formula">$$\text{Series: }G_1G_2;\qquad \text{Parallel: }G_1+G_2;\qquad \text{Feedback: }\frac{G}{1\pm GH}$$</div>
<div class="formula">$$\text{Mason: }T=\frac{\sum_kP_k\Delta_k}{\Delta},\qquad \Delta=1-\sum L_i+\sum L_iL_j-\cdots$$</div>
<ul>
<li>\(P_k\) = forward path gain; \(\Delta_k\) = cofactor (remove loops touching that path).</li>
<li>Non-touching loops share no node.</li>
</ul>
<div class="ex"><b>Worked example</b> Single loop: Δ = 1 + GH, giving T = G/(1+GH).</div>
<div class="tip"><b>Exam tip</b> Mason's rule is faster than block reduction for anything with more than two loops.</div>
`},

  {id:'time', name:'Time Response & Second-Order Systems', body: T`
<p><b>Core idea.</b> Characterise the transient by ζ and ω_n.</p>
${FIGSLOT('stepresp')}
<div class="formula">$$\frac{C(s)}{R(s)}=\frac{\omega_n^2}{s^2+2\zeta\omega_ns+\omega_n^2}$$
$$t_r\approx\frac{1.8}{\omega_n},\quad t_p=\frac{\pi}{\omega_d},\quad M_p=e^{-\pi\zeta/\sqrt{1-\zeta^2}},\quad t_s\approx\frac{4}{\zeta\omega_n}\ (2\%)$$</div>
<ul>
<li>ζ = 0 undamped; 0 &lt; ζ &lt; 1 underdamped; ζ = 1 critical; ζ &gt; 1 overdamped.</li>
<li>Poles at \(s=-\zeta\omega_n\pm j\omega_d\).</li>
<li>Peak overshoot depends only on ζ.</li>
</ul>
<div class="tip"><b>Exam tip</b> Two systems with the same ζ have the same percentage overshoot, regardless of ω_n.</div>
`},

  {id:'sse', name:'Steady-State Error & Error Constants', body: T`
<p><b>Core idea.</b> The system type (number of integrators) determines which inputs it tracks with zero error.</p>
<div class="formula">$$e_{ss}=\lim_{s\to0}\frac{sR(s)}{1+G(s)H(s)}$$
$$K_p=\lim_{s\to0}G H,\quad K_v=\lim_{s\to0}sGH,\quad K_a=\lim_{s\to0}s^2GH$$</div>
<table><tr><th>Type</th><th>Step</th><th>Ramp</th><th>Parabola</th></tr>
<tr><td>0</td><td>\(1/(1+K_p)\)</td><td>∞</td><td>∞</td></tr>
<tr><td>1</td><td>0</td><td>\(1/K_v\)</td><td>∞</td></tr>
<tr><td>2</td><td>0</td><td>0</td><td>\(1/K_a\)</td></tr>
</table>
<div class="tip"><b>Exam tip</b> Increasing gain reduces steady-state error but reduces stability margin — the central trade-off of control design.</div>
`},

  {id:'routh', name:'Stability — Routh–Hurwitz', body: T`
<p><b>Core idea.</b> Count right-half-plane roots without solving the polynomial.</p>
<ul>
<li>Build the Routh array from the characteristic polynomial.</li>
<li>Number of sign changes in the first column = number of RHP roots.</li>
<li>All first-column entries positive ⇒ stable.</li>
</ul>
<div class="warn"><b>Special cases</b>
<ul style="margin:6px 0 0;padding-left:18px">
<li><b>Zero in first column:</b> replace it with ε → 0⁺ and continue.</li>
<li><b>Entire row zero:</b> form the auxiliary equation from the row above, differentiate it, and use the derivative coefficients.</li>
<li>Roots of the auxiliary equation are symmetric about the origin (often purely imaginary ⇒ marginal).</li>
</ul></div>
<div class="ex"><b>Worked example</b> \(s^3+4s^2+5s+K=0\): Routh gives \(4\times5>K\), so \(0<K<20\) for stability.</div>
<div class="tip"><b>Exam tip</b> Necessary (not sufficient): all coefficients must be present and positive. Missing or negative coefficients ⇒ automatic instability.</div>
`},

  {id:'rl', name:'Root Locus', body: T`
<p><b>Core idea.</b> Plot where the closed-loop poles move as K goes from 0 to ∞.</p>
${FIGSLOT('rootlocus')}
<ul>
<li>Starts at open-loop poles (K=0), ends at open-loop zeros or infinity (K=∞).</li>
<li>Number of branches = number of open-loop poles.</li>
<li>Real-axis branches lie to the left of an odd number of poles+zeros.</li>
<li>Asymptote angles \((2q+1)180°/(n-m)\); centroid \(\sigma_a=(\sum p-\sum z)/(n-m)\).</li>
<li>Breakaway points satisfy \(dK/ds=0\).</li>
</ul>
<div class="tip"><b>Exam tip</b> The root locus is always symmetric about the real axis. If a sketch is not, it is wrong.</div>
`},

  {id:'freq', name:'Frequency Response — Bode, Polar, Nyquist', body: T`
<p><b>Core idea.</b> Frequency-domain stability assessment without solving for poles.</p>
${FIGSLOT('bode')}
<ul>
<li>Pole at origin: −20 dB/decade, phase −90°.</li>
<li>Simple pole at \(\omega_c\): −45° at \(\omega_c\), −90° far above.</li>
<li>Nyquist: \(Z=N+P\) — stable iff no encirclement of −1 (for P = 0).</li>
</ul>
${FIGSLOT('nyquist')}
<div class="tip"><b>Exam tip</b> Slope rules: pole −20 dB/dec, zero +20 dB/dec, order n pole −20n dB/dec. Count slopes to identify the transfer function from a plot.</div>
`},

  {id:'margin', name:'Gain Margin, Phase Margin & Relative Stability', body: T`
<p><b>Core idea.</b> Margins measure how far the system is from instability.</p>
<div class="formula">$$GM=-20\log|G(j\omega_{pc})|\ \text{dB},\quad \omega_{pc}:\angle G=-180°$$
$$PM=180°+\angle G(j\omega_{gc}),\quad \omega_{gc}:|G|=0\ \text{dB}$$</div>
<ul>
<li>Stable: GM &gt; 0 dB and PM &gt; 0°.</li>
<li>Design target: PM between 45° and 60° (ζ ≈ 0.4–0.6).</li>
<li>Rule of thumb: \(\zeta\approx PM/100\) for PM in degrees.</li>
</ul>
<div class="tip"><b>Exam tip</b> If the Nyquist plot passes through −1, both margins are zero — marginal stability.</div>
`},

  {id:'comp', name:'Compensators — Lead, Lag, Lead–Lag', body: T`
<p><b>Core idea.</b> Reshape the frequency response to meet a specification.</p>
${FIGSLOT('leadlag')}
<div class="formula">$$\text{Lead: }\frac{1+\alpha Ts}{1+Ts},\ \alpha>1;\qquad \text{Lag: }\frac{1+Ts}{1+\beta Ts},\ \beta>1$$
$$\omega_m=\frac{1}{T\sqrt\alpha},\qquad \phi_m=\sin^{-1}\frac{\alpha-1}{\alpha+1}$$</div>
<ul>
<li><b>Lead:</b> positive phase, more bandwidth, faster response, more noise-sensitive.</li>
<li><b>Lag:</b> attenuation at high frequency, better steady-state error, slower.</li>
<li><b>Lead–lag:</b> combines both benefits.</li>
</ul>
<div class="tip"><b>Exam tip</b> Lead improves transient response; lag improves steady-state accuracy. "Improved damping without affecting steady-state error" → lead.</div>
`},

  {id:'pid', name:'PID Controllers', body: T`
<p><b>Core idea.</b> The three-term controller is the workhorse of industrial control.</p>
${FIGSLOT('pid')}
<div class="formula">$$u(t)=K_pe+K_i\int e\,dt+K_d\frac{de}{dt},\qquad G_c(s)=K_p+\frac{K_i}{s}+K_ds$$</div>
<table><tr><th>Term</th><th>Rise time</th><th>Overshoot</th><th>Steady-state error</th></tr>
<tr><td>P</td><td>Decreases</td><td>Increases</td><td>Never eliminates</td></tr>
<tr><td>I</td><td>Decreases</td><td>Increases</td><td>Eliminates</td></tr>
<tr><td>D</td><td>Small change</td><td>Decreases</td><td>No effect</td></tr>
</table>
<div class="tip"><b>Exam tip</b> If the spec says "zero steady-state error", an integral term is mandatory.</div>
`},

  {id:'ss', name:'State-Space, Controllability & Observability', body: T`
<p><b>Core idea.</b> A time-domain model for multi-input, multi-output systems.</p>
${FIGSLOT('statespace')}
<div class="formula">$$\dot x=Ax+Bu,\qquad y=Cx+Du,\qquad G(s)=C(sI-A)^{-1}B+D$$</div>
<div class="formula">$$Q_c=[B\ AB\ \cdots\ A^{n-1}B],\qquad Q_o=\begin{bmatrix}C\\CA\\\vdots\\CA^{n-1}\end{bmatrix}$$
$$\text{controllable iff rank}(Q_c)=n,\qquad \text{observable iff rank}(Q_o)=n$$</div>
<ul>
<li>Eigenvalues of A are the system poles.</li>
<li>Pole placement requires controllability.</li>
<li>Pole-zero cancellation hides an uncontrollable or unobservable mode.</li>
</ul>
<div class="tip"><b>Exam tip</b> If a transfer function has pole-zero cancellation, the state-space model reveals a mode the transfer function hides.</div>
`},

  {id:'disc', name:'Basic Discrete-Time Control', body: T`
<p><b>Core idea.</b> Digital controllers operate on sampled data; stability now means inside the unit circle.</p>
<div class="formula">$$z=e^{sT},\qquad \text{stable iff }|z|<1\ \text{(all poles inside the unit circle)}$$</div>
<ul>
<li>LHP maps inside the unit circle; the \(j\omega\) axis maps onto the unit circle.</li>
<li>Sampling adds ≈ \(T/2\) delay, reducing phase margin.</li>
<li>Bilinear transform \(s=\frac{2}{T}\frac{z-1}{z+1}\) maps the unit circle to the \(j\omega\) axis so Routh can be applied in the w-plane.</li>
</ul>
<div class="tip"><b>Exam tip</b> A continuous stable system can become unstable after sampling if the rate is too low — phase loss from the hold circuit.</div>
`}
  ]
},

/* ============================================================ 7 COMM */
{
  id:'com', name:'Analog and Digital Communication', icon:'📶',
  topics:[
  {id:'am', name:'Amplitude Modulation — DSB, DSB-SC, SSB, VSB', body: T`
<p><b>Core idea.</b> AM shifts the baseband spectrum to the carrier; the sidebands carry the information.</p>
${FIGSLOT('am')}
${FIGSLOT('amspectrum')}
<div class="formula">$$s_{AM}(t)=A_c[1+\mu m(t)]\cos\omega_ct,\qquad \mu=\frac{A_m}{A_c}$$
$$BW=2f_m,\qquad P_T=P_c\left(1+\frac{\mu^2}{2}\right),\qquad \eta=\frac{\mu^2}{2+\mu^2}$$</div>
<table><tr><th>Scheme</th><th>Bandwidth</th><th>Power</th><th>Detection</th></tr>
<tr><td>AM (DSB-FC)</td><td>\(2f_m\)</td><td>Carrier + sidebands</td><td>Envelope</td></tr>
<tr><td>DSB-SC</td><td>\(2f_m\)</td><td>Sidebands only</td><td>Coherent</td></tr>
<tr><td>SSB</td><td>\(f_m\)</td><td>One sideband</td><td>Coherent</td></tr>
<tr><td>VSB</td><td>\(f_m\) + vestige</td><td>One sideband + vestige</td><td>Coherent</td></tr>
</table>
<ul>
<li>Maximum AM efficiency at μ = 1 is 33.3%.</li>
<li>Overmodulation (μ &gt; 1) causes envelope distortion and envelope detection fails.</li>
</ul>
<div class="tip"><b>Exam tip</b> SSB halves both bandwidth and power compared with DSB — that is why it is used in HF radio.</div>
`},

  {id:'fm', name:'Frequency and Phase Modulation', body: T`
<p><b>Core idea.</b> Angle modulation — constant amplitude, information in frequency or phase.</p>
${FIGSLOT('fm')}
<div class="formula">$$s_{FM}(t)=A_c\cos\left(2\pi f_ct+2\pi k_f\int m(\tau)d\tau\right)$$
$$\beta=\frac{\Delta f}{f_m},\qquad BW_{Carson}=2(\Delta f+f_m)=2f_m(\beta+1)$$</div>
<ul>
<li>FM has better noise immunity than AM (capture effect) at the cost of bandwidth.</li>
<li>Constant envelope allows efficient class-C amplifiers.</li>
<li>Single-tone FM produces sidebands at \(f_c\pm nf_m\) with Bessel coefficients \(J_n(\beta)\).</li>
<li>PM: \(\beta=k_pA_m\), phase deviation proportional to message amplitude.</li>
</ul>
<div class="ex"><b>Worked example</b> Δf = 75 kHz, \(f_m=15\) kHz ⇒ β = 5, BW = 2(75+15) = 180 kHz.</div>
<div class="tip"><b>Exam tip</b> Carson's rule is the standard bandwidth answer. For β ≫ 1, BW ≈ 2Δf.</div>
`},

  {id:'rx', name:'Transmitters, Receivers & Superheterodyne', body: T`
<p><b>Core idea.</b> The superheterodyne receiver converts every incoming RF to a fixed IF.</p>
${FIGSLOT('superhet')}
<div class="formula">$$f_{IF}=f_{RF}-f_{LO}\ (\text{high-side injection}),\qquad f_{image}=f_{RF}+2f_{IF}$$</div>
<ul>
<li>Blocks: RF amp → mixer → IF amp → detector → AF amp.</li>
<li>Advantages of IF: fixed-frequency, highly selective amplifiers; stable gain.</li>
<li>Image rejection ratio depends on the RF filter's selectivity at the image frequency.</li>
</ul>
<div class="formula">$$\text{IRR}=\sqrt{1+Q^2\rho^2},\qquad \rho=\frac{f_{image}}{f_{RF}}-\frac{f_{RF}}{f_{image}}$$</div>
<div class="tip"><b>Exam tip</b> With \(f_{RF}=1\) MHz and \(f_{IF}=455\) kHz, the image is at 1.91 MHz. This numeric appears repeatedly.</div>
`},

  {id:'noise', name:'Noise, SNR & Noise Figure', body: T`
<p><b>Core idea.</b> Noise sets the lower limit on detectable signal.</p>
<div class="formula">$$N=kTB,\qquad k=1.38\times10^{-23}\ \text{J/K}$$
$$F=\frac{SNR_{in}}{SNR_{out}},\qquad NF=10\log F\ \text{dB}$$
$$F_{total}=F_1+\frac{F_2-1}{G_1}+\frac{F_3-1}{G_1G_2}+\cdots\quad\text{(Friis)}$$</div>
<ul>
<li>Thermal noise is white and Gaussian.</li>
<li>Shot noise: \(i_n^2=2qIB\).</li>
<li>Flicker (1/f) noise dominates at low frequencies.</li>
<li>FM has better output SNR above threshold; below threshold it fails abruptly.</li>
</ul>
<div class="tip"><b>Exam tip</b> The first stage dominates the overall noise figure. Always place a low-noise amplifier first.</div>
`},

  {id:'pcm', name:'Sampling, Quantisation, PCM, DPCM, Delta Modulation', body: T`
<p><b>Core idea.</b> Convert an analog signal to bits; quantisation noise is the price.</p>
${FIGSLOT('pcm')}
<div class="formula">$$R_b=nf_s\ \text{bit/s},\qquad SNR_q=6.02n+1.76\ \text{dB}\quad\text{(uniform quantiser, full-scale sine)}$$</div>
<ul>
<li><b>PCM:</b> robust, requires large bandwidth.</li>
<li><b>DPCM:</b> encodes the difference between the sample and a prediction — saves bits.</li>
<li><b>Delta modulation:</b> 1 bit per sample; slope-overload if the step is too small, granular noise if too large.</li>
<li><b>ADM:</b> adaptive step size fixes the trade-off.</li>
<li><b>Companding</b> (μ-law, A-law) gives finer resolution to small signals.</li>
</ul>
<div class="tip"><b>Exam tip</b> Each added PCM bit improves SNR by ~6 dB. Telephony: 8 kHz × 8 bits = 64 kbps.</div>
`},

  {id:'dmod', name:'Digital Modulation — ASK, FSK, PSK, QPSK, QAM', body: T`
<p><b>Core idea.</b> Map bits onto amplitude, frequency, or phase of a carrier.</p>
${FIGSLOT('const')}
<div class="formula">$$\text{BPSK: }P_e=Q\!\left(\sqrt{\frac{2E_b}{N_0}}\right),\qquad \text{QPSK: }P_e=Q\!\left(\sqrt{\frac{2E_b}{N_0}}\right)$$
$$\text{M-ary QAM: }E_s=E_b\log_2M,\qquad \text{bits/symbol}=\log_2M$$</div>
<table><tr><th>Scheme</th><th>Bits/symbol</th><th>Spectral efficiency</th><th>Robustness</th></tr>
<tr><td>BPSK</td><td>1</td><td>1 bps/Hz</td><td>Highest</td></tr>
<tr><td>QPSK</td><td>2</td><td>2 bps/Hz</td><td>High</td></tr>
<tr><td>16-QAM</td><td>4</td><td>4 bps/Hz</td><td>Medium</td></tr>
<tr><td>64-QAM</td><td>6</td><td>6 bps/Hz</td><td>Lower</td></tr>
</table>
<div class="tip"><b>Exam tip</b> BPSK and QPSK have identical BER vs \(E_b/N_0\); QPSK wins on bandwidth, not power efficiency.</div>
`},

  {id:'det', name:'Detection, Matched Filters & Probability of Error', body: T`
<p><b>Core idea.</b> The matched filter maximises SNR at the sampling instant.</p>
<div class="formula">$$h(t)=s(T-t),\qquad \left(\frac SN\right)_{max}=\frac{2E}{N_0}$$
$$P_e=Q\!\left(\sqrt{\frac{2E_b}{N_0}}\right),\qquad Q(x)=\frac12\operatorname{erfc}\!\left(\frac{x}{\sqrt2}\right)$$</div>
<ul>
<li>Matched filter output peaks at t = T — optimal in AWGN.</li>
<li>Coherent detection needs carrier recovery; non-coherent does not but costs ~3 dB.</li>
<li>For BPSK, \(P_e=10^{-5}\) needs \(E_b/N_0\approx9.6\) dB.</li>
</ul>
<div class="tip"><b>Exam tip</b> The matched filter impulse response is the time-reversed, delayed pulse — asked directly very often.</div>
`},

  {id:'line', name:'Line Coding, Pulse Shaping & ISI', body: T`
<p><b>Core idea.</b> Shape pulses so that adjacent symbols do not interfere at the sampling instant.</p>
${FIGSLOT('linecode')}
<div class="formula">$$\text{Nyquist criterion: }\sum_kP\!\left(f-\frac{k}{T_s}\right)=T_s,\qquad |f|\le\frac{1}{2T_s}$$
$$BW=\frac{R_s}{2}(1+\alpha)\quad\text{(raised cosine)}$$</div>
<ul>
<li><b>NRZ:</b> simple, DC component, poor clock recovery.</li>
<li><b>RZ:</b> easier clock recovery, wider bandwidth.</li>
<li><b>Manchester:</b> self-clocking, DC-free.</li>
<li><b>AMI:</b> alternating mark inversion, no DC.</li>
<li>ISI is caused by band-limiting and multipath; removed at sampling instants by Nyquist pulses.</li>
</ul>
<div class="tip"><b>Exam tip</b> α = 0 gives minimum bandwidth but is unrealisable (sinc); α = 1 doubles the bandwidth but has the smoothest tails.</div>
`},

  {id:'info', name:'Information Theory — Entropy, Capacity', body: T`
<p><b>Core idea.</b> Shannon capacity is the maximum error-free data rate.</p>
<div class="formula">$$H=-\sum_iP_i\log_2P_i,\qquad H_{max}=\log_2M$$
$$C=B\log_2\!\left(1+\frac SN\right)\ \text{bit/s}\quad\text{(Shannon–Hartley)}$$</div>
<ul>
<li>BSC with crossover p: \(C=1-H(p)\).</li>
<li>Shannon limit: \(E_b/N_0=-1.6\) dB for reliable transmission.</li>
<li>Capacity grows linearly with bandwidth but only logarithmically with SNR.</li>
</ul>
<div class="ex"><b>Worked example</b> B = 3 kHz, S/N = 1000 (30 dB): \(C=3000\log_2(1001)\approx29.9\) kbps.</div>
<div class="tip"><b>Exam tip</b> A 3 dB increase in S/N adds about 1 bit/s/Hz of capacity. At 30 dB, capacity ≈ 10 bits/s/Hz.</div>
`},

  {id:'src', name:'Source Coding, Huffman & Error-Control Coding', body: T`
<p><b>Core idea.</b> Source coding removes redundancy; channel coding adds controlled redundancy to fight errors.</p>
${FIGSLOT('huffman')}
<div class="formula">$$\eta=\frac{H}{L}\times100\%,\qquad \text{Hamming}(7,4):\ 2^m\ge n+1$$
$$d_{min}\text{ detects }d_{min}-1\text{ errors, corrects }\left\lfloor\frac{d_{min}-1}{2}\right\rfloor$$</div>
<ul>
<li><b>Huffman:</b> optimal prefix code for a known source.</li>
<li><b>Shannon–Fano:</b> suboptimal but simpler.</li>
<li><b>Block codes:</b> \((n,k)\), rate \(k/n\).</li>
<li><b>Convolutional codes:</b> continuous, Viterbi decoding.</li>
<li><b>CRC:</b> polynomial division with shift registers.</li>
</ul>
<div class="tip"><b>Exam tip</b> "Which code is optimal?" → Huffman. "Which code is self-synchronising?" → prefix codes in general.</div>
`},

  {id:'mux', name:'Multiplexing & Multiple Access', body: T`
<p><b>Core idea.</b> Share a channel in time, frequency, or code.</p>
<table><tr><th>Scheme</th><th>Domain</th><th>Notes</th></tr>
<tr><td>FDM</td><td>Frequency</td><td>Guard bands required</td></tr>
<tr><td>TDM</td><td>Time</td><td>Requires synchronisation</td></tr>
<tr><td>FDMA/TDMA</td><td>Freq/time</td><td>Cellular multiple access</td></tr>
<tr><td>CDMA</td><td>Code</td><td>Interference-limited</td></tr>
<tr><td>OFDM</td><td>Subcarriers</td><td>Cyclic prefix removes ISI</td></tr>
<tr><td>WDM</td><td>Wavelength</td><td>Optical FDM</td></tr>
</table>
<div class="formula">$$\text{TDM frame rate}=f_s,\qquad R_b=f_s\times N\times n$$</div>
<div class="tip"><b>Exam tip</b> CDMA is interference-limited, not bandwidth-limited — a key difference from FDMA/TDMA.</div>
`},

  {id:'eq', name:'Equalisation, Eye Diagrams & Spread Spectrum', body: T`
<p><b>Core idea.</b> Undo channel distortion; measure margin with an eye diagram.</p>
${FIGSLOT('eye')}
<ul>
<li><b>Zero-forcing equaliser:</b> inverse of the channel; amplifies noise at deep nulls.</li>
<li><b>MMSE:</b> balances ISI removal and noise enhancement.</li>
<li><b>Adaptive:</b> LMS/RLS track a time-varying channel.</li>
<li><b>DSSS:</b> multiply by a PN code. <b>FHSS:</b> hop frequencies.</li>
</ul>
<div class="formula">$$G_p=\frac{B_{ss}}{B_{info}},\qquad \text{jamming margin}=G_p-(S/N)_{min}$$</div>
<div class="tip"><b>Exam tip</b> The eye's vertical opening indicates noise margin; the horizontal opening indicates timing jitter tolerance.</div>
`}
  ]
},

/* ============================================================ 8 EMFT */
{
  id:'em', name:'Electromagnetics, Transmission Lines & Antennas', icon:'🌐',
  topics:[
  {id:'vec', name:'Vector Fields & Coordinate Systems', body: T`
<p><b>Core idea.</b> Choose the coordinate system that matches the symmetry.</p>
<div class="formula">$$\text{Cylindrical: }d\vec l=d\rho\,\hat\rho+\rho d\phi\,\hat\phi+dz\,\hat z$$
$$\text{Spherical: }d\vec l=dr\,\hat r+rd\theta\,\hat\theta+r\sin\theta\,d\phi\,\hat\phi$$</div>
<div class="formula">$$\nabla\cdot\vec A=\frac{1}{\rho}\frac{\partial(\rho A_\rho)}{\partial\rho}+\frac{1}{\rho}\frac{\partial A_\phi}{\partial\phi}+\frac{\partial A_z}{\partial z}\quad\text{(cylindrical)}$$</div>
<div class="tip"><b>Exam tip</b> Coaxial cable → cylindrical. Point charge / sphere → spherical. Parallel plates → Cartesian. Never convert unnecessarily.</div>
`},

  {id:'estat', name:'Electrostatics — Gauss\'s Law, Potential, Capacitance', body: T`
<p><b>Core idea.</b> Symmetry plus Gauss's law gives the field in one line.</p>
${FIGSLOT('gauss')}
<div class="formula">$$\oint_S\vec D\cdot d\vec S=Q_{enc},\qquad \vec E=-\nabla V,\qquad \vec D=\epsilon\vec E$$
$$\vec E=\frac{Q}{4\pi\epsilon r^2}\hat r,\qquad V=\frac{Q}{4\pi\epsilon r}$$</div>
<div class="formula">$$\text{Parallel plate: }C=\frac{\epsilon A}{d},\qquad \text{Coaxial: }C=\frac{2\pi\epsilon L}{\ln(b/a)},\qquad \text{Sphere: }C=4\pi\epsilon a$$</div>
<ul>
<li>Energy stored: \(W=\frac12CV^2=\frac12\int\epsilon E^2dv\).</li>
<li>Boundary: \(D_{1n}-D_{2n}=\rho_s\); tangential E is continuous.</li>
<li>Inside a conductor in equilibrium: E = 0, charge resides on the surface.</li>
</ul>
<div class="tip"><b>Exam tip</b> A charge placed inside a cavity induces an equal and opposite charge on the cavity wall and an equal charge on the outer surface.</div>
`},

  {id:'mstat', name:'Magnetostatics — Ampere\'s Law, Inductance', body: T`
<p><b>Core idea.</b> Currents create magnetic fields; symmetry again is the key.</p>
${FIGSLOT('ampere')}
<div class="formula">$$\oint\vec H\cdot d\vec l=I_{enc},\qquad \vec B=\mu\vec H,\qquad \vec F=Q(\vec v\times\vec B)$$
$$\text{Wire: }H=\frac{I}{2\pi\rho},\qquad \text{Solenoid: }H=nI,\qquad \text{Toroid: }H=\frac{NI}{2\pi\rho}$$</div>
<div class="formula">$$L=\frac{N\Phi}{I},\qquad W=\frac12LI^2,\qquad L_{coax}=\frac{\mu_0L}{2\pi}\ln\frac ba$$</div>
<ul>
<li>Normal B is continuous; tangential H jumps by surface current density.</li>
<li>\(\nabla\cdot\vec B=0\) ⇒ no magnetic monopoles; B lines close on themselves.</li>
</ul>
<div class="tip"><b>Exam tip</b> B is continuous across a boundary normal component; H is continuous tangentially only when there is no surface current.</div>
`},

  {id:'max', name:'Maxwell\'s Equations & Boundary Conditions', body: T`
<p><b>Core idea.</b> Four equations unify electricity and magnetism and predict EM waves.</p>
<div class="formula">$$\nabla\cdot\vec D=\rho_v\qquad\text{(Gauss)}$$
$$\nabla\cdot\vec B=0\qquad\text{(no monopole)}$$
$$\nabla\times\vec E=-\frac{\partial\vec B}{\partial t}\qquad\text{(Faraday)}$$
$$\nabla\times\vec H=\vec J+\frac{\partial\vec D}{\partial t}\qquad\text{(Ampere–Maxwell)}$$</div>
<ul>
<li>The displacement current \(\partial D/\partial t\) is Maxwell's key addition; it allows propagation in free space.</li>
<li>Boundary conditions: \(E_t\) continuous, \(H_t\) jumps by \(J_s\), \(D_n\) jumps by \(\rho_s\), \(B_n\) continuous.</li>
<li>Perfect conductor: E = H = 0 inside; all fields are surface fields outside.</li>
</ul>
<div class="formula">$$\nabla^2\vec E=\mu\epsilon\frac{\partial^2\vec E}{\partial t^2}\qquad\text{(wave equation)}$$</div>
<div class="tip"><b>Exam tip</b> The wave equation follows directly from Maxwell's equations — a common "derive" question.</div>
`},

  {id:'pw', name:'Plane Waves, Polarisation & Poynting Vector', body: T`
<p><b>Core idea.</b> In free space, E, H and the propagation direction are mutually perpendicular.</p>
${FIGSLOT('planewave')}
<div class="formula">$$v_p=\frac{1}{\sqrt{\mu\epsilon}}=\frac{c}{\sqrt{\mu_r\epsilon_r}},\qquad \eta=\sqrt{\frac{\mu}{\epsilon}},\quad \eta_0=377\,\Omega$$
$$\vec P=\vec E\times\vec H,\qquad \vec P_{avg}=\frac12\Re(\vec E\times\vec H^*)$$</div>
<div class="formula">$$\text{Skin depth }\delta=\sqrt{\frac{2}{\omega\mu\sigma}},\qquad \alpha=\sqrt{\frac{\omega\mu\sigma}{2}}$$</div>
<ul>
<li>Lossless: α = 0, η real. Good conductor: α = β = \(\sqrt{\pi f\mu\sigma}\).</li>
<li>Polarisation: linear, circular (equal amplitude, 90° phase difference), elliptical.</li>
<li>In a good conductor, E leads H by 45°.</li>
</ul>
<div class="tip"><b>Exam tip</b> \(\eta_0=120\pi\approx377\,\Omega\) appears in almost every EMFT numerical — memorise it.</div>
`},

  {id:'refl', name:'Reflection, Transmission & Wave Impedance', body: T`
<p><b>Core idea.</b> At a boundary, part of the wave reflects and part transmits; the split depends on impedance mismatch.</p>
${FIGSLOT('refl')}
<div class="formula">$$\Gamma=\frac{\eta_2-\eta_1}{\eta_2+\eta_1},\qquad \tau=1+\Gamma=\frac{2\eta_2}{\eta_2+\eta_1}$$
$$|\Gamma|^2+\frac{\eta_1}{\eta_2}|\tau|^2=1\quad\text{(power conservation)}$$</div>
<ul>
<li>Brewster angle: no reflection for parallel polarisation; \(\tan\theta_B=\sqrt{\epsilon_2/\epsilon_1}\).</li>
<li>Total internal reflection when going denser → rarer beyond the critical angle: \(\sin\theta_c=\sqrt{\epsilon_2/\epsilon_1}\).</li>
<li>Perfect conductor: Γ = −1, full reflection with E phase reversal.</li>
</ul>
<div class="tip"><b>Exam tip</b> Γ = −1 for a short circuit; Γ = +1 for an open circuit. E reverses on reflection from a perfect conductor, H does not.</div>
`},

  {id:'tl', name:'Transmission-Line Equations & Characteristic Impedance', body: T`
<p><b>Core idea.</b> A transmission line is a distributed circuit; voltage and current vary along its length.</p>
${FIGSLOT('tl')}
<div class="formula">$$\frac{\partial V}{\partial z}=-L\frac{\partial I}{\partial t},\qquad \frac{\partial I}{\partial z}=-C\frac{\partial V}{\partial t}$$
$$Z_0=\sqrt{\frac{R+j\omega L}{G+j\omega C}},\qquad \gamma=\alpha+j\beta=\sqrt{(R+j\omega L)(G+j\omega C)}$$</div>
<div class="formula">$$\text{Lossless: }Z_0=\sqrt{\frac LC},\quad v_p=\frac{1}{\sqrt{LC}},\quad \beta=\omega\sqrt{LC}$$</div>
<ul>
<li>Distortionless line: \(R/L=G/C\).</li>
<li>Propagation delay \(t_d=l/v_p\).</li>
<li>Common impedances: 50 Ω coaxial, 75 Ω video, 300 Ω twin-lead, 50 Ω microstrip.</li>
</ul>
<div class="tip"><b>Exam tip</b> For an air-dielectric line, \(v_p=c\). Electrical length = physical length / λ.</div>
`},

  {id:'vswr', name:'Reflection Coefficient, VSWR & Matching', body: T`
<p><b>Core idea.</b> Mismatch creates standing waves; matching eliminates them.</p>
${FIGSLOT('vswr')}
<div class="formula">$$\Gamma_L=\frac{Z_L-Z_0}{Z_L+Z_0},\qquad VSWR=\frac{1+|\Gamma|}{1-|\Gamma|}$$
$$Z_{in}(l)=Z_0\frac{Z_L+jZ_0\tan\beta l}{Z_0+jZ_L\tan\beta l}$$</div>
<div class="formula">$$\text{Quarter-wave transformer: }Z_{in}=\frac{Z_0^2}{Z_L},\qquad Z_0'=\sqrt{Z_{in}Z_L}$$</div>
<ul>
<li>|Γ| = 0 → VSWR = 1 (perfect match); |Γ| = 1 → VSWR = ∞ (total reflection).</li>
<li>Return loss = −20 log|Γ| dB.</li>
<li>λ/4 line inverts impedance; λ/2 repeats it.</li>
</ul>
<div class="tip"><b>Exam tip</b> Adjacent minima are λ/2 apart; a maximum and the nearest minimum are λ/4 apart. Use this to locate the load.</div>
`},

  {id:'smith', name:'Smith Chart Fundamentals', body: T`
<p><b>Core idea.</b> A graphical calculator for impedance, reflection coefficient and matching.</p>
${FIGSLOT('smith')}
<ul>
<li>Centre = matched (Z = Z₀, Γ = 0); outer circle = |Γ| = 1.</li>
<li>Constant-resistance circles and constant-reactance arcs are orthogonal.</li>
<li>Clockwise = toward the generator; one full revolution = λ/2.</li>
<li>Upper half = inductive (+jX); lower half = capacitive (−jX).</li>
</ul>
<div class="formula">$$z=\frac{Z}{Z_0}=\frac{1+\Gamma}{1-\Gamma}\qquad\text{(normalised impedance)}$$</div>
<div class="tip"><b>Exam tip</b> To match with a stub: normalise the load, rotate toward the generator to the |Γ| circle, read the required reactance, then convert it to a stub length.</div>
`},

  {id:'wg', name:'Waveguides, Modes & Cutoff', body: T`
<p><b>Core idea.</b> Above cutoff a waveguide propagates; below cutoff it evanesces.</p>
${FIGSLOT('wg')}
<div class="formula">$$f_c=\frac c2\sqrt{\left(\frac ma\right)^2+\left(\frac nb\right)^2}\quad\text{(rectangular TE}_{mn}/\text{TM}_{mn}\text{)}$$
$$\lambda_g=\frac{\lambda_0}{\sqrt{1-(f_c/f)^2}},\qquad v_p=\frac{c}{\sqrt{1-(f_c/f)^2}},\qquad v_g=\frac{c^2}{v_p}$$</div>
<ul>
<li>Rectangular dominant mode: TE₁₀ with \(f_c=c/2a\).</li>
<li>Circular dominant mode: TE₁₁.</li>
<li>TM modes cannot exist in a rectangular guide if m or n is zero.</li>
<li>Below cutoff the wave is evanescent — no real power flow.</li>
</ul>
<div class="tip"><b>Exam tip</b> \(v_p>c\) and \(v_g<c\) always, with \(v_pv_g=c^2\). This pair is asked repeatedly.</div>
`},

  {id:'cav', name:'Cavity Resonators & Quality Factor', body: T`
<p><b>Core idea.</b> A closed waveguide is a high-Q resonator.</p>
${FIGSLOT('cavity')}
<div class="formula">$$f_{mnp}=\frac c2\sqrt{\left(\frac ma\right)^2+\left(\frac nb\right)^2+\left(\frac pd\right)^2},\qquad Q=\frac{\omega_0U}{P_{loss}},\quad BW=\frac{f_0}{Q}$$</div>
<ul>
<li>Rectangular cavity dominant mode: TE₁₀₁.</li>
<li>Q can exceed 10,000; used in klystrons, magnetrons, filters and frequency standards.</li>
<li>Surface resistance from skin effect lowers Q; silver plating helps.</li>
</ul>
<div class="tip"><b>Exam tip</b> Doubling Q halves bandwidth. High-Q cavities are essential for narrowband filters and stable oscillators.</div>
`},

  {id:'sp', name:'Scattering Parameters & Microwave Measurements', body: T`
<p><b>Core idea.</b> Power-wave description that works where V and I cannot be measured directly.</p>
<div class="formula">$$\begin{bmatrix}b_1\\b_2\end{bmatrix}=\begin{bmatrix}S_{11}&S_{12}\\S_{21}&S_{22}\end{bmatrix}\begin{bmatrix}a_1\\a_2\end{bmatrix}$$
$$S_{11}=\frac{b_1}{a_1}\Big|_{a_2=0},\quad S_{21}=\frac{b_2}{a_1}\Big|_{a_2=0},\quad S_{12}=\frac{b_1}{a_2}\Big|_{a_1=0},\quad S_{22}=\frac{b_2}{a_2}\Big|_{a_1=0}$$</div>
<ul>
<li>Reciprocal: \(S_{12}=S_{21}\). Lossless: unitary matrix.</li>
<li>Insertion loss = −20 log|S₂₁|; return loss = −20 log|S₁₁|.</li>
<li>VSWR = (1+|S₁₁|)/(1−|S₁₁|).</li>
<li>Measured with a VNA, calibrated with SOLT standards.</li>
</ul>
<div class="tip"><b>Exam tip</b> For a lossless two-port, |S₁₁|² + |S₂₁|² = 1. If a numerical result violates this, the calculation is wrong.</div>
`},

  {id:'match', name:'Impedance Matching & Microwave Networks', body: T`
<p><b>Core idea.</b> Deliver maximum power by making the load look like Z₀.</p>
<ul>
<li><b>λ/4 transformer:</b> narrowband, real load to real line.</li>
<li><b>Stub matching:</b> single stub (series or shunt) with adjustable position and length.</li>
<li><b>L-network:</b> two reactive elements, narrowband, complex loads.</li>
<li><b>Tapered lines:</b> gradual impedance change over a length → broadband.</li>
<li><b>Wilkinson divider:</b> equal split with matched ports and isolation.</li>
<li><b>Directional coupler:</b> coupling factor and directivity.</li>
</ul>
<div class="formula">$$\text{Return loss}=-20\log|\Gamma|,\qquad \text{Mismatch loss}=-10\log(1-|\Gamma|^2)$$</div>
<div class="tip"><b>Exam tip</b> Quarter-wave matching works only at one frequency — that is why broadband systems use tapered lines or multi-section transformers.</div>
`},

  {id:'tubes', name:'Microwave Tubes — Klystron, Magnetron, TWT, Gunn', body: T`
<p><b>Core idea.</b> At high power/frequency, conventional transistors fail and specialised tubes take over.</p>
<table><tr><th>Device</th><th>Mechanism</th><th>Key property</th><th>Application</th></tr>
<tr><td>Klystron</td><td>Velocity modulation</td><td>High gain, narrowband</td><td>Radar, accelerators</td></tr>
<tr><td>Magnetron</td><td>Crossed fields + cavities</td><td>Pulsed high power</td><td>Ovens, radar</td></tr>
<tr><td>TWT</td><td>Helix slow-wave structure</td><td>Very wide bandwidth</td><td>Satellite transponders</td></tr>
<tr><td>Gunn diode</td><td>Transferred electron effect</td><td>Compact oscillator</td><td>Low-power microwave</td></tr>
<tr><td>IMPATT</td><td>Avalanche transit time</td><td>High power at mm-wave</td><td>Mm-wave sources</td></tr>
</table>
<div class="formula">$$\text{Gunn transit-time frequency: }f\approx\frac{v_d}{L}$$</div>
<div class="tip"><b>Exam tip</b> TWT = broadband; Klystron = high gain, narrowband; Magnetron = highest pulsed power.</div>
`},

  {id:'ss', name:'PIN, Varactor, Tunnel Diode & HEMT', body: T`
<p><b>Core idea.</b> Specialised semiconductor devices for microwave control and amplification.</p>
<ul>
<li><b>PIN diode:</b> variable RF resistance — switches, attenuators, phase shifters.</li>
<li><b>Varactor:</b> voltage-variable capacitance — tuning and frequency multiplication.</li>
<li><b>Tunnel diode:</b> quantum tunnelling, negative resistance; very fast, low power.</li>
<li><b>HEMT:</b> very high electron mobility, lowest noise at mm-wave.</li>
<li><b>Schottky:</b> fast, low turn-on — detectors and mixers.</li>
</ul>
<div class="formula">$$C_j=\frac{C_0}{(1+V_R/V_0)^n},\qquad n\approx\tfrac12$$</div>
<div class="tip"><b>Exam tip</b> Control devices (PIN, varactor) vs source/amplifier devices (Gunn, IMPATT, HEMT) — categorise before answering.</div>
`},

  {id:'osc', name:'Microwave Oscillators, Mixers & Detectors', body: T`
<p><b>Core idea.</b> Frequency conversion and signal generation at microwave frequencies.</p>
<ul>
<li><b>Mixer:</b> nonlinear device producing sum/difference frequencies; conversion loss 5–8 dB.</li>
<li><b>Balanced mixer:</b> suppresses LO leakage, improves isolation.</li>
<li><b>Detector:</b> Schottky diode plus low-pass filter — extracts the envelope.</li>
<li><b>Gunn oscillator:</b> cavity-tuned; mechanically or electronically tunable.</li>
<li><b>DRO:</b> dielectric resonator oscillator — high Q, low phase noise.</li>
</ul>
<div class="formula">$$f_{IF}=|f_{RF}-f_{LO}|,\qquad \text{conversion gain}=10\log\frac{P_{IF}}{P_{RF}}$$</div>
<div class="tip"><b>Exam tip</b> An image-reject mixer removes the image band before conversion, improving noise figure.</div>
`},

  {id:'radar', name:'Radar Basics & Microwave Applications', body: T`
<p><b>Core idea.</b> Range from delay, velocity from Doppler.</p>
${FIGSLOT('radar')}
<div class="formula">$$R=\frac{ct}{2},\qquad f_d=\frac{2v_r}{\lambda},\qquad P_r=\frac{P_tG^2\lambda^2\sigma}{(4\pi)^3R^4}$$</div>
<div class="formula">$$\text{Max unambiguous range: }R_{max}=\frac{c}{2f_{PRF}},\qquad \text{range resolution}=\frac{c\tau}{2}$$</div>
<ul>
<li>Pulse radar: measures range; blind range if the target returns while transmitting.</li>
<li>CW radar: velocity only. FMCW: both range and velocity.</li>
<li>MTI/pulse-Doppler: reject clutter using Doppler filtering.</li>
<li>Radar cross-section σ is the effective area the target presents.</li>
</ul>
<div class="tip"><b>Exam tip</b> Received power falls as R⁴ — doubling range needs 16× the transmit power. This is the single most important radar relation.</div>
`}
  ]
},

/* ============================================================ 9 DEVICES */
{
  id:'dev', name:'Electronic Devices and Circuits', icon:'▣',
  topics:[
  {id:'pn', name:'PN Junctions, Breakdown & Diode Models', body: T`
<p><b>Core idea.</b> The depletion region and built-in potential govern everything.</p>
${FIGSLOT('pn')}
<div class="formula">$$V_0=V_T\ln\frac{N_AN_D}{n_i^2},\qquad W=\sqrt{\frac{2\epsilon(V_0-V_R)}{q}\left(\frac{1}{N_A}+\frac{1}{N_D}\right)}$$
$$C_j=\frac{C_{j0}}{(1-V_R/V_0)^m},\quad m=\tfrac12\ \text{(abrupt)},\ \tfrac13\ \text{(graded)}$$</div>
<ul>
<li><b>Zener breakdown:</b> heavy doping, thin depletion, tunnelling at low reverse voltage; negative temperature coefficient.</li>
<li><b>Avalanche breakdown:</b> impact ionisation; positive temperature coefficient.</li>
<li>Diode models: ideal switch, constant-voltage (0.7 V), piecewise-linear, small-signal resistance \(r_d=V_T/I_D\).</li>
</ul>
<div class="tip"><b>Exam tip</b> Zener breakdown voltage decreases with temperature; avalanche increases. Zener dominates below ~5–6 V.</div>
`},

  {id:'fet', name:'JFET & MOSFET Characteristics', body: T`
<p><b>Core idea.</b> Three device families with different control mechanisms and input impedances.</p>
<div class="formula">$$\text{JFET: }I_D=I_{DSS}\left(1-\frac{V_{GS}}{V_P}\right)^2\quad\text{(saturation)}$$</div>
<table><tr><th>Device</th><th>Control</th><th>Input impedance</th><th>Mode</th></tr>
<tr><td>BJT</td><td>Current (\(I_B\))</td><td>Moderate</td><td>Active/saturation/cut-off</td></tr>
<tr><td>JFET</td><td>Voltage (\(V_{GS}\))</td><td>Very high</td><td>Depletion only</td></tr>
<tr><td>MOSFET</td><td>Voltage (\(V_{GS}\))</td><td>Highest</td><td>Enhancement/depletion</td></tr>
</table>
<div class="tip"><b>Exam tip</b> For a JFET, gate current is essentially zero, so \(I_G\approx0\) and \(I_S=I_D\). For a BJT, \(I_E=I_B+I_C\).</div>
`},

  {id:'moscap', name:'MOS Capacitor, Threshold Voltage & CMOS', body: T`
<p><b>Core idea.</b> The MOS capacitor is the heart of the MOSFET and of CMOS logic.</p>
${FIGSLOT('moscap')}
<div class="formula">$$V_{TH}=V_{FB}+2\phi_F+\frac{\sqrt{2\epsilon_sqN_A(2\phi_F)}}{C_{ox}},\qquad C_{ox}=\frac{\epsilon_{ox}}{t_{ox}},\quad \phi_F=V_T\ln\frac{N_A}{n_i}$$</div>
<ul>
<li>Three regions: accumulation, depletion, inversion.</li>
<li>Strong inversion when the surface potential reaches \(2\phi_F\).</li>
<li>CMOS inverter: PMOS pull-up, NMOS pull-down; static power ≈ 0, dynamic power \(CV^2f\).</li>
<li>Body effect: \(V_{TH}\) increases when the source–body junction is reverse biased.</li>
<li>Short-channel effects: velocity saturation, DIBL, hot carriers.</li>
</ul>
<div class="tip"><b>Exam tip</b> In a CMOS inverter both transistors conduct only during switching — that is why power dissipation is dynamic, not static.</div>
`},

  {id:'bias', name:'Biasing, Load Lines & Small-Signal Analysis', body: T`
<p><b>Core idea.</b> Establish a stable operating point in the active/saturation region.</p>
<div class="formula">$$V_B=V_{CC}\frac{R_2}{R_1+R_2},\qquad V_E=V_B-V_{BE},\qquad I_E=\frac{V_E}{R_E}$$
$$V_{CE}=V_{CC}-I_C(R_C+R_E)\quad\text{(load line)}$$</div>
<ul>
<li>Q-point near the middle of the load line gives maximum symmetric swing.</li>
<li>Stability factor \(S=\partial I_C/\partial I_{CO}\); voltage-divider bias has the smallest S.</li>
<li>MOSFET self-bias: gate divider plus source resistor.</li>
</ul>
<div class="tip"><b>Exam tip</b> Assume \(V_{BE}=0.7\) V for silicon in every numerical, then check that the transistor is actually in the active region.</div>
`},

  {id:'fetamp', name:'JFET / MOSFET Amplifier Configurations', body: T`
<p><b>Core idea.</b> CS, CD, CG mirror CE, CC, CB.</p>
<div class="formula">$$\text{CS: }A_v=-g_m(R_D\parallel r_o),\quad R_{in}\approx\infty,\quad R_{out}\approx R_D$$
$$\text{CD: }A_v\approx1,\quad R_{in}\ \text{very high},\quad R_{out}\approx\frac{1}{g_m}$$
$$g_m=\frac{2I_D}{V_{GS}-V_{TH}}=\sqrt{2k_nI_D}$$</div>
<ul>
<li>CS: voltage gain with inversion, high input impedance.</li>
<li>CD (source follower): buffer, gain ≈ 1, drives low loads.</li>
<li>CG: low input impedance, good high-frequency behaviour.</li>
</ul>
<div class="tip"><b>Exam tip</b> The source follower is the MOSFET equivalent of the emitter follower — the buffer of choice.</div>
`},

  {id:'multidev', name:'Multistage Amplifiers & Frequency Response', body: T`
<p><b>Core idea.</b> Cascading increases gain but reduces bandwidth; Miller capacitance dominates the high-frequency limit.</p>
<div class="formula">$$A_{total}=A_1A_2\cdots A_n,\qquad f_H=\frac{1}{2\pi R_{eq}C_{eq}}$$
$$f_{H,total}=\frac{f_H}{\sqrt{2^{1/n}-1}}\quad\text{(n identical stages)}$$</div>
<ul>
<li>Coupling capacitors set the low-frequency cutoff.</li>
<li>Internal capacitances set the high-frequency cutoff.</li>
<li>Mid-band gain is constant between the two cutoffs.</li>
<li>Cascode reduces the Miller effect and improves bandwidth.</li>
</ul>
<div class="tip"><b>Exam tip</b> For two identical stages, \(f_{H,total}=0.64f_H\). For three, 0.51f_H.</div>
`},

  {id:'fbdev', name:'Feedback, Oscillators & Waveform Generation', body: T`
<p><b>Core idea.</b> Negative feedback stabilises; positive feedback with unity loop gain oscillates.</p>
<div class="formula">$$A_f=\frac{A}{1+A\beta},\qquad BW_f=BW(1+A\beta)$$</div>
<ul>
<li>Barkhausen: loop gain magnitude = 1, loop phase = 0° (360°).</li>
<li>RC oscillators for audio; LC for RF; crystal for highest stability.</li>
<li>Square wave from an astable multivibrator; triangle from an integrator; sawtooth from a relaxation oscillator.</li>
</ul>
<div class="tip"><b>Exam tip</b> An oscillator starts with loop gain slightly greater than 1, settling to exactly 1 at steady state via nonlinearity.</div>
`},

  {id:'diffdev', name:'Differential Pairs & Current Sources', body: T`
<p><b>Core idea.</b> Differential amplification rejects common-mode noise.</p>
<div class="formula">$$A_d=-g_mR_C,\qquad A_{cm}=-\frac{R_C}{2R_{EE}},\qquad CMRR=2g_mR_{EE}$$</div>
<ul>
<li>Perfect symmetry gives zero common-mode gain.</li>
<li>A current-source tail increases CMRR enormously.</li>
<li>Current mirrors: simple, Wilson, cascode — improving output resistance.</li>
<li>Active loads boost gain.</li>
</ul>
<div class="tip"><b>Exam tip</b> CMRR = 2g_mR_EE — increasing the tail resistance is the direct route to better common-mode rejection.</div>
`},

  {id:'pwrdev', name:'SCR, TRIAC, DIAC & Power Devices', body: T`
<p><b>Core idea.</b> Latching devices for switching large currents.</p>
${FIGSLOT('scr')}
<ul>
<li><b>SCR:</b> anode–cathode latching; once triggered it conducts until current falls below the holding current.</li>
<li><b>TRIAC:</b> bidirectional, used for AC control (dimmers, fan regulators).</li>
<li><b>DIAC:</b> bidirectional trigger, often paired with a TRIAC.</li>
<li><b>IGBT:</b> MOSFET gate drive + BJT conduction — inverters.</li>
<li><b>GTO:</b> gate turn-off thyristor.</li>
</ul>
<div class="warn"><b>Remember</b> Latching current &gt; holding current for an SCR. Latching is the minimum to turn on; holding is the minimum to stay on.</div>
`},

  {id:'sw', name:'Switching, Capacitances & Temperature Effects', body: T`
<p><b>Core idea.</b> Switching speed is limited by stored charge and parasitic capacitances.</p>
<div class="formula">$$\text{BJT: }t_d+t_r+t_s+t_f,\qquad t_s\ \text{(storage) dominates}$$
$$\text{MOSFET: }t=\frac{Q_g}{I_g}\quad\text{(gate charge / drive current)}$$</div>
<ul>
<li>BJT: minority-carrier device → storage delay at turn-off.</li>
<li>MOSFET: majority-carrier device → fast, no storage time, but gate capacitance must be charged.</li>
<li>Switching loss \(P_{sw}=\frac12V_{DS}I_Df_s(t_r+t_f)\).</li>
<li>\(V_{BE}\) decreases ~2 mV/°C; leakage doubles every ~10 °C.</li>
<li>MOSFETs have a positive temperature coefficient → safe to parallel. BJTs can current-hog.</li>
</ul>
<div class="tip"><b>Exam tip</b> MOSFETs can be paralleled safely; BJTs cannot, due to current hogging.</div>
`}
  ]
},

/* ============================================================ 10 MICRO */
{
  id:'mic', name:'Microprocessors, Microcontrollers & Embedded', icon:'▤',
  topics:[
  {id:'8085', name:'8085 / 8086 Architecture', body: T`
<p><b>Core idea.</b> Know the register set, bus width and key pins.</p>
${FIGSLOT('8085')}
<pre class="ascii">8085: 8-bit data bus, 16-bit address bus, 64 KB memory
  Registers: A, B C, D E, H L, SP, PC, flags
  Pins: ALE, RD, WR, IO/M, S0 S1, HOLD, HLDA, INTR, INTA
  Clock: 3 MHz typical; minimum instruction cycle 1.3 us

8086: 16-bit data bus, 20-bit address bus, 1 MB memory
  Registers: AX BX CX DX, SI DI BP SP, CS DS SS ES, IP, FLAGS
  Pins: MN/MX, ALE, READY, NMI, INTR, HOLD
  Min mode: single processor; Max mode: coprocessor 8087</pre>
<ul>
<li>8085 has 5 hardware interrupts: TRAP, RST 7.5, 6.5, 5.5, INTR.</li>
<li>TRAP is non-maskable and has the highest priority.</li>
<li>8086 flags: CF, PF, AF, ZF, SF, OF, TF, IF, DF.</li>
<li>8086 physical address = segment × 16 + offset.</li>
</ul>
<div class="tip"><b>Exam tip</b> CS = 2000H, IP = 0050H → physical address 20050H. This exact calculation is a favourite.</div>
`},

  {id:'addr', name:'Addressing Modes, Instruction Execution & Timing', body: T`
<p><b>Core idea.</b> The addressing mode determines where the operand lives.</p>
<table><tr><th>Mode</th><th>Example</th><th>Operand location</th></tr>
<tr><td>Immediate</td><td>MVI A, 32H</td><td>In the instruction</td></tr>
<tr><td>Direct</td><td>LDA 2000H</td><td>Address in instruction</td></tr>
<tr><td>Register</td><td>MOV A, B</td><td>In a register</td></tr>
<tr><td>Register indirect</td><td>MOV A, M</td><td>Address in HL</td></tr>
<tr><td>Indexed</td><td>MOV A, M(X)</td><td>Base + index</td></tr>
<tr><td>Relative</td><td>JMP 2000H</td><td>PC + offset</td></tr>
</table>
<div class="formula">$$\text{Instruction time}=T\text{-states}\times T_{clk},\qquad T_{clk}=\frac{1}{f_{clk}}$$</div>
<ul>
<li>8085: machine cycle = 3–6 T-states; instruction cycle = 1–5 machine cycles.</li>
<li>ALE demultiplexes the AD0–AD7 bus.</li>
</ul>
<div class="tip"><b>Exam tip</b> Memorise a few T-state counts: MOV A,B = 4, MVI A,data = 7, CALL = 18.</div>
`},

  {id:'asm', name:'Assembly-Language Fundamentals', body: T`
<p><b>Core idea.</b> Understand the instruction categories and trace small programs.</p>
<pre class="ascii">8085 example: add two 8-bit numbers at 2000H and 2001H
   LXI H, 2000H   ; point to first operand
   MOV A, M       ; load first number
   INX H          ; point to second
   ADD M          ; add
   STA 2002H      ; store result
   HLT</pre>
<ul>
<li>Instruction categories: data transfer, arithmetic, logical, branching, machine control.</li>
<li>8085 flags: Z, CY, S, P, AC.</li>
<li>PUSH decrements SP; CALL pushes the return address.</li>
</ul>
<div class="tip"><b>Exam tip</b> For "what is the result" questions, trace the accumulator and flags on paper — never mentally.</div>
`},

  {id:'io', name:'Memory and I/O Interfacing', body: T`
<p><b>Core idea.</b> Connect memory and peripherals to the address/data/control buses.</p>
<div class="formula">$$\text{Capacity}=2^{\text{address lines}}\times\text{word size},\qquad \text{chip select via decoding}$$</div>
<ul>
<li><b>Memory-mapped I/O:</b> peripherals share the memory address space; no special instructions.</li>
<li><b>I/O-mapped I/O:</b> separate address space; uses IN/OUT.</li>
<li>Address decoding: absolute (fixed range), partial (foldback), full.</li>
<li>Common peripherals: 8255 PPI, 8259 PIC, 8253/8254 timer, 8251 USART.</li>
</ul>
<div class="tip"><b>Exam tip</b> A 2K×8 chip needs 11 address lines; the remaining lines go to the decoder for chip select.</div>
`},

  {id:'int', name:'Interrupts, Timers & Serial Communication', body: T`
<p><b>Core idea.</b> Interrupts let the CPU respond to events without polling.</p>
<ul>
<li>Hardware interrupts: external signals. Software interrupts: instructions.</li>
<li>Vectored vs non-vectored; maskable vs non-maskable.</li>
<li>8085 priority: TRAP &gt; RST 7.5 &gt; RST 6.5 &gt; RST 5.5 &gt; INTR.</li>
<li>8253 modes: 0 (13-bit), 1 (16-bit), 2 (rate generator), 3 (square wave).</li>
<li>UART: asynchronous; USART: synchronous/asynchronous.</li>
</ul>
<div class="formula">$$\text{Baud divisor}=\frac{f_{clk}}{16\times\text{baud rate}}\quad\text{(8251/8051)}$$</div>
<div class="tip"><b>Exam tip</b> Interrupt latency includes context saving — it is the time from the request to the first ISR instruction.</div>
`},

  {id:'8051', name:'Microcontroller Architecture & Register-Level Programming', body: T`
<p><b>Core idea.</b> A microcontroller integrates CPU, memory and peripherals on one chip.</p>
${FIGSLOT('8051')}
<pre class="ascii">8051: 8-bit MCU
  4 KB ROM, 128 B RAM, 4 I/O ports (P0-P3)
  2 timers/counters, 5 interrupt sources, 1 serial port
  12 clocks per machine cycle (12 MHz -> 1 us machine cycle)
  Registers: A, B, DPTR, PSW, SP</pre>
<ul>
<li>Harvard architecture: separate program and data memory.</li>
<li>Bit-addressable RAM region 20H–2FH.</li>
<li>Port 0 is multiplexed address/data; Port 3 carries alternate functions.</li>
</ul>
<div class="tip"><b>Exam tip</b> 8051 machine cycle = 12 oscillator periods. At 12 MHz, one machine cycle = 1 µs.</div>
`},

  {id:'peri', name:'ADC/DAC and Peripheral Interfacing', body: T`
<p><b>Core idea.</b> Sensors are analog; the MCU is digital — the interface between them.</p>
<ul>
<li>ADC0808/0809: 8-bit, 8-channel, SAR, ~100 µs conversion.</li>
<li>DAC0808: 8-bit current-output; needs an op-amp for voltage output.</li>
<li>Interfacing: polling, interrupt-driven, DMA.</li>
<li>Keypad scanning and seven-segment multiplexing.</li>
<li>LCD 16×2: 8-bit or 4-bit data bus plus RS, RW, EN.</li>
</ul>
<div class="formula">$$\text{ADC step size}=\frac{V_{ref}}{2^n},\qquad \text{conversion time}\propto n\ \text{clock cycles (SAR)}$$</div>
<div class="tip"><b>Exam tip</b> For a 5 V, 8-bit ADC the resolution is 19.5 mV — it appears repeatedly.</div>
`},

  {id:'proto', name:'UART, SPI and I²C Protocols', body: T`
<p><b>Core idea.</b> Three serial buses with different trade-offs.</p>
${FIGSLOT('uart')}
${FIGSLOT('spi2c')}
<table><tr><th>Bus</th><th>Wires</th><th>Speed</th><th>Multi-device</th></tr>
<tr><td>UART</td><td>2 (TX, RX)</td><td>Low–medium</td><td>Point-to-point</td></tr>
<tr><td>SPI</td><td>4 (MOSI, MISO, SCLK, SS)</td><td>High</td><td>One SS per slave</td></tr>
<tr><td>I²C</td><td>2 (SDA, SCL)</td><td>Medium</td><td>Addressable, multi-master</td></tr>
</table>
<div class="formula">$$\text{UART frame}=1\text{ start}+8\text{ data}+1\text{ parity}+1\text{ stop}$$</div>
<div class="tip"><b>Exam tip</b> I²C needs pull-up resistors because the lines are open-drain. SPI has no acknowledgement; I²C does.</div>
`},

  {id:'emb', name:'Embedded Architecture, Firmware & Real-Time Concepts', body: T`
<p><b>Core idea.</b> Embedded systems are dedicated, resource-constrained and often time-critical.</p>
<ul>
<li>Components: MCU/MPU, memory, I/O, power supply, clock, firmware.</li>
<li>Super-loop vs RTOS architecture.</li>
<li>Hard real-time: a missed deadline is a failure. Soft real-time: degraded quality only.</li>
<li>Scheduling: round-robin, priority preemptive, rate-monotonic.</li>
<li>Watchdog timer resets the system if firmware hangs.</li>
<li>Interrupt latency and context-switch time determine responsiveness.</li>
</ul>
<div class="formula">$$\text{Rate-monotonic: shorter period}\Rightarrow\text{higher priority}$$</div>
<div class="tip"><b>Exam tip</b> A watchdog timer is a safety mechanism, not a scheduler. If firmware fails to kick it, the system resets.</div>
`},

  {id:'dma', name:'DMA, Memory-Mapped I/O & Bus Concepts', body: T`
<p><b>Core idea.</b> DMA moves data without CPU involvement.</p>
<ul>
<li>DMA controller takes the bus, transfers a block, releases it and raises an interrupt.</li>
<li><b>Cycle stealing:</b> steals individual bus cycles; slows the CPU slightly.</li>
<li><b>Burst transfer:</b> holds the bus for the whole block — faster, blocks the CPU longer.</li>
<li>Bus types: address (unidirectional), data (bidirectional), control.</li>
<li>Arbitration: daisy chaining, polling, independent requests.</li>
</ul>
<div class="formula">$$\text{DMA transfer time}\approx\frac{\text{block size}\times\text{bytes per transfer}}{\text{bus bandwidth}}$$</div>
<div class="tip"><b>Exam tip</b> DMA is essential for disk, display and ADC streaming — the CPU would be too slow to copy every byte.</div>
`}
  ]
},

/* ============================================================ 11 MEAS */
{
  id:'me', name:'Electronic Measurements & Instrumentation', icon:'📏',
  topics:[
  {id:'err', name:'Measurement Errors, Accuracy, Precision & Resolution', body: T`
<p><b>Core idea.</b> Every measurement has uncertainty; know how to quantify it.</p>
<div class="formula">$$\%\text{ error}=\frac{\text{measured}-\text{true}}{\text{true}}\times100\%$$
$$\text{Limiting error}=\pm\frac{\text{full-scale}\times\text{class}}{\text{reading}}$$</div>
<ul>
<li><b>Accuracy:</b> closeness to the true value. <b>Precision:</b> repeatability.</li>
<li><b>Resolution:</b> smallest detectable change.</li>
<li>Systematic errors: instrument bias, calibration, loading. Random errors: noise, fluctuations.</li>
<li>Error combination: for \(R=V/I\), \(\frac{\Delta R}{R}=\frac{\Delta V}{V}+\frac{\Delta I}{I}\).</li>
</ul>
<div class="tip"><b>Exam tip</b> A 1% class instrument read at 25% of full scale has an actual error of 4% — lower readings on the same instrument are always less accurate.</div>
`},

  {id:'analog', name:'PMMC, Moving-Iron & Electrodynamometer Instruments', body: T`
<p><b>Core idea.</b> Each meter movement responds to a different electrical quantity.</p>
${FIGSLOT('pmmc')}
<table><tr><th>Movement</th><th>Responds to</th><th>AC/DC</th><th>Scale</th></tr>
<tr><td>PMMC</td><td>Average DC</td><td>DC only</td><td>Uniform</td></tr>
<tr><td>Moving iron</td><td>RMS</td><td>Both</td><td>Non-uniform</td></tr>
<tr><td>Electrodynamometer</td><td>True RMS</td><td>Both</td><td>Non-uniform</td></tr>
<tr><td>Rectifier type</td><td>Average (RMS-calibrated)</td><td>AC</td><td>Non-uniform</td></tr>
</table>
<div class="formula">$$\text{Form factor}=\frac{V_{rms}}{V_{avg}},\qquad \text{Crest factor}=\frac{V_{peak}}{V_{rms}}$$
$$\text{Sine: }FF=1.11,\ CF=1.414$$</div>
<div class="tip"><b>Exam tip</b> A rectifier meter calibrated for a sine reads 1.11 × average — it is wrong for square or triangular waves.</div>
`},

  {id:'meas', name:'Measurement of V, I, R, Power & Energy', body: T`
<p><b>Core idea.</b> Choose the right method; each has loading effects.</p>
<ul>
<li><b>Ammeter:</b> low resistance, series. <b>Voltmeter:</b> high resistance, parallel.</li>
<li><b>Ohmmeter:</b> known source plus current measurement.</li>
<li><b>Wattmeter:</b> electrodynamometer; current coil in series, voltage coil in parallel.</li>
<li><b>Energy meter:</b> induction type; integrates power over time in kWh.</li>
<li><b>Loading effect:</b> a low-impedance voltmeter shunts the circuit and reads low.</li>
</ul>
<div class="formula">$$\text{Wattmeter: }P=VI\cos\phi,\qquad \text{Two-wattmeter: }P=W_1+W_2,\ Q=\sqrt3(W_1-W_2)$$</div>
<div class="tip"><b>Exam tip</b> In the two-wattmeter method, \(\tan\phi=\sqrt3\frac{W_1-W_2}{W_1+W_2}\). Equal readings ⇒ unity power factor.</div>
`},

  {id:'bridge', name:'Bridges — Wheatstone, Maxwell, Hay, Schering, Wien', body: T`
<p><b>Core idea.</b> A bridge balances when the detector reads zero; the unknown is then computed from known components.</p>
${FIGSLOT('wheatstone')}
<div class="formula">$$\text{Balance: }\frac{Z_1}{Z_2}=\frac{Z_3}{Z_4}\quad\text{or}\quad Z_1Z_4=Z_2Z_3$$</div>
<table><tr><th>Bridge</th><th>Measures</th><th>Best for</th></tr>
<tr><td>Wheatstone</td><td>Resistance</td><td>Medium R (Ω–MΩ)</td></tr>
<tr><td>Maxwell</td><td>Inductance</td><td>Low/medium Q</td></tr>
<tr><td>Hay</td><td>Inductance</td><td>High Q (&gt;10)</td></tr>
<tr><td>Schering</td><td>Capacitance, D</td><td>High-voltage testing</td></tr>
<tr><td>Wien</td><td>Frequency</td><td>Audio oscillators</td></tr>
<tr><td>Kelvin double</td><td>Very low R</td><td>&lt;1 Ω</td></tr>
</table>
<div class="tip"><b>Exam tip</b> Maxwell for low/medium Q, Hay for high Q. "High-Q coil" → Hay.</div>
`},

  {id:'cro', name:'Oscilloscopes, Probes & Frequency Counters', body: T`
<p><b>Core idea.</b> The oscilloscope is the universal time-domain instrument.</p>
${FIGSLOT('cro')}
<div class="formula">$$V=(\text{div})\times(\text{V/div})\times\text{probe factor},\qquad T=(\text{div})\times(\text{time/div}),\quad f=\frac1T$$</div>
<ul>
<li>CRT sections: vertical deflection, horizontal deflection, trigger, power supply.</li>
<li><b>1× probe:</b> high capacitance, low bandwidth. <b>10× probe:</b> 10 MΩ, ~10 pF, better bandwidth.</li>
<li><b>Lissajous:</b> frequency ratio from the number of loops in x and y.</li>
<li>DSO samples and reconstructs the waveform.</li>
<li>Bandwidth rule: scope bandwidth ≥ 5× the highest signal frequency.</li>
</ul>
<div class="tip"><b>Exam tip</b> A 10× probe divides by 10 and the reading must be multiplied by 10 — the most common CRO mistake.</div>
`},

  {id:'trans', name:'Transducers & Sensors', body: T`
<p><b>Core idea.</b> Convert a physical quantity into an electrical signal.</p>
<table><tr><th>Sensor</th><th>Quantity</th><th>Property</th></tr>
<tr><td>Thermistor</td><td>Temperature</td><td>Large nonlinear change, NTC</td></tr>
<tr><td>RTD (Pt100)</td><td>Temperature</td><td>Linear, stable, accurate</td></tr>
<tr><td>Thermocouple</td><td>Temperature</td><td>Seebeck effect, wide range, low output</td></tr>
<tr><td>Strain gauge</td><td>Strain</td><td>\(GF=\frac{\Delta R/R}{\Delta L/L}\)</td></tr>
<tr><td>LVDT</td><td>Displacement</td><td>High resolution, no contact</td></tr>
<tr><td>Piezoelectric</td><td>Dynamic pressure</td><td>Charge output, cannot measure static</td></tr>
<tr><td>Hall effect</td><td>Magnetic field</td><td>Non-contact</td></tr>
</table>
${FIGSLOT('lvdt')}
<div class="formula">$$\frac{\Delta R}{R}=GF\cdot\epsilon$$</div>
<div class="tip"><b>Exam tip</b> LVDT is preferred for displacement: theoretically infinite resolution, no friction, linear output.</div>
`},

  {id:'ina', name:'Instrumentation Amplifiers & Signal Conditioning', body: T`
<p><b>Core idea.</b> Amplify a tiny differential signal riding on a large common-mode voltage.</p>
${FIGSLOT('ina')}
<div class="formula">$$A=1+\frac{2R}{R_G}$$</div>
<ul>
<li>Very high input impedance (no loading of the sensor).</li>
<li>Very high CMRR (typically 100 dB+).</li>
<li>Gain set by a single resistor \(R_G\).</li>
<li>Signal chain: sensor → bridge → INA → filter → ADC.</li>
<li>Isolation amplifiers protect against high common-mode voltages.</li>
</ul>
<div class="tip"><b>Exam tip</b> A Wheatstone bridge plus an INA is the standard front end for strain-gauge and thermistor measurements.</div>
`},

  {id:'dvm', name:'Digital Voltmeters, Multimeters & Frequency Measurement', body: T`
<p><b>Core idea.</b> Digital instruments convert analog values to counts; resolution is expressed in digits.</p>
<div class="formula">$$\text{Resolution}=\frac{\text{full-scale}}{10^n}\quad\text{for an n-digit display}$$</div>
<ul>
<li><b>Ramp-type DVM:</b> voltage to time; simple but slow.</li>
<li><b>Dual-slope integrating:</b> very accurate, rejects 50/60 Hz noise.</li>
<li><b>SAR-based:</b> fast, moderate accuracy.</li>
<li>Frequency: \(f=N/t_{gate}\).</li>
<li>Autoranging improves resolution for small signals.</li>
</ul>
<div class="tip"><b>Exam tip</b> Dual-slope DVMs reject mains noise because the integration time is an integer multiple of the mains period.</div>
`},

  {id:'daq', name:'Data Acquisition & Calibration', body: T`
<p><b>Core idea.</b> Bring real-world signals into a computer reliably.</p>
<ul>
<li>Chain: sensor → signal conditioning → multiplexer → sample-and-hold → ADC → processor.</li>
<li><b>Sample-and-hold:</b> freezes the analog value while the ADC converts.</li>
<li><b>Multiplexer:</b> shares one ADC across many channels; limits per-channel rate.</li>
<li><b>Calibration:</b> compare against a traceable standard; zero and span adjustments.</li>
<li>Uncertainty is reported as a combined standard uncertainty (Type A + Type B).</li>
</ul>
<div class="formula">$$\text{Per-channel rate}=\frac{f_s}{N_{channels}}\quad\text{(with a multiplexer)}$$</div>
<div class="tip"><b>Exam tip</b> Eight channels into one 100 kSPS ADC gives only 12.5 kSPS per channel — a common numerical trap.</div>
`}
  ]
},

/* ============================================================ 12 POWER */
{
  id:'pw', name:'Power Electronics', icon:'⚙',
  topics:[
  {id:'sw', name:'Power Semiconductor Switches', body: T`
<p><b>Core idea.</b> Power switches are chosen by voltage, current, switching frequency and drive requirements.</p>
<table><tr><th>Device</th><th>Drive</th><th>Speed</th><th>Voltage</th><th>Turn-off</th></tr>
<tr><td>Power diode</td><td>None</td><td>Fast recovery types</td><td>High</td><td>Not controllable</td></tr>
<tr><td>SCR</td><td>Gate pulse</td><td>Line frequency</td><td>Very high</td><td>Commutation only</td></tr>
<tr><td>MOSFET</td><td>Voltage</td><td>Very fast</td><td>Low–medium</td><td>Gate</td></tr>
<tr><td>IGBT</td><td>Voltage</td><td>Medium</td><td>High</td><td>Gate</td></tr>
<tr><td>GTO</td><td>Gate</td><td>Medium</td><td>Very high</td><td>Gate (negative pulse)</td></tr>
</table>
<div class="formula">$$P_{cond}=I^2R_{on}\ \text{(MOSFET)},\qquad =V_{CE(sat)}I\ \text{(BJT/IGBT)}$$</div>
<div class="tip"><b>Exam tip</b> Low-voltage high-frequency → MOSFET. High-voltage medium-frequency → IGBT. Line-frequency high-power → SCR.</div>
`},

  {id:'rect', name:'Single-Phase and Three-Phase Rectifiers', body: T`
<p><b>Core idea.</b> Convert AC to DC; performance indices are ripple, efficiency and form factor.</p>
${FIGSLOT('pwrect')}
<div class="formula">$$\text{Half-wave: }V_{dc}=\frac{V_m}{\pi},\quad V_{rms}=\frac{V_m}{2},\quad FF=1.57,\quad RF=1.21$$
$$\text{Full-wave: }V_{dc}=\frac{2V_m}{\pi},\quad V_{rms}=\frac{V_m}{\sqrt2},\quad FF=1.11,\quad RF=0.48$$
$$\text{Three-phase bridge: }V_{dc}=\frac{3\sqrt3V_m}{\pi}\approx1.654V_m$$</div>
<ul>
<li>Ripple frequency: half-wave f, full-wave 2f, three-phase 6f.</li>
<li>PIV: half-wave \(V_m\), centre-tap \(2V_m\), bridge \(V_m\).</li>
<li>Efficiency: half-wave 40.6%, full-wave 81.2%.</li>
</ul>
<div class="tip"><b>Exam tip</b> The bridge rectifier needs half the secondary voltage and has half the PIV of a centre-tap design.</div>
`},

  {id:'ctrl', name:'Controlled Rectifiers & Firing Angle', body: T`
<p><b>Core idea.</b> Delay the gate pulse to control the average output voltage.</p>
<div class="formula">$$\text{1-}\phi\text{ half-controlled: }V_{dc}=\frac{V_m}{\pi}(1+\cos\alpha)$$
$$\text{1-}\phi\text{ fully controlled: }V_{dc}=\frac{2V_m}{\pi}\cos\alpha$$
$$\text{3-}\phi\text{ fully controlled: }V_{dc}=\frac{3\sqrt3V_m}{\pi}\cos\alpha$$</div>
<ul>
<li>Conduction begins only when the device is forward-biased <em>and</em> gated.</li>
<li>For α &gt; 90°, output becomes negative — inverter mode (if the load can supply power).</li>
<li>Firing circuits: RC, UJT relaxation, cosine-wave, digital.</li>
<li>Freewheeling diode improves input power factor and reduces ripple.</li>
</ul>
<div class="tip"><b>Exam tip</b> A fully controlled rectifier's average output can swing from \(+2V_m/\pi\) to \(-2V_m/\pi\); a half-controlled one cannot go negative.</div>
`},

  {id:'dcdc', name:'DC–DC Converters — Buck, Boost, Buck–Boost', body: T`
<p><b>Core idea.</b> Switch at high frequency and use an inductor to transfer energy — high efficiency.</p>
${FIGSLOT('buck')}
${FIGSLOT('boost')}
<div class="formula">$$\text{Buck: }V_o=DV_s,\qquad \text{Boost: }V_o=\frac{V_s}{1-D},\qquad \text{Buck–boost: }V_o=-V_s\frac{D}{1-D}$$</div>
<ul>
<li>CCM vs DCM (continuous/discontinuous conduction mode).</li>
<li>Buck inductor ripple: \(\Delta I_L=\frac{V_sD(1-D)}{Lf_s}\).</li>
<li>Critical inductance separates CCM and DCM.</li>
<li>Efficiency typically 80–95%, far better than a linear regulator.</li>
</ul>
<div class="tip"><b>Exam tip</b> Buck steps down, boost steps up, buck-boost inverts. A buck converter's output current is continuous; a boost converter's input current is continuous.</div>
`},

  {id:'inv', name:'Inverters & PWM Techniques', body: T`
<p><b>Core idea.</b> Convert DC to AC with controllable magnitude and frequency.</p>
${FIGSLOT('pwm')}
<div class="formula">$$\text{Square-wave inverter: }V_{rms}=\frac{2\sqrt2}{\pi}V_s\approx0.9V_s$$
$$\text{PWM fundamental: }V_1=\frac{4V_s}{\pi}m_a\quad(m_a\le1)$$</div>
<ul>
<li>Square-wave inverter: simple, rich in harmonics.</li>
<li>SPWM: \(m_a\) = modulation index, \(m_f\) = frequency ratio; reduces low-order harmonics.</li>
<li>Overmodulation (\(m_a>1\)) increases fundamental but adds harmonics.</li>
<li>Harmonic elimination: SHE, multilevel inverters.</li>
<li>VSI vs CSI.</li>
</ul>
<div class="tip"><b>Exam tip</b> Higher switching frequency pushes harmonics to higher orders, easier to filter, at the cost of switching loss.</div>
`},

  {id:'chop', name:'Choppers, AC Voltage Controllers & Cycloconverters', body: T`
<p><b>Core idea.</b> Control power by switching AC or DC waveforms.</p>
<ul>
<li><b>Step-down chopper:</b> \(V_o=DV_s\). <b>Step-up:</b> \(V_o=V_s/(1-D)\).</li>
<li><b>Jones chopper:</b> commutating capacitor for reliable SCR turn-off.</li>
<li><b>AC voltage controller:</b> phase-angle control of back-to-back thyristors — dimmers.</li>
<li><b>Cycloconverter:</b> fixed-frequency AC to variable-frequency AC directly; low-speed high-torque drives.</li>
<li>Integral-cycle control (on/off) avoids harmonics but causes flicker.</li>
</ul>
<div class="formula">$$\text{AC controller (R load): }V_{rms}=V_s\sqrt{\frac{1}{\pi}\left(\pi-\alpha+\frac{\sin2\alpha}{2}\right)}$$</div>
<div class="tip"><b>Exam tip</b> Phase control generates harmonics; integral-cycle control does not.</div>
`},

  {id:'smps', name:'Switch-Mode Power Supplies', body: T`
<p><b>Core idea.</b> Regulate output by rapid switching, achieving high efficiency.</p>
${FIGSLOT('smps')}
<ul>
<li>Topologies: buck, boost, buck-boost, flyback, forward, push-pull, half-bridge, full-bridge.</li>
<li><b>Flyback:</b> isolated, simple, low power (&lt;150 W) — phone chargers.</li>
<li><b>Forward:</b> isolated, needs transformer reset.</li>
<li>Feedback loop: PWM controller compares output to a reference and adjusts D.</li>
<li>Isolation via optocoupler or auxiliary winding.</li>
<li>EMI filtering is mandatory because of high dv/dt and di/dt.</li>
</ul>
<div class="formula">$$P_{in}=P_{out}/\eta,\qquad \eta\approx0.8\text{–}0.95\ \text{(SMPS)}\ \text{vs}\ 0.3\text{–}0.6\ \text{(linear)}$$</div>
<div class="tip"><b>Exam tip</b> Linear regulators are quiet but inefficient; SMPS are efficient but noisy.</div>
`},

  {id:'loss', name:'Switching Losses, Efficiency, Harmonics & Filtering', body: T`
<p><b>Core idea.</b> Every switch dissipates power during conduction and during transitions.</p>
<div class="formula">$$P_{cond}=I_{rms}^2R_{on},\qquad P_{sw}=\frac12V_sI_s(t_r+t_f)f_s$$
$$\eta=\frac{P_{out}}{P_{out}+P_{cond}+P_{sw}+P_{drive}+P_{core}}$$</div>
<ul>
<li>Conduction loss ∝ I²; switching loss ∝ f_s.</li>
<li>Snubbers reduce dv/dt and di/dt, shifting loss away from the device.</li>
<li>THD \(=\frac{\sqrt{\sum_{n\ge2}V_n^2}}{V_1}\).</li>
<li>\(PF=\frac{1}{\sqrt{1+THD^2}}\cos\phi_1\) for sinusoidal voltage.</li>
<li>Passive LC filters and active PFC reduce harmonics.</li>
</ul>
<div class="tip"><b>Exam tip</b> At high switching frequency switching loss dominates; at high current conduction loss dominates.</div>
`},

  {id:'drv', name:'Gate Drivers, Snubbers & Protection', body: T`
<p><b>Core idea.</b> Power devices fail fast without proper drive and protection.</p>
<ul>
<li><b>Gate driver:</b> fast current pulses to charge/discharge the gate; isolates control from power.</li>
<li><b>Optocoupler / pulse transformer:</b> level shifting and isolation.</li>
<li><b>Snubber:</b> RC or RCD network limiting dv/dt and di/dt.</li>
<li><b>Overcurrent protection:</b> current sensing plus fast shut-off.</li>
<li><b>Overvoltage protection:</b> clamps, MOVs, TVS diodes.</li>
<li><b>Thermal management:</b> heatsinks and thermal shutdown.</li>
</ul>
<div class="formula">$$P_{drive}=Q_gV_gf_s,\qquad t_{sw}\approx\frac{Q_g}{I_{drive}}$$</div>
<div class="tip"><b>Exam tip</b> An RC snubber across an SCR limits dv/dt so it does not spuriously trigger; an RCD snubber dissipates energy safely in converters.</div>
`}
  ]
},

/* ============================================================ 13 DSP */
{
  id:'dsp', name:'Digital Signal Processing', icon:'◫',
  topics:[
  {id:'dt', name:'Discrete-Time Systems & Difference Equations', body: T`
<p><b>Core idea.</b> DT systems are described by difference equations and analysed with the Z-transform.</p>
<div class="formula">$$y[n]=\sum_{k=0}^{N}a_ky[n-k]+\sum_{k=0}^{M}b_kx[n-k],\qquad H(z)=\frac{\sum b_kz^{-k}}{1-\sum a_kz^{-k}}$$</div>
<ul>
<li>FIR systems have no feedback (denominator = 1) — always stable.</li>
<li>IIR systems have feedback — stability must be checked via pole locations.</li>
<li>Impulse response of \(y[n]=ay[n-1]+x[n]\) is \(a^nu[n]\).</li>
</ul>
<div class="tip"><b>Exam tip</b> For stability of a causal DT system, all poles must lie strictly inside the unit circle.</div>
`},

  {id:'dft', name:'DTFT and DFT — Properties & Computation', body: T`
<p><b>Core idea.</b> The DFT is the computable, finite-length version of the DTFT.</p>
<div class="formula">$$X[k]=\sum_{n=0}^{N-1}x[n]e^{-j2\pi kn/N},\qquad x[n]=\frac1N\sum_{k=0}^{N-1}X[k]e^{j2\pi kn/N}$$
$$\Delta f=\frac{f_s}{N}=\frac{1}{NT_s}$$</div>
<ul>
<li>Circular convolution in the DFT domain corresponds to multiplication in time.</li>
<li>Zero-padding increases the display resolution but adds no information.</li>
<li>Spectral leakage is caused by truncation/windowing.</li>
<li>Parseval: \(\sum|x[n]|^2=\frac1N\sum|X[k]|^2\).</li>
</ul>
<div class="tip"><b>Exam tip</b> To resolve two close frequencies you need a longer observation window (larger N·T), not zero-padding.</div>
`},

  {id:'fft', name:'FFT — Radix-2 DIT and DIF', body: T`
<p><b>Core idea.</b> The FFT reduces DFT cost from N² to N log₂N.</p>
${FIGSLOT('butterfly')}
<div class="formula">$$O(N^2)\;\longrightarrow\;O(N\log_2N),\qquad \text{stages}=\log_2N,\qquad \text{butterflies per stage}=\frac N2$$
$$\text{complex multiplications}=\frac N2\log_2N$$</div>
<ul>
<li><b>DIT:</b> input bit-reversed, output natural.</li>
<li><b>DIF:</b> input natural, output bit-reversed.</li>
<li>Twiddle factor \(W_N=e^{-j2\pi/N}\).</li>
<li>For N = 1024, the FFT is roughly 100× faster than the direct DFT.</li>
</ul>
<div class="tip"><b>Exam tip</b> For N = 8, radix-2 FFT uses 12 complex multiplications — a common numerical.</div>
`},

  {id:'struct', name:'FIR and IIR Filter Structures', body: T`
<p><b>Core idea.</b> A filter's difference equation can be realised with several hardware structures.</p>
${FIGSLOT('fir')}
${FIGSLOT('iir')}
<ul>
<li><b>FIR:</b> direct, cascade, linear-phase, frequency-sampling forms.</li>
<li><b>IIR:</b> direct form I, direct form II (canonical), cascade of second-order sections, parallel.</li>
<li>Direct form II uses the minimum number of delay elements.</li>
<li>Cascade of biquads is preferred numerically for high-order IIR.</li>
<li>Transposed structures have better numerical properties.</li>
</ul>
<div class="tip"><b>Exam tip</b> FIR filters are always stable and can have exactly linear phase; IIR need fewer coefficients but are nonlinear-phase.</div>
`},

  {id:'fird', name:'FIR Filter Design Using Windows', body: T`
<p><b>Core idea.</b> Truncate the ideal impulse response and smooth the edges with a window.</p>
${FIGSLOT('window')}
<div class="formula">$$h[n]=h_d[n]w[n],\qquad h_d[n]=\frac{\sin(\omega_c(n-\alpha))}{\pi(n-\alpha)},\quad \alpha=\frac M2$$</div>
<table><tr><th>Window</th><th>Main lobe</th><th>Peak sidelobe</th></tr>
<tr><td>Rectangular</td><td>Narrowest</td><td>−13 dB</td></tr>
<tr><td>Hanning</td><td>—</td><td>−31 dB</td></tr>
<tr><td>Hamming</td><td>—</td><td>−43 dB</td></tr>
<tr><td>Blackman</td><td>Widest</td><td>−58 dB</td></tr>
</table>
<div class="formula">$$N\approx\frac{A_s-8}{2.285\,\Delta\omega}$$</div>
<div class="tip"><b>Exam tip</b> To double the stopband attenuation, choose a better window; to narrow the transition band, increase the filter length.</div>
`},

  {id:'iird', name:'IIR Filter Design Fundamentals', body: T`
<p><b>Core idea.</b> Design an analog prototype, then map it to the digital domain.</p>
${FIGSLOT('bilinear')}
<ul>
<li><b>Impulse invariance:</b> samples the analog impulse response; suffers from aliasing.</li>
<li><b>Bilinear transform:</b> \(s=\frac2T\frac{z-1}{z+1}\); no aliasing but frequency warping.</li>
<li><b>Matched-Z:</b> maps poles and zeros directly.</li>
<li>Prototypes: Butterworth (maximally flat), Chebyshev I (passband ripple), Chebyshev II (stopband ripple), elliptic (equiripple, sharpest).</li>
<li>Pre-warping compensates for bilinear warping.</li>
</ul>
<div class="formula">$$|H(j\Omega)|^2=\frac{1}{1+(\Omega/\Omega_c)^{2N}}\quad\text{(Butterworth)}$$
$$\Omega=\frac2T\tan\!\left(\frac\omega2\right)\quad\text{(warping relation)}$$</div>
<div class="tip"><b>Exam tip</b> Bilinear maps the entire jω axis onto the unit circle — no aliasing, but the frequency axis is compressed.</div>
`},

  {id:'freqresp', name:'Frequency Response & Pole-Zero Analysis', body: T`
<p><b>Core idea.</b> Evaluate H(z) on the unit circle to get the DT frequency response.</p>
<div class="formula">$$H(e^{j\omega})=H(z)\big|_{z=e^{j\omega}},\qquad |H(e^{j\omega})|=\frac{\prod|e^{j\omega}-z_k|}{\prod|e^{j\omega}-p_k|}$$</div>
<ul>
<li>Pole near the unit circle → peak; zero near it → null.</li>
<li>Poles/zeros at the origin contribute only phase.</li>
<li>A zero on the unit circle gives a notch at that frequency.</li>
<li>Linear-phase FIR filters have zeros in reciprocal pairs.</li>
</ul>
<div class="tip"><b>Exam tip</b> Geometric evaluation: magnitude = product of distances to zeros divided by product of distances to poles.</div>
`},

  {id:'linphase', name:'Linear-Phase FIR Filters', body: T`
<p><b>Core idea.</b> Symmetric impulse responses give exactly linear phase — constant group delay.</p>
<div class="formula">$$\text{Type I: }h[n]=h[M-n],\ M\text{ even};\qquad \text{Type II: }h[n]=h[M-n],\ M\text{ odd}$$
$$\text{Type III: }h[n]=-h[M-n],\ M\text{ even};\qquad \text{Type IV: }h[n]=-h[M-n],\ M\text{ odd}$$</div>
<ul>
<li>Type I: any filter (LP, HP, BP, BS).</li>
<li>Type II: forced zero at ω = π — cannot be high-pass.</li>
<li>Types III and IV: antisymmetric — differentiators and Hilbert transformers.</li>
