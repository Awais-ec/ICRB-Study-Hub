<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISRO ECE — Study Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0a0e13;--panel:#101720;--panel2:#0c1218;--line:#1e2a37;
  --text:#e7eef6;--muted:#8fa0b3;--c1:#4ea1ff;--c2:#2bd9a8;--c3:#ffb454;
  --c4:#ff7b72;--c5:#b48cff;--chip:#18222e;--r:14px;
}
html[data-theme="light"]{
  --bg:#f5f7fa;--panel:#fff;--panel2:#eef2f7;--line:#dbe2ea;--text:#0e151d;
  --muted:#5a6b7d;--c1:#0b62c4;--c2:#0b8f6b;--c3:#a05a00;--c4:#bb2f26;--c5:#6a3fbf;--chip:#e9eef5;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--c1);text-decoration:none}
#app{display:grid;grid-template-columns:318px 1fr;min-height:100vh}

/* ---------- SIDEBAR ---------- */
#sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;scrollbar-width:thin}
#sidebar::-webkit-scrollbar{width:8px}
#sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.brand{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand h1{font-size:14.5px;margin:0;letter-spacing:.3px}
.brand h1 span{color:var(--c1)}
.brand p{margin:3px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.searchbox{padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
.searchbox input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;outline:none}
.searchbox input:focus{border-color:var(--c1)}
#nav{padding:6px 6px 40px;flex:1}
.subj{margin-bottom:1px}
.subj-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;background:none;border:0;color:var(--text);font-size:13px;cursor:pointer;text-align:left;font-family:inherit}
.subj-btn:hover{background:var(--chip)}
.subj-btn .ico{width:20px;text-align:center;color:var(--c1);font-size:13px}
.subj-btn .nm{flex:1;line-height:1.25}
.subj-btn .cnt{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj-btn .car{font-size:9px;color:var(--muted);transition:.2s}
.subj.open .car{transform:rotate(90deg)}
.topics{display:none;padding:2px 0 6px 8px;border-left:1px solid var(--line);margin-left:16px}
.subj.open .topics{display:block}
.tlink{display:flex;gap:7px;align-items:flex-start;padding:5px 7px;border-radius:8px;color:var(--muted);font-size:12.2px;line-height:1.35;cursor:pointer}
.tlink:hover{background:var(--chip);color:var(--text)}
.tlink.active{background:var(--chip);color:var(--c1);font-weight:600}
.tlink .dot{width:11px;height:11px;border:1.5px solid var(--line);border-radius:4px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:8px}
.tlink.done .dot{background:var(--c2);border-color:var(--c2);color:#03130d}
.tlink.done{color:var(--c2)}

/* ---------- MAIN ---------- */
#main{display:flex;flex-direction:column;min-width:0}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:9px 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#menuBtn{display:none;background:var(--chip);border:0;color:var(--text);font-size:16px;padding:6px 11px;border-radius:9px;cursor:pointer}
#crumbs{flex:1;font-size:12.3px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumbs b{color:var(--text);font-weight:600}
.pbar{width:130px;height:7px;background:var(--chip);border-radius:99px;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));width:0;transition:.4s}
#pct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
#themeBtn{background:var(--chip);border:0;color:var(--text);font-size:15px;padding:6px 11px;border-radius:9px;cursor:pointer}
#view{max-width:930px;width:100%;margin:0 auto;padding:32px 26px 130px}

/* ---------- TYPOGRAPHY ---------- */
h1{font-size:27px;line-height:1.22;margin:6px 0 6px;letter-spacing:-.5px}
h2{font-size:19px;margin:36px 0 10px;letter-spacing:-.2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:15.5px;margin:26px 0 8px;color:var(--c1)}
h4{font-size:13.5px;margin:20px 0 6px;color:var(--c3);text-transform:uppercase;letter-spacing:.8px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;padding:4px 11px;border-radius:99px;background:var(--chip);color:var(--muted);border:1px solid var(--line);letter-spacing:.4px}
.prose p{margin:10px 0}
.prose ul,.prose ol{margin:10px 0;padding-left:20px}
.prose li{margin:5px 0}
.prose li::marker{color:var(--c1)}
b,strong{color:var(--text);font-weight:650}
.formula{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c1);border-radius:0 10px 10px 0;padding:12px 16px;margin:13px 0;overflow-x:auto}
.tip,.warn,.ex,.note{border-radius:10px;padding:12px 16px;margin:13px 0;font-size:13.7px;border:1px solid var(--line)}
.tip{background:color-mix(in srgb,var(--c2) 9%,transparent);border-left:3px solid var(--c2)}
.warn{background:color-mix(in srgb,var(--c4) 9%,transparent);border-left:3px solid var(--c4)}
.ex{background:color-mix(in srgb,var(--c3) 9%,transparent);border-left:3px solid var(--c3)}
.note{background:color-mix(in srgb,var(--c5) 9%,transparent);border-left:3px solid var(--c5)}
.tip b,.warn b,.ex b,.note b{display:block;margin-bottom:4px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase}
.tip b{color:var(--c2)}.warn b{color:var(--c4)}.ex b{color:var(--c3)}.note b{color:var(--c5)}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
th{background:var(--panel2);color:var(--c1);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
td code,p code,li code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
pre.ascii{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font-size:12.2px;line-height:1.55;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
details.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px}
details.q summary{cursor:pointer;color:var(--c1);font-weight:600}
details.q[open] summary{margin-bottom:8px}

/* ---------- FIGURES ---------- */
.figslot{margin:20px auto;text-align:center}
.figure{margin:0;display:block}
.figure svg{display:block;margin:0 auto;max-width:100%;height:auto;color:var(--muted)}
.figure figcaption{font-size:11.8px;color:var(--muted);margin-top:7px;font-style:italic;line-height:1.45}
.figure svg text{fill:currentColor;font-family:inherit}
svg .ax{stroke:currentColor;stroke-opacity:.5;stroke-width:1.2}
svg .grid{stroke:currentColor;stroke-opacity:.13;stroke-width:1}
svg .tick{font-size:9px;fill:var(--muted)}
svg .curve{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg .blk{fill:none;stroke:var(--c1);stroke-width:1.6}
svg .btxt{font-size:10.5px;fill:currentColor}
svg .wire{stroke:currentColor;stroke-width:1.5;fill:none}
svg .lbl{font-size:9.5px;fill:var(--muted)}
svg .ann{font-size:10px;fill:var(--c1)}
svg .dot{fill:var(--c2)}
svg .dash{stroke-dasharray:5 4}

/* ---------- GRID / CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;margin:18px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:var(--c1);transform:translateY(-2px)}
.card .ci{font-size:18px;color:var(--c1)}
.card .cn{font-weight:600;font-size:13.5px;line-height:1.3}
.card .cm{font-size:11.3px;color:var(--muted)}
.mini{height:5px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--c2);width:0}

/* ---------- ACTIONS ---------- */
.actions{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:10px;font-size:12.4px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:var(--c1)}
.btn.ok{background:color-mix(in srgb,var(--c2) 16%,transparent);border-color:var(--c2);color:var(--c2)}

/* ---------- NOTES / PAGER ---------- */
.notes{margin-top:46px;border-top:1px solid var(--line);padding-top:20px}
.notes textarea{width:100%;min-height:120px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px;font-family:inherit;font-size:13.4px;resize:vertical;outline:none}
.notes textarea:focus{border-color:var(--c1)}
.notes .saved{font-size:11.3px;color:var(--c2);margin-top:6px;height:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
.pager a{font-size:12.8px;max-width:48%;line-height:1.35}
.pager .nx{text-align:right;margin-left:auto}
.pager small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}

/* ---------- SEARCH RESULTS ---------- */
.sres{padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.sres:hover{background:var(--chip);border-color:var(--line)}
.sres b{display:block;font-size:12.8px}
.sres span{font-size:11px;color:var(--muted)}

.overlay{display:none}
@media (max-width:920px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;left:-330px;top:0;width:300px;z-index:60;transition:left .25s ease;box-shadow:0 0 40px rgba(0,0,0,.55)}
  #sidebar.open{left:0}
  #menuBtn{display:block}
  #view{padding:22px 15px 100px}
  h1{font-size:22px}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  .pbar{display:none}
}
@media print{
  #sidebar,#topbar,.actions,.notes,.pager,.overlay,.searchbox{display:none!important}
  #app{grid-template-columns:1fr}
  #view{max-width:100%;padding:0}
  body{background:#fff;color:#000}
  .formula,.tip,.ex,.warn,.note,pre.ascii{border:1px solid #bbb;background:#fafafa}
  .figure svg{color:#333}
}

/* ---------- TOPIC STUDY GUIDE (additive; original lesson content retained) ---------- */
.deep-master{margin:28px 0 8px;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--panel),var(--panel2));}
.deep-master>h2{margin:0 0 8px;border:0;padding:0;font-size:20px}
.deep-lead{color:var(--muted);margin:0 0 16px}
.deep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.deep-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-width:0}
.deep-card h3{font-size:13px;margin:0 0 8px;color:var(--c1)}
.deep-card p{margin:7px 0;font-size:13px}
.deep-card ul,.deep-card ol{padding-left:19px;margin:7px 0;font-size:13px}
.deep-card li{margin:5px 0}
.deep-step{display:flex;gap:9px;margin:9px 0;align-items:flex-start}
.deep-num{flex:none;width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:var(--chip);color:var(--c1);font-size:11px;font-weight:700}
.deep-check{display:grid;gap:7px}
.deep-check label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.deep-check input{margin-top:4px;accent-color:var(--c2)}
.deep-quiz details{margin:8px 0;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel)}
.deep-quiz summary{cursor:pointer;color:var(--c1);font-weight:650;font-size:13px}
.deep-quiz p{font-size:13px;margin:8px 0 2px}
.deep-tag{display:inline-block;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 8px;margin:3px 4px 3px 0;font-size:10.5px;color:var(--muted)}
.study-plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}
.study-plan>div{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--panel)}
.study-plan b{display:block;color:var(--c1);font-size:12px;margin-bottom:5px}
@media print{.deep-master{break-inside:avoid}.deep-grid{grid-template-columns:1fr 1fr}}

.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:18px 0}
.stat-card{padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stat-card .stat-label{font-size:11px;color:var(--muted);letter-spacing:.35px}
.stat-card .stat-value{font-size:25px;font-weight:700;line-height:1.35;margin-top:3px;font-variant-numeric:tabular-nums}
.section-intro{max-width:760px;color:var(--muted)}
.plan-table{width:100%;border-collapse:collapse}
.plan-table td,.plan-table th{vertical-align:top}
.plan-table td:first-child{white-space:nowrap;font-weight:650;color:var(--c1)}
.dashboard-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.dashboard-tools input[type=file]{max-width:220px;font-size:12px;color:var(--muted)}
.smallprint{font-size:11px;color:var(--muted)}
@media(max-width:560px){.plan-table td:first-child{white-space:normal}.stat-card .stat-value{font-size:21px}}
@media print{.dashboard-tools{display:none!important}}


</style>
</head>
<body>

<!-- shared SVG marker defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
  </marker>
  <marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--c1)"/>
  </marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--c2)"/>
  </marker>
  <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--c3)"/>
  </marker>
</defs></svg>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>ISRO <span>ECE</span> Study Hub</h1>
      <p>Scientist/Engineer 'SC'</p>
    </div>
    <div class="searchbox">
      <input id="search" type="search" placeholder="Search topics, formulas…  ( / )" autocomplete="off">
    </div>
    <nav id="nav"></nav>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="menuBtn">☰</button>
      <div id="crumbs"></div>
      <div class="pbar"><i id="pfill"></i></div>
      <span id="pct">0%</span>
      <button id="themeBtn" title="Toggle theme">◐</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="overlay" id="overlay"></div>

<script>
/* =====================================================================
   0. TINY SVG LIBRARY
   ===================================================================== */
const T = String.raw;

function fig(w,h,inner,cap){
  return `<figure class="figure"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${inner}</svg>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
}
function txt(x,y,t,cls='lbl',anchor='middle'){return `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${t}</text>`;}
function ln(x1,y1,x2,y2,cls='ax',extra=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" ${extra}/>`;}
function pl(pts,cls='curve',extra=''){return `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" class="${cls}" ${extra}/>`;}
function rc(x,y,w,h,cls='blk',r=6,extra=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${cls}" ${extra}/>`;}
function ci(x,y,r,cls='dot',extra=''){return `<circle cx="${x}" cy="${y}" r="${r}" class="${cls}" ${extra}/>`;}
function pa(d,cls='curve',extra=''){return `<path d="${d}" class="${cls}" ${extra}/>`;}
function arw(x1,y1,x2,y2,color='currentColor',cls=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.5" marker-end="url(#ah)" class="${cls}"/>`;}

/* generic plot */
function plot(o){
  const w=o.w||380, h=o.h||210;
  const L=o.l??44, R=o.r??16, Tp=o.t??16, B=o.b??34;
  const xr=o.xr||[0,1], yr=o.yr||[0,1];
  const lg=o.xlog?Math.log10:(x=>x);
  const x0=lg(xr[0]), x1=lg(xr[1]);
  const X=x=>L+(lg(x)-x0)/(x1-x0)*(w-L-R);
  const Y=y=>h-B-(y-yr[0])/(yr[1]-yr[0])*(h-Tp-B);
  let s='';
  (o.ygrid||[]).forEach(v=>{
    s+=ln(L,Y(v),w-R,Y(v),'grid');
    s+=txt(L-6,Y(v)+3,o.yfmt?o.yfmt(v):v,'tick','end');
  });
  (o.xgrid||[]).forEach(v=>{
    s+=ln(X(v),Tp,X(v),h-B,'grid');
    s+=txt(X(v),h-B+14,o.xfmt?o.xfmt(v):v,'tick','middle');
  });
  s+=ln(L,h-B,w-R,h-B,'ax');
  s+=ln(L,Tp,L,h-B,'ax');
  if(o.zero){
    if(yr[0]<0&&yr[1]>0) s+=ln(L,Y(0),w-R,Y(0),'ax','stroke-opacity=".3"');
    if(xr[0]<0&&xr[1]>0) s+=ln(X(0),Tp,X(0),h-B,'ax','stroke-opacity=".3"');
  }
  (o.curves||[]).forEach(c=>{
    const from=c.from??xr[0], to=c.to??xr[1], n=c.n||180;
    const pts=[];
    for(let i=0;i<=n;i++){
      const x=from+(to-from)*i/n;
      let y=c.f(x);
      if(!isFinite(y)) continue;
      y=Math.max(yr[0]-1,Math.min(yr[1]+1,y));
      pts.push([X(x),Y(y)]);
    }
    s+=pl(pts,'curve',`stroke="${c.color?`var(--${c.color})`:'var(--c1)'}" ${c.dash?`stroke-dasharray="${c.dash}"`:''} stroke-width="${c.w||2.2}"`);
  });
  (o.vlines||[]).forEach(v=>{
    s+=ln(X(v.x),Tp,X(v.x),h-B,'ax',`stroke="var(--${v.color||'c3'})" stroke-dasharray="4 4"`);
    if(v.t) s+=txt(X(v.x),Tp+10,v.t,'lbl','middle');
  });
  (o.dots||[]).forEach(d=>{
    s+=ci(X(d.x),Y(d.y),d.r||3.5,d.cls||'dot',`fill="var(--${d.color||'c2'})" stroke="none"`);
  });
  (o.texts||[]).forEach(t=>{
    s+=txt(X(t.x),Y(t.y),t.t,'ann',t.anchor||'middle');
  });
  if(o.xlabel) s+=txt((L+w-R)/2,h-4,o.xlabel,'lbl','middle');
  if(o.ylabel) s+=`<text x="12" y="${(Tp+h-B)/2}" class="lbl" text-anchor="middle" transform="rotate(-90 12 ${(Tp+h-B)/2})">${o.ylabel}</text>`;
  return fig(w,h,s,o.cap);
}

/* circuit components between two points */
function comp(kind,x1,y1,x2,y2,label){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  const ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
  const P=(t,off=0)=>[x1+ux*len*t+nx*off, y1+uy*len*t+ny*off];
  const pts=[];
  let s='';
  if(kind==='R'){
    const a=0.2,b=0.8,segs=6,amp=5;
    pts.push([x1,y1],P(a));
    for(let i=0;i<segs;i++){
      const t=a+(b-a)*(i+0.5)/segs;
      pts.push(P(t,(i%2?-1:1)*amp));
    }
    pts.push(P(b),[x2,y2]);
    s=pl(pts,'wire','stroke="var(--c1)"');
  } else if(kind==='C'){
    const a=0.42,b=0.58;
    pts.push([x1,y1],P(a));
    s=pl(pts,'wire')+
      pl([P(a,-9),P(a,9)],'wire','stroke="var(--c1)" stroke-width="2.2"')+
      pl([P(b,-9),P(b,9)],'wire','stroke="var(--c1)" stroke-width="2.2"')+
      pl([P(b),[x2,y2]],'wire');
  } else if(kind==='L'){
    const a=0.25,b=0.75,n=4;
    pts.push([x1,y1],P(a));
    let d=`M${x1},${y1} L${P(a)[0]},${P(a)[1]}`;
    for(let i=0;i<n;i++){
      const t1=a+(b-a)*i/n, t2=a+(b-a)*(i+1)/n;
      const p1=P(t1),p2=P(t2),mid=P((t1+t2)/2,-6);
      d+=` Q${mid[0]},${mid[1]} ${p2[0]},${p2[1]}`;
    }
    s=pa(d,'wire','stroke="var(--c1)"')+pl([P(b),[x2,y2]],'wire');
  } else if(kind==='V'){
    const c=P(0.5);
    s=pl([[x1,y1],P(0.38)],'wire')+pl([P(0.62),[x2,y2]],'wire')+
      ci(c[0],c[1],10,'','fill="none" stroke="var(--c3)" stroke-width="1.8"')+
      txt(c[0]+(uy?0:-14),c[1]+(uy?14:0),'+','lbl')+
      txt(c[0]+(uy?0:14),c[1]+(uy?-14:0),'−','lbl');
  } else if(kind==='D'){
    const c=P(0.5);
    s=pl([[x1,y1],P(0.38)],'wire')+pl([P(0.62),[x2,y2]],'wire')+
      pl([P(0.38,-8),P(0.38,8)],'wire','stroke="var(--c4)" stroke-width="2.2"')+
      pa(`M${P(0.62,-8)[0]},${P(0.62,-8)[1]} L${P(0.62,8)[0]},${P(0.62,8)[1]} L${P(0.38)[0]},${P(0.38)[1]} Z`,'','fill="var(--c4)" opacity=".85"');
  } else if(kind==='gnd'){
    s=pl([[x1,y1],[x1,y1+8]],'wire')+pl([[x1-9,y1+8],[x1+9,y1+8]],'wire')+pl([[x1-5,y1+13],[x1+5,y1+13]],'wire')+pl([[x1-2,y1+18],[x1+2,y1+18]],'wire');
  }
  if(label) s+=txt((x1+x2)/2+nx*16,(y1+y2)/2+ny*16,label,'lbl','middle');
  return s;
}

/* op-amp triangle */
function opamp(x,y,w=46,h=46){
  return pa(`M${x},${y} L${x},${y+h} L${x+w},${y+h/2} Z`,'','fill="none" stroke="var(--c1)" stroke-width="1.7"')+
    txt(x+8,y+h*0.28,'−','lbl')+txt(x+8,y+h*0.78,'+','lbl');
}

/* block diagram builder */
function blkdiag(boxes,links,o={}){
  const w=o.w||430,h=o.h||170;
  const pos={}; let s='';
  boxes.forEach(b=>{
    pos[b.id]=b;
    s+=rc(b.x,b.y,b.w,b.h,'blk',7);
    (b.t||'').split('\n').forEach((line,i,a)=>{
      s+=txt(b.x+b.w/2,b.y+b.h/2+3+(i-(a.length-1)/2)*11,line,'btxt','middle');
    });
  });
  links.forEach(l=>{
    const A=pos[l.a], B=pos[l.b];
    if(!A||!B) return;
    let x1,y1,x2,y2;
    if(l.side==='v'){ x1=A.x+A.w/2; y1=A.y+A.h; x2=B.x+B.w/2; y2=B.y; }
    else { x1=A.x+A.w; y1=A.y+A.h/2; x2=B.x; y2=B.y+B.h/2; }
    const midX=(x1+x2)/2;
    const d = Math.abs(y2-y1)>2 ? `M${x1},${y1} L${midX},${y1} L${midX},${y2} L${x2},${y2}` : `M${x1},${y1} L${x2},${y2}`;
    s+=pa(d,'','fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"');
    if(l.t) s+=txt(midX,(y1+y2)/2-5,l.t,'lbl','middle');
  });
  return fig(w,h,s,o.cap);
}

  {id:'la', name:'Linear Algebra — Matrices, Rank, Eigenvalues', body: T`
<p><b>Core idea.</b> Almost every linear-algebra question in ISRO reduces to one of three operations: find the <b>rank</b>, check <b>consistency</b> of \(Ax=b\), or find <b>eigenvalues</b>. Master the shortcuts and you can answer most of them in under 30 seconds.</p>

<h4>Rank — four equivalent definitions</h4>
<ul>
<li>Number of non-zero rows after row reduction (Gauss elimination).</li>
<li>Order of the largest non-zero minor.</li>
<li>Dimension of the column space = dimension of the row space.</li>
<li>Number of non-zero singular values.</li>
</ul>
<p>For an \(m\times n\) matrix, \(\operatorname{rank}(A)\le\min(m,n)\). If \(\operatorname{rank}(A)=n\) the columns are independent; if \(\operatorname{rank}(A)=m\) the rows are independent.</p>
${FIGSLOT('matrank')}
<h4>Consistency of \(Ax=b\)</h4>
<div class="formula">$$\text{rank}(A)=\text{rank}([A|b])\;\Rightarrow\;\text{consistent}$$
$$\text{If rank}=n\;\Rightarrow\;\text{unique solution};\qquad \text{If rank}<n\;\Rightarrow\;\text{infinitely many solutions}$$</div>
<p>If \(\operatorname{rank}(A)<\operatorname{rank}([A|b])\) the system is <b>inconsistent</b> (no solution). A homogeneous system \(Ax=0\) always has the trivial solution; it has non-trivial solutions iff \(\det(A)=0\).</p>

<h4>Eigenvalues and eigenvectors</h4>
<p>\(\lambda\) is an eigenvalue if \((A-\lambda I)\) is singular, i.e. \(|A-\lambda I|=0\). The vector \(x\neq0\) satisfying \(Ax=\lambda x\) is the corresponding eigenvector.</p>
<div class="formula">$$\sum_i\lambda_i=\operatorname{tr}(A),\qquad \prod_i\lambda_i=\det(A)$$</div>
${FIGSLOT('eigen')}
<ul>
<li><b>Triangular / diagonal matrices:</b> eigenvalues are the diagonal entries.</li>
<li><b>Real symmetric:</b> eigenvalues real, eigenvectors orthogonal. <b>Skew-symmetric:</b> eigenvalues purely imaginary or zero.</li>
<li><b>Orthogonal matrix:</b> \(|\lambda|=1\). <b>Idempotent</b> (\(A^2=A\)): eigenvalues 0 or 1.</li>
<li><b>Nilpotent</b> (\(A^k=0\)): all eigenvalues zero.</li>
<li>Eigenvalues of \(A^{-1}\) are \(1/\lambda_i\); of \(A^k\) are \(\lambda_i^k\); of \(A+cI\) are \(\lambda_i+c\).</li>
</ul>

<h4>Cayley–Hamilton theorem</h4>
<p>Every square matrix satisfies its own characteristic equation. For a \(2\times2\) matrix this gives a one-line inverse:</p>
<div class="formula">$$\lambda^2-(\operatorname{tr}A)\lambda+\det A=0\;\Longrightarrow\;A^2=(\operatorname{tr}A)A-(\det A)I$$
$$A^{-1}=\frac{1}{\det A}\big[(\operatorname{tr}A)I-A\big]$$</div>
<div class="ex"><b>Worked example</b>
\(A=\begin{bmatrix}2&1\\1&2\end{bmatrix}\): trace 4, det 3, so \(\lambda^2-4\lambda+3=0\Rightarrow\lambda=1,3\).
Then \(A^{-1}=\frac13(4I-A)=\frac13\begin{bmatrix}2&-1\\-1&2\end{bmatrix}\). Verify: \(AA^{-1}=I\). ✓
</div>

<details class="q"><summary>Quick check — what is the rank of a \(3\times3\) matrix with two identical rows?</summary>
<p>At most 2, because the identical rows are linearly dependent. If the third row is independent, rank = 2; if it is also dependent, rank = 1.</p></details>

<div class="tip"><b>Exam tip</b> For a \(3\times3\) matrix, compute trace and determinant first. Many MCQs give options with obviously wrong sums or products — eliminate them before expanding the cubic.</div>
<div class="warn"><b>Common trap</b> \(\operatorname{rank}(AB)\le\min(\operatorname{rank}A,\operatorname{rank}B)\), not the sum. Also \(\operatorname{rank}(A+B)\) is <em>not</em> determined by the individual ranks.</div>
`},

  {id:'calc', name:'Differential Calculus — Limits, Maxima/Minima, Partial Derivatives', body: T`
<p><b>Core idea.</b> Limits, L'Hôpital, stationary points and the second-derivative test. ISRO asks these as fast MCQs, so standard results matter more than long derivations.</p>

<h4>Standard limits you must know cold</h4>
<div class="formula">$$\lim_{x\to0}\frac{\sin x}{x}=1,\quad \lim_{x\to0}\frac{\tan x}{x}=1,\quad \lim_{x\to0}\frac{1-\cos x}{x^2}=\frac12$$
$$\lim_{x\to0}\frac{e^x-1}{x}=1,\quad \lim_{x\to0}\frac{\ln(1+x)}{x}=1,\quad \lim_{x\to0}(1+x)^{1/x}=e$$
$$\lim_{x\to\infty}\left(1+\frac{a}{x}\right)^{x}=e^a,\qquad \lim_{x\to0}\frac{\sin^{-1}x}{x}=1$$</div>
<p><b>L'Hôpital's rule</b> applies only to \(0/0\) or \(\infty/\infty\); differentiate numerator and denominator separately. Repeated application is allowed, but standard limits are usually faster.</p>

<h4>Maxima and minima in one variable</h4>
<ul>
<li>Solve \(f'(x)=0\) → stationary points.</li>
<li>\(f''(x)>0\) → local minimum; \(f''(x)<0\) → local maximum; \(f''(x)=0\) → test further (third derivative / sign change).</li>
<li>On a closed interval, also check the endpoints for the global extremum.</li>
</ul>
${FIGSLOT('extrema')}

<h4>Functions of two variables</h4>
<p>At a stationary point solve \(f_x=0,\;f_y=0\). Let</p>
<div class="formula">$$r=f_{xx},\qquad s=f_{xy},\qquad t=f_{yy},\qquad D=rt-s^2$$</div>
<ul>
<li>\(D>0,\ r>0\) → local minimum.</li>
<li>\(D>0,\ r<0\) → local maximum.</li>
<li>\(D<0\) → saddle point.</li>
<li>\(D=0\) → test fails, needs further analysis.</li>
</ul>

<h4>Taylor and Euler</h4>
<div class="formula">$$f(x)=f(a)+f'(a)(x-a)+\frac{f''(a)}{2!}(x-a)^2+\frac{f'''(a)}{3!}(x-a)^3+\cdots$$</div>
<p>For a homogeneous function of degree \(n\): \(x f_x + y f_y = n f\) (Euler's theorem).</p>

<div class="ex"><b>Worked example</b> Find the extrema of \(f(x,y)=x^2+y^2-2x-4y+7\).
\(f_x=2x-2=0\Rightarrow x=1\); \(f_y=2y-4=0\Rightarrow y=2\). Then \(r=2,\ s=0,\ t=2\), \(D=4>0\) and \(r>0\) ⇒ minimum at \((1,2)\) with \(f=2\).</div>

<div class="tip"><b>Exam tip</b> For "maximum value of a function" questions with a nice symmetric form, try AM–GM or completing the square instead of calculus — it is usually faster.</div>
`},

  {id:'integral', name:'Integral Calculus — Definite, Improper & Multiple Integrals', body: T`
<p><b>Core idea.</b> Recognise symmetry and standard forms; only then integrate.</p>

<h4>Symmetry — the 5-second shortcut</h4>
<div class="formula">$$\int_{-a}^{a}f(x)\,dx=2\int_{0}^{a}f(x)\,dx\ \text{if }f\text{ is even};\qquad =0\ \text{if }f\text{ is odd}$$</div>
${FIGSLOT('intarea')}
<h4>Standard results</h4>
<div class="formula">$$\int_0^{\pi/2}\sin^n x\,dx=\int_0^{\pi/2}\cos^n x\,dx=\frac{n-1}{n}\cdot\frac{n-3}{n-2}\cdots$$
$$\Gamma(n)=\int_0^\infty x^{n-1}e^{-x}dx=(n-1)!,\qquad \beta(m,n)=\frac{\Gamma(m)\Gamma(n)}{\Gamma(m+n)}$$
$$\int_0^\infty\frac{dx}{1+x^2}=\frac{\pi}{2},\qquad \int_0^\infty e^{-ax}dx=\frac1a,\qquad \int_0^\infty x^ne^{-ax}dx=\frac{n!}{a^{n+1}}$$</div>

<h4>Improper integrals</h4>
<ul>
<li>\(\int_1^\infty x^{-p}dx\) converges iff \(p>1\).</li>
<li>\(\int_0^1 x^{-p}dx\) converges iff \(p<1\).</li>
<li>Convergence is decided by the limit existing and being finite.</li>
</ul>

<h4>Double and triple integrals</h4>
<p>For a region \(R\): \(\iint_R f(x,y)\,dA\). If the inner integral is hard, <b>change the order of integration</b> — this is a favourite ISRO trick.</p>
<div class="formula">$$\text{Polar: } dA=r\,dr\,d\theta;\qquad \text{cylindrical: } dV=\rho\,d\rho\,d\phi\,dz;\qquad \text{spherical: } dV=r^2\sin\theta\,dr\,d\theta\,d\phi$$</div>
<div class="ex"><b>Worked example</b> \(\displaystyle\int_0^\infty\int_0^\infty e^{-(x+y)}dx\,dy=\left(\int_0^\infty e^{-x}dx\right)^2=1\), because the integrand is separable.</div>
<div class="tip"><b>Exam tip</b> Always check if the integrand is separable — \(f(x)g(y)\) over a rectangular region factorises into a product of two 1-D integrals.</div>
`},

  {id:'ode', name:'Differential Equations — First & Higher Order', body: T`
<p><b>Core idea.</b> Identify the type, apply the matching standard solution, then fit the initial conditions.</p>
${FIGSLOT('odefam')}
<h4>First order</h4>
<table><tr><th>Type</th><th>Form</th><th>Method</th></tr>
<tr><td>Variable separable</td><td>\(\frac{dy}{dx}=f(x)g(y)\)</td><td>\(\int dy/g=\int f\,dx\)</td></tr>
<tr><td>Linear</td><td>\(\frac{dy}{dx}+P(x)y=Q(x)\)</td><td>IF \(=e^{\int P dx}\)</td></tr>
<tr><td>Exact</td><td>\(Mdx+Ndy=0\), \(M_y=N_x\)</td><td>Find potential \(u(x,y)=C\)</td></tr>
<tr><td>Homogeneous</td><td>\(\frac{dy}{dx}=F(y/x)\)</td><td>Substitute \(y=vx\)</td></tr>
<tr><td>Bernoulli</td><td>\(y'+Py=Qy^n\)</td><td>Substitute \(v=y^{1-n}\)</td></tr>
</table>
<div class="formula">$$\text{Linear first order: } y\,e^{\int P dx}=\int Q\,e^{\int P dx}dx+C$$</div>

<h4>Second and higher order (constant coefficients)</h4>
<p>Solve the auxiliary equation \(m^2+am+b=0\) for the complementary function (CF), then add a particular integral (PI).</p>
<table><tr><th>Roots</th><th>Complementary function</th></tr>
<tr><td>Real, distinct \(m_1,m_2\)</td><td>\(C_1e^{m_1x}+C_2e^{m_2x}\)</td></tr>
<tr><td>Real, repeated \(m\)</td><td>\((C_1+C_2x)e^{mx}\)</td></tr>
<tr><td>Complex \(\alpha\pm j\beta\)</td><td>\(e^{\alpha x}(C_1\cos\beta x+C_2\sin\beta x)\)</td></tr>
</table>
<div class="formula">$$\text{PI for }e^{ax}:\ \frac{1}{f(a)}e^{ax}\ (f(a)\neq0);\qquad \text{PI for }\sin ax:\ \frac{1}{f(-a^2)}\sin ax$$</div>
<div class="ex"><b>Worked example</b> Solve \(\frac{dy}{dx}+\frac{y}{x}=x\). IF \(=e^{\int dx/x}=x\). Multiply: \(\frac{d}{dx}(xy)=x^2\Rightarrow xy=\frac{x^3}{3}+C\Rightarrow y=\frac{x^2}{3}+\frac{C}{x}\).</div>
<div class="tip"><b>Exam tip</b> For "which of these is a solution?", substitute each option — often faster than solving.</div>
`},

  {id:'vector', name:'Vector Calculus — Gradient, Divergence, Curl & Integral Theorems', body: T`
<p><b>Core idea.</b> Three operators, three big theorems, one rule: match the integral to the theorem.</p>
${FIGSLOT('vops')}
<h4>The operators</h4>
<div class="formula">$$\nabla f=\left(\frac{\partial f}{\partial x},\frac{\partial f}{\partial y},\frac{\partial f}{\partial z}\right)$$
$$\nabla\cdot\vec F=\frac{\partial F_x}{\partial x}+\frac{\partial F_y}{\partial y}+\frac{\partial F_z}{\partial z}$$
$$\nabla\times\vec F=\begin{vmatrix}\hat i&\hat j&\hat k\\ \partial_x&\partial_y&\partial_z\\ F_x&F_y&F_z\end{vmatrix}$$</div>
<ul>
<li>\(\nabla f\) is normal to the level surface \(f=\text{const}\) and points uphill.</li>
<li>\(\nabla\cdot\vec F=0\) ⇒ solenoidal (no sources/sinks).</li>
<li>\(\nabla\times\vec F=0\) ⇒ irrotational/conservative ⇒ \(\vec F=\nabla\phi\).</li>
<li>\(\nabla^2f=\nabla\cdot\nabla f\) (Laplacian).</li>
<li>\(\nabla\times(\nabla f)=0\) and \(\nabla\cdot(\nabla\times\vec F)=0\) — always.</li>
</ul>

<h4>The three integral theorems</h4>
<div class="formula">$$\oiint_S\vec F\cdot d\vec S=\iiint_V(\nabla\cdot\vec F)\,dV\qquad\text{(Gauss divergence)}$$
$$\oint_C\vec F\cdot d\vec r=\iint_S(\nabla\times\vec F)\cdot d\vec S\qquad\text{(Stokes)}$$
$$\oint_C(Mdx+Ndy)=\iint_R\left(\frac{\partial N}{\partial x}-\frac{\partial M}{\partial y}\right)dA\qquad\text{(Green)}$$</div>
<div class="ex"><b>Worked example</b> \(\vec F=(2x,2y,2z)\). Then \(\nabla\cdot\vec F=6\), so flux through the surface of a sphere of radius R equals \(6\times\frac43\pi R^3=8\pi R^3\).</div>
<div class="tip"><b>Exam tip</b> If \(\vec F\) is conservative (curl = 0), line integrals are path-independent — integrate along the easiest path, usually straight segments parallel to the axes.</div>
`},

  {id:'complex', name:'Complex Variables — Analytic Functions, C–R & Residues', body: T`
<p><b>Core idea.</b> Analyticity via Cauchy–Riemann, and contour integrals via residues.</p>
${FIGSLOT('contour')}
<h4>Analyticity</h4>
<div class="formula">$$\frac{\partial u}{\partial x}=\frac{\partial v}{\partial y},\qquad \frac{\partial u}{\partial y}=-\frac{\partial v}{\partial x}\qquad\text{(Cauchy–Riemann)}$$</div>
<ul>
<li>Analytic ⟺ C–R hold and the partial derivatives are continuous.</li>
<li>If \(f=u+jv\) is analytic, both \(u\) and \(v\) are harmonic: \(\nabla^2u=\nabla^2v=0\).</li>
<li>\(f'(z)=\frac{\partial u}{\partial x}+j\frac{\partial v}{\partial x}\) for analytic \(f\).</li>
<li>Polar form: \(u_r=\frac1r v_\theta,\; u_\theta=-r v_r\).</li>
</ul>

<h4>Residues</h4>
<div class="formula">$$\oint_C f(z)\,dz=2\pi j\sum\text{Residues inside }C$$</div>
<div class="formula">$$\text{Simple pole at }a:\ \operatorname{Res}=\lim_{z\to a}(z-a)f(z);\qquad \text{if }f=\frac{g}{h}:\ \operatorname{Res}=\frac{g(a)}{h'(a)}$$
$$\text{Pole of order }n:\ \operatorname{Res}=\frac{1}{(n-1)!}\lim_{z\to a}\frac{d^{n-1}}{dz^{n-1}}\big[(z-a)^nf(z)\big]$$</div>
<div class="ex"><b>Worked example</b> \(\displaystyle\oint_{|z|=2}\frac{e^z}{z-1}dz\). Simple pole at \(z=1\), inside. Residue \(=e\). Integral \(=2\pi je\).</div>
<div class="tip"><b>Exam tip</b> Classify the pole first. A "simple pole" formula turns a 10-line calculation into one line.</div>
<div class="warn"><b>Common trap</b> Only poles <em>inside</em> the contour contribute. A pole on the contour is a different (principal value) problem.</div>
`},

  {id:'prob', name:'Probability — Bayes, Random Variables, Expectation', body: T`
<p><b>Core idea.</b> Conditional probability, Bayes, and the mean/variance of a random variable.</p>
${FIGSLOT('bayes')}
<div class="formula">$$P(A|B)=\frac{P(B|A)P(A)}{P(B)},\qquad P(B)=\sum_iP(B|A_i)P(A_i)\quad\text{(total probability)}$$</div>
<div class="formula">$$E[X]=\sum x_iP(x_i)\ \text{(discrete)},\qquad E[X]=\int xf_X(x)dx\ \text{(continuous)}$$
$$\operatorname{Var}(X)=E[X^2]-(E[X])^2,\qquad E[aX+b]=aE[X]+b,\qquad \operatorname{Var}(aX+b)=a^2\operatorname{Var}(X)$$</div>
<ul>
<li>Independent: \(P(A\cap B)=P(A)P(B)\). Mutually exclusive: \(P(A\cap B)=0\) (and they cannot both be independent unless one has zero probability).</li>
<li>\(P(A\cup B)=P(A)+P(B)-P(A\cap B)\).</li>
<li>For a valid PDF: \(f_X(x)\ge0\) and \(\int f_X=1\).</li>
<li>CDF: \(F_X(x)=P(X\le x)=\int_{-\infty}^{x}f_X(t)dt\).</li>
</ul>
<div class="ex"><b>Worked example</b> Two machines produce 60% and 40% of items, with 2% and 5% defectives. Given a defective item:
\(P(M_2|D)=\frac{0.05\times0.4}{0.02\times0.6+0.05\times0.4}=\frac{0.02}{0.032}=0.625\).</div>
<div class="tip"><b>Exam tip</b> Draw the tree. Bayes becomes mechanical once the branches carry prior × likelihood.</div>
`},

  {id:'dist', name:'Standard Distributions', body: T`
<p><b>Core idea.</b> PMF/PDF, mean and variance for each family. "Mean = variance" is a classic one-liner.</p>
${FIGSLOT('dists2')}
<table><tr><th>Distribution</th><th>PMF / PDF</th><th>Mean</th><th>Variance</th></tr>
<tr><td>Binomial \((n,p)\)</td><td>\(\binom{n}{k}p^k(1-p)^{n-k}\)</td><td>\(np\)</td><td>\(np(1-p)\)</td></tr>
<tr><td>Poisson \((\lambda)\)</td><td>\(\frac{e^{-\lambda}\lambda^k}{k!}\)</td><td>\(\lambda\)</td><td>\(\lambda\)</td></tr>
<tr><td>Gaussian \((\mu,\sigma^2)\)</td><td>\(\frac{1}{\sigma\sqrt{2\pi}}e^{-\frac{(x-\mu)^2}{2\sigma^2}}\)</td><td>\(\mu\)</td><td>\(\sigma^2\)</td></tr>
<tr><td>Exponential \((\lambda)\)</td><td>\(\lambda e^{-\lambda x},\;x\ge0\)</td><td>\(1/\lambda\)</td><td>\(1/\lambda^2\)</td></tr>
<tr><td>Uniform \((a,b)\)</td><td>\(\frac{1}{b-a}\)</td><td>\(\frac{a+b}{2}\)</td><td>\(\frac{(b-a)^2}{12}\)</td></tr>
</table>
<div class="formula">$$\text{Poisson is the limit of Binomial when }n\to\infty,\ p\to0,\ np=\lambda$$</div>
<ul>
<li><b>Gaussian:</b> 68.27% within \(1\sigma\), 95.45% within \(2\sigma\), 99.73% within \(3\sigma\).</li>
<li><b>Exponential</b> is memoryless: \(P(X>s+t|X>s)=P(X>t)\).</li>
<li><b>Binomial</b> is the sum of \(n\) independent Bernoulli trials.</li>
</ul>
<div class="tip"><b>Exam tip</b> If a question says "mean equals variance", the answer is Poisson. If "number of trials until first success", it is geometric with mean \(1/p\).</div>
`},

  {id:'num', name:'Numerical Methods', body: T`
<p><b>Core idea.</b> Iterative root finding and numerical quadrature — know convergence orders and which rule is exact for which degree.</p>
${FIGSLOT('numquad')}
<h4>Root finding</h4>
<table><tr><th>Method</th><th>Iteration</th><th>Convergence</th></tr>
<tr><td>Bisection</td><td>Halve the bracket</td><td>Linear, always converges</td></tr>
<tr><td>False position</td><td>Regula falsi</td><td>Linear, faster than bisection</td></tr>
<tr><td>Secant</td><td>Two-point slope</td><td>Superlinear, order ≈1.62</td></tr>
<tr><td>Newton–Raphson</td><td>\(x_{n+1}=x_n-\frac{f}{f'}\)</td><td>Quadratic (needs \(f'\))</td></tr>
</table>
<div class="formula">$$x_{n+1}=x_n-\frac{f(x_n)}{f'(x_n)}\qquad\text{(Newton–Raphson)}$$</div>

<h4>Numerical integration</h4>
<div class="formula">$$\text{Trapezoidal: }\int_a^bf\,dx\approx\frac h2\big[y_0+2(y_1+\cdots+y_{n-1})+y_n\big]$$
$$\text{Simpson 1/3: }\frac h3\big[y_0+4(\text{odd }y)+2(\text{even }y)+y_n\big]\quad(n\text{ even})$$
$$\text{Simpson 3/8: }\frac{3h}{8}\big[y_0+3(y_1+y_2)+2y_3+\cdots+y_n\big]\quad(n\text{ multiple of 3})$$</div>
<ul>
<li>Trapezoidal is exact for polynomials up to degree 1.</li>
<li>Simpson 1/3 and 3/8 are exact up to degree 3.</li>
<li>Boole's rule is exact up to degree 5.</li>
</ul>
<div class="tip"><b>Exam tip</b> "Which rule gives the exact result for \(x^3\)?" — Simpson 1/3, Simpson 3/8, and Boole's all do. Trapezoidal does not.</div>
`}
  ]
},

/* ============================================================ 2 NETWORK */
{
  id:'net', name:'Network Theory', icon:'⚡',
  topics:[
  {id:'kcl', name:'KCL, KVL, Node & Mesh Analysis', body: T`
<p><b>Core idea.</b> Two conservation laws plus two systematic methods that solve any linear circuit.</p>
${FIGSLOT('kcl')}
<div class="formula">$$\text{KCL: }\sum I_{\text{leaving}}=0\qquad\text{(charge conservation)}$$
$$\text{KVL: }\sum V_{\text{around loop}}=0\qquad\text{(energy conservation)}$$</div>
<h4>Counting equations</h4>
<div class="formula">$$\text{independent nodes}=n-1,\qquad \text{independent meshes}=b-n+1$$</div>
<p>where \(n\) = number of nodes and \(b\) = number of branches. Choose the method that gives fewer equations.</p>
${FIGSLOT('mesh')}
<h4>Nodal analysis recipe</h4>
<ol>
<li>Pick a reference node (ground).</li>
<li>Write KCL at every other node in terms of node voltages.</li>
<li>Solve the linear system.</li>
<li>Use a <b>supernode</b> when a voltage source sits between two non-reference nodes.</li>
</ol>
<h4>Mesh analysis recipe</h4>
<ol>
<li>Assign a clockwise current to every independent mesh.</li>
<li>Write KVL for each mesh.</li>
<li>Use a <b>supermesh</b> when a current source is shared by two meshes.</li>
</ol>
<div class="ex"><b>Worked example</b> Two resistors in parallel driven by current \(I\): the node voltage is \(V=I\frac{R_1R_2}{R_1+R_2}\) and the current divides inversely with resistance (current divider).</div>
<div class="tip"><b>Exam tip</b> Nodal is better for many parallel branches; mesh is better for many series loops. Count the unknowns before choosing.</div>
`},

  {id:'theorems', name:'Thevenin, Norton, Superposition & Maximum Power Transfer', body: T`
<p><b>Core idea.</b> Reduce any linear network to a simple equivalent — the single most useful skill in network theory.</p>
${FIGSLOT('thevenin')}
<h4>Thevenin and Norton</h4>
<ul>
<li><b>Thevenin:</b> \(V_{th}\) = open-circuit voltage; \(R_{th}\) = look-in resistance with all independent sources killed (V sources shorted, I sources opened).</li>
<li><b>Norton:</b> \(I_N\) = short-circuit current; \(R_N=R_{th}\).</li>
<li>Conversion: \(V_{th}=I_NR_{th}\).</li>
</ul>
<div class="formula">$$V_{th}=V_{oc},\qquad I_N=I_{sc},\qquad R_{th}=R_N=\frac{V_{oc}}{I_{sc}}$$</div>

<h4>Superposition</h4>
<p>In a linear circuit, the response = sum of responses to each independent source acting alone. Kill the others: short voltage sources, open current sources.</p>
<div class="warn"><b>Important limitation</b> Superposition applies to <b>voltage and current</b>, never to <b>power</b>. Power is nonlinear in V and I, so it must be computed from the total voltage/current after superposition.</div>

<h4>Maximum power transfer</h4>
<div class="formula">$$P_{max}=\frac{V_{th}^2}{4R_{th}}\quad\text{when }R_L=R_{th},\qquad \eta=50\%\text{ at that point}$$</div>
${FIGSLOT('srctrans')}
<div class="tip"><b>Exam tip</b> Maximum power transfer gives 50% efficiency — the other 50% is dissipated in \(R_{th}\). If a question asks for "maximum efficiency", the answer is not \(R_L=R_{th}\).</div>
`},

  {id:'stardelta', name:'Source Transformation & Star–Delta Conversion', body: T`
<p><b>Core idea.</b> Two algebraic equivalences that let you simplify almost any resistor network.</p>
<h4>Source transformation</h4>
<div class="formula">$$V_s\text{ in series with }R\;\equiv\;I_s=\frac{V_s}{R}\text{ in parallel with }R$$</div>
<p>The terminal V–I relationship of the external network is preserved. Ideal voltage sources can be shorted in series; ideal current sources can be opened in parallel.</p>
${FIGSLOT('stardelta')}
<h4>Star–Delta</h4>
<div class="formula">$$\Delta\to Y:\quad R_a=\frac{R_{ab}R_{ac}}{R_{ab}+R_{bc}+R_{ca}}$$
$$Y\to\Delta:\quad R_{ab}=R_a+R_b+\frac{R_aR_b}{R_c}$$</div>
<p>Balanced case: \(R_Y=R_\Delta/3\), equivalently \(R_\Delta=3R_Y\).</p>
<div class="ex"><b>Worked example</b> Three 30 Ω resistors in delta → star of 10 Ω each. This often turns a bridge that "cannot be simplified" into a simple series–parallel circuit.</div>
<div class="tip"><b>Exam tip</b> If a Wheatstone bridge is unbalanced and you need the equivalent resistance, star–delta conversion is usually the fastest route.</div>
`},

  {id:'transient', name:'First & Second Order Transients', body: T`
<p><b>Core idea.</b> Energy-storage elements cannot change state instantaneously; the response is natural plus forced.</p>
<h4>Continuity conditions</h4>
<div class="formula">$$v_C(0^-)=v_C(0^+),\qquad i_L(0^-)=i_L(0^+)$$</div>
<h4>First order</h4>
<div class="formula">$$x(t)=x(\infty)+\big[x(0^+)-x(\infty)\big]e^{-t/\tau},\qquad \tau_{RC}=RC,\quad \tau_{RL}=\frac LR$$</div>
${FIGSLOT('rct')}
<p>The universal formula works for capacitor voltage and inductor current. One time constant = 63.2% of the change; five time constants ≈ 99.3%.</p>
<h4>Second order (series RLC)</h4>
<div class="formula">$$s_{1,2}=-\alpha\pm\sqrt{\alpha^2-\omega_0^2},\qquad \alpha=\frac{R}{2L},\quad \omega_0=\frac{1}{\sqrt{LC}}$$
$$\zeta=\frac{R}{2}\sqrt{\frac CL}$$</div>
${FIGSLOT('rlc')}
<ul>
<li>\(\zeta>1\) overdamped — no oscillation.</li>
<li>\(\zeta=1\) critically damped — fastest non-oscillatory return.</li>
<li>\(0<\zeta<1\) underdamped — decaying oscillation.</li>
<li>\(\zeta=0\) undamped — sustained oscillation.</li>
</ul>
<div class="tip"><b>Exam tip</b> For first-order circuits, find initial and final conditions first, then plug into the universal formula. No differential equation needed.</div>
`},

  {id:'ac', name:'Sinusoidal Steady State — Phasors, Power & Power Factor', body: T`
<p><b>Core idea.</b> At steady state every voltage and current is a sinusoid at the same frequency — work with phasors and complex impedance.</p>
${FIGSLOT('phasor')}
<div class="formula">$$Z_R=R,\quad Z_L=j\omega L,\quad Z_C=\frac{1}{j\omega C}=\frac{-j}{\omega C}$$
$$S=P+jQ=V_{rms}I_{rms}^*,\qquad P=VI\cos\phi,\quad Q=VI\sin\phi,\quad |S|=VI$$</div>
<ul>
<li>RMS of a sinusoid \(=V_m/\sqrt2\).</li>
<li>Inductive load → current lags → lagging power factor. Capacitive → leading.</li>
<li>Average real power is dissipated only in resistors: \(P=I_{rms}^2R\).</li>
<li>Reactive power oscillates between source and reactive elements; it does no net work.</li>
<li>Power-factor correction: parallel capacitor supplies \(Q_C=P(\tan\phi_1-\tan\phi_2)\).</li>
</ul>
<div class="ex"><b>Worked example</b> \(V=230\angle0^\circ\) V, \(I=10\angle{-30^\circ}\) A. Then \(S=230\times10\angle30^\circ=2300\angle30^\circ\), so \(P=2300\cos30^\circ=1992\) W and \(Q=1150\) var.</div>
<div class="tip"><b>Exam tip</b> \(S=VI^*\) uses the <b>complex conjugate</b> of current. Forgetting the conjugate flips the sign of Q — a classic negative-marking trap.</div>
`},

  {id:'res', name:'Resonance, Q-Factor, Bandwidth & Coupled Circuits', body: T`
<p><b>Core idea.</b> At resonance the reactances cancel, leaving a purely resistive circuit.</p>
${FIGSLOT('resonance')}
<div class="formula">$$\text{Series: }\omega_0=\frac{1}{\sqrt{LC}},\quad Q=\frac{\omega_0L}{R}=\frac{1}{\omega_0CR}=\frac1R\sqrt{\frac LC},\quad BW=\frac{\omega_0}{Q}=\frac RL$$</div>
<div class="formula">$$\text{Parallel (high-Q): }\omega_0\approx\frac{1}{\sqrt{LC}},\quad Q=R\sqrt{\frac CL}$$</div>
<ul>
<li>At series resonance, \(V_L=V_C=QV_s\) — voltage magnification.</li>
<li>At parallel resonance, circulating current is \(Q\) times the supply current — current magnification.</li>
<li>Half-power frequencies satisfy \(f_2-f_1=f_0/Q\).</li>
<li>Coupled circuits: \(M=k\sqrt{L_1L_2}\), \(0\le k\le1\). Series aiding \(L=L_1+L_2+2M\); opposing \(L_1+L_2-2M\).</li>
</ul>
<div class="tip"><b>Exam tip</b> Higher Q ⇒ narrower bandwidth ⇒ sharper selectivity. A circuit with Q = 100 has a bandwidth of 1% of \(f_0\).</div>
`},

  {id:'twoport', name:'Two-Port Networks — Z, Y, h, ABCD', body: T`
<p><b>Core idea.</b> Describe a linear two-port by a \(2\times2\) matrix; convert between parameter sets.</p>
${FIGSLOT('twoport')}
<div class="formula">$$\begin{bmatrix}V_1\\V_2\end{bmatrix}=\begin{bmatrix}z_{11}&z_{12}\\z_{21}&z_{22}\end{bmatrix}\begin{bmatrix}I_1\\I_2\end{bmatrix}\qquad\text{(Z)}$$
$$\begin{bmatrix}I_1\\I_2\end{bmatrix}=\begin{bmatrix}y_{11}&y_{12}\\y_{21}&y_{22}\end{bmatrix}\begin{bmatrix}V_1\\V_2\end{bmatrix}\qquad\text{(Y)}$$
$$\begin{bmatrix}V_1\\I_1\end{bmatrix}=\begin{bmatrix}A&B\\C&D\end{bmatrix}\begin{bmatrix}V_2\\-I_2\end{bmatrix}\qquad\text{(ABCD)}$$</div>
<table><tr><th>Property</th><th>Z</th><th>Y</th><th>h</th><th>ABCD</th></tr>
<tr><td>Reciprocal</td><td>\(z_{12}=z_{21}\)</td><td>\(y_{12}=y_{21}\)</td><td>\(h_{12}=-h_{21}\)</td><td>\(AD-BC=1\)</td></tr>
<tr><td>Symmetric</td><td>\(z_{11}=z_{22}\)</td><td>\(y_{11}=y_{22}\)</td><td>\(\Delta_h=1\)</td><td>\(A=D\)</td></tr>
</table>
<div class="formula">$$\text{Cascade: multiply ABCD.}\quad\text{Series: add Z.}\quad\text{Parallel: add Y.}$$</div>
<div class="tip"><b>Exam tip</b> Only ABCD matrices multiply in cascade. If two networks are cascaded, convert to ABCD first.</div>
`},

  {id:'pz', name:'Network Functions, Poles, Zeros & Stability', body: T`
<p><b>Core idea.</b> The transfer function \(H(s)\) determines everything about the response and stability.</p>
${FIGSLOT('pz')}
<div class="formula">$$H(s)=\frac{N(s)}{D(s)}=\frac{V_o(s)}{V_i(s)}\Big|_{\text{zero initial conditions}}$$</div>
<ul>
<li><b>Poles:</b> roots of \(D(s)\) — natural frequencies.</li>
<li><b>Zeros:</b> roots of \(N(s)\) — transmission nulls.</li>
<li><b>BIBO stability:</b> all poles strictly in the left half-plane.</li>
<li>Poles on the \(j\omega\) axis ⇒ marginally stable (sustained oscillation).</li>
<li>Passive RC networks: poles on the negative real axis. LC networks: poles purely imaginary.</li>
<li>Minimum-phase network: all zeros also in the LHP.</li>
<li>All-pass: poles and zeros mirror images about the \(j\omega\) axis — flat magnitude.</li>
</ul>
<div class="tip"><b>Exam tip</b> An odd number of right-half-plane poles means unstable. If a pole-zero plot shows any pole to the right of the imaginary axis, the system is unstable regardless of the zeros.</div>
`},

  {id:'graph', name:'Graph Theory & Network Topology', body: T`
<p><b>Core idea.</b> A network is a graph; topology tells you how many independent equations exist and how to write them.</p>
<h4>Definitions</h4>
<ul>
<li><b>Tree:</b> connected subgraph containing all nodes and no loops. Branches = \(n-1\).</li>
<li><b>Chord (link):</b> any branch not in the tree. Number of chords = \(b-n+1\) = number of fundamental loops.</li>
<li><b>Incidence matrix \(A\):</b> rows = nodes except reference, columns = branches.</li>
<li><b>Tie-set matrix \(B\):</b> rows = fundamental loops.</li>
<li><b>Cut-set matrix \(Q\):</b> rows = fundamental cut-sets.</li>
<li>Orthogonality: \(BQ^T=0\).</li>
</ul>
<div class="formula">$$\text{independent loops}=b-n+1,\qquad \text{independent cut-sets}=n-1$$</div>
<div class="tip"><b>Exam tip</b> Tie-set analysis → mesh equations. Cut-set analysis → node equations. They are duals.</div>
`}
  ]
},

/* ============================================================ 3 SIGNALS */
{
  id:'sig', name:'Signals and Systems', icon:'∿',
  topics:[
  {id:'ctdt', name:'Continuous-Time and Discrete-Time Signals', body: T`
<p><b>Core idea.</b> The classification of a signal decides which transform and which toolkit apply.</p>
${FIGSLOT('ctdt')}
<ul>
<li>CT signals exist for all \(t\); DT signals only at integer \(n\).</li>
<li><b>Periodic CT:</b> \(x(t+T)=x(t)\). A sum of sinusoids is periodic iff the frequency ratios are rational.</li>
<li><b>Periodic DT:</b> \(x[n+N]=x[n]\) requires an <em>integer</em> N. A DT sinusoid \(A\cos(\Omega n+\phi)\) is periodic iff \(\Omega/2\pi\) is rational.</li>
</ul>
<div class="formula">$$\text{CT: }\omega=\frac{2\pi}{T}=2\pi f;\qquad \text{DT: }\Omega=\frac{2\pi}{N}$$</div>
<div class="warn"><b>Common trap</b> \(\cos(0.5n)\) is <b>not</b> periodic because \(0.5/2\pi\) is irrational. DT sinusoids are not automatically periodic.</div>
<div class="tip"><b>Exam tip</b> For a sum \(\cos(\omega_1t)+\cos(\omega_2t)\), periodicity requires \(\omega_1/\omega_2\) rational. If irrational, the sum is aperiodic.</div>
`},

  {id:'energy', name:'Energy, Power, Even/Odd Signals', body: T`
<p><b>Core idea.</b> Energy signals have finite energy and zero average power; power signals are the opposite.</p>
<div class="formula">$$E=\int_{-\infty}^{\infty}|x(t)|^2dt,\qquad P=\lim_{T\to\infty}\frac{1}{2T}\int_{-T}^{T}|x(t)|^2dt$$</div>
<div class="formula">$$x_e(t)=\tfrac12[x(t)+x(-t)],\qquad x_o(t)=\tfrac12[x(t)-x(-t)]$$</div>
<ul>
<li>Periodic signals, step, sinusoids → <b>power signals</b>.</li>
<li>Finite-duration pulses, decaying exponentials → <b>energy signals</b>.</li>
<li>\(x(t)=t\) → neither (infinite energy and infinite power).</li>
<li>Sinusoid of amplitude A: \(P=A^2/2\). Square wave of amplitude A: \(P=A^2\).</li>
<li>Every signal decomposes uniquely as \(x=x_e+x_o\).</li>
</ul>
<div class="tip"><b>Exam tip</b> Energy of a sinusoid over infinite time is infinite, but power is finite — that is exactly why it is a power signal.</div>
`},

  {id:'elem', name:'Elementary Signals — Impulse, Step, Ramp, Exponential', body: T`
<p><b>Core idea.</b> These four signals are the building blocks of every other signal.</p>
${FIGSLOT('elem')}
<h4>Impulse</h4>
<div class="formula">$$\int\delta(t)dt=1,\qquad \delta(at)=\frac{1}{|a|}\delta(t),\qquad x(t)\delta(t-t_0)=x(t_0)\delta(t-t_0)$$
$$\int x(t)\delta(t-t_0)dt=x(t_0)\qquad\text{(sampling property)}$$</div>
<h4>Step and ramp</h4>
<div class="formula">$$u(t)=\int_{-\infty}^{t}\delta(\tau)d\tau,\qquad \frac{du}{dt}=\delta(t),\qquad r(t)=tu(t),\qquad \frac{dr}{dt}=u(t)$$</div>
<h4>Discrete versions</h4>
<div class="formula">$$\delta[n]=\begin{cases}1&n=0\\0&n\neq0\end{cases},\qquad u[n]=\begin{cases}1&n\ge0\\0&n<0\end{cases}$$</div>
<div class="tip"><b>Exam tip</b> The scaling property \(\delta(at)=\delta(t)/|a|\) appears constantly. A sign or factor error here cascades through the whole question.</div>
`},

  {id:'props', name:'System Properties — Linearity, Time-Invariance, Causality, Stability', body: T`
<p><b>Core idea.</b> Test each property independently — ISRO asks "which of these is LTI?" and similar.</p>
<ul>
<li><b>Linear:</b> \(T[a x_1+b x_2]=aT[x_1]+bT[x_2]\). Any constant offset, square, or product of inputs breaks linearity.</li>
<li><b>Time-invariant:</b> a shift in input produces the same shift in output.</li>
<li><b>Causal:</b> output depends only on present and past inputs.</li>
<li><b>BIBO stable:</b> bounded input ⇒ bounded output ⟺ \(\int|h(t)|dt<\infty\).</li>
<li><b>Memoryless:</b> output depends only on the present input.</li>
<li><b>Invertible:</b> distinct inputs give distinct outputs.</li>
</ul>
<table><tr><th>System</th><th>Linear?</th><th>Time-invariant?</th><th>Causal?</th></tr>
<tr><td>\(y(t)=x(t)\cos\omega t\)</td><td>Yes</td><td>No</td><td>Yes</td></tr>
<tr><td>\(y(t)=x(2t)\)</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>\(y(t)=x^2(t)\)</td><td>No</td><td>Yes</td><td>Yes</td></tr>
<tr><td>\(y(t)=x(t)+1\)</td><td>No</td><td>Yes</td><td>Yes</td></tr>
</table>
<div class="tip"><b>Exam tip</b> A system with a time-scaled input \(x(at)\) or \(x(nM)\) is time-varying unless \(a=1\). This single test answers a large fraction of LTI questions.</div>
`},

  {id:'conv', name:'Convolution and Impulse Response', body: T`
<p><b>Core idea.</b> An LTI system is completely described by its impulse response; output = input * h.</p>
${FIGSLOT('conv')}
<div class="formula">$$y(t)=\int_{-\infty}^{\infty}x(\tau)h(t-\tau)d\tau,\qquad y[n]=\sum_{k=-\infty}^{\infty}x[k]h[n-k]$$</div>
<ul>
<li>Duration of convolution = sum of durations: if x has M samples and h has N, y has M+N−1.</li>
<li>Commutative, associative, distributive.</li>
<li>Step response = integral of impulse response.</li>
<li>Cascade: \(h=h_1*h_2\). Parallel: \(h=h_1+h_2\).</li>
<li>Convolution with impulse: \(x(t)*\delta(t-t_0)=x(t-t_0)\).</li>
</ul>
<div class="ex"><b>Worked example</b> \(x=u(t)\), \(h=e^{-2t}u(t)\). Then \(y(t)=\int_0^te^{-2\tau}d\tau=\frac{1-e^{-2t}}{2}u(t)\).</div>
<div class="tip"><b>Exam tip</b> For rectangular pulses, the convolution is a trapezoid (or a triangle if the widths are equal). Sketch the widths; no integration needed.</div>
`},

  {id:'de', name:'Differential- and Difference-Equation Models', body: T`
<p><b>Core idea.</b> Move between the time-domain equation, the transfer function, and the block diagram.</p>
<div class="formula">$$a_n\frac{d^ny}{dt^n}+\cdots+a_0y=b_m\frac{d^mx}{dt^m}+\cdots+b_0x$$
$$H(s)=\frac{b_ms^m+\cdots+b_0}{a_ns^n+\cdots+a_0},\qquad H(z)=\frac{b_mz^m+\cdots+b_0}{a_nz^n+\cdots+a_0}$$</div>
<ul>
<li>Order = highest derivative = number of poles.</li>
<li>For DT, use \(y[n-k]\leftrightarrow z^{-k}Y(z)\).</li>
<li>Zero-input (natural) response from initial conditions; zero-state (forced) response from the input.</li>
<li>Characteristic equation = denominator = 0; its roots are the natural frequencies.</li>
</ul>
<div class="tip"><b>Exam tip</b> Match the denominator roots against the options to identify the system, without solving the full response.</div>
`},

  {id:'fourier', name:'Fourier Series and Fourier Transform', body: T`
<p><b>Core idea.</b> Decompose a signal into sinusoids — the bridge between time and frequency.</p>
${FIGSLOT('fsquare')}
<div class="formula">$$x(t)=a_0+\sum_{n=1}^{\infty}\big[a_n\cos(n\omega_0t)+b_n\sin(n\omega_0t)\big],\qquad \omega_0=\frac{2\pi}{T}$$</div>
<div class="formula">$$a_0=\frac1T\int_Tx\,dt,\quad a_n=\frac2T\int_Tx\cos(n\omega_0t)dt,\quad b_n=\frac2T\int_Tx\sin(n\omega_0t)dt$$</div>
<div class="formula">$$X(j\omega)=\int_{-\infty}^{\infty}x(t)e^{-j\omega t}dt,\qquad x(t)=\frac{1}{2\pi}\int_{-\infty}^{\infty}X(j\omega)e^{j\omega t}d\omega$$</div>
<h4>Symmetry shortcuts</h4>
<ul>
<li>Even signal → only cosine terms (\(b_n=0\)).</li>
<li>Odd signal → only sine terms (\(a_n=0\)).</li>
<li>Half-wave symmetry → only odd harmonics.</li>
</ul>
<h4>Transform properties</h4>
<div class="formula">$$x(t-t_0)\leftrightarrow X(j\omega)e^{-j\omega t_0},\qquad x(at)\leftrightarrow\frac{1}{|a|}X\!\left(\frac{j\omega}{a}\right)$$
$$x(t)\cos\omega_ct\leftrightarrow\frac12\big[X(j(\omega-\omega_c))+X(j(\omega+\omega_c))\big]$$
$$\int|x(t)|^2dt=\frac{1}{2\pi}\int|X(j\omega)|^2d\omega\quad\text{(Parseval)}$$</div>
<div class="tip"><b>Exam tip</b> Fourier series is for periodic signals (line spectrum); Fourier transform for finite-energy aperiodic signals (continuous spectrum).</div>
`},

  {id:'laplace', name:'Laplace Transform, ROC and System Analysis', body: T`
<p><b>Core idea.</b> Turns differential equations into algebra; the ROC decides causality and stability.</p>
${FIGSLOT('roc')}
<div class="formula">$$X(s)=\int_{-\infty}^{\infty}x(t)e^{-st}dt,\qquad s=\sigma+j\omega$$</div>
<div class="formula">$$\delta(t)\leftrightarrow1,\quad u(t)\leftrightarrow\frac1s,\quad e^{-at}u(t)\leftrightarrow\frac{1}{s+a},\quad tu(t)\leftrightarrow\frac{1}{s^2}$$
$$\frac{dx}{dt}\leftrightarrow sX(s)-x(0^-),\qquad \int_0^tx(\tau)d\tau\leftrightarrow\frac{X(s)}{s}$$</div>
<ul>
<li>Right-sided signal → ROC to the right of the rightmost pole.</li>
<li>Left-sided → ROC to the left of the leftmost pole.</li>
<li>Two-sided → ROC is a vertical strip.</li>
<li>Causal LTI system → ROC to the right of all poles.</li>
<li>Stable ⟺ ROC includes the \(j\omega\) axis ⟺ all poles in the LHP.</li>
<li>Final value theorem: \(\lim_{t\to\infty}x(t)=\lim_{s\to0}sX(s)\), valid only if poles of \(sX(s)\) are in the LHP.</li>
</ul>
<div class="tip"><b>Exam tip</b> The ROC never contains a pole. A pole on the \(j\omega\) axis inside the ROC means marginal stability, not stability.</div>
`},

  {id:'z', name:'Z-Transform, Inverse Z and ROC', body: T`
<p><b>Core idea.</b> The Laplace transform of DT signals; the unit circle plays the role of the \(j\omega\) axis.</p>
<div class="formula">$$X(z)=\sum_{n=-\infty}^{\infty}x[n]z^{-n},\qquad z=re^{j\Omega}$$</div>
<div class="formula">$$u[n]\leftrightarrow\frac{1}{1-z^{-1}}\ (|z|>1),\qquad a^nu[n]\leftrightarrow\frac{1}{1-az^{-1}}\ (|z|>|a|)$$
$$x[n-k]\leftrightarrow z^{-k}X(z),\qquad x[n]*h[n]\leftrightarrow X(z)H(z)$$</div>
<ul>
<li>Stable DT system ⟺ ROC includes the unit circle.</li>
<li>Causal ⟺ ROC outside the outermost pole (including \(z=\infty\)).</li>
<li>Inverse Z by partial fractions, long division, or the residue method.</li>
</ul>
<div class="tip"><b>Exam tip</b> A causal system with all poles inside the unit circle is stable. Pole location alone is not enough — the ROC must include the unit circle.</div>
`},

  {id:'sampling', name:'Sampling Theorem, Aliasing & Reconstruction', body: T`
<p><b>Core idea.</b> Sample faster than twice the highest frequency, or the spectrum folds over itself.</p>
${FIGSLOT('sampling')}
<div class="formula">$$f_s\ge2f_{max}\qquad\text{(Nyquist rate)},\qquad X_s(j\omega)=\frac{1}{T_s}\sum_{k=-\infty}^{\infty}X\big(j(\omega-k\omega_s)\big)$$</div>
<ul>
<li>Anti-aliasing filter: low-pass before the sampler with cutoff \(f_s/2\).</li>
<li>Reconstruction: ideal low-pass at \(f_s/2\) plus sinc interpolation.</li>
<li>Aliased frequency: \(f_{alias}=|f-kf_s|\) for the integer k that brings it into \([0,f_s/2]\).</li>
</ul>
<div class="ex"><b>Worked example</b> A signal containing 3 kHz and 5 kHz is sampled at 6 kHz. The 3 kHz component stays at 3 kHz; the 5 kHz component aliases to |5−6| = 1 kHz.</div>
<div class="tip"><b>Exam tip</b> Zero-padding improves the <em>display</em> resolution of a DFT but does not add information or improve true frequency resolution — that needs a longer observation time.</div>
`},

  {id:'pz2', name:'Poles, Zeros, Transfer Functions & Frequency Response', body: T`
<p><b>Core idea.</b> The pole-zero plot fully characterises a linear system.</p>
<div class="formula">$$H(j\omega)=H(s)\big|_{s=j\omega}=|H(j\omega)|e^{j\angle H(j\omega)}$$</div>
<ul>
<li>Pole near the \(j\omega\) axis → resonant peak. Zero near it → notch.</li>
<li>Slope: −20 dB/decade per pole, +20 dB/decade per zero.</li>
<li>All-pass: flat magnitude, varying phase.</li>
<li>Minimum-phase: all poles and zeros in the LHP — smallest group delay for a given magnitude.</li>
<li>Group delay: \(\tau_g=-\frac{d\phi}{d\omega}\).</li>
</ul>
<div class="formula">$$|H(j\omega)|=\frac{\prod|j\omega-z_k|}{\prod|j\omega-p_k|}$$</div>
<div class="tip"><b>Exam tip</b> Use the geometric interpretation: magnitude = product of distances to zeros divided by product of distances to poles. This often answers the question without algebra.</div>
`}
  ]
},

/* ============================================================ 4 ANALOG */
{
  id:'ana', name:'Analog Electronics', icon:'◑',
  topics:[
  {id:'semi', name:'Semiconductor Physics — Intrinsic & Extrinsic', body: T`
<p><b>Core idea.</b> Doping creates majority carriers; temperature increases conductivity.</p>
<div class="formula">$$n_i^2\propto T^3e^{-E_g/2kT},\qquad np=n_i^2\quad\text{(mass action law)}$$</div>
<ul>
<li>N-type: donors, electrons majority, Fermi level near the conduction band.</li>
<li>P-type: acceptors, holes majority, Fermi level near the valence band.</li>
<li>Conductivity: \(\sigma=q(n\mu_n+p\mu_p)\).</li>
<li>Silicon: \(E_g\approx1.12\) eV; Germanium: 0.67 eV.</li>
<li>\(\mu_n>\mu_p\) for silicon, so n-type conducts better than p-type at the same doping.</li>
</ul>
<div class="formula">$$V_T=\frac{kT}{q}\approx26\ \text{mV at 300 K}$$</div>
<div class="tip"><b>Exam tip</b> Semiconductors have a negative temperature coefficient of resistance; metals have a positive one. This distinction is asked repeatedly.</div>
`},

  {id:'diode', name:'PN Junction Diodes, Zener, Rectifiers, Clippers & Clampers', body: T`
<p><b>Core idea.</b> The diode is a one-way valve; the Zener exploits reverse breakdown for regulation.</p>
${FIGSLOT('diode')}
<div class="formula">$$I=I_0\big(e^{V/\eta V_T}-1\big),\qquad \eta\approx1\ \text{(Ge)},\ \approx2\ \text{(Si at low current)}$$</div>
<h4>Rectifier performance</h4>
<table><tr><th>Quantity</th><th>Half-wave</th><th>Full-wave</th></tr>
<tr><td>\(V_{dc}\)</td><td>\(V_m/\pi\)</td><td>\(2V_m/\pi\)</td></tr>
<tr><td>\(V_{rms}\)</td><td>\(V_m/2\)</td><td>\(V_m/\sqrt2\)</td></tr>
<tr><td>Ripple factor</td><td>1.21</td><td>0.48</td></tr>
<tr><td>Efficiency</td><td>40.6%</td><td>81.2%</td></tr>
<tr><td>PIV</td><td>\(V_m\)</td><td>\(2V_m\) (centre-tap), \(V_m\) (bridge)</td></tr>
<tr><td>Ripple frequency</td><td>\(f\)</td><td>\(2f\)</td></tr>
</table>
${FIGSLOT('rectwave')}
<ul>
<li><b>Clipper:</b> limits the signal amplitude (series or shunt).</li>
<li><b>Clamper:</b> shifts the DC level without changing the shape.</li>
<li><b>Zener:</b> operates in reverse breakdown; needs a series resistor to limit current.</li>
</ul>
<div class="formula">$$r=\sqrt{\left(\frac{V_{rms}}{V_{dc}}\right)^2-1},\qquad \eta=\frac{P_{dc}}{P_{ac}}$$</div>
<div class="tip"><b>Exam tip</b> The bridge rectifier is preferred over the centre-tap: it needs only half the secondary voltage and has half the PIV.</div>
`},

  {id:'bjt', name:'BJT & MOSFET — Operation, Characteristics & Biasing', body: T`
<p><b>Core idea.</b> BJT is current-controlled; MOSFET is voltage-controlled. Both need a stable Q-point.</p>
${FIGSLOT('bjtchar')}
${FIGSLOT('moschar')}
<div class="formula">$$\text{BJT: }I_C=\beta I_B,\quad I_E=(\beta+1)I_B,\quad \alpha=\frac{\beta}{\beta+1}$$
$$\text{MOSFET saturation: }I_D=\frac12\mu_nC_{ox}\frac WL(V_{GS}-V_{TH})^2$$</div>
<table><tr><th>Region</th><th>BJT condition</th><th>MOSFET condition</th></tr>
<tr><td>Cut-off</td><td>BE reverse, BC reverse</td><td>\(V_{GS}<V_{TH}\)</td></tr>
<tr><td>Active / saturation</td><td>BE forward, BC reverse</td><td>\(V_{DS}>V_{GS}-V_{TH}\)</td></tr>
<tr><td>Saturation / triode</td><td>Both forward</td><td>\(V_{DS}<V_{GS}-V_{TH}\)</td></tr>
</table>
${FIGSLOT('loadline')}
<div class="formula">$$\text{Voltage-divider bias: }V_B=V_{CC}\frac{R_2}{R_1+R_2},\quad I_E=\frac{V_B-V_{BE}}{R_E}$$</div>
<div class="tip"><b>Exam tip</b> Voltage-divider bias is the most stable against β variation — the standard "most stable biasing" answer.</div>
`},

  {id:'ss', name:'Small-Signal Models & Equivalent Circuits', body: T`
<p><b>Core idea.</b> Linearise around the Q-point to get a small-signal model.</p>
${FIGSLOT('hybridpi')}
<div class="formula">$$g_m=\frac{I_C}{V_T},\qquad r_\pi=\frac{\beta}{g_m}=\frac{V_T}{I_B},\qquad r_e=\frac{V_T}{I_E},\qquad r_o=\frac{V_A}{I_C}$$</div>
<div class="formula">$$\text{CE gain: }A_v=-g_m(R_C\parallel R_L),\qquad R_{in}=R_B\parallel r_\pi,\qquad R_{out}=R_C$$</div>
<ul>
<li>Early effect (base-width modulation) is modelled by \(r_o\).</li>
<li>MOSFET: \(A_v=-g_m(R_D\parallel r_o)\), \(g_m=\sqrt{2\mu_nC_{ox}\frac WL I_D}\).</li>
<li>At 300 K, \(g_m\approx38.5I_C\) S — a very useful quick number.</li>
</ul>
<div class="tip"><b>Exam tip</b> Always compute \(g_m=I_C/26\text{ mV}\) first; almost every small-signal quantity follows from it.</div>
`},

  {id:'multi', name:'Single-Stage and Multistage Amplifiers', body: T`
<p><b>Core idea.</b> Cascade stages multiply gains but reduce bandwidth.</p>
${FIGSLOT('cecb')}
<table><tr><th>Configuration</th><th>Gain</th><th>Input Z</th><th>Output Z</th><th>Phase</th></tr>
<tr><td>CE</td><td>High</td><td>Medium</td><td>Medium</td><td>Inverting</td></tr>
<tr><td>CC (emitter follower)</td><td>≈1</td><td>High</td><td>Low</td><td>Non-inverting</td></tr>
<tr><td>CB</td><td>High</td><td>Low</td><td>High</td><td>Non-inverting</td></tr>
</table>
<div class="formula">$$A_{total}=A_1A_2\cdots A_n,\qquad \text{dB adds: }20\log|A_{total}|=\sum20\log|A_i|$$</div>
<div class="formula">$$f_{H,total}=\frac{f_H}{\sqrt{2^{1/n}-1}}\quad\text{(n identical stages)}$$</div>
<ul>
<li>Darlington pair: \(\beta_{eq}=\beta_1\beta_2\), very high input impedance.</li>
<li>Cascode: high gain plus high bandwidth, reduced Miller effect.</li>
</ul>
<div class="tip"><b>Exam tip</b> dB values add when stages cascade — they do not multiply. A gain of 100 followed by 10 gives 1000 = 60 dB.</div>
`},

  {id:'freq', name:'Frequency Response, Bandwidth & Miller Effect', body: T`
<p><b>Core idea.</b> Internal capacitances create a low-pass behaviour; the Miller effect magnifies input capacitance.</p>
<div class="formula">$$A_v(f)=\frac{A_{v,mid}}{\sqrt{1+(f/f_H)^2}},\qquad f_H=\frac{1}{2\pi R_{eq}C_{eq}}$$</div>
<div class="formula">$$C_{Miller}=C_\mu(1+|A_v|)\quad\text{(input side)}$$</div>
<ul>
<li>Gain–bandwidth product is constant for a single-pole amplifier.</li>
<li>Coupling/bypass capacitors set the lower cutoff; internal capacitances set the upper cutoff.</li>
<li>Octave = 2× = 6 dB; decade = 10× = 20 dB.</li>
</ul>
<div class="tip"><b>Exam tip</b> Miller effect is why the common-emitter stage has poor high-frequency performance — and why the cascode exists.</div>
`},

  {id:'fb', name:'Feedback Amplifiers & Oscillators', body: T`
<p><b>Core idea.</b> Negative feedback trades gain for stability and bandwidth; positive feedback with the right phase gives oscillation.</p>
${FIGSLOT('feedback')}
<div class="formula">$$A_f=\frac{A}{1+A\beta}\quad\text{(negative feedback)},\qquad |A\beta|=1,\ \angle A\beta=0^\circ\quad\text{(Barkhausen)}$$</div>
<ul>
<li>Negative feedback: reduces gain, increases bandwidth, reduces distortion.</li>
<li>Voltage-series feedback → high input Z, low output Z.</li>
<li>Current-shunt feedback → low input Z, high output Z.</li>
</ul>
${FIGSLOT('osc')}
<div class="formula">$$f_{RC}=\frac{1}{2\pi RC\sqrt6},\qquad f_{Wien}=\frac{1}{2\pi RC},\qquad f_{Colpitts}\approx\frac{1}{2\pi\sqrt{LC_{eq}}}$$</div>
<ul>
<li>RC phase-shift: audio frequencies, simple.</li>
<li>Wien bridge: low distortion, audio signal generators.</li>
<li>Colpitts/Hartley: LC, RF.</li>
<li>Crystal: highest Q (~10⁴), most stable frequency.</li>
</ul>
<div class="tip"><b>Exam tip</b> "Most stable oscillator" → crystal. "Wide frequency range" → RC. "RF oscillator" → LC (Colpitts/Hartley).</div>
`},

  {id:'diff', name:'Differential Amplifiers, Current Mirrors & Active Loads', body: T`
<p><b>Core idea.</b> The input stage of every op-amp; CMRR is its figure of merit.</p>
${FIGSLOT('diffpair')}
<div class="formula">$$A_d=-g_mR_C,\qquad A_{cm}=-\frac{R_C}{2R_{EE}},\qquad CMRR=\left|\frac{A_d}{A_{cm}}\right|=2g_mR_{EE}$$</div>
<ul>
<li>Perfect symmetry gives zero common-mode gain.</li>
<li>A current-source tail instead of \(R_{EE}\) increases CMRR enormously.</li>
<li>Current mirrors: simple, Wilson, cascode — each improves output resistance.</li>
<li>Active load boosts gain by increasing \(R_{out}\).</li>
</ul>
<div class="tip"><b>Exam tip</b> CMRR = 2g_m R_EE. To improve common-mode rejection, increase the tail resistance or use a current source.</div>
`},

  {id:'opamp', name:'Operational Amplifiers — Ideal & Non-Ideal', body: T`
<p><b>Core idea.</b> Infinite gain and input impedance, zero output impedance — then the deviations.</p>
<div class="formula">$$\text{Ideal: }A_{ol}=\infty,\ R_{in}=\infty,\ R_{out}=0,\ BW=\infty,\ CMRR=\infty,\ SR=\infty$$</div>
<div class="formula">$$\text{Virtual short (with negative feedback): }V_+=V_-,\qquad I_+=I_-=0$$</div>
<h4>Non-ideal parameters</h4>
<ul>
<li><b>Input offset voltage \(V_{os}\):</b> finite differential voltage for zero output.</li>
<li><b>Input bias current \(I_B\):</b> DC current into the inputs.</li>
<li><b>Slew rate \(SR\):</b> maximum \(dV_o/dt\), in V/µs — limits full-power bandwidth.</li>
<li><b>GBW:</b> unity-gain bandwidth; closed-loop BW = GBW/(1+βA).</li>
</ul>
<div class="formula">$$f_{max}=\frac{SR}{2\pi V_m}\qquad\text{(full-power bandwidth)}$$</div>
<div class="tip"><b>Exam tip</b> Slew-rate limiting gives a triangular output for a sine input. If asked "what distortion", the answer is slew-rate-induced distortion, not clipping.</div>
`},

  {id:'opapps', name:'Op-Amp Applications', body: T`
<p><b>Core idea.</b> Almost every application is a variation of four topologies.</p>
${FIGSLOT('invamp')}
<div class="formula">$$\text{Inverting: }A=-\frac{R_f}{R_{in}};\qquad \text{Non-inverting: }A=1+\frac{R_f}{R_1}$$
$$\text{Summing: }V_o=-R_f\left(\frac{V_1}{R_1}+\frac{V_2}{R_2}+\frac{V_3}{R_3}\right)$$
$$\text{Integrator: }V_o=-\frac{1}{RC}\int V_i\,dt;\qquad \text{Differentiator: }V_o=-RC\frac{dV_i}{dt}$$</div>
${FIGSLOT('schmitt')}
<ul>
<li><b>Comparator:</b> open-loop, output saturates to ±V_sat.</li>
<li><b>Schmitt trigger:</b> positive feedback creates hysteresis; \(V_{UT}=\frac{R_2}{R_1+R_2}V_{sat}\), \(V_{LT}=-V_{UT}\).</li>
<li><b>Precision rectifier:</b> diode inside the feedback loop removes the 0.7 V drop.</li>
<li><b>Instrumentation amplifier:</b> three op-amps, very high CMRR and input impedance.</li>
</ul>
<div class="ex"><b>Worked example</b> Inverting amp with \(R_{in}=10\) kΩ and \(R_f=100\) kΩ: gain −10. Input 0.2 V → output −2 V.</div>
<div class="tip"><b>Exam tip</b> Schmitt trigger thresholds depend only on the saturation voltage and the resistor divider — not on the input signal.</div>
`},

  {id:'filt', name:'Active Filters & Waveform Generators', body: T`
<p><b>Core idea.</b> Active filters shape the frequency response; waveform generators use RC timing plus comparators.</p>
${FIGSLOT('activefilt')}
<ul>
<li>First-order low-pass: \(f_c=1/(2\pi RC)\), slope −20 dB/decade.</li>
<li>Sallen–Key second-order: −40 dB/decade; Q set by component ratios.</li>
<li><b>Butterworth:</b> maximally flat passband.</li>
<li><b>Chebyshev:</b> ripple in the passband, sharper roll-off.</li>
<li><b>Bessel:</b> linear phase, best transient response.</li>
<li><b>Astable multivibrator:</b> square wave; 555 timer \(f=\frac{1.44}{(R_1+2R_2)C}\).</li>
</ul>
<div class="formula">$$f_{555}=\frac{1.44}{(R_1+2R_2)C},\qquad \text{duty}=\frac{R_1+R_2}{R_1+2R_2}$$</div>
<div class="tip"><b>Exam tip</b> A basic 555 astable cannot produce a duty cycle below 50%. This is a classic MCQ.</div>
`},

  {id:'poweramp', name:'Class A, B, AB, C Power Amplifiers', body: T`
<p><b>Core idea.</b> Trade distortion for efficiency by changing the conduction angle.</p>
${FIGSLOT('classb')}
<table><tr><th>Class</th><th>Conduction angle</th><th>Max efficiency</th><th>Distortion</th></tr>
<tr><td>A</td><td>360°</td><td>25% (resistive), 50% (transformer)</td><td>Lowest</td></tr>
<tr><td>B</td><td>180°</td><td>78.5%</td><td>Crossover</td></tr>
<tr><td>AB</td><td>180°–360°</td><td>50–78.5%</td><td>Low</td></tr>
<tr><td>C</td><td>&lt;180°</td><td>~80%</td><td>High (RF)</td></tr>
</table>
<div class="formula">$$\eta_B=\frac{\pi}{4}=78.5\%,\qquad P_{diss,max}=\frac{2V_{CC}^2}{\pi^2R_L}$$</div>
<div class="tip"><b>Exam tip</b> Crossover distortion is specific to Class B; its cure is Class AB bias. Efficiency ordering: C > B > AB > A.</div>
`},

  {id:'reg', name:'Voltage Regulators & Power Supply Design', body: T`
<p><b>Core idea.</b> Keep the output constant despite line, load and temperature variations.</p>
<div class="formula">$$\text{Line regulation}=\frac{\Delta V_o}{\Delta V_i},\qquad \text{Load regulation}=\frac{V_{NL}-V_{FL}}{V_{FL}}\times100\%$$</div>
<ul>
<li><b>Shunt regulator:</b> Zener plus resistor — simple, inefficient.</li>
<li><b>Series regulator:</b> pass transistor plus error amplifier — better efficiency.</li>
<li><b>Switching regulator:</b> highest efficiency (75–95%).</li>
<li>78xx: fixed positive; 79xx: fixed negative; LM317: adjustable.</li>
<li>Dropout voltage: minimum \(V_i-V_o\) for regulation.</li>
</ul>
<div class="formula">$$P_{diss}=(V_i-V_o)I_L\quad\text{(linear regulator)}$$</div>
<div class="tip"><b>Exam tip</b> Linear regulators dissipate \((V_i-V_o)I_L\); that is why they are inefficient for large voltage drops.</div>
`}
  ]
},

/* ============================================================ 5 DIGITAL */
{
  id:'dig', name:'Digital Electronics', icon:'⌗',
  topics:[
  {id:'num', name:'Number Systems, Binary Arithmetic & Signed Representations', body: T`
<p><b>Core idea.</b> Base conversion plus 2's complement — the arithmetic foundation of every digital question.</p>
<ul>
<li><b>2's complement:</b> invert all bits and add 1.</li>
<li>n-bit 2's complement range: \(-2^{n-1}\) to \(2^{n-1}-1\).</li>
<li>Subtraction: \(A-B=A+(\text{2's complement of }B)\); ignore the final carry.</li>
<li>Overflow: two same-sign numbers add to the opposite sign.</li>
</ul>
<div class="formula">$$(1101)_2=(13)_{10}=(D)_{16},\qquad -5\text{ in 4-bit 2's complement}=1011$$</div>
<div class="formula">$$\text{Binary}\to\text{Gray: }G=B\oplus(B\gg1);\qquad \text{Gray}\to\text{Binary: }B_n=G_n,\ B_{n-1}=B_n\oplus G_{n-1}$$</div>
<div class="tip"><b>Exam tip</b> Gray code changes only one bit between consecutive values — used in shaft encoders to avoid glitches.</div>
`},

  {id:'bool', name:'Boolean Algebra, Logic Gates & K-Maps', body: T`
<p><b>Core idea.</b> Minimise the number of literals — fewer gates, lower cost, faster circuit.</p>
${FIGSLOT('kmap')}
<div class="formula">$$\overline{A+B}=\bar A\bar B,\qquad \overline{AB}=\bar A+\bar B\quad\text{(De Morgan)}$$
$$A+\bar AB=A+B,\qquad AB+\bar AC+BC=AB+\bar AC\quad\text{(consensus)}$$</div>
<ul>
<li>NAND and NOR are universal gates.</li>
<li>A 4-variable K-map has 16 cells; adjacent cells differ in exactly one variable.</li>
<li>Group 1s in powers of two (1, 2, 4, 8, 16); edges wrap around.</li>
<li>Don't-care terms can be treated as 1 or 0 to enlarge a group.</li>
</ul>
<div class="warn"><b>Common trap</b> NAND is <b>not</b> associative: NAND(NAND(a,b),c) ≠ NAND(a,NAND(b,c)).</div>
<div class="tip"><b>Exam tip</b> For a 3-variable function, at most a 4:1 MUX plus one inverter is needed. This often gives the "minimum hardware" answer.</div>
`},

  {id:'comb', name:'Combinational Circuits — Adders, MUX, Decoders', body: T`
<p><b>Core idea.</b> Output depends only on the present inputs — no memory.</p>
${FIGSLOT('fulladder')}
<div class="formula">$$\text{Half adder: }S=A\oplus B,\ C=AB$$
$$\text{Full adder: }S=A\oplus B\oplus C_{in},\ C_{out}=AB+BC_{in}+AC_{in}$$</div>
${FIGSLOT('mux')}
<ul>
<li><b>MUX \(2^n\):1</b> selects one of \(2^n\) inputs using n select lines.</li>
<li><b>Decoder \(n:2^n\)</b> asserts one output per input code; used to implement minterms.</li>
<li><b>Encoder \(2^n:n\)</b> reverse of decoder; priority encoder handles simultaneous inputs.</li>
<li><b>Comparator:</b> equality by XNOR, magnitude by cascaded gates.</li>
</ul>
<div class="formula">$$f(A,B)=\bar A\bar BI_0+\bar ABI_1+A\bar BI_2+ABI_3\quad\text{(MUX as function generator)}$$</div>
<div class="tip"><b>Exam tip</b> Any n-variable function needs at most a \(2^{n-1}\):1 MUX plus one inverter — a classic shortcut.</div>
`},

  {id:'seq', name:'Sequential Circuits — Latches, Flip-Flops, Counters', body: T`
<p><b>Core idea.</b> Sequential circuits have memory; the next state depends on the present state and input.</p>
${FIGSLOT('fftiming')}
<div class="formula">$$\text{SR: }Q_{n+1}=S+\bar RQ_n\ (\text{SR}=0\text{ invalid});\quad \text{D: }Q_{n+1}=D;\quad \text{T: }Q_{n+1}=T\oplus Q_n$$
$$\text{JK: }Q_{n+1}=J\bar Q_n+\bar KQ_n$$</div>
<ul>
<li><b>Latch:</b> level-sensitive. <b>Flip-flop:</b> edge-triggered.</li>
<li>Race-around in JK flip-flops occurs when the clock pulse is wider than the propagation delay; cured by master–slave.</li>
<li>Ripple counters have cumulative delay; synchronous counters do not.</li>
<li>Mod-N counter needs \(\lceil\log_2N\rceil\) flip-flops.</li>
<li>Ring counter: n flip-flops, n states. Johnson counter: n flip-flops, 2n states.</li>
</ul>
<div class="tip"><b>Exam tip</b> For a mod-10 counter use 4 flip-flops (2³=8 &lt; 10 ≤ 16=2⁴). For a mod-6 counter use 3 flip-flops.</div>
`},

  {id:'fsm', name:'State Diagrams, Tables & FSM Design', body: T`
<p><b>Core idea.</b> Mealy outputs depend on state + input; Moore outputs depend only on state.</p>
${FIGSLOT('fsm')}
<ul>
<li><b>Mealy:</b> fewer states, output can change with input, faster response.</li>
<li><b>Moore:</b> more states, output synchronised with the clock, safer.</li>
<li>Design flow: state diagram → state table → state reduction → state assignment → excitation table → K-map → logic.</li>
<li>State reduction by equivalence partitioning: two states are equivalent if they produce the same output and go to equivalent next states.</li>
</ul>
<div class="formula">$$\text{Overlapping sequence detector for a pattern of length }k:\ k\text{ states (Moore)},\ k-1\text{ (Mealy, typically)}$$</div>
<div class="tip"><b>Exam tip</b> For "detect 1011 overlapping", a Mealy machine usually needs one state fewer than a Moore machine. If the options differ by one, this decides it.</div>
`},

  {id:'tim', name:'Timing Diagrams, Setup/Hold & Hazards', body: T`
<p><b>Core idea.</b> Real gates have delay — that creates races and hazards.</p>
<div class="formula">$$f_{max}=\frac{1}{t_{pd,logic}+t_{setup}+t_{cq}}$$</div>
<ul>
<li><b>Setup time:</b> data stable before the clock edge.</li>
